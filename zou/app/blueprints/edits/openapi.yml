AllEditsResource_get:
  summary: Get edits
  description: Get the edits. Add a query parameter for each column to filter
    on. If you are not an administrator, you must give project_id. A vendor
    gets only the edits of their assigned tasks. The route /data/edits/all
    gives the same result.
  tags:
    - Edits
  parameters:
    - in: query
      name: project_id
      required: false
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Get only the edits of this project
      schema:
        type: string
        format: uuid
    - in: query
      name: name
      required: false
      example: Opening Sequence
      description: Get only the edits with this name
      schema:
        type: string
  responses:
    200:
      description: The list of edits
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: Edit unique identifier
                  example: a24a6ea4-ce75-4665-a070-57453082c250
                name:
                  type: string
                  description: Edit name
                  example: Opening Sequence
                description:
                  type: string
                  description: Edit description
                  example: Main opening sequence edit
                project_id:
                  type: string
                  format: uuid
                  description: Project identifier
                  example: b35b7fb5-df86-5776-b181-68564193d360
                episode_id:
                  type: string
                  format: uuid
                  description: Episode identifier
                  example: c46c80c6-e097-6887-c292-79675204e470
                created_at:
                  type: string
                  format: date-time
                  description: Creation timestamp
                  example: '2023-01-01T12:00:00Z'
                updated_at:
                  type: string
                  format: date-time
                  description: Last update timestamp
                  example: '2023-01-01T12:30:00Z'
    400:
      description: An identifier is not a valid UUID
    403:
      description: You do not have access to this project

EditPreviewsResource_get:
  summary: Get the previews of an edit
  description: Get the preview files of an edit. The response is a map of task
    type identifiers to lists of previews.
  tags:
    - Edits
  parameters:
    - in: path
      name: edit_id
      required: true
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the edit
      schema:
        type: string
        format: uuid
  responses:
    200:
      description: A map of task type identifiers to lists of previews
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Preview unique identifier
                    example: b35b7fb5-df86-5776-b181-68564193d360
                  name:
                    type: string
                    description: Preview name
                    example: edit_preview_01
                  original_name:
                    type: string
                    description: Original file name
                    example: edit_sequence.mov
                  file_path:
                    type: string
                    description: File path
                    example: /previews/edit/edit_preview_01.mov
                  task_type_id:
                    type: string
                    format: uuid
                    description: Task type identifier
                    example: c46c80c6-e097-6887-c292-79675204e470
                  created_at:
                    type: string
                    format: date-time
                    description: Creation timestamp
                    example: '2023-01-01T12:00:00Z'
    403:
      description: You do not have access to this project, or you are a vendor
        without a task on this edit
    404:
      description: The edit does not exist

EditResource_delete:
  summary: Delete an edit
  description: Delete an edit. The creator of the edit can delete it if the
    creator is in the project team. Other users must be managers of the
    project. If the edit has tasks, the edit is only marked as canceled. Use
    force=true to delete the edit and all its related data.
    Only a manager of the project can use force=true.
  tags:
    - Edits
  parameters:
    - in: path
      name: edit_id
      required: true
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the edit to delete
      schema:
        type: string
        format: uuid
    - in: query
      name: force
      required: false
      description: Delete the edit and all its related data
      example: false
      schema:
        type: boolean
  responses:
    204:
      description: The edit is deleted
    403:
      description: You cannot delete this edit
    404:
      description: The edit does not exist

