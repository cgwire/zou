EditVersionsResource_get:
  summary: Get the versions of an edit
  description: Get the saved versions of the data of an edit. Each version
    keeps the values of the edit at one time.
  tags:
    - Edits
  parameters:
    - in: path
      name: edit_id
      required: true
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the edit
      schema:
        type: string
        format: uuid
  responses:
    200:
      description: The list of versions
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: Version unique identifier
                  example: b35b7fb5-df86-5776-b181-68564193d360
                edit_id:
                  type: string
                  format: uuid
                  description: Edit identifier
                  example: a24a6ea4-ce75-4665-a070-57453082c250
                version_number:
                  type: integer
                  description: Version number
                  example: 1
                data:
                  type: object
                  description: Version data content
                  example: {duration: 120, fps: 24, changes: Added transitions}
                created_at:
                  type: string
                  format: date-time
                  description: Creation timestamp
                  example: '2023-01-01T12:00:00Z'
                created_by:
                  type: string
                  format: uuid
                  description: Creator person identifier
                  example: c46c80c6-e097-6887-c292-79675204e470
    403:
      description: You do not have access to this project, or you are a vendor
        without a task on this edit
    404:
      description: The edit does not exist

EditsAndTasksResource_get:
  summary: Get edits with their tasks
  description: Get the edits with the tasks of each edit. Filter with
    project_id or episode_id. Use episode_id=main for the edits without
    episode, episode_id=all for all the edits. A client gets the tasks without
    the studio fields. If you are not an administrator, you must give
    project_id. A vendor gets only the edits of their assigned tasks.
  tags:
    - Edits
  parameters:
    - in: query
      name: project_id
      required: false
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Get only the edits of this project
      schema:
        type: string
        format: uuid
    - in: query
      name: episode_id
      required: false
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Get only the edits of this episode. Use main for the edits
        without episode, all for all the edits.
      schema:
        type: string
    - in: query
      name: assigned_to
      required: false
      description: With any value, get only the edits that have a task
        assigned to you.
      schema:
        type: string
  responses:
    200:
      description: The list of edits with their tasks
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: Edit unique identifier
                  example: a24a6ea4-ce75-4665-a070-57453082c250
                name:
                  type: string
                  description: Edit name
                  example: Opening Sequence
                description:
                  type: string
                  description: Edit description
                  example: Main opening sequence edit
                project_id:
                  type: string
                  format: uuid
                  description: Project identifier
                  example: b35b7fb5-df86-5776-b181-68564193d360
                project_name:
                  type: string
                  description: Project name
                  example: My Animation Project
                episode_id:
                  type: string
                  format: uuid
                  description: Episode identifier
                  example: c46c80c6-e097-6887-c292-79675204e470
                tasks:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Task unique identifier
                        example: d57d91d7-f108-7998-d403-80786315f580
                      name:
                        type: string
                        description: Task name
                        example: Edit Task
                      task_type_id:
                        type: string
                        format: uuid
                        description: Task type identifier
                        example: e68e02e8-0219-8009-e514-918974260690
                created_at:
                  type: string
                  format: date-time
                  description: Creation timestamp
                  example: '2023-01-01T12:00:00Z'
                updated_at:
                  type: string
                  format: date-time
                  description: Last update timestamp
                  example: '2023-01-01T12:30:00Z'
    400:
      description: An identifier is not a valid UUID
    403:
      description: You do not have access to this project

