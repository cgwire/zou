Delete an edit
---
description: Delete an edit. The creator of the edit can delete it if the
  creator is in the project team. Other users must be managers of the
  project. If the edit has tasks, the edit is only marked as canceled. Use
  force=true to delete the edit and all its related data.
tags:
  - Edits
parameters:
  - in: path
    name: edit_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the edit to delete
    schema:
      type: string
      format: uuid
  - in: query
    name: force
    required: false
    description: Delete the edit and all its related data
    example: false
    schema:
      type: boolean
responses:
  204:
    description: The edit is deleted
  403:
    description: You cannot delete this edit
  404:
    description: The edit does not exist
