Get edit tasks
---
description: Retrieve all tasks that are related to a specific edit.
tags:
  - Edits
parameters:
  - in: path
    name: edit_id
    required: true
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c25
    description: Unique identifier of the edit
  - in: query
    name: relations
    type: boolean
    required: false
    description: Include related entity information
    example: true
responses:
  200:
    description: List of edit tasks successfully retrieved
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Task unique identifier
                example: b35b7fb5-df86-5776-b181-68564193d36
              name:
                type: string
                description: Task name
                example: "Edit Task"
              task_type_id:
                type: string
                format: uuid
                description: Task type identifier
                example: c46c8gc6-eg97-6887-c292-79675204e47
              task_status_id:
                type: string
                format: uuid
                description: Task status identifier
                example: d57d9hd7-fh08-7998-d403-80786315f58
              entity_id:
                type: string
                format: uuid
                description: Entity identifier
                example: e68e0ie8-gi19-8009-e514-91897426g69
              assigned_to:
                type: string
                format: uuid
                description: Assigned person identifier
                example: f79f1jf9-hj20-9010-f625-02998537h80
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: "2023-01-01T12:00:00Z"
              updated_at:
                type: string
                format: date-time
                description: Last update timestamp
                example: "2023-01-01T12:30:00Z"
