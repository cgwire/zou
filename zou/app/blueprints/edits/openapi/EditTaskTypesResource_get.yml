Get the task types of an edit
---
description: Get the task types of the tasks of an edit.
tags:
  - Edits
parameters:
  - in: path
    name: edit_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the edit
    schema:
      type: string
      format: uuid
responses:
  200:
    description: The list of task types
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Task type unique identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
              name:
                type: string
                description: Task type name
                example: Edit
              short_name:
                type: string
                description: Task type short name
                example: EDT
              color:
                type: string
                description: Task type color code
                example: '#FF5733'
              for_entity:
                type: string
                description: Entity type this task type is for
                example: Edit
  403:
    description: You do not have access to this project
  404:
    description: The edit does not exist
