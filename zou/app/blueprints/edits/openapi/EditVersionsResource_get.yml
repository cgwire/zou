Get edit versions
---
description: Retrieve all data versions of a specific edit. This
  includes historical versions and metadata about changes over time.
tags:
  - Edits
parameters:
  - in: path
    name: edit_id
    required: true
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the edit
  - in: query
    name: page
    required: false
    type: integer
    example: 1
    description: Page number. Without page nor limit, the whole list is
      returned; with either, a paginated envelope is returned.
  - in: query
    name: limit
    required: false
    type: integer
    example: 100
    description: Number of entries per page (default 100, max 5000). A
      limit alone returns the first page.
responses:
  200:
    description: Edit versions successfully retrieved
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Version unique identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
              edit_id:
                type: string
                format: uuid
                description: Edit identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              version_number:
                type: integer
                description: Version number
                example: 1
              data:
                type: object
                description: Version data content
                example: {"duration": 120, "fps": 24, "changes": "Added transitions"}
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: "2023-01-01T12:00:00Z"
              created_by:
                type: string
                format: uuid
                description: Creator person identifier
                example: c46c80c6-e097-6887-c292-79675204e470
