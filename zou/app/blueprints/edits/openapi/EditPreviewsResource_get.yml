Get edit previews
---
description: Retrieve all preview files related to a specific edit.
  Returns them as a dictionary where keys are related task type IDs and
  values are arrays of previews for that task type.
tags:
  - Edits
parameters:
  - in: path
    name: edit_id
    required: true
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the edit
responses:
  200:
    description: Edit previews successfully retrieved
    content:
      application/json:
        schema:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: Preview unique identifier
                  example: b35b7fb5-df86-5776-b181-68564193d360
                name:
                  type: string
                  description: Preview name
                  example: "edit_preview_01"
                original_name:
                  type: string
                  description: Original file name
                  example: "edit_sequence.mov"
                file_path:
                  type: string
                  description: File path
                  example: "/previews/edit/edit_preview_01.mov"
                task_type_id:
                  type: string
                  format: uuid
                  description: Task type identifier
                  example: c46c80c6-e097-6887-c292-79675204e470
                created_at:
                  type: string
                  format: date-time
                  description: Creation timestamp
                  example: "2023-01-01T12:00:00Z"
