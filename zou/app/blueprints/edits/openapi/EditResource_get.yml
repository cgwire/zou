Get an edit
---
description: Get an edit with its project name, episode and tasks.
tags:
  - Edits
parameters:
  - in: path
    name: edit_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the edit
    schema:
      type: string
      format: uuid
responses:
  200:
    description: The edit
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Edit unique identifier
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              description: Edit name
              example: Opening Sequence
            description:
              type: string
              description: Edit description
              example: Main opening sequence edit
            project_id:
              type: string
              format: uuid
              description: Project identifier
              example: b35b7fb5-df86-5776-b181-68564193d360
            episode_id:
              type: string
              format: uuid
              description: Episode identifier
              example: c46c80c6-e097-6887-c292-79675204e470
            created_at:
              type: string
              format: date-time
              description: Creation timestamp
              example: '2023-01-01T12:00:00Z'
            updated_at:
              type: string
              format: date-time
              description: Last update timestamp
              example: '2023-01-01T12:30:00Z'
  403:
    description: You do not have access to this project
  404:
    description: The edit does not exist
