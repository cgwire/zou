Get edit
---
description: Retrieve detailed information about a specific edit.
tags:
  - Edits
parameters:
  - in: path
    name: edit_id
    required: true
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c25
    description: Unique identifier of the edit
responses:
  200:
    description: Edit information successfully retrieved
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Edit unique identifier
              example: a24a6ea4-ce75-4665-a070-57453082c25
            name:
              type: string
              description: Edit name
              example: "Opening Sequence"
            description:
              type: string
              description: Edit description
              example: "Main opening sequence edit"
            project_id:
              type: string
              format: uuid
              description: Project identifier
              example: b35b7fb5-df86-5776-b181-68564193d36
            episode_id:
              type: string
              format: uuid
              description: Episode identifier
              example: c46c8gc6-eg97-6887-c292-79675204e47
            created_at:
              type: string
              format: date-time
              description: Creation timestamp
              example: "2023-01-01T12:00:00Z"
            updated_at:
              type: string
              format: date-time
              description: Last update timestamp
              example: "2023-01-01T12:30:00Z"
