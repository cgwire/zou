Create edit
---
description: Create a new edit for a specific project with name, description, and optional episode association.
tags:
  - Edits
parameters:
  - in: path
    name: project_id
    required: true
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the project
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
        properties:
          name:
            type: string
            description: Edit name
            example: "Opening Sequence"
          description:
            type: string
            description: Edit description
            example: "Main opening sequence edit"
          data:
            type: object
            description: Additional edit data
            example: {"duration": 120, "fps": 24}
          episode_id:
            type: string
            format: uuid
            description: Episode identifier (optional)
            example: b35b7fb5-df86-5776-b181-68564193d360
responses:
  201:
    description: Edit successfully created
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Edit unique identifier
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              description: Edit name
              example: "Opening Sequence"
            description:
              type: string
              description: Edit description
              example: "Main opening sequence edit"
            project_id:
              type: string
              format: uuid
              description: Project identifier
              example: b35b7fb5-df86-5776-b181-68564193d360
            episode_id:
              type: string
              format: uuid
              description: Episode identifier
              example: c46c80c6-e097-6887-c292-79675204e470
            data:
              type: object
              description: Additional edit data
              example: {"duration": 120, "fps": 24}
            created_by:
              type: string
              format: uuid
              description: Creator person identifier
              example: d57d91d7-f108-7998-d403-80786315f580
            created_at:
              type: string
              format: date-time
              description: Creation timestamp
              example: "2023-01-01T12:00:00Z"
            updated_at:
              type: string
              format: date-time
              description: Last update timestamp
              example: "2023-01-01T12:00:00Z"
