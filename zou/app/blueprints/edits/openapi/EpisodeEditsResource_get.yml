Get episode edits
---
description: Retrieve all edits that are related to a specific episode.
tags:
  - Edits
parameters:
  - in: path
    name: episode_id
    required: true
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c25
    description: Unique identifier of the episode
  - in: query
    name: relations
    type: boolean
    required: false
    description: Include related entity information
    example: true
responses:
  200:
    description: List of episode edits successfully retrieved
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Edit unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c25
              name:
                type: string
                description: Edit name
                example: "Episode Edit"
              description:
                type: string
                description: Edit description
                example: "Main episode edit"
              project_id:
                type: string
                format: uuid
                description: Project identifier
                example: b35b7fb5-df86-5776-b181-68564193d36
              episode_id:
                type: string
                format: uuid
                description: Episode identifier
                example: c46c8gc6-eg97-6887-c292-79675204e47
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: "2023-01-01T12:00:00Z"
              updated_at:
                type: string
                format: date-time
                description: Last update timestamp
                example: "2023-01-01T12:30:00Z"
