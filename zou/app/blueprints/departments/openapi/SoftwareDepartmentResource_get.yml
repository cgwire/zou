Get a software license of a department
---
description: Get a software license of a department. You must be an
  administrator.
tags:
  - Departments
parameters:
  - in: path
    name: department_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the department
    schema:
      type: string
      format: uuid
  - in: path
    name: software_id
    required: true
    example: b35b7fb5-df86-5776-b181-68564193d360
    description: Unique identifier of the software license
    schema:
      type: string
      format: uuid
responses:
  200:
    description: The software license
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Software license unique identifier
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              description: Software license name
              example: Maya
            short_name:
              type: string
              description: Software license short name
              example: MAYA
            file_extension:
              type: string
              description: Default file extension for the software license
              example: .ma
            department_id:
              type: string
              format: uuid
              description: Department identifier
              example: b35b7fb5-df86-5776-b181-68564193d360
            created_at:
              type: string
              format: date-time
              description: Creation timestamp
              example: '2023-01-01T12:00:00Z'
            updated_at:
              type: string
              format: date-time
              description: Last update timestamp
              example: '2023-01-01T12:30:00Z'
  400:
    description: An identifier is not a valid UUID
  403:
    description: You are not an administrator
  404:
    description: The department does not have this software license
