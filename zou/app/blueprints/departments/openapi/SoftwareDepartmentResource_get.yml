Get department software license
---
description: Retrieve one software item associated with a specific
  department.
tags:
  - Departments
parameters:
  - in: path
    name: department_id
    required: true
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c25
    description: Unique identifier of the department
  - in: path
    name: software_id
    required: true
    type: string
    format: uuid
    example: b35b7fb5-df86-5776-b181-68564193d36
    description: Unique identifier of the software
responses:
  200:
    description: Department software license successfully retrieved
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Software license unique identifier
              example: a24a6ea4-ce75-4665-a070-57453082c25
            name:
              type: string
              description: Software license name
              example: "Maya"
            short_name:
              type: string
              description: Software license short name
              example: "MAYA"
            file_extension:
              type: string
              description: Default file extension for the software license
              example: ".ma"
            department_id:
              type: string
              format: uuid
              description: Department identifier
              example: b35b7fb5-df86-5776-b181-68564193d36
            created_at:
              type: string
              format: date-time
              description: Creation timestamp
              example: "2023-01-01T12:00:00Z"
            updated_at:
              type: string
              format: date-time
              description: Last update timestamp
              example: "2023-01-01T12:30:00Z"
