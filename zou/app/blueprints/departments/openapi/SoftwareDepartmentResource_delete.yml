Remove a software license from a department
---
description: Remove a software license from a department. The software
  license is not deleted. If the link does not exist, the route also returns
  204. You must be an administrator.
tags:
  - Departments
parameters:
  - in: path
    name: department_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the department
    schema:
      type: string
      format: uuid
  - in: path
    name: software_id
    required: true
    example: b35b7fb5-df86-5776-b181-68564193d360
    description: Unique identifier of the software license to remove
    schema:
      type: string
      format: uuid
responses:
  204:
    description: The software license is removed from the department
  400:
    description: An identifier is not a valid UUID
  403:
    description: You are not an administrator
