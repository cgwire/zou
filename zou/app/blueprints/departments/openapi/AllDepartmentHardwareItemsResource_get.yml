Get all department hardware items
---
description: Retrieve all hardware items organized by department.
  Returns a dictionary where each department contains its associated
  hardware items.
tags:
  - Departments
responses:
  200:
    description: Department hardware items successfully retrieved
    content:
      application/json:
        schema:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: Hardware item unique identifier
                  example: a24a6ea4-ce75-4665-a070-57453082c250
                name:
                  type: string
                  description: Hardware item name
                  example: "Workstation"
                description:
                  type: string
                  description: Hardware item description
                  example: "High-performance workstation"
                department_id:
                  type: string
                  format: uuid
                  description: Department identifier
                  example: b35b7fb5-df86-5776-b181-68564193d360
                created_at:
                  type: string
                  format: date-time
                  description: Creation timestamp
                  example: "2023-01-01T12:00:00Z"
                updated_at:
                  type: string
                  format: date-time
                  description: Last update timestamp
                  example: "2023-01-01T12:30:00Z"
