Get the hardware items of a department
---
description: Get the hardware items of a department. You must be an
  administrator.
tags:
  - Departments
parameters:
  - in: path
    name: department_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the department
    schema:
      type: string
      format: uuid
  - in: path
    name: hardware_item_id
    required: true
    description: Unique identifier of a hardware item. The route does not
      use this value.
    example: b35b7fb5-df86-5776-b181-68564193d360
    schema:
      type: string
      format: uuid
responses:
  200:
    description: The list of hardware items
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Hardware item unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                description: Hardware item name
                example: Workstation
              description:
                type: string
                description: Hardware item description
                example: High-performance workstation
              department_id:
                type: string
                format: uuid
                description: Department identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: '2023-01-01T12:00:00Z'
              updated_at:
                type: string
                format: date-time
                description: Last update timestamp
                example: '2023-01-01T12:30:00Z'
  400:
    description: The identifier is not a valid UUID
  403:
    description: You are not an administrator
