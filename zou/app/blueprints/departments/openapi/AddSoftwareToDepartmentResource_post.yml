Add a software license to a department
---
description: Add a software license to a department. The budget forecast
  uses the software licenses of each department. If the link already exists,
  the route returns it. You must be an administrator.
tags:
  - Departments
parameters:
  - in: path
    name: department_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the department
    schema:
      type: string
      format: uuid
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - software_id
        properties:
          software_id:
            type: string
            format: uuid
            description: Software identifier to add to department
            example: b35b7fb5-df86-5776-b181-68564193d360
responses:
  201:
    description: The link between the department and the software license
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Software license department link unique
                identifier
              example: c46c80c6-e097-6887-c292-79675204e470
            department_id:
              type: string
              format: uuid
              description: Department identifier
              example: a24a6ea4-ce75-4665-a070-57453082c250
            software_id:
              type: string
              format: uuid
              description: Software license identifier
              example: b35b7fb5-df86-5776-b181-68564193d360
            created_at:
              type: string
              format: date-time
              description: Creation timestamp
              example: '2023-01-01T12:00:00Z'
  400:
    description: An identifier is not a valid UUID
  403:
    description: You are not an administrator
  404:
    description: The department or the software license does not exist
