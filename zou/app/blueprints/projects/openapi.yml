      name: project_id
      required: true
      schema:
        type: string
        format: uuid
      description: Project unique identifier
      example: a24a6ea4-ce75-4665-a070-57453082c250
    - in: path
      name: asset_type_id
      required: true
      schema:
        type: string
        format: uuid
      description: Asset type unique identifier
      example: b35b7fb5-df86-5776-b181-68564193d360
  responses:
    204:
      description: The asset type is removed from the project
    403:
      description: You are not a manager of the project

ProductionAssetTypeResource_post:
  summary: Add an asset type to a project
  description: Add an asset type to the settings of a project. You must be a
    manager of the project.
  tags:
    - Projects
  parameters:
