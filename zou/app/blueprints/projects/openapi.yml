AllProjectsMetadataDescriptorResource_delete:
  summary: Delete a metadata descriptor in all projects
  description: Delete the metadata descriptors with this field name in your
    projects, in one request. A metadata descriptor describes an extra column.
    The values of the column are in the data field of the entities. The route
    changes the open projects where you are a manager. An administrator
    changes all the open projects. Your global role must be manager or
    administrator. The role set on a project does not open this route.
  tags:
    - Projects
  parameters:
    - in: path
      name: field_name
      required: true
      schema:
        type: string
      description: Field name of the descriptor, the key in the data field
    - in: query
      name: entity_type
      required: true
      schema:
        type: string
      description: 'Entity type of the descriptor: Asset, Shot, Edit, Episode,
        Sequence or Project'
  responses:
    200:
      description: The identifiers of the deleted descriptors
    400:
      description: The entity type is not valid
    403:
      description: Your global role is not manager or administrator

AllProjectsMetadataDescriptorResource_put:
  summary: Update a metadata descriptor in all projects
  description: Update the metadata descriptors with this field name in your
    projects, in one request. A metadata descriptor describes an extra column.
    The values of the column are in the data field of the entities. The route
    changes the open projects where you are a manager. An administrator
    changes all the open projects. Your global role must be manager or
    administrator. The role set on a project does not open this route.
  tags:
    - Projects
  parameters:
    - in: path
      name: field_name
      required: true
      schema:
        type: string
      description: Field name of the descriptor, the key in the data field
  responses:
    200:
      description: The updated descriptors
    400:
      description: A value is not valid, or the name is used by another
        column of the same type, by a built-in field, or is too long
    403:
      description: Your global role is not manager or administrator
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - entity_type
          properties:
            entity_type:
              type: string
              description: 'Entity type of the descriptor: Asset, Shot, Edit,
                Episode, Sequence or Project'
            name:
              type: string
              description: New name of the column
            for_client:
              type: boolean
              default: false
              description: Show the column to the clients
            data_type:
              type: string
              default: string
              description: Type of the values, for example string, number,
                list or boolean
            choices:
              type: array
              items:
                type: string
              description: Values of a list column
            departments:
              type: array
              items:
                type: string
                format: uuid
              description: Departments that see the column

AllProjectsMetadataDescriptorsReorderResource_post:
  summary: Reorder the metadata descriptors in all projects
  description: Set the same order of columns in your projects, in one request.
    Give the field names in the new order. The route changes the open projects
    where you are a manager. An administrator changes all the open projects.
    Your global role must be manager or administrator. The role set on a
    project does not open this route.
  tags:
    - Projects
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - entity_type
            - field_order
          properties:
            entity_type:
              type: string
              description: 'Entity type of the descriptors: Asset, Shot, Edit,
                Episode, Sequence or Project'
            field_order:
              type: array
              items:
                type: string
  responses:
    200:
      description: The updated descriptors
    400:
      description: The body is not valid
    403:
      description: Your global role is not manager or administrator

AllProjectsMetadataDescriptorsResource_post:
  summary: Create a metadata descriptor in all projects
  description: Create the same metadata descriptor in your projects, in one
    request. A project that already has a descriptor with this field name is
    skipped. A metadata descriptor describes an extra column. The values of
    the column are in the data field of the entities. The route changes the
    open projects where you are a manager. An administrator changes all the
    open projects. Your global role must be manager or
    administrator. The role set on a project does not open this route.
  tags:
    - Projects
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
          properties:
            entity_type:
              type: string
              default: Asset
              enum: [Asset, Shot, Edit, Episode, Sequence, Project]
            name:
              type: string
            data_type:
              type: string
              default: string
            for_client:
              type: boolean
              default: false
              description: Show the column to the clients
            choices:
              type: array
              items:
                type: string
              description: Values of a list column
            departments:
              type: array
              items:
                type: string
                format: uuid
              description: Departments that see the column
  responses:
    201:
      description: The new descriptors
    400:
      description: A value is not valid, or the name is used by a built-in
        field
    403:
      description: Your global role is not manager or administrator

AllProjectsResource_get:
  summary: Get all the projects
  description: Get all the projects, open and closed. An administrator gets
    all of them. Other users get the projects of their teams, open and
    closed. The name filter ignores the case.
  tags:
    - Projects
  parameters:
    - in: query
      name: name
      required: false
      schema:
        type: string
      description: Get only the projects with this name
      example: My Project
  responses:
    200:
      description: The list of projects
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: Project unique identifier
                  example: a24a6ea4-ce75-4665-a070-57453082c250
                name:
                  type: string
                  description: Project name
                  example: My Project
                project_status_id:
                  type: string
                  format: uuid
                  description: Project status unique identifier
                  example: b35b7fb5-df86-5776-b181-68564193d360
    404:
      description: No project has this name. Only when you give name.

OpenProjectsResource_get:
  summary: Get the open projects
  description: Get the open projects. An administrator gets all of them. Other
    users get the projects of their teams.
  tags:
    - Projects
  parameters:
    - in: query
      name: name
      required: false
      schema:
        type: string
      description: Get only the projects with this name
      example: My Project
  responses:
    200:
      description: The list of open projects
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: Project unique identifier
                  example: a24a6ea4-ce75-4665-a070-57453082c250
                name:
                  type: string
                  description: Project name
                  example: My Project
                project_status_id:
                  type: string
                  format: uuid
                  description: Project status unique identifier
                  example: b35b7fb5-df86-5776-b181-68564193d360

ProductionAssetTypeRemoveResource_delete:
  summary: Remove an asset type from a project
  description: Remove an asset type from the settings of a project. The asset
    type is not deleted. You must be a manager of the project.
  tags:
    - Projects
  parameters:
