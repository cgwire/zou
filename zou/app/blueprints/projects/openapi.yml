ProductionMetadataDescriptorsResource_post:
  summary: Create a metadata descriptor
  description: Create a metadata descriptor in a project. A metadata
    descriptor describes an extra column. The values of the column are in the
    data field of the entities. Administrators and managers of the project can
    use this route. A supervisor of the project can use it only when the
    descriptor has at least one department and the departments of the
    descriptor include every department of the supervisor. A supervisor with
    no department can use it for any descriptor that has departments.
  tags:
    - Projects
  parameters:
    - in: path
      name: project_id
      required: true
      schema:
        type: string
        format: uuid
      description: Project unique identifier
