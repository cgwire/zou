  parameters:
    - in: path
      name: project_id
      required: true
      schema:
        type: string
        format: uuid
      description: Project unique identifier
      example: a24a6ea4-ce75-4665-a070-57453082c250
    - in: path
      name: budget_id
      required: true
      schema:
        type: string
        format: uuid
      description: Unique identifier of the budget
      example: b35b7fb5-df86-5776-b181-68564193d360
  responses:
    200:
      description: The list of budget entries
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
    400:
