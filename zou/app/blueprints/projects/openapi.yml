      name: project_id
      required: true
      schema:
        type: string
        format: uuid
      description: Project unique identifier
      example: a24a6ea4-ce75-4665-a070-57453082c250
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - asset_type_id
          properties:
            asset_type_id:
              type: string
              format: uuid
              description: Asset type unique identifier
              example: b35b7fb5-df86-5776-b181-68564193d360
  responses:
    201:
      description: The updated project
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Project unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                description: Project name
                example: My Project
    400:
      description: The body is not valid
    403:
      description: You are not a manager of the project

ProductionAssetTypesScheduleItemsResource_get:
  summary: Get the schedule items of the asset types for a task type
  description: Get the schedule items of the asset types of a project, for a
    task type. A schedule item gives the start date and the end date of a part
    of the production in the schedule. Give episode_id to get the items of one
    episode. Vendors cannot use this route.
  tags:
    - Projects
  parameters:
    - in: query
      name: episode_id
      required: false
      schema:
        type: string
        format: uuid
      description: Restrict results to asset types of the given episode
    - in: path
      name: project_id
      required: true
      schema:
        type: string
        format: uuid
      description: Project unique identifier
      example: a24a6ea4-ce75-4665-a070-57453082c250
    - in: path
      name: task_type_id
      required: true
      schema:
        type: string
        format: uuid
      description: Task type unique identifier
      example: b35b7fb5-df86-5776-b181-68564193d360
  responses:
    200:
      description: The list of schedule items
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
    400:
      description: An identifier is not a valid UUID
    403:
      description: You do not have access to this project, or you are a vendor

ProductionBudgetEntriesResource_get:
