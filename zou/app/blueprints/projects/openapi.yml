  description: Update a metadata descriptor of a project. A metadata
    descriptor describes an extra column. The values of the column are in the
    data field of the entities. Send every field. A field you leave out goes
    back to its default value, except the name. Administrators and managers
    of the project can use this route. A supervisor of the project can use it
    only when the descriptor, with the departments you send, has at least one
    department and these departments include every department of the
    supervisor.
  tags:
    - Projects
  parameters:
    - in: path
      name: project_id
      required: true
      schema:
        type: string
        format: uuid
      description: Project unique identifier
      example: a24a6ea4-ce75-4665-a070-57453082c250
    - in: path
      name: metadata_descriptor_id
      required: true
      schema:
        type: string
        format: uuid
      description: Metadata descriptor unique identifier
      example: b35b7fb5-df86-5776-b181-68564193d360
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
              description: Name of the metadata descriptor, kept when left out
              example: Custom Field
            for_client:
              type: string
              description: Whether the descriptor is for client
              default: 'False'
              example: 'True'
            data_type:
              type: string
              default: string
              description: Type of the values, for example string, number,
                list or boolean
            choices:
              type: array
              description: List of choices for the descriptor
              items:
                type: string
              example: [option1, option2]
            departments:
              type: array
              description: List of departments for the descriptor
              items:
                type: string
