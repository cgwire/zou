Reorder the metadata descriptors in all projects
---
description: Set the same order of columns in your projects, in one request.
  Give the field names in the new order. The route changes the open projects
  where you are a manager. An administrator changes all the open projects.
  You must have the manager role or a higher role.
tags:
  - Projects
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - entity_type
          - field_order
        properties:
          entity_type:
            type: string
          field_order:
            type: array
            items:
              type: string
responses:
  200:
    description: The updated descriptors
  400:
    description: The body is not valid
  403:
    description: You do not have the manager role
