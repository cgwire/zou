Apply a schedule version to the tasks
---
description: Copy the start dates and the due dates of a production schedule
  version to the tasks of the project. A production schedule version is a
  copy of the schedule. You can change it, and then apply it to the tasks.
  You must be a manager of the project.
tags:
  - Projects
parameters:
  - in: path
    name: production_schedule_version_id
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the production schedule version
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  200:
    description: The number of updated tasks
    content:
      application/json:
        schema:
          type: object
          properties:
            success:
              type: boolean
            task_count:
              type: integer
  400:
    description: An identifier is not a valid UUID
  403:
    description: You are not a manager of the project
  404:
    description: The production schedule version does not exist
