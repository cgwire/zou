Update metadata descriptor
---
description: Update a metadata descriptor. Descriptors serve to
  describe extra fields listed in the data attribute of entities.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: metadata_descriptor_id
    required: true
    schema:
      type: string
      format: uuid
    description: Metadata descriptor unique identifier
    example: b35b7fb5-df86-5776-b181-68564193d360
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            description: Name of the metadata descriptor
            example: "Custom Field"
          for_client:
            type: string
            description: Whether the descriptor is for client
            default: "False"
            example: "True"
          choices:
            type: array
            description: List of choices for the descriptor
            items:
              type: string
            example: ["option1", "option2"]
          departments:
            type: array
            description: List of departments for the descriptor
            items:
              type: string
            example: ["department1", "department2"]
responses:
  200:
    description: Metadata descriptor updated
    content:
      application/json:
        schema:
          type: object
  400:
    description: Empty name, invalid data type, or a name taken by another
      column of the same type or too long
  404:
    description: No descriptor of this project with this id
