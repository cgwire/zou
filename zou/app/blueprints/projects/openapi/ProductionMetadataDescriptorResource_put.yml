Update a metadata descriptor
---
description: Update a metadata descriptor of a project. A metadata
  descriptor describes an extra column. The values of the column are in the
  data field of the entities. Administrators and managers of the project can
  use this route. A supervisor of the project can use it if the supervisor
  has access to all the departments of the descriptor.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: metadata_descriptor_id
    required: true
    schema:
      type: string
      format: uuid
    description: Metadata descriptor unique identifier
    example: b35b7fb5-df86-5776-b181-68564193d360
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            description: Name of the metadata descriptor, kept when left out
            example: Custom Field
          for_client:
            type: string
            description: Whether the descriptor is for client
            default: 'False'
            example: 'True'
          choices:
            type: array
            description: List of choices for the descriptor
            items:
              type: string
            example: [option1, option2]
          departments:
            type: array
            description: List of departments for the descriptor
            items:
              type: string
            example: [department1, department2]
responses:
  200:
    description: The updated descriptor
    content:
      application/json:
        schema:
          type: object
  400:
    description: The name is empty, the data type is not valid, or the name
      is used by another column of the same type, by a built-in field, or
      is too long
  403:
    description: You cannot change this descriptor
  404:
    description: The project has no descriptor with this identifier
