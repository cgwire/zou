Update a metadata descriptor in all projects
---
description: Update the metadata descriptors with this field name in your
  projects, in one request. A metadata descriptor describes an extra column.
  The values of the column are in the data field of the entities. The route
  changes the open projects where you are a manager. An administrator
  changes all the open projects. You must have the manager role or a higher
  role.
tags:
  - Projects
parameters:
  - in: path
    name: field_name
    required: true
    schema:
      type: string
    description: Field name of the descriptor, the key in the data field
responses:
  200:
    description: The updated descriptors
  400:
    description: A value is not valid, or the name is used by another
      column of the same type, by a built-in field, or is too long
  403:
    description: You do not have the manager role
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - entity_type
        properties:
          entity_type:
            type: string
            description: 'Entity type of the descriptor: Asset, Shot, Edit, Episode
              or Sequence'
          name:
            type: string
            description: New name of the column
          for_client:
            type: boolean
            default: false
            description: Show the column to the clients
          data_type:
            type: string
            default: string
            description: Type of the values, for example string, number,
              list or boolean
          choices:
            type: array
            items:
              type: string
            description: Values of a list column
          departments:
            type: array
            items:
              type: string
              format: uuid
            description: Departments that see the column
