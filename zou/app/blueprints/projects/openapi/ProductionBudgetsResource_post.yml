Create a budget
---
description: Create a budget in a project. You must be a manager of the
  project.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
        properties:
          name:
            type: string
            description: Budget name
            example: New Budget
          currency:
            type: string
            description: Budget currency code
            default: USD
            example: USD
responses:
  201:
    description: The new budget
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Budget unique identifier
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              description: Budget name
              example: New Budget
            currency:
              type: string
              description: Budget currency code
              example: USD
  400:
    description: The body is not valid
  403:
    description: You are not a manager of the project
