Get open projects
---
description: Return the list of projects currently running. Most of the
  time, past projects are not needed.
tags:
  - Projects
parameters:
  - in: query
    name: name
    required: false
    schema:
      type: string
    description: Filter projects by name
    example: "My Project"
responses:
  200:
    description: All running projects
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Project unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                description: Project name
                example: "My Project"
              project_status_id:
                type: string
                format: uuid
                description: Project status unique identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
