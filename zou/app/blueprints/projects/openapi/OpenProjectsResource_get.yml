Get the open projects
---
description: Get the open projects. An administrator gets all of them. Other
  users get the projects of their teams.
tags:
  - Projects
parameters:
  - in: query
    name: name
    required: false
    schema:
      type: string
    description: Get only the projects with this name
    example: My Project
responses:
  200:
    description: The list of open projects
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Project unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                description: Project name
                example: My Project
              project_status_id:
                type: string
                format: uuid
                description: Project status unique identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
