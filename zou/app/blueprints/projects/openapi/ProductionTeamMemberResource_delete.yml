Remove a person from a project team
---
description: Remove a person from the team of a project. You must be a
  manager of the project.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: person_id
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the person
    example: b35b7fb5-df86-5776-b181-68564193d360
responses:
  204:
    description: The person is removed from the team
  403:
    description: You are not a manager of the project
