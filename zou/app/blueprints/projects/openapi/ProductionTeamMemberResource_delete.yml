Remove person from production team
---
description: Remove people listed in a production team.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: person_id
    required: true
    schema:
      type: string
      format: uuid
    description: Person unique identifier
    example: b35b7fb5-df86-5776-b181-68564193d360
responses:
  204:
    description: Person removed from production team
