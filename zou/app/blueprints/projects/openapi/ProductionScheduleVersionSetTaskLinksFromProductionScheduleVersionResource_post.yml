Copy the task dates of an other schedule version
---
description: Copy the task dates of an other production schedule version
  into this version. A production schedule version is a copy of the
  schedule. You can change it, and then apply it to the tasks. You must be a
  manager of the project.
tags:
  - Projects
parameters:
  - in: path
    name: production_schedule_version_id
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the production schedule version
    example: a24a6ea4-ce75-4665-a070-57453082c250
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - production_schedule_version_id
        properties:
          production_schedule_version_id:
            type: string
            format: uuid
            description: Source production schedule version unique
              identifier
            example: b35b7fb5-df86-5776-b181-68564193d360
responses:
  200:
    description: The task links of the version
    content:
      application/json:
        schema:
          type: object
          properties:
            success:
              type: boolean
            task_link_count:
              type: integer
              description: Number of task links copied
  400:
    description: The body is not valid, or the two versions are not in the
      same project
  403:
    description: You are not a manager of the project
  404:
    description: A production schedule version does not exist
