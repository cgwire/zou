Get the preview account of a project
---
description: Get the preview account of a project. If the project has no
  preview account, the response is null. You must be a manager of the
  project.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  200:
    description: The preview account, or null
    content:
      application/json:
        schema:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              example: preview-0a1b2c3d4e5f@preview.kitsu.invalid
            full_name:
              type: string
              example: Preview Cosmos Landromat
            preview_open_until:
              type: string
              format: date-time
              nullable: true
              description: End of the access window, null when closed
  403:
    description: You are not a manager of the project
