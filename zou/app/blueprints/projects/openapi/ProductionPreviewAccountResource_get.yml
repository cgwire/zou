Get the preview account of a production
---
description: Return the preview account of the production, or null when there is none. Restricted to managers of the production.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  200:
    description: Preview account or null
    content:
      application/json:
        schema:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              example: preview-0a1b2c3d4e5f@preview.kitsu.invalid
            full_name:
              type: string
              example: Preview Cosmos Landromat
            preview_open_until:
              type: string
              format: date-time
              nullable: true
              description: End of the access window, null when closed
