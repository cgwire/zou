Get the schedule items of the task types
---
description: Get the schedule items of the task types that have tasks in a
  project. A schedule item gives the start date and the end date of a part
  of the production in the schedule. If the project has task type settings,
  the route skips the other task types. Vendors cannot use this route.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  200:
    description: The list of schedule items
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
  403:
    description: You do not have access to this project, or you are a vendor
