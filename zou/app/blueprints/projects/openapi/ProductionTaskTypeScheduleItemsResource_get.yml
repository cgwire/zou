Get production task type schedule items
---
description: Retrieve task type schedule items for given production.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  200:
    description: All task types schedule items of given production
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
