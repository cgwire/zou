Get production task type schedule items
---
description: Retrieve the schedule items of the task types with tasks in given production. When the production has task type settings, the other task types are left out.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  200:
    description: Task type schedule items of given production
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
