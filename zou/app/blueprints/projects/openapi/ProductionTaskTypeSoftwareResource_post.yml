Add a software to a task type of a project
---
description: Add a software to a task type of a project. The project must
  use the task type. The software must not be archived. If the link exists,
  the route returns it. Administrators and managers of the project can use
  this route. A supervisor of the project can use it for the task types of
  their departments.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: task_type_id
    required: true
    schema:
      type: string
      format: uuid
    description: Task type unique identifier
    example: b35b7fb5-df86-5776-b181-68564193d360
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - software_id
        properties:
          software_id:
            type: string
            format: uuid
            description: Software unique identifier
            example: c46c8fc6-ef97-4887-a292-79675204e471
responses:
  201:
    description: The link between the task type and the software
    content:
      application/json:
        schema:
          type: object
          properties:
            project_id:
              type: string
              format: uuid
              description: Project unique identifier
              example: a24a6ea4-ce75-4665-a070-57453082c250
            task_type_id:
              type: string
              format: uuid
              description: Task type unique identifier
              example: b35b7fb5-df86-5776-b181-68564193d360
            software_id:
              type: string
              format: uuid
              description: Software unique identifier
              example: c46c8fc6-ef97-4887-a292-79675204e471
  400:
    description: The project does not use the task type, or the software is
      archived
  403:
    description: You cannot change the softwares of this task type
  404:
    description: The software does not exist
