Add software to production task type
---
description: Link a software to a task type of a production. The task type
  must be a task type of the production and the software must not be
  archived. An existing link is returned as is. Admins, managers of the
  team and supervisors of the team for the task types of their departments
  can add it.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: task_type_id
    required: true
    schema:
      type: string
      format: uuid
    description: Task type unique identifier
    example: b35b7fb5-df86-5776-b181-68564193d360
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - software_id
        properties:
          software_id:
            type: string
            format: uuid
            description: Software unique identifier
            example: c46c8fc6-ef97-4887-a292-79675204e471
responses:
  201:
    description: Task type software link
    content:
      application/json:
        schema:
          type: object
          properties:
            project_id:
              type: string
              format: uuid
              description: Project unique identifier
              example: a24a6ea4-ce75-4665-a070-57453082c250
            task_type_id:
              type: string
              format: uuid
              description: Task type unique identifier
              example: b35b7fb5-df86-5776-b181-68564193d360
            software_id:
              type: string
              format: uuid
              description: Software unique identifier
              example: c46c8fc6-ef97-4887-a292-79675204e471
  400:
    description: Task type not in the production, or archived software
  403:
    description: Not allowed to change the softwares of this task type
  404:
    description: Software not found
