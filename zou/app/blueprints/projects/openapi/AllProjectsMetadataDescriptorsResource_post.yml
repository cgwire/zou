Create a metadata descriptor in all projects
---
description: Create the same metadata descriptor in your projects, in one
  request. A project that already has a descriptor with this field name is
  skipped. A metadata descriptor describes an extra column. The values of
  the column are in the data field of the entities. The route changes the
  open projects where you are a manager. An administrator changes all the
  open projects. You must have the manager role or a higher role.
tags:
  - Projects
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - data_type
        properties:
          entity_type:
            type: string
            default: Project
          name:
            type: string
          data_type:
            type: string
responses:
  201:
    description: The new descriptors
  400:
    description: A value is not valid, or the name is used by a built-in
      field
  403:
    description: You do not have the manager role
