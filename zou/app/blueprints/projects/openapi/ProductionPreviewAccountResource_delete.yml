Delete the preview account of a project
---
description: Delete the preview account of a project. You must be a manager
  of the project.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  204:
    description: The preview account is deleted
  403:
    description: You are not a manager of the project
