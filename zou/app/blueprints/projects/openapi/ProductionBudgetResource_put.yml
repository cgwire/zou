Update a budget
---
description: Change the name or the currency of a budget. You must be a
  manager of the project.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: budget_id
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the budget
    example: b35b7fb5-df86-5776-b181-68564193d360
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            description: Budget name
            example: New Budget
          currency:
            type: string
            description: Budget currency code
            example: USD
responses:
  200:
    description: The updated budget
    content:
      application/json:
        schema:
          type: object
  400:
    description: The body is not valid
  403:
    description: You are not a manager of the project
  404:
    description: The budget does not exist in this project
