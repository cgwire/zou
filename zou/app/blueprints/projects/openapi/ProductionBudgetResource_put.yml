Update budget
---
description: Update a budget for given production.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: budget_id
    required: true
    schema:
      type: string
      format: uuid
    description: Budget unique identifier
    example: b35b7fb5-df86-5776-b181-68564193d360
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            description: Budget name
            example: "New Budget"
          currency:
            type: string
            description: Budget currency code
            example: "USD"
responses:
  200:
    description: Budget updated
    content:
      application/json:
        schema:
          type: object
