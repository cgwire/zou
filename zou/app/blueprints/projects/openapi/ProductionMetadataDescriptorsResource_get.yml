Get the metadata descriptors of a project
---
description: Get the metadata descriptors of a project. A metadata
  descriptor describes an extra column. The values of the column are in the
  data field of the entities. A client gets only the descriptors for
  clients. A vendor gets only the descriptors of their departments and the
  descriptors without department.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  200:
    description: The list of descriptors
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
  403:
    description: You do not have access to this project
