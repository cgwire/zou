Get the softwares of the task types of a project
---
description: Get the softwares that the artists use for each task type of a
  project.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  200:
    description: The list of links between task types and softwares
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              project_id:
                type: string
                format: uuid
                description: Project unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              task_type_id:
                type: string
                format: uuid
                description: Task type unique identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
              software_id:
                type: string
                format: uuid
                description: Software unique identifier
                example: c46c8fc6-ef97-4887-a292-79675204e471
  403:
    description: You do not have access to this project
