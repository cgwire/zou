Create the preview account of a project
---
description: Create the preview account of a project. If the account exists,
  the route sets a new password and closes the access. Only this response
  gives the password. You must be a manager of the project.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  201:
    description: The preview account with its password
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              example: preview-0a1b2c3d4e5f@preview.kitsu.invalid
            full_name:
              type: string
              example: Preview Cosmos Landromat
            preview_open_until:
              type: string
              format: date-time
              nullable: true
              description: End of the access window, null when closed
            password:
              type: string
              example: 3kT9dQvE1xZb7mLw
  400:
    description: The authentication strategy does not support preview
      accounts
  403:
    description: You are not a manager of the project
