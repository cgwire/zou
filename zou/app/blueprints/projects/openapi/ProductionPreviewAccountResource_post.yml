Create the preview account of a production
---
description: Create the preview account of the production, or reset its password and close its access window. The clear password is returned only here. Fails with 400 when the authentication strategy is not local. Restricted to managers of the production.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  201:
    description: Preview account with its clear password
    content:
      application/json:
        schema:
          type: object
              properties:
                id:
                  type: string
                  format: uuid
                email:
                  type: string
                  example: preview-0a1b2c3d4e5f@preview.kitsu.invalid
                full_name:
                  type: string
                  example: Preview Cosmos Landromat
                preview_open_until:
                  type: string
                  format: date-time
                  nullable: true
                  description: End of the access window, null when closed
                password:
                  type: string
                  example: 3kT9dQvE1xZb7mLw
  400:
    description: Preview accounts are not available with this authentication strategy
