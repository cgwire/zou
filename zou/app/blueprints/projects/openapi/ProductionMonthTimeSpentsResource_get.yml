Get the time spent of a project by month
---
description: Get the total time spent of a project for each month. You must
  be an administrator.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  200:
    description: The total time spent for each month
    content:
      application/json:
        schema:
          type: object
  400:
    description: An identifier is not a valid UUID
  403:
    description: You are not an administrator
