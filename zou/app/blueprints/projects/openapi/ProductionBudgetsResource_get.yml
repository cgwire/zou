Get the budgets of a project
---
description: Get the budgets of a project. You must be a manager of the
  project.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  200:
    description: The list of budgets
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
  400:
    description: An identifier is not a valid UUID
  403:
    description: You are not a manager of the project
