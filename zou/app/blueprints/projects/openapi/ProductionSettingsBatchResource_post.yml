Add settings to production batch
---
description: Add several task types (with their priority), task
  statuses and asset types to a production in a single request,
  replacing one link request per item. Unknown ids are skipped.
  When replace_task_types is set, the task type list is the full
  wanted set and existing links absent from it are removed.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          task_types:
            type: array
            items:
              type: object
              properties:
                task_type_id:
                  type: string
                  format: uuid
                priority:
                  type: integer
          task_status_ids:
            type: array
            items:
              type: string
              format: uuid
          asset_type_ids:
            type: array
            items:
              type: string
              format: uuid
          replace_task_types:
            type: boolean
            default: false
responses:
  200:
    description: Updated project
