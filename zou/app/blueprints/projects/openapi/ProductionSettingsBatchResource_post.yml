Add settings to a project
---
description: Add task types with their priority, task statuses and asset
  types to a project in one request. The unknown identifiers are skipped. If
  replace_task_types is true, the task types of the project are replaced.
  You must be a manager of the project.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          task_types:
            type: array
            items:
              type: object
              properties:
                task_type_id:
                  type: string
                  format: uuid
                priority:
                  type: integer
          task_status_ids:
            type: array
            items:
              type: string
              format: uuid
          asset_type_ids:
            type: array
            items:
              type: string
              format: uuid
          replace_task_types:
            type: boolean
            default: false
responses:
  200:
    description: The updated project
  400:
    description: The body is not valid
  403:
    description: You are not a manager of the project
