Get a metadata descriptor
---
description: Get a metadata descriptor of a project. A metadata descriptor
  describes an extra column. The values of the column are in the data field
  of the entities. A client gets only the descriptors for clients. A vendor
  gets only the descriptors of their departments and the descriptors without
  department.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: metadata_descriptor_id
    required: true
    schema:
      type: string
      format: uuid
    description: Metadata descriptor unique identifier
    example: b35b7fb5-df86-5776-b181-68564193d360
responses:
  200:
    description: The descriptor
    content:
      application/json:
        schema:
          type: object
  403:
    description: You cannot read this descriptor
  404:
    description: The project has no descriptor with this identifier
