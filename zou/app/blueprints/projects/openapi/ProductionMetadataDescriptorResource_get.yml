Get metadata descriptor
---
description: Get a metadata descriptor. Descriptors serve to describe
  extra fields listed in the data attribute of entities.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: metadata_descriptor_id
    required: true
    schema:
      type: string
      format: uuid
    description: Metadata descriptor unique identifier
    example: b35b7fb5-df86-5776-b181-68564193d360
responses:
  200:
    description: Metadata descriptor
    content:
      application/json:
        schema:
          type: object
