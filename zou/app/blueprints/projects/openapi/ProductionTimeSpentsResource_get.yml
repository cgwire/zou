Get the time spents of a project
---
description: Get the time spent entries of a project. Clients and vendors cannot use this route.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  200:
    description: The list of time spent entries
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
  403:
    description: You do not have access to this project, or you are a client or a vendor
