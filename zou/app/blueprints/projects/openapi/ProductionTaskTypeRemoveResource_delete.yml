Remove a task type from a project
---
description: Remove a task type from the settings of a project. The task
  type is not deleted. You must be a manager of the project.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: task_type_id
    required: true
    schema:
      type: string
      format: uuid
    description: Task type unique identifier
    example: b35b7fb5-df86-5776-b181-68564193d360
responses:
  204:
    description: The task type is removed from the project
  403:
    description: You are not a manager of the project
