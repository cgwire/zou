Remove software from production task type
---
description: Unlink a software from a task type of a production. Admins,
  managers of the team and supervisors of the team for the task types of
  their departments can remove it.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: task_type_id
    required: true
    schema:
      type: string
      format: uuid
    description: Task type unique identifier
    example: b35b7fb5-df86-5776-b181-68564193d360
  - in: path
    name: software_id
    required: true
    schema:
      type: string
      format: uuid
    description: Software unique identifier
    example: c46c8fc6-ef97-4887-a292-79675204e471
responses:
  204:
    description: Software removed from the task type
  403:
    description: Not allowed to change the softwares of this task type
