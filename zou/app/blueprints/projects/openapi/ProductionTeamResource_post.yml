Add a person to a project team
---
description: Add a person to the team of a project. You can give the role of
  the person in this project. You must be a manager of the project.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - person_id
        properties:
          person_id:
            type: string
            format: uuid
            description: Person unique identifier
            example: b35b7fb5-df86-5776-b181-68564193d360
          role:
            type: string
            nullable: true
            description: Role of the person on this project only. Null means
              the person's global role applies.
            enum: [user, supervisor, manager, client, vendor, null]
responses:
  201:
    description: The updated project
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Project unique identifier
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              description: Project name
              example: My Project
  400:
    description: The body is not valid
  403:
    description: You are not a manager of the project
