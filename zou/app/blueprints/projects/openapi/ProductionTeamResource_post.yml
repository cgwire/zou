Add person to production team
---
description: Add a person to a production team.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c25
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - person_id
        properties:
          person_id:
            type: string
            format: uuid
            description: Person unique identifier
            example: b35b7fb5-df86-5776-b181-68564193d36
          role:
            type: string
            nullable: true
            description: Role of the person on this project only.
              Null means the person's global role applies.
            enum: [user, supervisor, manager, client, vendor, null]
responses:
  201:
    description: Person added to the production team
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Project unique identifier
              example: a24a6ea4-ce75-4665-a070-57453082c25
            name:
              type: string
              description: Project name
              example: "My Project"
  400:
    description: Invalid parameters
