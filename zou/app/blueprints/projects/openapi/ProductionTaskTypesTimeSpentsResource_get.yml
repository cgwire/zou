Get production task type time spents
---
description: Retrieve time spents for a task type in the production.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c25
  - in: path
    name: task_type_id
    required: true
    schema:
      type: string
      format: uuid
    description: Task type unique identifier
    example: b35b7fb5-df86-5776-b181-68564193d36
  - in: query
    name: start_date
    required: false
    schema:
      type: string
      format: date
    description: Start date for filtering time spents
    example: "2022-07-01"
  - in: query
    name: end_date
    required: false
    schema:
      type: string
      format: date
    description: End date for filtering time spents
    example: "2022-07-31"
responses:
  200:
    description: All time spents for given task type and project
    content:
      application/json:
        schema:
          type: dict
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Time spent unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c25
              person_id:
                type: string
                format: uuid
                description: Person unique identifier
                example: b35b7fb5-df86-5776-b181-68564193d36
              duration:
                type: number
                format: float
                description: Time spent duration in hours
                example: 8.5
              date:
                type: string
                format: date
                description: Date of time spent entry
                example: "2022-07-15"
  400:
    description: Invalid date range parameters
