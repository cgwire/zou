Get the time spents of a task type in a project
---
description: Get the time spent entries of the tasks of a task type in a
  project. Give start_date and end_date to get the entries of a period. You
  must be a manager of the project.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: task_type_id
    required: true
    schema:
      type: string
      format: uuid
    description: Task type unique identifier
    example: b35b7fb5-df86-5776-b181-68564193d360
  - in: query
    name: start_date
    required: false
    schema:
      type: string
      format: date
    description: First date of the period, in the YYYY-MM-DD format
    example: '2022-07-01'
  - in: query
    name: end_date
    required: false
    schema:
      type: string
      format: date
    description: Last date of the period, in the YYYY-MM-DD format
    example: '2022-07-31'
responses:
  200:
    description: The list of time spent entries
    content:
      application/json:
        schema:
          type: object
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Time spent unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              person_id:
                type: string
                format: uuid
                description: Person unique identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
              duration:
                type: number
                format: float
                description: Time spent duration in hours
                example: 8.5
              date:
                type: string
                format: date
                description: Date of time spent entry
                example: '2022-07-15'
  400:
    description: An identifier or a date is not valid, or only one date of
      the period is given
  403:
    description: You are not a manager of the project
