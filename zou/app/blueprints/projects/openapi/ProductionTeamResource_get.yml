Get the team of a project
---
description: Get the persons of the team of a project, with their role in
  the project. A manager gets all the fields of each person. A client gets
  the fields for clients. Other users get the minimal fields.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  200:
    description: The list of team members
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Person unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              first_name:
                type: string
                description: Person first name
                example: John
              last_name:
                type: string
                description: Person last name
                example: Doe
              email:
                type: string
                description: Person email address
                example: john.doe@example.com
              project_role:
                type: string
                nullable: true
                description: Person role on this project only. Null means
                  the person's global role applies.
                example: supervisor
  403:
    description: You do not have access to this project
