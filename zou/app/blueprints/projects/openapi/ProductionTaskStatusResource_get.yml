Get production task statuses
---
description: Return task statuses linked to a production.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  200:
    description: Task statuses linked to production
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
