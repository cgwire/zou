Remove status automation from production
---
description: Remove a status automation from a production.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: status_automation_id
    required: true
    schema:
      type: string
      format: uuid
    description: Status automation unique identifier
    example: b35b7fb5-df86-5776-b181-68564193d360
responses:
  204:
    description: Status automation removed from production
