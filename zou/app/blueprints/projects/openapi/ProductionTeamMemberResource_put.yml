Set the role of a team member
---
description: Set the role of a person in one project. A null role gives back
  the global role of the person. You must be a manager of the project.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the project
  - in: path
    name: person_id
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the person
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          role:
            type: string
            nullable: true
            enum: [user, supervisor, manager, client, vendor, null]
responses:
  200:
    description: The updated team link
  400:
    description: The person is not in the team, or the role is not valid
  403:
    description: You are not a manager of the project
