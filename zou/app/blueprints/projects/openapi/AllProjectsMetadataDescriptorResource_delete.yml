Delete a metadata descriptor in all projects
---
description: Delete the metadata descriptors with this field name in your
  projects, in one request. A metadata descriptor describes an extra column.
  The values of the column are in the data field of the entities. The route
  changes the open projects where you are a manager. An administrator
  changes all the open projects. You must have the manager role or a higher
  role.
tags:
  - Projects
parameters:
  - in: path
    name: field_name
    required: true
    schema:
      type: string
    description: Field name of the descriptor, the key in the data field
  - in: query
    name: entity_type
    required: true
    schema:
      type: string
    description: 'Entity type of the descriptor: Asset, Shot, Edit, Episode or
      Sequence'
responses:
  200:
    description: The identifiers of the deleted descriptors
  400:
    description: The entity type is not valid
  403:
    description: You do not have the manager role
