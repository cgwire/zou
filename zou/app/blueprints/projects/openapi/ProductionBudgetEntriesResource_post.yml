Create a budget entry
---
description: Create an entry in a budget of a project. You must be a manager
  of the project.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: budget_id
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the budget
    example: b35b7fb5-df86-5776-b181-68564193d360
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - department_id
        properties:
          department_id:
            type: string
            format: uuid
            description: Department unique identifier
            example: c46c80c6-e097-6887-c292-79675204e470
          person_id:
            type: string
            format: uuid
            description: Person unique identifier
            example: a24a6ea4-ce75-4665-a070-57453082c250
          start_date:
            type: string
            format: date
            description: Budget entry start date
            example: '2025-01-01'
          months_duration:
            type: integer
            description: Budget entry duration in months
            example: 12
          daily_salary:
            type: number
            format: float
            description: Daily salary amount
            example: 100.00
          position:
            type: string
            description: Position name
            example: Artist
          seniority:
            type: string
            description: Seniority level
            example: Mid
responses:
  201:
    description: The new budget entry
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Budget entry unique identifier
              example: a24a6ea4-ce75-4665-a070-57453082c250
            department_id:
              type: string
              format: uuid
              description: Department unique identifier
              example: c46c80c6-e097-6887-c292-79675204e470
  400:
    description: The body is not valid
  403:
    description: You are not a manager of the project
