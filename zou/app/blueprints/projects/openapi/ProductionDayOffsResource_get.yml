Get the day offs of a project team
---
description: Get the day offs of the team of a project. Give start_date and
  end_date to get the day offs of a period. A manager gets the description
  of each day off. Other users get the description of their own day offs
  only. Clients and vendors cannot use this route.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: query
    name: start_date
    required: false
    schema:
      type: string
      format: date
    description: First date of the period, in the YYYY-MM-DD format
    example: '2022-07-01'
  - in: query
    name: end_date
    required: false
    schema:
      type: string
      format: date
    description: Last date of the period, in the YYYY-MM-DD format
    example: '2022-07-31'
responses:
  200:
    description: The list of day offs
    content:
      application/json:
        schema:
          type: object
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Day off unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              person_id:
                type: string
                format: uuid
                description: Person unique identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
              description:
                type: string
                description: Day off description
                example: Vacation
              date:
                type: string
                format: date
                description: Day off start date
                example: '2022-07-15'
              end_date:
                type: string
                format: date
                description: Day off end date
                example: '2022-07-22'
  400:
    description: A date is not valid
  403:
    description: You do not have access to this project, or you are a client
      or a vendor
