Get production day offs
---
description: Retrieve all day offs for a production.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c25
  - in: query
    name: start_date
    required: false
    schema:
      type: string
      format: date
    description: Start date for filtering day offs
    example: "2022-07-01"
  - in: query
    name: end_date
    required: false
    schema:
      type: string
      format: date
    description: End date for filtering day offs
    example: "2022-07-31"
responses:
  200:
    description: All day offs for given project
    content:
      application/json:
        schema:
          type: dict
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Day off unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c25
              person_id:
                type: string
                format: uuid
                description: Person unique identifier
                example: b35b7fb5-df86-5776-b181-68564193d36
              description:
                type: string
                description: Day off description
                example: "Vacation"
              date:
                type: string
                format: date
                description: Day off start date
                example: "2022-07-15"
              end_date:
                type: string
                format: date
                description: Day off end date
                example: "2022-07-22"
  400:
    description: Invalid date range parameters
