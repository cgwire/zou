Get budget entry
---
description: Retrieve a budget entry for given production and budget.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: budget_id
    required: true
    schema:
      type: string
      format: uuid
    description: Budget unique identifier
    example: b35b7fb5-df86-5776-b181-68564193d360
  - in: path
    name: entry_id
    required: true
    schema:
      type: string
      format: uuid
    description: Budget entry unique identifier
    example: c46c80c6-e097-6887-c292-79675204e470
responses:
  200:
    description: Budget entry retrieved
    content:
      application/json:
        schema:
          type: object
