Get a budget entry
---
description: Get an entry of a budget. You must be a manager of the project.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: budget_id
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the budget
    example: b35b7fb5-df86-5776-b181-68564193d360
  - in: path
    name: entry_id
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the budget entry
    example: c46c80c6-e097-6887-c292-79675204e470
responses:
  200:
    description: The budget entry
    content:
      application/json:
        schema:
          type: object
  400:
    description: An identifier is not a valid UUID
  403:
    description: You are not a manager of the project
  404:
    description: The budget entry does not exist in this budget
