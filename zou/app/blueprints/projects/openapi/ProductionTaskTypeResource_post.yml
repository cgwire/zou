Add a task type to a project
---
description: Add a task type to the settings of a project. You can give its
  priority, its movie bitrates and its visibility for the clients. You must
  be a manager of the project.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - task_type_id
        properties:
          task_type_id:
            type: string
            format: uuid
            description: Task type unique identifier
            example: b35b7fb5-df86-5776-b181-68564193d360
          priority:
            type: string
            description: Task type priority
            example: None
          hd_bitrate_compression:
            type: integer
            description: High definition movie bitrate in Mbit/s for this
              task type, null inherits the project's
            example: 20
          ld_bitrate_compression:
            type: integer
            description: Low definition movie bitrate in Mbit/s for this
              task type, null inherits the project's
            example: 4
          is_client_visible:
            type: boolean
            description: Whether clients see this task type, left untouched
              when omitted
            example: true
responses:
  201:
    description: The updated project
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Project unique identifier
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              description: Project name
              example: My Project
  400:
    description: The body is not valid
  403:
    description: You are not a manager of the project
