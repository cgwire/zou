Set production task status client permission
---
description: Override, for a production, whether its clients may set a
  task status. A null value reverts to the studio value of the task status.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: task_status_id
    required: true
    schema:
      type: string
      format: uuid
    description: Task status unique identifier
    example: b35b7fb5-df86-5776-b181-68564193d360
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - is_client_allowed
        properties:
          is_client_allowed:
            type: boolean
            nullable: true
            description: Whether clients may set this status in this
              production, null inherits the studio value
            example: false
responses:
  200:
    description: Updated task status link
  400:
    description: Missing is_client_allowed field
  403:
    description: Caller is not a manager of the production
  404:
    description: Task status not linked to the production
