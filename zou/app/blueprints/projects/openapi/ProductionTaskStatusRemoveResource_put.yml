Let the clients use a task status
---
description: Set if the clients of a project can use a task status. A null
  value uses the value of the studio. You must be a manager of the project.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: task_status_id
    required: true
    schema:
      type: string
      format: uuid
    description: Task status unique identifier
    example: b35b7fb5-df86-5776-b181-68564193d360
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - is_client_allowed
        properties:
          is_client_allowed:
            type: boolean
            nullable: true
            description: Whether clients may set this status in this
              production, null inherits the studio value
            example: false
responses:
  200:
    description: The updated link
  400:
    description: is_client_allowed is missing
  403:
    description: You are not a manager of the project
  404:
    description: The project does not use this task status
