Open or close the preview account
---
description: Open the access of the preview account for one hour, or close
  it. When you close it, its sessions end. You must be a manager of the
  project.
tags:
  - Projects
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - is_open
        properties:
          is_open:
            type: boolean
            example: true
responses:
  200:
    description: The updated preview account
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              example: preview-0a1b2c3d4e5f@preview.kitsu.invalid
            full_name:
              type: string
              example: Preview Cosmos Landromat
            preview_open_until:
              type: string
              format: date-time
              nullable: true
              description: End of the access window, null when closed
  400:
    description: The body is not valid
  403:
    description: You are not a manager of the project
  404:
    description: The project has no preview account
