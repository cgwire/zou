Get production schedule version task links
---
description: Get task links for given production schedule version.
tags:
  - Projects
parameters:
  - in: path
    name: production_schedule_version_id
    required: true
    schema:
      type: string
      format: uuid
    description: Production schedule version unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: query
    name: task_type_id
    required: false
    schema:
      type: string
      format: uuid
    description: Task type unique identifier for filtering
    example: b35b7fb5-df86-5776-b181-68564193d360
  - in: query
    name: page
    required: false
    type: integer
    example: 1
    description: Page number. Without page nor limit, the whole list is
      returned; with either, a paginated envelope is returned.
  - in: query
    name: limit
    required: false
    type: integer
    example: 100
    description: Number of entries per page (default 100, max 5000). A
      limit alone returns the first page.
responses:
  200:
    description: Task links for given production schedule version
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
  400:
    description: Wrong ID format
