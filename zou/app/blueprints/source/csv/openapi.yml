TaskTypeEstimationsCsvImportResource_post:
  summary: Import task estimations from a CSV file
  tags:
    - Import
  description: Set the estimations, the dates and the other values of the
    tasks of a task type from a CSV file. Each line gives one entity. The
    columns are Parent, Entity, Estimation, Drawings, Start date and Due date.
    Send the CSV file in a multipart form. The route finds the separator of
    the file. Each line is imported in order. If a line is not valid, the
    import stops. You must be a manager of the project, or a supervisor of the
    department of the task type.
  parameters:
    - in: path
      name: project_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the project
    - in: path
      name: task_type_id
      required: true
      schema:
        type: string
        format: uuid
      example: b24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the task type
  responses:
    201:
      description: The imported lines
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  example: a24a6ea4-ce75-4665-a070-57453082c250
                name:
                  type: string
                  example: Asset Modeling
                estimation:
                  type: integer
                  example: 480
                start_date:
                  type: string
                  format: date
                  example: '2024-01-15'
                due_date:
                  type: string
                  format: date
                  example: '2024-01-25'
    400:
      description: A line of the file is not valid. The lines before this line
        are imported.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: boolean
              message:
                type: string
              line_number:
                type: integer
                description: Number of the line that is not valid
              imported_rows:
                type: integer
                description: Number of lines that are imported
    403:
      description: You cannot change the tasks of this task type
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            file:
              type: string
              description: CSV file with task estimation data
              format: binary
          required:
            - file

