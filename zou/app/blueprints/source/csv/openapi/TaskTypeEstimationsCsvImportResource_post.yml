Import task type estimations csv
---
tags:
  - Import
description: Import task type estimations from a CSV file. Updates
  estimations, dates, and other task properties for assets or shots
  based on CSV rows. The Estimation column is read in hours when the
  organisation displays durations in hours (format_duration_in_hours),
  in days otherwise.
consumes:
  - multipart/form-data
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: task_type_id
    required: true
    schema:
      type: string
      format: uuid
    example: b24a6ea4-ce75-4665-a070-57453082c250
  - in: formData
    name: file
    type: file
    required: true
    description: CSV file with task estimation data
responses:
    201:
      description: Task estimations imported successfully
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  example: a24a6ea4-ce75-4665-a070-57453082c250
                name:
                  type: string
                  example: Asset Modeling
                estimation:
                  type: integer
                  example: 480
                start_date:
                  type: string
                  format: date
                  example: "2024-01-15"
                due_date:
                  type: string
                  format: date
                  example: "2024-01-25"
    400:
      description: Invalid CSV format or entity not found
