Import shots csv
---
tags:
  - Import
description: Import project shots from a CSV file. Creates or updates
  shots based on CSV rows. Supports sequences, episodes, and task
  status updates.
consumes:
  - multipart/form-data
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: query
    name: update
    required: false
    schema:
      type: boolean
    default: false
    example: false
    description: Whether to update existing shots
  - in: formData
    name: file
    type: file
    required: true
    description: CSV file with shot data
responses:
    201:
      description: Shots imported successfully
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  example: a24a6ea4-ce75-4665-a070-57453082c250
                name:
                  type: string
                  example: SH010
                project_id:
                  type: string
                  format: uuid
                  example: b24a6ea4-ce75-4665-a070-57453082c250
                parent_id:
                  type: string
                  format: uuid
                  example: c24a6ea4-ce75-4665-a070-57453082c250
                nb_frames:
                  type: integer
                  example: 120
                description:
                  type: string
                  example: Shot description
    400:
      description: Invalid CSV format or missing required columns
