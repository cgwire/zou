Import shots from a CSV file
---
tags:
  - Import
description: Create shots in a project from a CSV file. A line gives the
  episode, the sequence, the frames, the metadata and the task statuses of a
  shot. The route creates the missing episodes and sequences. Send the CSV
  file in a multipart form. The route finds the separator of the file. Each
  line is imported in order. If a line is not valid, the import stops.
  Without update=true, the lines of the entities that exist are skipped. You
  must be a manager of the project.
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the project
  - in: query
    name: update
    required: false
    schema:
      type: boolean
      default: false
    example: false
    description: Update the entities that exist
responses:
  201:
    description: The imported lines
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: SH010
              project_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              parent_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
              nb_frames:
                type: integer
                example: 120
              description:
                type: string
                example: Shot description
  400:
    description: A line of the file is not valid. The lines before this line
      are imported.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: boolean
            message:
              type: string
            line_number:
              type: integer
              description: Number of the line that is not valid
            imported_rows:
              type: integer
              description: Number of lines that are imported
  403:
    description: You are not a manager of the project
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          file:
            type: string
            description: CSV file with shot data
            format: binary
        required:
          - file
