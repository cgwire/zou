OTIOBaseResource_post:
  summary: Import a timeline file
  description: Set frame_in, frame_out and nb_frames of the shots from a
    timeline file. Send the file in a multipart form. The route can read all
    the formats of OpenTimelineIO, for example OTIO or EDL. The naming
    convention gives the name of each shot of the file. The route creates the
    missing shots. You must be a manager of the project.
  tags:
    - Import
  parameters:
    - in: path
      name: project_id
      required: true
      schema:
        type: string
        format: uuid
      description: Unique identifier of the project
      example: a24a6ea4-ce75-4665-a070-57453082c250
  responses:
    201:
      description: The updated shots
    400:
      description: The file is not valid, or a name does not match the naming
        convention
    403:
      description: You are not a manager of the project
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            file:
              type: string
              description: OTIO file to import (EDL, OTIO, etc.)
              format: binary
          required:
            - file

OTIOImportEpisodeResource_post:
  summary: Import a timeline file into an episode
  tags:
    - Import
  description: Set frame_in, frame_out and nb_frames of the shots of an
    episode from a timeline file. The naming convention includes the episode
    name. Send the file in a multipart form. The route can read all the
    formats of OpenTimelineIO, for example OTIO or EDL. The naming convention
    gives the name of each shot of the file. The route creates the missing
    shots. You must be a manager of the project.
  parameters:
    - in: path
      name: project_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the project
    - in: path
      name: episode_id
      required: true
      schema:
        type: string
        format: uuid
      example: b24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the episode
    - in: query
      name: naming_convention
      required: false
      schema:
        type: string
        default: ${project_name}_${episode_name}-${sequence_name}-${shot_name}
      example: ${project_name}_${episode_name}-${sequence_name}-${shot_name}
      description: Template of the shot names in the file. You can also send
        it as a form field.
    - in: query
      name: match_case
      required: false
      schema:
        type: boolean
        default: true
      example: true
      description: Make a difference between upper case and lower case in the
        names. You can also send it as a form field.
  responses:
    201:
      description: The updated shots
      content:
        application/json:
          schema:
            type: object
            properties:
              updated_shots:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      example: a24a6ea4-ce75-4665-a070-57453082c250
                    name:
                      type: string
                      example: SH010
                    project_id:
                      type: string
                      format: uuid
                      example: c24a6ea4-ce75-4665-a070-57453082c250
                    nb_frames:
                      type: integer
                      example: 120
                    data:
                      type: object
                      properties:
                        frame_in:
                          type: integer
                          example: 1001
                        frame_out:
                          type: integer
                          example: 1120
              created_shots:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      example: d24a6ea4-ce75-4665-a070-57453082c250
                    name:
                      type: string
                      example: SH020
                    project_id:
                      type: string
                      format: uuid
                      example: c24a6ea4-ce75-4665-a070-57453082c250
                    nb_frames:
                      type: integer
                      example: 96
                    data:
                      type: object
                      properties:
                        frame_in:
                          type: integer
                          example: 2001
                        frame_out:
                          type: integer
                          example: 2096
    400:
      description: The file is missing or not valid, or a name does not match
        the naming convention
    403:
      description: You are not a manager of the project
    404:
      description: The project or the episode does not exist
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            file:
              type: string
              description: OTIO file to import (EDL, OTIO, etc.)
              format: binary
          required:
            - file

