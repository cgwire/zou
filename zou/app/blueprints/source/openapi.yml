BaseImportKitsuResource_post:
  summary: Import rows from another Kitsu instance
  tags:
    - Import
  description: 'Import rows, for example preview files, time spents,
    playlists, milestones, notifications or attachment files, from another
    Kitsu instance. Synchronization tools use this route to copy data from
    another Kitsu instance. Send a JSON list of rows, with their identifiers.
    A row that exists is updated. Else, it is created. You must be an
    administrator.'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: Resource name
              project_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
        example:
          - id: a24a6ea4-ce75-4665-a070-57453082c250
            name: Example resource
            project_id: b24a6ea4-ce75-4665-a070-57453082c250
  responses:
    200:
      description: The created and updated rows
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  example: a24a6ea4-ce75-4665-a070-57453082c250
                name:
                  type: string
                  example: Imported resource
                created_at:
                  type: string
                  format: date-time
                  example: '2024-01-15T10:30:00Z'
                updated_at:
                  type: string
                  format: date-time
                  example: '2024-01-15T11:00:00Z'
    400:
      description: The body is not a list, or a row breaks a database
        constraint
    403:
      description: You are not an administrator
  parameters:
    - in: query
      name: silent
      required: false
      description: Do not send an event for each imported row. Use it for
        large imports.
      schema:
        type: boolean
        default: false

