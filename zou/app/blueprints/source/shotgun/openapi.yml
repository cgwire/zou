ImportShotgunAssetsResource_post:
  summary: Import Shotgun assets
  description: Import assets from Shotgun. The route also links each asset to
    its parent assets. Send a JSON list of Shotgun rows. A row that exists in
    Kitsu, with the same Shotgun identifier, is updated. Else, it is created.
    A row that misses a field is skipped. A row with no sg_asset_type, or
    whose project is not in Kitsu, is skipped. You must be an administrator.
  tags:
    - Import
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                description: Shotgun ID of the asset
                example: 12345
              code:
                type: string
                description: Asset code
                example: Asset01
              description:
                type: string
                description: Asset description
                example: Main character asset
              sg_asset_type:
                type: string
                description: Asset type name
                example: Character
              project:
                type: object
                description: Project information
                properties:
                  id:
                    type: integer
                    example: 11111
              parents:
                type: array
                description: Parent assets
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 22222
        example:
          - id: 12345
            code: Asset01
            description: Main character asset
            sg_asset_type: Character
            project:
              id: 11111
            parents:
              - id: 22222
  responses:
    200:
      description: The created and updated rows
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: Asset unique identifier
                  example: a24a6ea4-ce75-4665-a070-57453082c250
                name:
                  type: string
                  description: Asset name
                  example: Asset01
                description:
                  type: string
                  description: Asset description
                  example: Main character asset
                created_at:
                  type: string
                  format: date-time
                  description: Creation timestamp
                  example: '2024-01-15T10:30:00Z'
                updated_at:
                  type: string
                  format: date-time
                  description: Update timestamp
                  example: '2024-01-15T11:00:00Z'
    400:
      description: The body is not JSON
    403:
      description: You are not an administrator
    500:
      description: The body is not a list, or a row breaks a database
        constraint

