  description: Import notes as comments from Shotgun. The route imports only
    the notes whose first task exists in Kitsu. Send a JSON list of Shotgun
    rows. A row that exists in Kitsu, with the same Shotgun identifier, is
    updated. Else, it is created. A row that misses a field is skipped. You
    must be an administrator.
  tags:
    - Import
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                description: Shotgun ID of the note
                example: 12345
              content:
                type: string
                description: Note content
                example: This is a comment
              tasks:
                type: array
                description: Linked tasks
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 67890
              user:
                type: object
                description: User who created the note
                properties:
                  id:
                    type: integer
                    example: 11111
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: '2024-01-15T10:30:00Z'
        example:
          - id: 12345
            content: This is a comment
            tasks:
              - id: 67890
            user:
              id: 11111
            created_at: '2024-01-15T10:30:00Z'
  responses:
    200:
      description: The created and updated rows
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: Comment unique identifier
                  example: a24a6ea4-ce75-4665-a070-57453082c250
                text:
                  type: string
                  description: Comment text
                  example: This is a comment
                created_at:
                  type: string
                  format: date-time
                  description: Creation timestamp
                  example: '2024-01-15T10:30:00Z'
    400:
      description: The body is not JSON
    403:
      description: You are not an administrator
    500:
      description: The body is not a list, or a row breaks a database
        constraint

ImportShotgunPersonsResource_post:
  summary: Import Shotgun persons
  description: Import persons from Shotgun. Send a JSON list of Shotgun rows.
    A person that exists in Kitsu, with the same Shotgun identifier or the
    same email, is not changed, but their department is set to the department
    of the row. Else, the person is created. The role is manager or admin when
    permission_rule_set.name is Manager or Admin, user otherwise. A row with
    the email changeme@email.com is skipped. A row that misses a field is
    skipped. You must be an administrator.
  tags:
    - Import
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                description: Shotgun ID of the person
                example: 12345
              firstname:
                type: string
                description: First name
                example: John
              lastname:
                type: string
                description: Last name
                example: Doe
              email:
                type: string
                format: email
                description: Email address
                example: john.doe@example.com
              login:
                type: string
                description: Desktop login
                example: jdoe
              sg_status_list:
                type: string
                description: Status list
                example: act
              permission_rule_set:
                type: object
                description: Permission rule set
                properties:
                  name:
                    type: string
                    example: Manager
              department:
                type: object
                description: Department information
