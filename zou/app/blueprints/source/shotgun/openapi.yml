BaseImportShotgunResource_post:
  summary: Import Shotgun rows
  tags:
    - Import
  description: Import rows from Shotgun. Send a JSON list of Shotgun rows. A
    row that exists in Kitsu, with the same Shotgun identifier, is updated.
    Else, it is created. A row that misses a field is skipped. You must be an
    administrator.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 12345
                description: Shotgun ID of the entry
              code:
                type: string
                example: SH010
              name:
                type: string
                example: Shot name
        example:
          - id: 12345
            code: SH010
            name: Shot name
  responses:
    200:
      description: The created and updated rows
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  example: a24a6ea4-ce75-4665-a070-57453082c250
                name:
                  type: string
                  example: Imported resource
                created_at:
                  type: string
                  format: date-time
                  example: '2024-01-15T10:30:00Z'
                updated_at:
                  type: string
                  format: date-time
                  example: '2024-01-15T11:00:00Z'
    400:
      description: The body is not JSON
    403:
      description: You are not an administrator
    500:
      description: The body is not a list, or a row breaks a database
        constraint

ImportRemoveShotgunAssetResource_post:
  summary: Remove a Shotgun asset
  description: Remove an asset. If tasks of the asset have working files, the
    asset is only canceled that was imported from Shotgun. Send the Shotgun
    identifier of the row in the body. If no row has this identifier, the
    response is a success. You must be an administrator.
  tags:
    - Import
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - id
          properties:
            id:
              type: integer
              description: Shotgun ID of the asset to remove
              example: 12345
        example:
          id: 12345
  responses:
    200:
      description: The result of the removal
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                description: Whether the removal was successful
                example: true
              removed_instance_id:
                type: string
                format: uuid
                description: ID of the removed asset, if found
                example: a24a6ea4-ce75-4665-a070-57453082c250
    400:
      description: The body is not JSON
    403:
      description: You are not an administrator
    500:
      description: The body has no id, or the id is not an integer

ImportRemoveShotgunBaseResource_post:
  summary: Remove a Shotgun row
  tags:
