Delete a Shotgun import error
---
description: Delete an error of a Shotgun import. You must be an
  administrator.
tags:
  - Import
parameters:
  - in: path
    name: error_id
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the import error
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  204:
    description: The import error is deleted
    content:
      application/json:
        schema:
          type: object
          properties:
            deletion_success:
              type: boolean
              description: Whether deletion was successful
              example: true
  403:
    description: You are not an administrator
  404:
    description: The import error does not exist, or the identifier is not
      valid
