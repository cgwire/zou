Import Shotgun shots
---
description: Import shots from Shotgun. The route also sets the frames, the
  custom fields and the casting of each shot. Send a JSON list of Shotgun
  rows. A row that exists in Kitsu, with the same Shotgun identifier, is
  updated. Else, it is created. A row with a wrong format is skipped. You
  must be an administrator.
tags:
  - Import
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: array
        items:
          type: object
          properties:
            id:
              type: integer
              description: Shotgun ID of the shot
              example: 12345
            code:
              type: string
              description: Shot code
              example: SH010
            sg_cut_in:
              type: integer
              description: Cut in frame
              example: 1001
            sg_cut_duration:
              type: integer
              description: Cut duration in frames
              example: 50
            project:
              type: object
              description: Project information
              properties:
                name:
                  type: string
                  example: My Project
            sg_sequence:
              type: object
              description: Sequence information
              properties:
                id:
                  type: integer
                  example: 11111
            sg_scene:
              type: object
              description: Scene information
              properties:
                id:
                  type: integer
                  example: 22222
            assets:
              type: array
              description: Linked assets
              items:
                type: object
                properties:
                  id:
                    type: integer
                    example: 33333
      example:
        - id: 12345
          code: SH010
          sg_cut_in: 1001
          sg_cut_duration: 50
          project:
            name: My Project
          sg_sequence:
            id: 11111
          sg_scene:
            id: 22222
          assets:
            - id: 33333
responses:
  200:
    description: The created and updated rows
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Shot unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                description: Shot name
                example: SH010
              data:
                type: object
                description: Shot data with frame ranges and custom fields
                example:
                  frame_in: 1001
                  frame_out: 1051
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                description: Update timestamp
                example: '2024-01-15T11:00:00Z'
  400:
    description: The body is not valid
  403:
    description: You are not an administrator
  500:
    description: A row breaks a database constraint
