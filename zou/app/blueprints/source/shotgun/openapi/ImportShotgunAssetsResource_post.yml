Import shotgun assets
---
description: Import Shotgun assets. Send a list of Shotgun asset
  entries in the JSON body. Returns created or updated assets with
  parent-child relationships.
tags:
  - Import
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: array
        items:
          type: object
          properties:
            id:
              type: integer
              description: Shotgun ID of the asset
              example: 12345
            code:
              type: string
              description: Asset code
              example: "Asset01"
            description:
              type: string
              description: Asset description
              example: "Main character asset"
            sg_asset_type:
              type: string
              description: Asset type name
              example: "Character"
            project:
              type: object
              description: Project information
              properties:
                id:
                  type: integer
                  example: 11111
            parents:
              type: array
              description: Parent assets
              items:
                type: object
                properties:
                  id:
                    type: integer
                    example: 22222
      example:
        - id: 12345
          code: "Asset01"
          description: "Main character asset"
          sg_asset_type: "Character"
          project:
            id: 11111
          parents:
            - id: 22222
responses:
  200:
    description: Assets imported successfully
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Asset unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                description: Asset name
                example: "Asset01"
              description:
                type: string
                description: Asset description
                example: "Main character asset"
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: "2024-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                description: Update timestamp
                example: "2024-01-15T11:00:00Z"
  400:
    description: Invalid request body or data format error
