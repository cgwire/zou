Import Shotgun versions
---
description: Import versions as preview files from Shotgun. The route
  imports only the versions that are linked to a task. A version becomes a
  preview file. Send a JSON list of Shotgun rows. A row that exists in
  Kitsu, with the same Shotgun identifier, is updated. Else, it is created.
  A row with a wrong format is skipped. You must be an administrator.
tags:
  - Import
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: array
        items:
          type: object
          properties:
            id:
              type: integer
              description: Shotgun ID of the version
              example: 12345
            code:
              type: string
              description: Version code
              example: v001
            description:
              type: string
              description: Version description
              example: First version
            sg_task:
              type: object
              description: Task information
              properties:
                id:
                  type: integer
                  example: 11111
            user:
              type: object
              description: User information
              properties:
                id:
                  type: integer
                  example: 22222
            sg_uploaded_movie:
              type: object
              description: Uploaded movie information
              properties:
                url:
                  type: string
                  example: https://example.com/movie.mp4
                name:
                  type: string
                  example: movie.mp4
      example:
        - id: 12345
          code: v001
          description: First version
          sg_task:
            id: 11111
          user:
            id: 22222
          sg_uploaded_movie:
            url: https://example.com/movie.mp4
            name: movie.mp4
responses:
  200:
    description: The created and updated rows
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Preview file unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                description: Preview file name
                example: v001
              description:
                type: string
                description: Preview file description
                example: First version
              source:
                type: string
                description: Source of the preview
                example: Shotgun
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                description: Update timestamp
                example: '2024-01-15T11:00:00Z'
  400:
    description: The body is not valid
  403:
    description: You are not an administrator
  500:
    description: A row breaks a database constraint
