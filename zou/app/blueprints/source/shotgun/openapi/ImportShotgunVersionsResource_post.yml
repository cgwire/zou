Import shotgun versions
---
description: Import Shotgun versions (preview files). Send a list of
  Shotgun version entries in the JSON body. Only versions linked to
  tasks are imported. Returns created or updated preview files.
tags:
  - Import
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: array
        items:
          type: object
          properties:
            id:
              type: integer
              description: Shotgun ID of the version
              example: 12345
            code:
              type: string
              description: Version code
              example: "v001"
            description:
              type: string
              description: Version description
              example: "First version"
            sg_task:
              type: object
              description: Task information
              properties:
                id:
                  type: integer
                  example: 11111
            user:
              type: object
              description: User information
              properties:
                id:
                  type: integer
                  example: 22222
            sg_uploaded_movie:
              type: object
              description: Uploaded movie information
              properties:
                url:
                  type: string
                  example: "https://example.com/movie.mp4"
                name:
                  type: string
                  example: "movie.mp4"
      example:
        - id: 12345
          code: "v001"
          description: "First version"
          sg_task:
            id: 11111
          user:
            id: 22222
          sg_uploaded_movie:
            url: "https://example.com/movie.mp4"
            name: "movie.mp4"
responses:
  200:
    description: Versions imported successfully
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Preview file unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c25
              name:
                type: string
                description: Preview file name
                example: "v001"
              description:
                type: string
                description: Preview file description
                example: "First version"
              source:
                type: string
                description: Source of the preview
                example: "Shotgun"
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: "2024-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                description: Update timestamp
                example: "2024-01-15T11:00:00Z"
  400:
    description: Invalid request body or data format error
