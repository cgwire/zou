Save a Shotgun import error
---
description: Save an error of a Shotgun import. The body is kept as the data
  of the error. You must be an administrator.
tags:
  - Import
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        description: Error event data
        properties:
          error:
            type: string
            description: Error message
            example: Failed to import asset
          details:
            type: object
            description: Additional error details
            example: {shotgun_id: 12345, reason: Missing field}
        example:
          error: Failed to import asset
          details:
            shotgun_id: 12345
            reason: Missing required field
responses:
  201:
    description: The new import error
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Import error unique identifier
              example: a24a6ea4-ce75-4665-a070-57453082c250
            source:
              type: string
              description: Source of the import error
              example: shotgun
            event_data:
              type: object
              description: Error event data
              example: {error: Failed to import asset}
            created_at:
              type: string
              format: date-time
              description: Creation timestamp
              example: '2024-01-15T10:30:00Z'
  400:
    description: Invalid request body
  403:
    description: You are not an administrator
