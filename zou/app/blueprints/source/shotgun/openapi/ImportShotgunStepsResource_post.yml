Import Shotgun steps
---
description: Import steps as task types from Shotgun. A step becomes a task
  type. Send a JSON list of Shotgun rows. A row that exists in Kitsu, with
  the same Shotgun identifier, is updated. Else, it is created. A row with a
  wrong format is skipped. You must be an administrator.
tags:
  - Import
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: array
        items:
          type: object
          properties:
            id:
              type: integer
              description: Shotgun ID of the step
              example: 12345
            code:
              type: string
              description: Step code (used to extract department)
              example: Animation Modeling
            short_name:
              type: string
              description: Step short name
              example: mod
            color:
              type: string
              description: Color in RGB format
              example: 255,128,0
            entity_type:
              type: string
              description: Entity type this step applies to
              example: Asset
      example:
        - id: 12345
          code: Animation Modeling
          short_name: mod
          color: 255,128,0
          entity_type: Asset
responses:
  200:
    description: The created and updated rows
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Task type unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                description: Task type name
                example: Animation Modeling
              short_name:
                type: string
                description: Task type short name
                example: mod
              color:
                type: string
                description: Task type color in hex format
                example: '#FF8000'
              for_entity:
                type: string
                description: Entity type
                example: Asset
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                description: Update timestamp
                example: '2024-01-15T11:00:00Z'
  400:
    description: The body is not valid
  403:
    description: You are not an administrator
  500:
    description: A row breaks a database constraint
