Import shotgun resource
---
tags:
  - Import
description: Import Shotgun resources. Send a list of Shotgun entries
  in the JSON body. Returns created or updated resources.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: array
        items:
          type: object
          properties:
            id:
              type: integer
              example: 12345
              description: Shotgun ID of the entry
            code:
              type: string
              example: SH010
            name:
              type: string
              example: Shot name
      example:
        - id: 12345
          code: SH010
          name: Shot name
responses:
    200:
      description: Resources imported successfully
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  example: a24a6ea4-ce75-4665-a070-57453082c25
                name:
                  type: string
                  example: Imported resource
                created_at:
                  type: string
                  format: date-time
                  example: "2024-01-15T10:30:00Z"
                updated_at:
                  type: string
                  format: date-time
                  example: "2024-01-15T11:00:00Z"
    400:
      description: Invalid request body or data format error
