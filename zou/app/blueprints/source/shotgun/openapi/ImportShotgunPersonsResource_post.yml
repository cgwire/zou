Import Shotgun persons
---
description: Import persons from Shotgun. The route also adds each person to
  their department. Send a JSON list of Shotgun rows. A row that exists in
  Kitsu, with the same Shotgun identifier, is updated. Else, it is created.
  A row with a wrong format is skipped. You must be an administrator.
tags:
  - Import
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: array
        items:
          type: object
          properties:
            id:
              type: integer
              description: Shotgun ID of the person
              example: 12345
            firstname:
              type: string
              description: First name
              example: John
            lastname:
              type: string
              description: Last name
              example: Doe
            email:
              type: string
              format: email
              description: Email address
              example: john.doe@example.com
            login:
              type: string
              description: Desktop login
              example: jdoe
            sg_status_list:
              type: string
              description: Status list
              example: act
            permission_rule_set:
              type: object
              description: Permission rule set
              properties:
                name:
                  type: string
                  example: Manager
            department:
              type: object
              description: Department information
              properties:
                name:
                  type: string
                  example: Animation
      example:
        - id: 12345
          firstname: John
          lastname: Doe
          email: john.doe@example.com
          login: jdoe
          sg_status_list: act
          permission_rule_set:
            name: Manager
          department:
            name: Animation
responses:
  200:
    description: The created and updated rows
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Person unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              first_name:
                type: string
                description: First name
                example: John
              last_name:
                type: string
                description: Last name
                example: Doe
              email:
                type: string
                format: email
                description: Email address
                example: john.doe@example.com
              role:
                type: string
                description: User role
                example: manager
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                description: Update timestamp
                example: '2024-01-15T11:00:00Z'
  400:
    description: The body is not valid
  403:
    description: You are not an administrator
  500:
    description: A row breaks a database constraint
