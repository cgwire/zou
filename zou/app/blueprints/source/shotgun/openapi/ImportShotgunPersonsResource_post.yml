Import shotgun persons
---
description: Import Shotgun persons (users). Send a list of Shotgun
  person entries in the JSON body. Returns created or updated persons
  with department associations.
tags:
  - Import
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: array
        items:
          type: object
          properties:
            id:
              type: integer
              description: Shotgun ID of the person
              example: 12345
            firstname:
              type: string
              description: First name
              example: "John"
            lastname:
              type: string
              description: Last name
              example: "Doe"
            email:
              type: string
              format: email
              description: Email address
              example: "john.doe@example.com"
            login:
              type: string
              description: Desktop login
              example: "jdoe"
            sg_status_list:
              type: string
              description: Status list
              example: "act"
            permission_rule_set:
              type: object
              description: Permission rule set
              properties:
                name:
                  type: string
                  example: "Manager"
            department:
              type: object
              description: Department information
              properties:
                name:
                  type: string
                  example: "Animation"
      example:
        - id: 12345
          firstname: "John"
          lastname: "Doe"
          email: "john.doe@example.com"
          login: "jdoe"
          sg_status_list: "act"
          permission_rule_set:
            name: "Manager"
          department:
            name: "Animation"
responses:
  200:
    description: Persons imported successfully
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Person unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c25
              first_name:
                type: string
                description: First name
                example: "John"
              last_name:
                type: string
                description: Last name
                example: "Doe"
              email:
                type: string
                format: email
                description: Email address
                example: "john.doe@example.com"
              role:
                type: string
                description: User role
                example: "manager"
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: "2024-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                description: Update timestamp
                example: "2024-01-15T11:00:00Z"
  400:
    description: Invalid request body or data format error
