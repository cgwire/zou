Import shotgun project connections
---
description: Import Shotgun project-user connections. Send a list of
  Shotgun project connection entries in the JSON body. Returns
  projects with team members added.
tags:
  - Import
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: array
        items:
          type: object
          properties:
            id:
              type: integer
              description: Shotgun ID of the connection
              example: 12345
            project:
              type: object
              description: Project information
              properties:
                id:
                  type: integer
                  example: 11111
            user:
              type: object
              description: User information
              properties:
                id:
                  type: integer
                  example: 22222
      example:
        - id: 12345
          project:
            id: 11111
          user:
            id: 22222
responses:
  200:
    description: Project connections imported successfully
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Project unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c25
              name:
                type: string
                description: Project name
                example: "My Project"
              team:
                type: array
                description: Team member IDs
                items:
                  type: string
                  format: uuid
                example:
                  - b35b7fb5-df86-5776-b181-68564193d36
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: "2024-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                description: Update timestamp
                example: "2024-01-15T11:00:00Z"
  400:
    description: Invalid request body or data format error
