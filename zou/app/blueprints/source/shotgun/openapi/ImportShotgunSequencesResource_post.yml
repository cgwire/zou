Import shotgun sequences
---
description: Import Shotgun sequences. Send a list of Shotgun
  sequence entries in the JSON body. Returns created or updated
  sequences linked to episodes.
tags:
  - Import
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: array
        items:
          type: object
          properties:
            id:
              type: integer
              description: Shotgun ID of the sequence
              example: 12345
            code:
              type: string
              description: Sequence code
              example: "SQ01"
            description:
              type: string
              description: Sequence description
              example: "Main sequence"
            project:
              type: object
              description: Project information
              properties:
                name:
                  type: string
                  example: "My Project"
            episode:
              type: object
              description: Episode information
              properties:
                id:
                  type: integer
                  example: 11111
      example:
        - id: 12345
          code: "SQ01"
          description: "Main sequence"
          project:
            name: "My Project"
          episode:
            id: 11111
responses:
  200:
    description: Sequences imported successfully
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Sequence unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                description: Sequence name
                example: "SQ01"
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: "2024-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                description: Update timestamp
                example: "2024-01-15T11:00:00Z"
  400:
    description: Invalid request body or data format error
