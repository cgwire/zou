Remove a Shotgun team member
---
description: Remove a person from the team of a project that was imported
  from Shotgun. Send the Shotgun identifier of the row in the body. If no
  row has this identifier, the response is a success. You must be an
  administrator.
tags:
  - Import
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - id
        properties:
          id:
            type: integer
            description: Shotgun ID of the connection to remove
            example: 12345
      example:
        id: 12345
responses:
  200:
    description: The result of the removal
    content:
      application/json:
        schema:
          type: object
          properties:
            success:
              type: boolean
              description: Whether the removal was successful
              example: true
  400:
    description: The body is not valid
  403:
    description: You are not an administrator
