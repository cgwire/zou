Import shotgun episodes
---
description: Import Shotgun episodes. Send a list of Shotgun episode
  entries in the JSON body. Returns created or updated episodes.
tags:
  - Import
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: array
        items:
          type: object
          properties:
            id:
              type: integer
              description: Shotgun ID of the episode
              example: 12345
            code:
              type: string
              description: Episode code
              example: "EP01"
            description:
              type: string
              description: Episode description
              example: "First episode"
            project:
              type: object
              description: Project information
              properties:
                name:
                  type: string
                  example: "My Project"
      example:
        - id: 12345
          code: "EP01"
          description: "First episode"
          project:
            name: "My Project"
responses:
  200:
    description: Episodes imported successfully
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Episode unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c25
              name:
                type: string
                description: Episode name
                example: "EP01"
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: "2024-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                description: Update timestamp
                example: "2024-01-15T11:00:00Z"
  400:
    description: Invalid request body or data format error
