Import Shotgun projects
---
description: Import projects from Shotgun. Send a JSON list of Shotgun rows.
  A row that exists in Kitsu, with the same Shotgun identifier, is updated.
  Else, it is created. A row with a wrong format is skipped. You must be an
  administrator.
tags:
  - Import
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: array
        items:
          type: object
          properties:
            id:
              type: integer
              description: Shotgun ID of the project
              example: 12345
            name:
              type: string
              description: Project name
              example: My Project
            sg_status:
              type: string
              description: Project status
              example: Active
      example:
        - id: 12345
          name: My Project
          sg_status: Active
responses:
  200:
    description: The created and updated rows
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Project unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                description: Project name
                example: My Project
              data:
                type: object
                description: Custom project data
                example: {}
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                description: Update timestamp
                example: '2024-01-15T11:00:00Z'
  400:
    description: The body is not valid
  403:
    description: You are not an administrator
  500:
    description: A row breaks a database constraint
