Import shotgun tasks
---
description: Import Shotgun tasks. Send a list of Shotgun task
  entries in the JSON body. Only tasks with steps and projects are
  imported. Returns created or updated tasks with assignees.
tags:
  - Import
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: array
        items:
          type: object
          properties:
            id:
              type: integer
              description: Shotgun ID of the task
              example: 12345
            cached_display_name:
              type: string
              description: Task display name
              example: "Modeling for Asset"
            start_date:
              type: string
              format: date
              description: Start date
              example: "2024-01-15"
            due_date:
              type: string
              format: date
              description: Due date
              example: "2024-02-15"
            sg_sort_order:
              type: integer
              description: Sort order
              example: 1
            duration:
              type: integer
              description: Duration in days
              example: 30
            step:
              type: object
              description: Step (task type) information
              properties:
                id:
                  type: integer
                  example: 11111
            project:
              type: object
              description: Project information
              properties:
                id:
                  type: integer
                  example: 22222
            entity:
              type: object
              description: Entity information
              properties:
                id:
                  type: integer
                  example: 33333
                type:
                  type: string
                  example: "Asset"
            sg_status_list:
              type: string
              description: Status short name
              example: "IP"
            created_by:
              type: object
              description: Creator information
              properties:
                id:
                  type: integer
                  example: 44444
            task_assignees:
              type: array
              description: Task assignees
              items:
                type: object
                properties:
                  id:
                    type: integer
                    example: 55555
      example:
        - id: 12345
          cached_display_name: "Modeling for Asset"
          start_date: "2024-01-15"
          due_date: "2024-02-15"
          sg_sort_order: 1
          duration: 30
          step:
            id: 11111
          project:
            id: 22222
          entity:
            id: 33333
            type: "Asset"
          sg_status_list: "IP"
          created_by:
            id: 44444
          task_assignees:
            - id: 55555
responses:
  200:
    description: Tasks imported successfully
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Task unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                description: Task name
                example: "Modeling for Asset"
              start_date:
                type: string
                format: date
                description: Start date
                example: "2024-01-15"
              due_date:
                type: string
                format: date
                description: Due date
                example: "2024-02-15"
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: "2024-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                description: Update timestamp
                example: "2024-01-15T11:00:00Z"
  400:
    description: Invalid request body or data format error
