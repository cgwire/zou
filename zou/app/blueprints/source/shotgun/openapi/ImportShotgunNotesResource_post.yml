Import shotgun notes
---
description: Import Shotgun notes (comments) linked to tasks. Send a
  list of Shotgun note entries in the JSON body. Only notes linked to
  tasks are imported. Returns created or updated comments.
tags:
  - Import
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: array
        items:
          type: object
          properties:
            id:
              type: integer
              description: Shotgun ID of the note
              example: 12345
            content:
              type: string
              description: Note content
              example: "This is a comment"
            tasks:
              type: array
              description: Linked tasks
              items:
                type: object
                properties:
                  id:
                    type: integer
                    example: 67890
            user:
              type: object
              description: User who created the note
              properties:
                id:
                  type: integer
                  example: 11111
            created_at:
              type: string
              format: date-time
              description: Creation timestamp
              example: "2024-01-15T10:30:00Z"
      example:
        - id: 12345
          content: "This is a comment"
          tasks:
            - id: 67890
          user:
            id: 11111
          created_at: "2024-01-15T10:30:00Z"
responses:
  200:
    description: Notes imported successfully
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Comment unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c25
              text:
                type: string
                description: Comment text
                example: "This is a comment"
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: "2024-01-15T10:30:00Z"
  400:
    description: Invalid request body or data format error
