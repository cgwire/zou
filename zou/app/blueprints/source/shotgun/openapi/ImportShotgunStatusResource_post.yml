Import shotgun task statuses
---
description: Import Shotgun task statuses. Send a list of Shotgun
  status entries in the JSON body. Returns created or updated task
  statuses with colors.
tags:
  - Import
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: array
        items:
          type: object
          properties:
            id:
              type: integer
              description: Shotgun ID of the status
              example: 12345
            name:
              type: string
              description: Status name
              example: "In Progress"
            code:
              type: string
              description: Status short code
              example: "IP"
            bg_color:
              type: string
              description: Background color in RGB format
              example: "255,128,0"
      example:
        - id: 12345
          name: "In Progress"
          code: "IP"
          bg_color: "255,128,0"
responses:
  200:
    description: Task statuses imported successfully
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Task status unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                description: Status name
                example: "In Progress"
              short_name:
                type: string
                description: Status short code
                example: "IP"
              color:
                type: string
                description: Status color in hex format
                example: "#FF8000"
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: "2024-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                description: Update timestamp
                example: "2024-01-15T11:00:00Z"
  400:
    description: Invalid request body or data format error
