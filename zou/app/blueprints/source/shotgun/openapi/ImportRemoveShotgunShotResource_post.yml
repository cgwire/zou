Remove a Shotgun shot
---
description: Remove a shot that was imported from Shotgun. Send the Shotgun
  identifier of the row in the body. If no row has this identifier, the
  response is a success. You must be an administrator.
tags:
  - Import
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - id
        properties:
          id:
            type: integer
            description: Shotgun ID of the shot to remove
            example: 12345
      example:
        id: 12345
responses:
  200:
    description: The result of the removal
    content:
      application/json:
        schema:
          type: object
          properties:
            success:
              type: boolean
              description: Whether the removal was successful
              example: true
            removed_instance_id:
              type: string
              format: uuid
              description: ID of the removed shot, if found
              example: a24a6ea4-ce75-4665-a070-57453082c250
  400:
    description: The body is not valid
  403:
    description: You are not an administrator
