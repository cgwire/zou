Import kitsu tasks
---
description: Import Kitsu tasks. Send a list of Kitsu task entries in
  the JSON body. Returns created or updated tasks.
tags:
  - Import
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Kitsu ID of the task
              example: a24a6ea4-ce75-4665-a070-57453082c25
            name:
              type: string
              description: Task name
              example: "Modeling"
            project_id:
              type: string
              format: uuid
              description: Project ID
              example: b24a6ea4-ce75-4665-a070-57453082c25
            entity_id:
              type: string
              format: uuid
              description: Entity ID the task is linked to
              example: c24a6ea4-ce75-4665-a070-57453082c25
            task_type_id:
              type: string
              format: uuid
              description: Task type ID
              example: d24a6ea4-ce75-4665-a070-57453082c25
      example:
        - id: a24a6ea4-ce75-4665-a070-57453082c25
          name: "Modeling"
          project_id: b24a6ea4-ce75-4665-a070-57453082c25
          entity_id: c24a6ea4-ce75-4665-a070-57453082c25
          task_type_id: d24a6ea4-ce75-4665-a070-57453082c25
responses:
  200:
    description: Tasks imported successfully
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Task unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c25
              name:
                type: string
                description: Task name
                example: "Modeling"
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: "2024-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                description: Update timestamp
                example: "2024-01-15T11:00:00Z"
  400:
    description: Invalid request body or missing required fields
