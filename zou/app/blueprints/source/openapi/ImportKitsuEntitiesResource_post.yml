Import kitsu entities
---
description: Import Kitsu entities (assets, shots, sequences, etc.).
  Send a list of Kitsu entity entries in the JSON body. Returns
  created or updated entities.
tags:
  - Import
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Kitsu ID of the entity
              example: a24a6ea4-ce75-4665-a070-57453082c25
            name:
              type: string
              description: Entity name
              example: "Asset01"
            project_id:
              type: string
              format: uuid
              description: Project ID
              example: b24a6ea4-ce75-4665-a070-57453082c25
            entity_type_id:
              type: string
              format: uuid
              description: Entity type ID
              example: c24a6ea4-ce75-4665-a070-57453082c25
      example:
        - id: a24a6ea4-ce75-4665-a070-57453082c25
          name: "Asset01"
          project_id: b24a6ea4-ce75-4665-a070-57453082c25
          entity_type_id: c24a6ea4-ce75-4665-a070-57453082c25
responses:
  200:
    description: Entities imported successfully
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Entity unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c25
              name:
                type: string
                description: Entity name
                example: "Asset01"
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: "2024-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                description: Update timestamp
                example: "2024-01-15T11:00:00Z"
  400:
    description: Invalid request body or missing required fields
