Import kitsu entity links
---
description: Import Kitsu entity links (casting links). Send a list
  of Kitsu entity link entries in the JSON body. Returns created or
  updated entity links.
tags:
  - Import
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Kitsu ID of the entity link
              example: a24a6ea4-ce75-4665-a070-57453082c250
            entity_in_id:
              type: string
              format: uuid
              description: Source entity ID
              example: b24a6ea4-ce75-4665-a070-57453082c250
            entity_out_id:
              type: string
              format: uuid
              description: Target entity ID
              example: c24a6ea4-ce75-4665-a070-57453082c250
      example:
        - id: a24a6ea4-ce75-4665-a070-57453082c250
          entity_in_id: b24a6ea4-ce75-4665-a070-57453082c250
          entity_out_id: c24a6ea4-ce75-4665-a070-57453082c250
responses:
  200:
    description: Entity links imported successfully
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Entity link unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              entity_in_id:
                type: string
                format: uuid
                description: Source entity ID
                example: b24a6ea4-ce75-4665-a070-57453082c250
              entity_out_id:
                type: string
                format: uuid
                description: Target entity ID
                example: c24a6ea4-ce75-4665-a070-57453082c250
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: "2024-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                description: Update timestamp
                example: "2024-01-15T11:00:00Z"
  400:
    description: Invalid request body or missing required fields
