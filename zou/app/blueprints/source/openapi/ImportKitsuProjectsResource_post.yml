Import kitsu projects
---
description: Import Kitsu projects. Send a list of Kitsu project
  entries in the JSON body. Returns created or updated projects.
tags:
  - Import
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Kitsu ID of the project
              example: a24a6ea4-ce75-4665-a070-57453082c25
            name:
              type: string
              description: Project name
              example: "My Project"
            production_type:
              type: string
              description: Production type
              example: "tvshow"
      example:
        - id: a24a6ea4-ce75-4665-a070-57453082c25
          name: "My Project"
          production_type: "tvshow"
responses:
  200:
    description: Projects imported successfully
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Project unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c25
              name:
                type: string
                description: Project name
                example: "My Project"
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: "2024-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                description: Update timestamp
                example: "2024-01-15T11:00:00Z"
  400:
    description: Invalid request body or missing required fields
