Import comments from an other Kitsu instance
---
description: 'Import comments from an other Kitsu instance. Synchronization tools
  use this route to copy data from an other Kitsu instance. Send a JSON list of
  rows, with their identifiers. A row that exists is updated. Else, it is created.
  Only an administrator can import: for other users, the route skips all the rows
  and returns an empty list.'
tags:
  - Import
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Kitsu ID of the comment
              example: a24a6ea4-ce75-4665-a070-57453082c250
            object_id:
              type: string
              format: uuid
              description: Task ID the comment is linked to
              example: b24a6ea4-ce75-4665-a070-57453082c250
            text:
              type: string
              description: Comment text
              example: This is a comment
            person_id:
              type: string
              format: uuid
              description: Person who created the comment
              example: c24a6ea4-ce75-4665-a070-57453082c250
      example:
        - id: a24a6ea4-ce75-4665-a070-57453082c250
          object_id: b24a6ea4-ce75-4665-a070-57453082c250
          text: This is a comment
          person_id: c24a6ea4-ce75-4665-a070-57453082c250
responses:
  200:
    description: The created and updated rows
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Comment unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              text:
                type: string
                description: Comment text
                example: This is a comment
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                description: Update timestamp
                example: '2024-01-15T11:00:00Z'
  400:
    description: The body is not a list, or a row breaks a database
      constraint
parameters:
  - in: query
    name: silent
    required: false
    description: Do not send an event for each imported row. Use it for
      large imports.
    schema:
      type: boolean
      default: false
