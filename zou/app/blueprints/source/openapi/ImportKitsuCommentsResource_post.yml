Import kitsu comments
---
description: Import Kitsu comments. Send a list of Kitsu comment
  entries in the JSON body. Returns created or updated comments
  linked to tasks.
tags:
  - Import
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Kitsu ID of the comment
              example: a24a6ea4-ce75-4665-a070-57453082c25
            object_id:
              type: string
              format: uuid
              description: Task ID the comment is linked to
              example: b24a6ea4-ce75-4665-a070-57453082c25
            text:
              type: string
              description: Comment text
              example: "This is a comment"
            person_id:
              type: string
              format: uuid
              description: Person who created the comment
              example: c24a6ea4-ce75-4665-a070-57453082c25
      example:
        - id: a24a6ea4-ce75-4665-a070-57453082c25
          object_id: b24a6ea4-ce75-4665-a070-57453082c25
          text: "This is a comment"
          person_id: c24a6ea4-ce75-4665-a070-57453082c25
responses:
  200:
    description: Comments imported successfully
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Comment unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c25
              text:
                type: string
                description: Comment text
                example: "This is a comment"
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: "2024-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                description: Update timestamp
                example: "2024-01-15T11:00:00Z"
  400:
    description: Invalid request body or missing required fields
