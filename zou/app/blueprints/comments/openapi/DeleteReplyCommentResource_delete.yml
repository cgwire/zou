Delete a comment reply
---
description: Delete a reply of a comment. Only the author of the reply or an
  administrator can delete it.
tags:
  - Comments
parameters:
  - in: path
    name: task_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the task
    schema:
      type: string
      format: uuid
  - in: path
    name: comment_id
    required: true
    example: b35b7fb5-df86-5776-b181-68564193d360
    description: Unique identifier of the comment
    schema:
      type: string
      format: uuid
  - in: path
    name: reply_id
    required: true
    example: c46c80c6-e097-6887-c292-79675204e470
    description: Unique identifier of the reply
    schema:
      type: string
      format: uuid
responses:
  200:
    description: The comment without the reply
  403:
    description: You cannot delete this reply
  404:
    description: The comment or the reply does not exist
