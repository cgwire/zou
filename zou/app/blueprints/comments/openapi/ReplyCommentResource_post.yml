Reply to comment
---
description: Add a reply to a specific comment. The reply will be added
  to the comment's replies list.
tags:
  - Comments
parameters:
  - in: path
    name: task_id
    required: true
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the task
  - in: path
    name: comment_id
    required: true
    type: string
    format: uuid
    example: b35b7fb5-df86-5776-b181-68564193d360
    description: Unique identifier of the comment
  - in: formData
    name: text
    type: string
    example: "Thanks for the feedback!"
    description: Reply text content
responses:
  200:
    description: Reply successfully added to comment
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Reply unique identifier
              example: c46c80c6-e097-6887-c292-79675204e470
            comment_id:
              type: string
              format: uuid
              description: Parent comment identifier
              example: b35b7fb5-df86-5776-b181-68564193d360
            text:
              type: string
              description: Reply text content
              example: "Thanks for the feedback!"
            person_id:
              type: string
              format: uuid
              description: Person identifier who made the reply
              example: d57d91d7-f108-7998-d403-80786315f580
            created_at:
              type: string
              format: date-time
              description: Creation timestamp
              example: "2023-01-01T12:00:00Z"
