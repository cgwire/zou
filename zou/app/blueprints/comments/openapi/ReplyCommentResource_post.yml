Reply to a comment
---
description: 'Add a reply to a comment. A client can see some threads: comments
  for the client, and comments of a client. In these threads, only the managers
  and the clients can reply.'
tags:
  - Comments
parameters:
  - in: path
    name: task_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the task
    schema:
      type: string
      format: uuid
  - in: path
    name: comment_id
    required: true
    example: b35b7fb5-df86-5776-b181-68564193d360
    description: Unique identifier of the comment
    schema:
      type: string
      format: uuid
responses:
  200:
    description: The new reply
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Reply unique identifier
              example: c46c80c6-e097-6887-c292-79675204e470
            comment_id:
              type: string
              format: uuid
              description: Parent comment identifier
              example: b35b7fb5-df86-5776-b181-68564193d360
            text:
              type: string
              description: Reply text content
              example: Thanks for the feedback!
            person_id:
              type: string
              format: uuid
              description: Person identifier who made the reply
              example: d57d91d7-f108-7998-d403-80786315f580
            created_at:
              type: string
              format: date-time
              description: Creation timestamp
              example: '2023-01-01T12:00:00Z'
  403:
    description: You cannot reply to this comment
  404:
    description: The comment does not exist
requestBody:
  required: false
  content:
    application/json:
      schema:
        type: object
        properties:
          text:
            type: string
            description: Reply text content
            example: Thanks for the feedback!
