Acknowledge comment
---
description: Acknowledge a specific comment. If it's already
  acknowledged, remove the acknowledgement.
tags:
  - Comments
parameters:
  - in: path
    name: task_id
    required: true
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the task
  - in: path
    name: comment_id
    required: true
    type: string
    format: uuid
    example: b35b7fb5-df86-5776-b181-68564193d360
    description: Unique identifier of the comment
responses:
  200:
    description: Comment acknowledgement status successfully updated
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Comment unique identifier
              example: b35b7fb5-df86-5776-b181-68564193d360
            acknowledged:
              type: boolean
              description: Whether the comment is acknowledged
              example: true
