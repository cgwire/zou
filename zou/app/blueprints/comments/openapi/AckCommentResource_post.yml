Acknowledge a comment
---
description: Acknowledge a comment for the current user. If the current user
  already acknowledged the comment, remove the acknowledgement.
tags:
  - Comments
parameters:
  - in: path
    name: task_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the task
    schema:
      type: string
      format: uuid
  - in: path
    name: comment_id
    required: true
    example: b35b7fb5-df86-5776-b181-68564193d360
    description: Unique identifier of the comment
    schema:
      type: string
      format: uuid
responses:
  200:
    description: The comment
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Comment unique identifier
              example: b35b7fb5-df86-5776-b181-68564193d360
            acknowledged:
              type: boolean
              description: Whether the comment is acknowledged
              example: true
  403:
    description: You do not have access to this task
  404:
    description: The comment does not exist
