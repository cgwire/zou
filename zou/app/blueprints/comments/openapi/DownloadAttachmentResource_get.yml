Download an attachment
---
description: Download a file attached to a comment or to a chat message.
  The browser shows JPEG, PNG, GIF, WebP, BMP and AVIF images. Other files
  are sent as downloads. Clients cannot get the files of a chat.
tags:
  - Comments
parameters:
  - in: path
    name: attachment_file_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the attachment file
    schema:
      type: string
      format: uuid
  - in: path
    name: file_name
    required: true
    example: document.pdf
    description: Name of the file to download
    schema:
      type: string
responses:
  200:
    description: The file
    content:
      application/octet-stream:
        schema:
          type: string
          format: binary
          description: File content
  403:
    description: You do not have access to the comment or to the chat
  404:
    description: The attachment or its file does not exist
