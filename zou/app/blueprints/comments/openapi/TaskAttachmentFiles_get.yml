Get the attachments of a task
---
description: Get the files attached to the comments of a task. You must be
  an administrator.
tags:
  - Comments
parameters:
  - in: path
    name: task_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the task
    schema:
      type: string
      format: uuid
responses:
  200:
    description: The list of attachment files
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Attachment file unique identifier
                example: d57d91d7-f108-7998-d403-80786315f580
              name:
                type: string
                description: File name
                example: document.pdf
              mimetype:
                type: string
                description: File MIME type
                example: application/pdf
              size:
                type: integer
                description: File size in bytes
                example: 1024000
              comment_id:
                type: string
                format: uuid
                description: Comment identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
              task_id:
                type: string
                format: uuid
                description: Task identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              reply_id:
                type: string
                format: uuid
                description: Reply identifier if attached to a reply
                example: c46c80c6-e097-6887-c292-79675204e470
  403:
    description: You are not an administrator
