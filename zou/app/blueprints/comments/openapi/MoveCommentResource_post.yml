Move a comment to an other task
---
description: Move a comment to an other task of the same entity. The entity
  can be a shot, an asset, a sequence, an episode or an edit. The comment
  keeps its text, attachments, mentions, creation date and status change.
  The notifications and the news of the comment move to the new task. Thus,
  the watchers of the new task get a notification. You cannot move a comment
  that is linked to a preview revision. You must be a manager.
tags:
  - Comments
parameters:
  - in: path
    name: task_id
    required: true
    description: Unique identifier of the comment's current task
    example: a24a6ea4-ce75-4665-a070-57453082c250
    schema:
      type: string
      format: uuid
  - in: path
    name: comment_id
    required: true
    description: Unique identifier of the comment to move
    example: b35b7fb5-df86-5776-b181-68564193d360
    schema:
      type: string
      format: uuid
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - target_task_id
        properties:
          target_task_id:
            type: string
            format: uuid
            description: Unique identifier of the task to move the comment
              to. Must belong to the same entity as the current task.
            example: c46c80c6-e097-6887-c292-79675204e470
responses:
  200:
    description: The moved comment, with its new object_id
  400:
    description: The tasks are on different entities, the two tasks are the
      same, or the comment is linked to a preview revision
  403:
    description: You are not a manager
