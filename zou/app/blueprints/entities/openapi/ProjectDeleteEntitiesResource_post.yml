Delete entities
---
description: Delete the assets, shots, edits and concepts of the list in one
  request. The body is a list of entity identifiers. Without force, an
  entity with tasks is marked as canceled. If the entity is already
  canceled, it is deleted. A concept is always deleted. With force=true, all
  the entities are deleted with their tasks. The creator of an entity can
  delete it if the creator is in the project team. For the other entities,
  you must be a manager of the project.
tags:
  - Entities
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the project
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: query
    name: force
    required: false
    schema:
      type: boolean
    description: Delete the entities and their tasks, also when they are not
      canceled
    example: false
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: array
        items:
          type: string
          format: uuid
        description: Entity unique identifiers to delete
responses:
  200:
    description: The identifiers of the deleted entities. The entities of
      other projects and the entities of other types are skipped.
    content:
      application/json:
        schema:
          type: array
          items:
            type: string
            format: uuid
  400:
    description: The body is not a list of valid identifiers
  403:
    description: You cannot delete one of the entities
  404:
    description: The project does not exist
