Delete entities batch
---
description: Delete assets, shots, edits and concepts given by id
  list in a single request. Each entity follows the same rules as
  its single deletion route. Without force, entities with tasks are
  marked as canceled on first deletion, then removed for real when
  already canceled; concepts are always removed. Only entity
  creators or project managers can delete entities.
tags:
  - Entities
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the project
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: query
    name: force
    required: false
    schema:
      type: boolean
    description: Remove the entities and their tasks for real,
      instead of only canceling the ones that have tasks
    example: false
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: array
        items:
          type: string
          format: uuid
        description: Entity unique identifiers to delete
responses:
  200:
    description: Ids of the entities that were deleted. Entities that
      do not belong to the project or are not an asset, a shot, an
      edit or a concept are skipped.
    content:
      application/json:
        schema:
          type: array
          items:
            type: string
            format: uuid
