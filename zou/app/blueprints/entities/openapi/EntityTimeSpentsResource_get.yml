Get entity time spent
---
description: Retrieve all time spent entries that are linked to a
  specific entity.
tags:
  - Entities
parameters:
  - in: path
    name: entity_id
    required: true
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the entity
responses:
  200:
    description: List of entity time spent entries successfully retrieved
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Time spent unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              duration:
                type: number
                format: float
                description: Time duration in hours
                example: 2.5
              date:
                type: string
                format: date
                description: Date when time was spent
                example: "2023-12-07"
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: "2023-01-01T12:00:00Z"
              person_id:
                type: string
                format: uuid
                description: Person identifier who spent the time
                example: b35b7fb5-df86-5776-b181-68564193d360
              entity_id:
                type: string
                format: uuid
                description: Entity identifier
                example: c46c80c6-e097-6887-c292-79675204e470
