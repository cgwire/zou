Create tasks for an entity
---
description: Create one task for each task type of the list. The project
  must use each task type. For an asset, the workflow of the asset type must
  also have each task type. If the list is empty, the route uses all the
  task types that are valid for the entity. If a task with the same task
  type exists, it is skipped. Clients and vendors cannot use this route.
tags:
  - Entities
parameters:
  - in: path
    name: entity_id
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the entity
    example: a24a6ea4-ce75-4665-a070-57453082c250
requestBody:
  required: false
  content:
    application/json:
      schema:
        type: object
        properties:
          task_type_ids:
            type: array
            items:
              type: string
              format: uuid
            description: Optional list of task type IDs to create. Omit or
              pass an empty list to default to every task type valid for the
              entity.
        example:
          task_type_ids:
            - b24a6ea4-ce75-4665-a070-57453082c250
responses:
  201:
    description: The new tasks
  400:
    description: A task type is not used by the project, is not in the
      workflow of the asset type, or is not for this type of entity
  403:
    description: You do not have access to this entity, or you are a client
      or a vendor
  404:
    description: The entity or a task type does not exist
