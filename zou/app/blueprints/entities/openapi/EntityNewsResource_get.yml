Get entity news
---
description: Retrieve all news entries that are linked to a specific
  entity.
tags:
  - Entities
parameters:
  - in: path
    name: entity_id
    required: true
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the entity
responses:
  200:
    description: List of entity news successfully retrieved
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: News unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              change:
                type: boolean
                description: Whether this news represents a change
                example: true
              author_id:
                type: string
                format: uuid
                description: Author person identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
              comment_id:
                type: string
                format: uuid
                description: Comment identifier
                example: c46c80c6-e097-6887-c292-79675204e470
              task_id:
                type: string
                format: uuid
                description: Task identifier
                example: d57d91d7-f108-7998-d403-80786315f580
              preview_file_id:
                type: string
                format: uuid
                description: Preview file identifier
                example: e68e02e8-0219-8009-e514-918974260690
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: "2023-01-01T12:00:00Z"
              updated_at:
                type: string
                format: date-time
                description: Last update timestamp
                example: "2023-01-01T12:30:00Z"
