Get the news of an entity
---
description: Get the news of the tasks of an entity. A news is made when a
  comment is posted on a task. Clients cannot use this route.
tags:
  - Entities
parameters:
  - in: path
    name: entity_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the entity
    schema:
      type: string
      format: uuid
responses:
  200:
    description: The list of news
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: News unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              change:
                type: boolean
                description: Whether this news represents a change
                example: true
              author_id:
                type: string
                format: uuid
                description: Author person identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
              comment_id:
                type: string
                format: uuid
                description: Comment identifier
                example: c46c80c6-e097-6887-c292-79675204e470
              task_id:
                type: string
                format: uuid
                description: Task identifier
                example: d57d91d7-f108-7998-d403-80786315f580
              preview_file_id:
                type: string
                format: uuid
                description: Preview file identifier
                example: e68e02e8-0219-8009-e514-918974260690
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: '2023-01-01T12:00:00Z'
              updated_at:
                type: string
                format: date-time
                description: Last update timestamp
                example: '2023-01-01T12:30:00Z'
  403:
    description: You are a client, or you do not have access to this
      entity
  404:
    description: The entity does not exist
