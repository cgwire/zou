Get the entities linked to a concept
---
description: Get the entities that are linked to a concept, with the tasks
  of each entity. Give the identifier of a concept. For another type of
  entity, the list is empty. Clients cannot use this route.
tags:
  - Entities
parameters:
  - in: path
    name: entity_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the concept
    schema:
      type: string
      format: uuid
responses:
  200:
    description: The list of linked entities with their tasks
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Entity unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                description: Entity name
                example: Character Model
              entity_type_id:
                type: string
                format: uuid
                description: Entity type identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
              project_id:
                type: string
                format: uuid
                description: Project identifier
                example: c46c80c6-e097-6887-c292-79675204e470
              parent_id:
                type: string
                format: uuid
                description: Parent entity identifier
                example: d57d91d7-f108-7998-d403-80786315f580
              tasks:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      description: Task unique identifier
                      example: e68e02e8-0219-8009-e514-918974260690
                    name:
                      type: string
                      description: Task name
                      example: Modeling Task
                    task_type_id:
                      type: string
                      format: uuid
                      description: Task type identifier
                      example: f79f13f9-1320-9010-f625-029985371800
  403:
    description: You are a client, or you do not have access to this entity
  404:
    description: The entity does not exist
