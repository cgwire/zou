Add a preview background file to a project template
---
description: Add a preview background file to a project template. You must
  be an administrator.
tags:
  - Project Templates
parameters:
  - in: path
    name: project_template_id
    required: true
    description: Unique identifier of the project template
    example: a24a6ea4-ce75-4665-a070-57453082c250
    schema:
      type: string
      format: uuid
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - preview_background_file_id
        properties:
          preview_background_file_id:
            type: string
            format: uuid
            description: Preview background file to add
responses:
  201:
    description: The new link
  400:
    description: The body is not valid, or an identifier does not exist
  403:
    description: You are not an administrator
  404:
    description: The project template does not exist
