Reorder the task types of a project template
---
description: Set the priority of the task types of a project template in one
  request. The order of the list gives the priority. You must be an
  administrator.
tags:
  - Project Templates
parameters:
  - in: path
    name: project_template_id
    required: true
    description: Unique identifier of the project template
    example: a24a6ea4-ce75-4665-a070-57453082c250
    schema:
      type: string
      format: uuid
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - task_type_ids
        properties:
          task_type_ids:
            type: array
            items:
              type: string
              format: uuid
            description: Task types in the new order
responses:
  200:
    description: The updated links
  400:
    description: The body is not valid
  403:
    description: You are not an administrator
