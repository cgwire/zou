ProjectTemplateTaskTypesResource_post:
  summary: Add a task type to a project template
  description: Add a task type to a project template. If the task type is
    already in the template, the route changes its values. A request without
    bitrates keeps the current bitrates. You must be an administrator.
  tags:
    - Project Templates
  parameters:
    - in: path
      name: project_template_id
      required: true
      description: Unique identifier of the project template
      example: a24a6ea4-ce75-4665-a070-57453082c250
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - task_type_id
          properties:
            task_type_id:
              type: string
              format: uuid
              description: Task type to add
            priority:
              type: integer
              description: Priority of the task type in the template
            hd_bitrate_compression:
              type: integer
              minimum: 1
              description: Bitrate of the high definition movies
            ld_bitrate_compression:
              type: integer
              minimum: 1
              description: Bitrate of the low definition movies
            is_client_visible:
              type: boolean
              description: Show the task type to the clients. If the field is
                not in the body, an existing link keeps its value.
  responses:
    201:
      description: The new link
    400:
      description: The body is not valid, or an identifier does not exist
    403:
      description: You are not an administrator
    404:
      description: The project template does not exist
