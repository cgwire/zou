ApplyProjectTemplateResource_post:
  summary: Apply a project template to a project
  description: Apply the configuration of a project template to a project. The
    current links of the project stay. The links that the project already has
    are skipped. The production settings of the template are written to the
    project. You must be an administrator.
  tags:
    - Project Templates
  parameters:
    - in: path
      name: project_id
      required: true
      description: Unique identifier of the project
      example: a24a6ea4-ce75-4665-a070-57453082c250
      schema:
        type: string
        format: uuid
    - in: path
      name: project_template_id
      required: true
      description: Unique identifier of the project template
      example: a24a6ea4-ce75-4665-a070-57453082c250
      schema:
        type: string
        format: uuid
  responses:
    200:
      description: The updated project
    400:
      description: A value of the template is not valid
    403:
      description: You are not an administrator
    404:
      description: The project or the project template does not exist

ProjectTemplateAssetTypeResource_delete:
  summary: Remove an asset type from a project template
  description: Remove an asset type from a project template. The asset type is
    not deleted. You must be an administrator.
  tags:
