          properties:
            task_status_id:
              type: string
              format: uuid
              description: Task status to add
            priority:
              type: integer
              description: Priority of the task status in the template
            roles_for_board:
              type: array
              items:
                type: string
              description: Roles that see the task status on the board
            is_client_allowed:
              type: boolean
              nullable: true
              description: Let the clients use the task status. Send null to
                use the value of the studio. If the field is not in the body,
                an existing link keeps its value.
  responses:
