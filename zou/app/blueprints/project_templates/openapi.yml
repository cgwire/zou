ProjectTemplateFromProjectResource_post:
  summary: Create a project template from a project
  description: Create a project template from the configuration of a project.
    The template gets the production settings, the task types, the task
    statuses, the asset types, the status automations, the metadata
    descriptors, the file tree and the free data. The template does not get
    the team, the dates, the preview backgrounds, the project status or the
    production data. You must be an administrator.
  tags:
    - Project Templates
  parameters:
    - in: path
      name: project_id
      required: true
      description: Unique identifier of the project
      example: a24a6ea4-ce75-4665-a070-57453082c250
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
          properties:
            name:
              type: string
              minLength: 1
              description: Name of the template
            description:
              type: string
              description: Description of the template
  responses:
    201:
      description: The new project template
    400:
      description: The body is not valid
    403:
      description: You are not an administrator
    404:
      description: The project does not exist

ProjectTemplateMetadataDescriptorsResource_put:
  summary: Replace the metadata descriptors of a project template
  description: Replace the metadata descriptors of a project template. Send a
    list of descriptors, or an object with a metadata_descriptors list. You
    must be an administrator.
  tags:
    - Project Templates
  parameters:
    - in: path
      name: project_template_id
      required: true
      description: Unique identifier of the project template
      example: a24a6ea4-ce75-4665-a070-57453082c250
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          oneOf:
            - type: array
              items:
                type: object
            - type: object
              properties:
                metadata_descriptors:
                  type: array
                  items:
                    type: object
  responses:
    200:
      description: The updated project template
    400:
      description: A descriptor is not valid
    403:
      description: You are not an administrator
    404:
      description: The project template does not exist

