SharedPlaylistCommentResource_put:
  summary: Edit a guest comment
  description: Change the text, the checklist or the task status of a comment.
    Only the guest who wrote the comment can change it. You do not need an
    account. The token of the link is the credential. If the link has a
    password, give it in the password query parameter.
  tags:
    - Playlists
  security: []
  parameters:
    - in: path
      name: token
      required: true
      description: Token of the share link
      schema:
        type: string
    - in: path
      name: comment_id
      required: true
      description: Unique identifier of the comment
      schema:
        type: string
        format: uuid
    - in: query
      name: password
      required: false
      schema:
        type: string
      description: Password when the link is protected
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - guest_id
          properties:
            guest_id:
              type: string
              format: uuid
              description: Identifier of the guest who wrote the comment
            text:
              type: string
              description: New text
            checklist:
              type: array
              items:
                type: object
              description: New checklist
            task_status_id:
              type: string
              format: uuid
              description: New task status. The status must allow clients
                on the project.
  responses:
    200:
      description: The updated comment
    400:
      description: The body is not valid
    403:
      description: Comments are disabled for this link, the guest is not a
        guest of this link, another guest wrote the comment, the comment is
        not on a task of the shared playlist, or the new task status does not
        allow clients
    404:
      description: The link is not valid, has expired, or the password is
        missing or wrong, or the comment does not exist

