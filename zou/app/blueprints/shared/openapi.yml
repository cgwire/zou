SharedPlaylistResource_get:
  summary: Get a shared playlist
  description: Get the playlist of a share link. Each shot has the revision
    that the playlist uses, and no other revision. You do not need an account.
    The token of the link is the credential. If the link has a password, give
    it in the password query parameter.
  tags:
    - Playlists
  security: []
  parameters:
    - in: path
      name: token
      required: true
      schema:
        type: string
      description: Share link token
    - in: query
      name: password
      required: false
      schema:
        type: string
      description: Password when the link is protected
  responses:
    200:
      description: Playlist with the positioned revision of each shot and
        enriched shots
      content:
        application/json:
          schema:
            type: object
    404:
      description: The link is not valid, has expired, or the password is
        wrong
