SharedPlaylistAnnotationsResource_put:
  summary: Change the annotations of a shared preview
  description: Change the annotations of a preview of the shared playlist. The
    body uses the same additions, updates and deletions as the route for
    users. A guest can change only the annotations of this guest. The guest
    must be a guest of this link. You do not need an account. The token of the
    link is the credential. If the link has a password, give it in the
    password query parameter.
  tags:
    - Playlists
  security: []
  parameters:
    - in: path
      name: token
      required: true
      schema:
        type: string
      description: Share link token
    - in: query
      name: password
      required: false
      schema:
        type: string
      description: Password when the link is protected
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - guest_id
            - preview_file_id
          properties:
            guest_id:
              type: string
              format: uuid
            preview_file_id:
              type: string
              format: uuid
            additions:
              type: array
              items:
                type: object
            updates:
              type: array
              items:
                type: object
            deletions:
              type: array
              items:
                type: string
                format: uuid
  responses:
    200:
      description: Updated preview file with the new annotations
      content:
        application/json:
          schema:
            type: object
    400:
      description: Missing required body fields
    403:
      description: Annotations are disabled for this link, the guest is not a
        guest of this link, or the preview is not in the shared playlist
    404:
      description: The link is not valid, has expired, or the password is
        missing or wrong, or the preview file does not exist

SharedPlaylistAttachmentFileResource_get:
  summary: Download an attachment of a shared comment
  description: 'Download a file attached to a comment that the link shows: a
    comment for the clients or a comment of a guest. You do not need an
    account. The token of the link is the credential. If the link has a
    password, give it in the password query parameter.'
  tags:
    - Playlists
  security: []
  parameters:
    - in: path
      name: token
      required: true
      description: Token of the share link
      schema:
        type: string
    - in: path
      name: attachment_file_id
      required: true
      description: Unique identifier of the attachment
      schema:
        type: string
        format: uuid
    - in: path
      name: file_name
      required: true
      description: Any value. The route ignores it. The response uses the
        name stored on the attachment.
      schema:
        type: string
    - in: query
      name: password
      required: false
      schema:
        type: string
      description: Password when the link is protected
  responses:
    200:
      description: The file
    404:
      description: The link is not valid, has expired, or the password is
        missing or wrong, or the attachment is not shown by this link

SharedPlaylistCommentAttachmentResource_delete:
  summary: Delete an attachment of a guest comment
  description: Delete a file attached to a comment. Only the guest who wrote
    the comment can delete it. You do not need an account. The token of the
    link is the credential. If the link has a password, give it in the
    password query parameter.
  tags:
    - Playlists
  security: []
  parameters:
    - in: path
      name: token
      required: true
      description: Token of the share link
      schema:
        type: string
    - in: path
      name: comment_id
      required: true
      description: Unique identifier of the comment
      schema:
        type: string
        format: uuid
    - in: path
      name: attachment_file_id
      required: true
      description: Unique identifier of the attachment
      schema:
        type: string
        format: uuid
    - in: query
      name: password
      required: false
      schema:
        type: string
      description: Password when the link is protected
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - guest_id
          properties:
            guest_id:
              type: string
              format: uuid
              description: Identifier of the guest who wrote the comment
  responses:
    204:
      description: The attachment is deleted
    400:
      description: The body has no guest_id, or guest_id is not a UUID
    403:
      description: Comments are disabled for this link, the guest is not a
        guest of this link, another guest wrote the comment, or the comment
        is not on a task of the shared playlist
    404:
      description: The link is not valid, has expired, or the password is
        missing or wrong, or the comment does not exist, or the attachment
        does not exist

SharedPlaylistCommentAttachmentsResource_post:
  summary: Attach files to a guest comment
  description: Attach files to a comment. Only the guest who wrote the comment
    can attach files. Send the files in a multipart form. The route attaches
    every file of the form, whatever the name of its field. Give guest_id in
    the form or in the query string. You do not need an account. The token of
    the link is the credential. If the link has a password, give it in the
    password query parameter.
  tags:
    - Playlists
  security: []
  parameters:
    - in: path
      name: token
      required: true
      description: Token of the share link
      schema:
        type: string
    - in: path
      name: comment_id
      required: true
      description: Unique identifier of the comment
      schema:
        type: string
        format: uuid
    - in: query
      name: guest_id
      required: false
      description: Same as the form field
      schema:
        type: string
        format: uuid
    - in: query
      name: password
      required: false
      schema:
        type: string
      description: Password when the link is protected
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            guest_id:
              type: string
              format: uuid
              description: Identifier of the guest who wrote the comment
            files:
              type: array
              items:
                type: string
                format: binary
              description: Files to attach
  responses:
    201:
      description: The comment with its attachments
    403:
      description: Comments are disabled for this link, guest_id is missing,
        the guest is not a guest of this link, another guest wrote the
        comment, or the comment is not on a task of the shared playlist
    404:
      description: The link is not valid, has expired, or the password is
        missing or wrong, or the comment does not exist

