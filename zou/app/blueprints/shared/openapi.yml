SharedPlaylistCommentResource_put:
  summary: Edit a guest comment
  description: Change the text, the checklist or the task status of a comment.
    Only the guest who wrote the comment can change it. You do not need an
    account. The token of the link is the credential. This route does not read
    the password. For a link with a password, the route returns 404.
  tags:
    - Playlists
  security: []
  parameters:
    - in: path
      name: token
      required: true
      description: Token of the share link
      schema:
        type: string
    - in: path
      name: comment_id
      required: true
      description: Unique identifier of the comment
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - guest_id
          properties:
            guest_id:
              type: string
              format: uuid
              description: Identifier of the guest who wrote the comment
            text:
              type: string
              description: New text
            checklist:
              type: array
              items:
                type: object
              description: New checklist
            task_status_id:
              type: string
              format: uuid
              description: New task status
