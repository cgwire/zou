SharedPlaylistAnnotationsResource_put:
  summary: Change the annotations of a shared preview
  description: Change the annotations of a preview of the shared playlist. The
    body uses the same additions, updates and deletions as the route for
    users. A guest can change only the annotations of this guest. You do not
    need an account. The token of the link is the credential. This route does
    not read the password. For a link with a password, the route returns 404.
  tags:
    - Playlists
  security: []
  parameters:
    - in: path
      name: token
      required: true
      schema:
        type: string
      description: Share link token
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - guest_id
            - preview_file_id
          properties:
            guest_id:
              type: string
              format: uuid
            preview_file_id:
              type: string
              format: uuid
            additions:
              type: array
              items:
                type: object
            updates:
              type: array
              items:
                type: object
            deletions:
              type: array
              items:
                type: string
                format: uuid
  responses:
    200:
      description: Updated preview file with the new annotations
      content:
        application/json:
          schema:
            type: object
    400:
      description: Missing required body fields
    403:
      description: Annotations disabled for this share link, or the preview
        file is not part of the shared playlist
    404:
      description: The link is not valid, has expired, or has a password

SharedPlaylistAttachmentFileResource_get:
  summary: Download an attachment of a shared comment
  description: 'Download a file attached to a comment that the link shows: a comment
    for the clients or a comment of a guest. You do not need an account. The token
    of the link is the credential. This route does not read the password. For a
    link with a password, the route returns 404.'
  tags:
    - Playlists
  security: []
  parameters:
    - in: path
      name: token
      required: true
      description: Token of the share link
      schema:
        type: string
    - in: path
      name: attachment_file_id
      required: true
      description: Unique identifier of the attachment
      schema:
        type: string
        format: uuid
    - in: path
      name: file_name
      required: true
      description: Name of the file
      schema:
        type: string
  responses:
    200:
      description: The file
    404:
      description: The link is not valid, has expired, or has a password, or
        the attachment is not shown by this link

SharedPlaylistCommentAttachmentResource_delete:
  summary: Delete an attachment of a guest comment
  description: Delete a file attached to a comment. Only the guest who wrote
    the comment can delete it. You do not need an account. The token of the
    link is the credential. This route does not read the password. For a link
    with a password, the route returns 404.
  tags:
    - Playlists
  security: []
  parameters:
    - in: path
      name: token
      required: true
      description: Token of the share link
      schema:
        type: string
    - in: path
      name: comment_id
      required: true
      description: Unique identifier of the comment
      schema:
        type: string
        format: uuid
    - in: path
      name: attachment_file_id
      required: true
      description: Unique identifier of the attachment
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - guest_id
          properties:
            guest_id:
              type: string
              format: uuid
              description: Identifier of the guest who wrote the comment
  responses:
    204:
      description: The attachment is deleted
    403:
      description: Comments are disabled for this link, or another guest
        wrote the comment
    404:
      description: The link is not valid, has expired, or has a password, or
        the comment does not exist, or the attachment does not exist

SharedPlaylistCommentAttachmentsResource_post:
  summary: Attach files to a guest comment
  description: Attach files to a comment. Only the guest who wrote the comment
    can attach files. Send the files and guest_id in a multipart form. You do
    not need an account. The token of the link is the credential. This route
    does not read the password. For a link with a password, the route returns
    404.
  tags:
    - Playlists
  security: []
  parameters:
    - in: path
      name: token
      required: true
      description: Token of the share link
      schema:
        type: string
    - in: path
      name: comment_id
      required: true
      description: Unique identifier of the comment
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          required:
            - guest_id
            - files
          properties:
            guest_id:
              type: string
              format: uuid
              description: Identifier of the guest who wrote the comment
            files:
              type: array
              items:
                type: string
                format: binary
              description: Files to attach
  responses:
    201:
      description: The comment with its attachments
    403:
      description: Comments are disabled for this link, or another guest
        wrote the comment
    404:
      description: The link is not valid, has expired, or has a password, or
        the comment does not exist

