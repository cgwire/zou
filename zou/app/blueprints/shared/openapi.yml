  tags:
    - Playlists
  security: []
  parameters:
    - in: path
      name: token
      required: true
      schema:
        type: string
      description: Share link token
    - in: query
      name: password
      required: false
      schema:
        type: string
      description: Password when the link is protected
  responses:
    200:
      description: The list of comments
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
    404:
      description: The link is not valid, has expired, or the password is
        wrong

SharedPlaylistCommentsResource_post:
  summary: Comment a shared playlist
  description: Add a comment as a guest. Give guest_id, task_id,
    task_status_id and the text. The link must allow comments. The task status
    must allow clients. You do not need an account. The token of the link is
    the credential. If the link has a password, give it in the password query
    parameter.
  tags:
    - Playlists
  security: []
  parameters:
    - in: path
      name: token
      required: true
      schema:
        type: string
      description: Share link token
    - in: query
      name: password
      required: false
      schema:
        type: string
      description: Password when the link is protected
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - guest_id
            - task_id
            - task_status_id
          properties:
            guest_id:
              type: string
              format: uuid
            task_id:
              type: string
              format: uuid
            task_status_id:
              type: string
              format: uuid
            text:
              type: string
            checklist:
              type: array
              items:
                type: object
  responses:
    201:
      description: Comment created
      content:
        application/json:
          schema:
            type: object
    400:
      description: Missing required body fields, unknown task status, or task
        status not allowed for guest reviewers
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    403:
      description: Comments are disabled for this link, the guest is not a
        guest of this link, or the task is not in the shared playlist
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    404:
      description: The link is not valid, has expired, or the password is
        wrong

SharedPlaylistContextResource_get:
  summary: Get the context of a shared playlist
  description: Get the minimal data that the share page needs. It gives what the
    link allows, the project, its task types and its task statuses. You do not
    need an account. The token of the link is the credential. If the link
    has a password, give it in the password query parameter.
  tags:
    - Playlists
  security: []
  parameters:
    - in: path
      name: token
      required: true
      schema:
        type: string
      description: Share link token
    - in: query
      name: password
      required: false
      schema:
        type: string
      description: Password when the link is protected
  responses:
    200:
      description: The context of the share page
      content:
        application/json:
          schema:
            type: object
            properties:
              share_link:
                type: object
                properties:
                  can_comment:
                    type: boolean
                    description: True if the guests can comment and annotate
              project:
                type: object
                description: Project of the playlist
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  fps:
                    type: string
                    nullable: true
                  ratio:
                    type: string
                    nullable: true
                  resolution:
                    type: string
                    nullable: true
                  team:
                    type: array
                    description: Always empty. The link gives no team.
                    items:
                      type: string
                      format: uuid
              task_types:
                type: array
                description: Task types of the project
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string
                    color:
                      type: string
                      nullable: true
                    for_entity:
                      type: string
                      nullable: true
              task_statuses:
                type: array
                description: Task statuses of the project
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string
                    short_name:
                      type: string
                    color:
                      type: string
                    is_client_allowed:
                      type: boolean
                      nullable: true
                      description: True if a guest can set this status. The
                        setting of the project applies.
                    is_default:
                      type: boolean
                      nullable: true
                    for_concept:
                      type: boolean
                      nullable: true
    404:
      description: The link is not valid, has expired, or the password is
        wrong

SharedPlaylistGuestResource_post:
  summary: Create a guest for a shared playlist
  description: Create a guest identity for the shared playlist. If you give
    the guest_id of a guest created from this link, the route returns this
    guest with the code 200. Else the route creates a new guest and returns it
    with the code 201. The route never reuses a guest by name. You do not need
    an account. The token of the link is the credential. If the link has a
    password, give it in the password query parameter.
  tags:
    - Playlists
  security: []
  parameters:
    - in: path
      name: token
      required: true
      schema:
        type: string
      description: Share link token
    - in: query
      name: password
      required: false
      schema:
        type: string
      description: Password when the link is protected
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            first_name:
              type: string
              default: Guest
            last_name:
              type: string
            guest_id:
              type: string
              format: uuid
              description: If set, return this guest if it still exists
  responses:
    200:
      description: The guest already exists
      content:
        application/json:
          schema:
            type: object
    201:
      description: The guest
      content:
        application/json:
          schema:
            type: object
    404:
      description: The link is not valid, has expired, or the password is
        missing or wrong

