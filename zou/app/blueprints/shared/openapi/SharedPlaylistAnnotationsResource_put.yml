Change the annotations of a shared preview
---
description: Change the annotations of a preview of the shared playlist. The
  body uses the same additions, updates and deletions as the route for
  users. A guest can change only the annotations of this guest. You do not
  need an account. The token of the link is the credential. This route does
  not read the password. For a link with a password, the route returns 404.
tags:
  - Playlists
security: []
parameters:
  - in: path
    name: token
    required: true
    schema:
      type: string
    description: Share link token
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - guest_id
          - preview_file_id
        properties:
          guest_id:
            type: string
            format: uuid
          preview_file_id:
            type: string
            format: uuid
          additions:
            type: array
            items:
              type: object
          updates:
            type: array
            items:
              type: object
          deletions:
            type: array
            items:
              type: string
              format: uuid
responses:
  200:
    description: Updated preview file with the new annotations
    content:
      application/json:
        schema:
          type: object
  400:
    description: Missing required body fields
  403:
    description: Annotations disabled for this share link, or the preview
      file is not part of the shared playlist
  404:
    description: The link is not valid, has expired, or has a password
