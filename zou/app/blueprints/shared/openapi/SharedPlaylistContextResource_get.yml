Get shared playlist context
---
description: Return minimal project and playlist context needed to
  render the shared playlist UI, with what the link allows. Optional
  `password` query param when the link is protected.
tags:
  - Playlists
parameters:
  - in: path
    name: token
    required: true
    schema:
      type: string
    description: Share link token
  - in: query
    name: password
    required: false
    schema:
      type: string
    description: Password when the link is protected
responses:
  200:
    description: Context payload for the share page
    content:
      application/json:
        schema:
          type: object
          properties:
            share_link:
              type: object
              properties:
                can_comment:
                  type: boolean
                  description: Whether guests may comment and annotate
            project:
              type: object
              description: Production of the playlist
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                fps:
                  type: string
                  nullable: true
                ratio:
                  type: string
                  nullable: true
                resolution:
                  type: string
                  nullable: true
                team:
                  type: array
                  description: Always empty, the link lists no team
                  items:
                    type: string
                    format: uuid
            task_types:
              type: array
              description: Task types of the production
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  color:
                    type: string
                    nullable: true
                  for_entity:
                    type: string
                    nullable: true
            task_statuses:
              type: array
              description: Task statuses of the production
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  short_name:
                    type: string
                  color:
                    type: string
                  is_client_allowed:
                    type: boolean
                    nullable: true
                    description: Whether a guest may set this status, with
                      the override of the production applied
                  is_default:
                    type: boolean
                    nullable: true
                  for_concept:
                    type: boolean
                    nullable: true
  404:
    description: Unknown, revoked or expired link, or a missing or wrong
      password
