Get the context of a shared playlist
---
description: Get the minimal data that the share page needs. It gives what the
  link allows, the project, its task types and its task statuses. You do not
  need an account. The token of the link is the credential. If the link
  has a password, give it in the password query parameter.
tags:
  - Playlists
security: []
parameters:
  - in: path
    name: token
    required: true
    schema:
      type: string
    description: Share link token
  - in: query
    name: password
    required: false
    schema:
      type: string
    description: Password when the link is protected
responses:
  200:
    description: The context of the share page
    content:
      application/json:
        schema:
          type: object
          properties:
            share_link:
              type: object
              properties:
                can_comment:
                  type: boolean
                  description: True if the guests can comment and annotate
            project:
              type: object
              description: Project of the playlist
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                fps:
                  type: string
                  nullable: true
                ratio:
                  type: string
                  nullable: true
                resolution:
                  type: string
                  nullable: true
                team:
                  type: array
                  description: Always empty. The link gives no team.
                  items:
                    type: string
                    format: uuid
            task_types:
              type: array
              description: Task types of the project
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  color:
                    type: string
                    nullable: true
                  for_entity:
                    type: string
                    nullable: true
            task_statuses:
              type: array
              description: Task statuses of the project
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  short_name:
                    type: string
                  color:
                    type: string
                  is_client_allowed:
                    type: boolean
                    nullable: true
                    description: True if a guest can set this status. The
                      setting of the project applies.
                  is_default:
                    type: boolean
                    nullable: true
                  for_concept:
                    type: boolean
                    nullable: true
  404:
    description: The link is not valid, has expired, or the password is
      wrong
