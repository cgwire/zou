Get the avatar of a person on a shared playlist
---
description: Get the avatar of a person that the share page shows, as the
  author of a comment or of a reply. You do not need an account. The token
  of the link is the credential. This route does not read the password. For
  a link with a password, the route returns 404.
tags:
  - Playlists
security: []
parameters:
  - in: path
    name: token
    required: true
    schema:
      type: string
    description: Share link token
  - in: path
    name: person_id
    required: true
    schema:
      type: string
      format: uuid
    description: Person unique identifier
responses:
  200:
    description: Avatar image
    content:
      image/png:
        schema:
          type: string
          format: binary
  404:
    description: The link is not valid or has a password, the page does not
      show this person, or the person has no avatar
