Comment a shared playlist
---
description: Add a comment as a guest. Give guest_id, task_id,
  task_status_id and the text. The link must allow comments. The task status
  must allow clients. You do not need an account. The token of the link is
  the credential. If the link has a password, give it in the password query
  parameter.
tags:
  - Playlists
security: []
parameters:
  - in: path
    name: token
    required: true
    schema:
      type: string
    description: Share link token
  - in: query
    name: password
    required: false
    schema:
      type: string
    description: Password when the link is protected
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - guest_id
          - task_id
          - task_status_id
        properties:
          guest_id:
            type: string
            format: uuid
          task_id:
            type: string
            format: uuid
          task_status_id:
            type: string
            format: uuid
          text:
            type: string
          checklist:
            type: array
            items:
              type: object
responses:
  201:
    description: Comment created
    content:
      application/json:
        schema:
          type: object
  400:
    description: Missing required body fields, unknown task status, or task
      status not allowed for guest reviewers
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
  403:
    description: Comments disabled for this share link, or the task is not
      part of this shared playlist
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
  404:
    description: The link is not valid, has expired, or the password is
      wrong
