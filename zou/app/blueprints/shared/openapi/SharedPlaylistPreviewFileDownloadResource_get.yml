Download a shared preview file
---
description: Download the file of a preview of the shared playlist as an
  attachment. The preview must be in the playlist. You do not need an
  account. The token of the link is the credential. This route does not read
  the password. For a link with a password, the route returns 404.
tags:
  - Playlists
security: []
parameters:
  - in: path
    name: token
    required: true
    schema:
      type: string
    description: Share link token
  - in: path
    name: preview_file_id
    required: true
    schema:
      type: string
      format: uuid
    description: Preview file unique identifier
responses:
  200:
    description: Preview file downloaded as attachment
    content:
      application/octet-stream:
        schema:
          type: string
          format: binary
  403:
    description: The preview is not in the shared playlist
  404:
    description: The link is not valid, has expired, or has a password, or
      the file does not exist
