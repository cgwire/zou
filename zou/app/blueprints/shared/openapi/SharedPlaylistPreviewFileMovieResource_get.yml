Get the movie of a shared preview
---
description: Get the movie of a preview of the shared playlist. The preview
  must be in the playlist. You do not need an account. The token of the link
  is the credential. This route does not read the password. For a link with
  a password, the route returns 404.
tags:
  - Playlists
security: []
parameters:
  - in: path
    name: token
    required: true
    schema:
      type: string
    description: Share link token
  - in: path
    name: preview_file_id
    required: true
    schema:
      type: string
      format: uuid
    description: Preview file unique identifier
responses:
  200:
    description: Movie preview file stream
    content:
      video/mp4:
        schema:
          type: string
          format: binary
  403:
    description: The preview is not in the shared playlist
  404:
    description: The link is not valid, has expired, or has a password, or
      the file does not exist
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
