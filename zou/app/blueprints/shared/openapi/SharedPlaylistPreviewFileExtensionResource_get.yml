Get the original file of a shared preview
---
description: Get the original file of a preview of the shared playlist, for
  example a GIF, an SVG, a JPEG or a PDF file. The extension of the path
  must be the extension of the preview. The preview must be in the playlist.
  You do not need an account. The token of the link is the credential. This
  route does not read the password. For a link with a password, the route
  returns 404.
tags:
  - Playlists
security: []
parameters:
  - in: path
    name: token
    required: true
    schema:
      type: string
    description: Share link token
  - in: path
    name: preview_file_id
    required: true
    schema:
      type: string
      format: uuid
    description: Preview file unique identifier
  - in: path
    name: extension
    required: true
    schema:
      type: string
    description: File extension
responses:
  200:
    description: Original picture file
    content:
      application/octet-stream:
        schema:
          type: string
          format: binary
  400:
    description: Extension not allowed
  403:
    description: The preview is not in the shared playlist
  404:
    description: The link is not valid, has expired, or has a password, or
      the file does not exist
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
