Get the last login logs
---
description: Get the last login logs, the newest first. To get the next
  page, give the identifier of the last log in cursor_login_log_id. You must
  be an administrator.
tags:
  - Events
parameters:
  - in: query
    name: after
    example: '2022-07-12'
    description: Get the logs after this date. Date in the ISO 8601 format,
      for example 2026-10-28T10:00:00
    schema:
      type: string
      format: date
  - in: query
    name: before
    example: '2022-07-12'
    description: Get the logs before this date. Date in the ISO 8601 format,
      for example 2026-10-28T10:00:00
    schema:
      type: string
      format: date
  - in: query
    name: cursor_login_log_id
    required: false
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Get the logs that are older than this log
    schema:
      type: string
      format: uuid
  - in: query
    name: limit
    example: 100
    description: Maximum number of logs. The maximum value is 1000.
    schema:
      type: integer
      default: 100
  - in: query
    name: person_ids
    description: Filter login logs by person. Repeat the parameter for each
      value.
    schema:
      type: array
      items:
        type: string
        format: uuid
responses:
  200:
    description: The list of login logs
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Login log unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              created_at:
                type: string
                format: date-time
                description: Login timestamp
                example: '2023-01-01T12:00:00Z'
              ip_address:
                type: string
                description: IP address of the login
                example: 192.168.1.100
              person_id:
                type: string
                format: uuid
                description: Person identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
              origin:
                type: string
                description: Login origin
                example: web
                enum: [web, script]
  400:
    description: A date or an identifier is not valid
  403:
    description: You are not an administrator
