Get the event names
---
description: >-
  Get the names of the events in the event log, sorted. The log screen uses these
  names to make its filters. The list is the same for all the productions. It
  does not show production data. You must be a manager.
tags:
  - Events
responses:
  200:
    description: The sorted list of event names
    content:
      application/json:
        schema:
          type: array
          items:
            type: string
            example: task:update
  403:
    description: You are not a manager
