Get events
---
description: Retrieve last events with filtering support. Filters can be
  specified in the query string to narrow down results by date range,
  project, or other criteria.
tags:
  - Events
parameters:
  - in: query
    name: after
    type: string
    format: date
    example: "2022-07-12"
    description: Filter events after this date
  - in: query
    name: before
    type: string
    format: date
    example: "2022-07-12"
    description: Filter events before this date
  - in: query
    name: only_files
    type: boolean
    default: false
    description: Return only file-related events
    example: false
  - in: query
    name: cursor_event_id
    required: False
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: ID of the last event from previous page for cursor-based pagination
  - in: query
    name: limit
    type: integer
    default: 100
    example: 100
    description: Maximum number of events to return
  - in: query
    name: project_id
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Filter events by specific project
  - in: query
    name: name
    type: string
    example: "user_login"
    description: Filter events by event name
  - in: query
    name: name_prefixes
    type: array
    items:
      type: string
    example: ["task", "comment"]
    description: Filter events by object, the part of the event name
      before the colon. Repeat the parameter for each value.
  - in: query
    name: name_suffixes
    type: array
    items:
      type: string
    example: ["update", "delete"]
    description: Filter events by action, the part of the event name
      after the colon. Repeat the parameter for each value.
  - in: query
    name: person_ids
    type: array
    items:
      type: string
      format: uuid
    description: Filter events by author. Repeat the parameter for
      each value.
responses:
  200:
    description: List of events successfully retrieved
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Event unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                description: Event name
                example: "user_login"
              data:
                type: object
                description: Event data content
                example: {"user_id": "b35b7fb5-df86-5776-b181-68564193d360"}
              project_id:
                type: string
                format: uuid
                description: Project identifier
                example: c46c80c6-e097-6887-c292-79675204e470
              created_at:
                type: string
                format: date-time
                description: Event timestamp
                example: "2023-01-01T12:00:00Z"
              user_id:
                type: string
                format: uuid
                description: User identifier who triggered the event
                example: d57d91d7-f108-7998-d403-80786315f580
