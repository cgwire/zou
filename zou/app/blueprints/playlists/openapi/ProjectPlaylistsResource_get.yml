Get the playlists of a project
---
description: Get the playlists of a project, page by page. A client gets
  only the playlists for clients. Vendors cannot use this route.
tags:
  - Playlists
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: query
    name: page
    required: false
    schema:
      type: integer
    description: Page to get. Each page has 20 playlists.
    example: 1
  - in: query
    name: sort_by
    required: false
    schema:
      type: string
    description: Field to sort the playlists on, for example created_at
    example: updated_at
  - in: query
    name: task_type_id
    required: false
    schema:
      type: string
      format: uuid
    description: Get only the playlists of this task type
    example: b35b7fb5-df86-5776-b181-68564193d360
responses:
  200:
    description: The list of playlists
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Playlist unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                description: Playlist name
                example: Review Playlist
              project_id:
                type: string
                format: uuid
                description: Project unique identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
  403:
    description: You do not have access to this project, or you are a vendor
