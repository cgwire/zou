Get project playlists
---
description: Retrieve all playlists related to given project. Result is
  paginated and can be sorted.
tags:
  - Playlists
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: query
    name: page
    required: false
    schema:
      type: integer
    description: Page number for pagination
    example: 1
  - in: query
    name: sort_by
    required: false
    schema:
      type: string
    description: Field to sort by
    example: updated_at
  - in: query
    name: task_type_id
    required: false
    schema:
      type: string
      format: uuid
    description: Task type unique identifier to filter by
    example: b35b7fb5-df86-5776-b181-68564193d360
responses:
  200:
    description: All playlists related to given project
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Playlist unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                description: Playlist name
                example: "Review Playlist"
              project_id:
                type: string
                format: uuid
                description: Project unique identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
