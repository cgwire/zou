Create a share link for a playlist
---
description: Create a link that guests can use to review the playlist
  without an account. The link can expire, block comments and ask for a
  password. You must be a manager of the project.
tags:
  - Playlists
parameters:
  - in: path
    name: playlist_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the playlist
requestBody:
  required: false
  content:
    application/json:
      schema:
        type: object
        properties:
          expiration_date:
            type: string
            format: date-time
            description: Date after which the link stops working
            example: '2026-12-31'
          can_comment:
            type: boolean
            default: true
            description: Whether guests may comment and annotate
          password:
            type: string
            description: Password guests must give to open the link
responses:
  201:
    description: The new share link, with its token
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
            token:
              type: string
            playlist_id:
              type: string
              format: uuid
            expiration_date:
              type: string
              format: date-time
              nullable: true
            is_active:
              type: boolean
            can_comment:
              type: boolean
            has_password:
              type: boolean
  400:
    description: The body is not valid
  403:
    description: You are not a manager of the project
  404:
    description: The playlist does not exist
