Get the build jobs of a project
---
description: Get the build jobs of the playlists of a project.
  Synchronization tools use this route. You must be an administrator.
tags:
  - Playlists
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  200:
    description: The list of build jobs
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Build job unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              status:
                type: string
                description: Build job status
                example: succeeded
              created_at:
                type: string
                format: date-time
                description: Build job creation timestamp
                example: '2022-07-12T10:30:00Z'
  403:
    description: You are not an administrator
