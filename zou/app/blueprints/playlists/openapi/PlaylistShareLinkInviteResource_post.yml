Invite reviewers to a shared playlist
---
description: Send the URL of a share link by email. Give email addresses,
  person identifiers, or both. You can add a message. You must be a manager
  of the project.
tags:
  - Playlists
parameters:
  - in: path
    name: playlist_id
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the playlist
  - in: path
    name: token
    required: true
    schema:
      type: string
    description: Token of the share link
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          emails:
            type: array
            items:
              type: string
              format: email
          person_ids:
            type: array
            items:
              type: string
              format: uuid
          message:
            type: string
responses:
  200:
    description: The list of addresses that got the email
    content:
      application/json:
        schema:
          type: object
          properties:
            sent:
              type: array
              items:
                type: string
  400:
    description: An email address is not valid
  403:
    description: You are not a manager of the project
  404:
    description: The playlist or the share link does not exist
