Revoke a share link
---
description: Disable a share link. The token must be a token of the playlist
  of the path. You must be a manager of the project.
tags:
  - Playlists
parameters:
  - in: path
    name: playlist_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the playlist
  - in: path
    name: token
    required: true
    schema:
      type: string
    description: Token of the share link
responses:
  200:
    description: The revoked share link
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
            is_active:
              type: boolean
              example: false
  403:
    description: You are not a manager of the project
  404:
    description: The playlist or the share link does not exist, or the token
      is for an other playlist
