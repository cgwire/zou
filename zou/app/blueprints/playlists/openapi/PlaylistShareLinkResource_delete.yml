Revoke a share link
---
description: Deactivate the share link of given token. The token must belong
  to the playlist named in the path. Requires the manager role on the
  production.
tags:
  - Playlists
parameters:
  - in: path
    name: playlist_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: token
    required: true
    schema:
      type: string
responses:
  200:
    description: Share link revoked
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
            is_active:
              type: boolean
              example: false
  403:
    description: Not a manager of the production
  404:
    description: Playlist or share link not found, or token of another playlist
