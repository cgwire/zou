Get all project playlists
---
description: Retrieve all playlists related to given project. It's
  mainly used for synchronisation purpose.
tags:
  - Playlists
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: query
    name: page
    required: false
    type: integer
    example: 1
    description: Page number. Without page nor limit, the whole list is
      returned; with either, a paginated envelope is returned.
  - in: query
    name: limit
    required: false
    type: integer
    example: 100
    description: Number of entries per page (default 100, max 5000). A
      limit alone returns the first page.
responses:
  200:
    description: All playlists related to given project
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Playlist unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                description: Playlist name
                example: "Review Playlist"
              project_id:
                type: string
                format: uuid
                description: Project unique identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
