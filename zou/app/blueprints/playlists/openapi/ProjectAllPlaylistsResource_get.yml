Get all the playlists of a project
---
description: Get all the playlists of a project. Synchronization tools use
  this route. You must be an administrator.
tags:
  - Playlists
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  200:
    description: The list of playlists
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Playlist unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                description: Playlist name
                example: Review Playlist
              project_id:
                type: string
                format: uuid
                description: Project unique identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
  403:
    description: You are not an administrator
