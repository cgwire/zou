Get the share links of a playlist
---
description: Get the share links of a playlist, active and revoked. The
  response does not give the passwords. The has_password field tells if a
  link has a password. You must be a manager of the project.
tags:
  - Playlists
parameters:
  - in: path
    name: playlist_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the playlist
responses:
  200:
    description: The list of share links
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              token:
                type: string
              playlist_id:
                type: string
                format: uuid
              created_by:
                type: string
                format: uuid
              expiration_date:
                type: string
                format: date-time
                nullable: true
              is_active:
                type: boolean
              can_comment:
                type: boolean
              has_password:
                type: boolean
  403:
    description: You are not a manager of the project
  404:
    description: The playlist does not exist
