Get the previews of an entity
---
description: Get the preview files of an entity. The response is a map of
  task type identifiers to lists of previews.
tags:
  - Playlists
parameters:
  - in: path
    name: entity_id
    required: true
    schema:
      type: string
      format: uuid
    description: Entity unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  200:
    description: A map of task type identifiers to lists of previews
    content:
      application/json:
        schema:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: Preview file unique identifier
                  example: a24a6ea4-ce75-4665-a070-57453082c250
                name:
                  type: string
                  description: Preview file name
                  example: preview_v001.png
  403:
    description: You do not have access to this entity
  404:
    description: The entity does not exist
