Download the movie of a playlist
---
description: Download the MP4 movie of a build job. A manager of the project
  can use this route. A supervisor can use it for the playlists that the
  supervisor can see. A client can use it for the playlists for clients.
  Artists and vendors cannot use it.
tags:
  - Playlists
parameters:
  - in: path
    name: playlist_id
    required: true
    schema:
      type: string
      format: uuid
    description: Playlist unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: build_job_id
    required: true
    schema:
      type: string
      format: uuid
    description: Build job unique identifier
    example: b35b7fb5-df86-5776-b181-68564193d360
responses:
  200:
    description: The MP4 file
    content:
      video/mp4:
        schema:
          type: string
          format: binary
  400:
    description: The build is not finished. Try again later.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: boolean
              description: Error flag
              example: true
            message:
              type: string
              description: Error message
              example: Build is not finished
  403:
    description: You cannot access this playlist
  404:
    description: The playlist or the build job does not exist
