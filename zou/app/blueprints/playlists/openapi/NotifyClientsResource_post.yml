Notify clients playlist ready
---
description: Notify clients that given playlist is ready for review.
tags:
  - Playlists
parameters:
  - in: path
    name: playlist_id
    required: true
    schema:
      type: string
      format: uuid
    description: Playlist unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
requestBody:
  required: false
  content:
    application/json:
      schema:
        type: object
        properties:
          studio_id:
            type: string
            format: uuid
            description: Studio unique identifier to notify
            example: b35b7fb5-df86-5776-b181-68564193d360
          department_id:
            type: string
            format: uuid
            description: Department unique identifier to notify
            example: c46c80c6-e097-6887-c292-79675204e470
responses:
  200:
    description: Clients notified successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              description: Notification status
              example: "success"
