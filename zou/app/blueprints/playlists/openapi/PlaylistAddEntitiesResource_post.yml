Add entities to a playlist
---
description: Add several couples of an entity and a preview to a playlist,
  in one database write. The same entity can be in the playlist several
  times, with different previews. A couple that is already in the playlist
  is skipped. Without preview_file_id, the route uses the last preview of
  the task type of the playlist. A manager of the project can change all the
  playlists. A supervisor can change the playlists that the supervisor
  created.
tags:
  - Playlists
parameters:
  - in: path
    name: playlist_id
    required: true
    schema:
      type: string
      format: uuid
    description: Playlist unique identifier
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - entities
        properties:
          entities:
            type: array
            items:
              type: object
              required:
                - entity_id
              properties:
                entity_id:
                  type: string
                  format: uuid
                preview_file_id:
                  type: string
                  format: uuid
                  nullable: true
            description: Entity/preview couples to add to the playlist
responses:
  200:
    description: The updated playlist
    content:
      application/json:
        schema:
          type: object
  400:
    description: The body is not valid
  403:
    description: You cannot change this playlist
  404:
    description: The playlist does not exist
