Make a temporary playlist
---
description: Make a temporary playlist from tasks or entities. The playlist
  is not saved. For each entity, the route uses the task of the entity that
  has a preview. You must have access to each task.
tags:
  - Playlists
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: query
    name: sort
    required: false
    schema:
      type: boolean
    description: Sort the entries of the playlist
    example: true
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          task_ids:
            type: array
            items:
              type: string
              format: uuid
            description: List of task unique identifiers
            example: [a24a6ea4-ce75-4665-a070-57453082c250]
          entity_ids:
            type: array
            items:
              type: string
              format: uuid
            description: >
              List of entity unique identifiers, each contributing
              the task holding its current preview (or its first
              task with a preview)
            example: [a24a6ea4-ce75-4665-a070-57453082c250]
responses:
  200:
    description: The entries of the temporary playlist
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Preview file unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                description: Preview file name
                example: preview_v001.png
  400:
    description: An identifier is not valid
  403:
    description: You do not have access to this project or to a task
