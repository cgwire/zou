Delete build job
---
description: Remove given build job related to given playlist.
tags:
  - Playlists
parameters:
  - in: path
    name: playlist_id
    required: true
    schema:
      type: string
      format: uuid
    description: Playlist unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: build_job_id
    required: true
    schema:
      type: string
      format: uuid
    description: Build job unique identifier
    example: b35b7fb5-df86-5776-b181-68564193d360
responses:
  204:
    description: Build job removed successfully
