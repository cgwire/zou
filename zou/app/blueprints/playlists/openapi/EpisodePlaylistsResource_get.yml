Get the playlists of an episode
---
description: Get the playlists of an episode. Give main to get the playlists
  that are in no episode. Give all to get the playlists of all the episodes.
  A client gets only the playlists for clients. Vendors cannot use this
  route.
tags:
  - Playlists
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: episode_id
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the episode, or main, or all
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: query
    name: for_entity
    required: false
    schema:
      type: string
    description: 'Get only the playlists of this entity type: asset, shot, sequence,
      edit or episode'
    example: shot
  - in: query
    name: page
    required: false
    description: Page to get. Each page has 20 playlists.
    schema:
      type: integer
  - in: query
    name: sort_by
    required: false
    description: Field to sort the playlists on, for example created_at
    schema:
      type: string
  - in: query
    name: task_type_id
    required: false
    description: Get only the playlists of this task type
    schema:
      type: string
responses:
  200:
    description: The list of playlists
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Playlist unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                description: Playlist name
                example: Review Playlist
              episode_id:
                type: string
                format: uuid
                description: Episode unique identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
  403:
    description: You do not have access to this project, or you are a vendor
