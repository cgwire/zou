Get episode playlists
---
description: Retrieve all playlists related to given episode. The full
  list is returned because the number of playlists in an episode is not
  that big.
tags:
  - Playlists
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: episode_id
    required: true
    schema:
      type: string
      format: uuid
    description: Episode unique identifier or special value (main, all)
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: query
    name: for_entity
    required: false
    schema:
      type: string
    description: Only list playlists of this entity type (asset,
      shot, sequence, edit, episode)
    example: shot
responses:
  200:
    description: All playlists related to given episode
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Playlist unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                description: Playlist name
                example: "Review Playlist"
              episode_id:
                type: string
                format: uuid
                description: Episode unique identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
