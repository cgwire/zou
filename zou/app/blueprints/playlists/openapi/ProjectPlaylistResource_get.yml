Get playlist
---
description: Retrieve a specific playlist by ID with preview file
  revisions.
tags:
  - Playlists
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: playlist_id
    required: true
    schema:
      type: string
      format: uuid
    description: Playlist unique identifier
    example: b35b7fb5-df86-5776-b181-68564193d360
responses:
  200:
    description: Playlist details with preview file revisions
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Playlist unique identifier
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              description: Playlist name
              example: "Review Playlist"
            project_id:
              type: string
              format: uuid
              description: Project unique identifier
              example: b35b7fb5-df86-5776-b181-68564193d360
            shots:
              type: array
              description: List of shots with preview file revisions
              items:
                type: object
                example: [{"id": "uuid", "preview_file_id": "uuid"}]
