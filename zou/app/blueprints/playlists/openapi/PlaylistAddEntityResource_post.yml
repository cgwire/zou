Add an entity to a playlist
---
description: Add an entity to a playlist, with a preview. Without
  preview_file_id, the route uses the last preview of the task type of the
  playlist. A manager of the project can change all the playlists. A
  supervisor can change the playlists that the supervisor created.
tags:
  - Playlists
parameters:
  - in: path
    name: playlist_id
    required: true
    schema:
      type: string
      format: uuid
    description: Playlist unique identifier
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - entity_id
        properties:
          entity_id:
            type: string
            format: uuid
            description: Entity unique identifier to add to playlist
          preview_file_id:
            type: string
            format: uuid
            nullable: true
            description: Optional preview file identifier associated to the
              entity
responses:
  200:
    description: The updated playlist
    content:
      application/json:
        schema:
          type: object
  400:
    description: The body is not valid
  403:
    description: You cannot change this playlist
  404:
    description: The playlist does not exist
