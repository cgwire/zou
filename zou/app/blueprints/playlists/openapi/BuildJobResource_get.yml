Get build job
---
description: Retrieve build job related to given playlist.
tags:
  - Playlists
parameters:
  - in: path
    name: playlist_id
    required: true
    schema:
      type: string
      format: uuid
    description: Playlist unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c25
  - in: path
    name: build_job_id
    required: true
    schema:
      type: string
      format: uuid
    description: Build job unique identifier
    example: b35b7fb5-df86-5776-b181-68564193d36
responses:
  200:
    description: Build job related to given playlist
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Build job unique identifier
              example: a24a6ea4-ce75-4665-a070-57453082c25
            status:
              type: string
              description: Build job status
              example: "succeeded"
            created_at:
              type: string
              format: date-time
              description: Build job creation timestamp
              example: "2022-07-12T10:30:00Z"
