      description: Untracked item not found

UntrackedResource_put:
  summary: Update untracked item
  description: Rename an untracked item, change its description or its
    link. A null parent_id removes the link, a missing one keeps it.
    Reserved to the managers of the project.
  tags:
    - Untracked
  parameters:
    - in: path
      name: untracked_id
      required: true
      example: e68e02e8-a219-8009-e514-91897426a691
      description: Unique identifier of the untracked item
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
              description: Untracked item name
              example: Sound design
            description:
              type: string
              description: Untracked item description
              example: Foley and mix for the whole film
            parent_id:
              type: string
              format: uuid
              nullable: true
              description: Episode, sequence or shot to link the item
                to
              example: b35b7fb5-df86-5776-b181-68564193d36d
  responses:
    200:
      description: Untracked item successfully updated
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Untracked item unique identifier
                example: e68e02e8-a219-8009-e514-91897426a691
              name:
                type: string
                description: Untracked item name
                example: Sound design
              description:
                type: string
                description: Untracked item description
                example: Foley and mix for the whole film
              project_id:
                type: string
                format: uuid
                description: Project identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              parent_id:
                type: string
                format: uuid
                nullable: true
                description: Episode, sequence or shot the item is linked
                  to
                example: b35b7fb5-df86-5776-b181-68564193d36d
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: '2023-01-01T12:00:00Z'
    400:
      description: Invalid link, or another item already carries this
        name and link
    404:
      description: Untracked item not found
