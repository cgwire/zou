Reset the password with a token
---
description: Set a new password for a user who forgot the password. Give the
  token from the password reset email. The token proves that the user asked
  for the reset.
tags:
  - Authentication
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          email:
            type: string
            format: email
            minLength: 1
            example: admin@example.com
            description: Email address of the user
          token:
            type: string
            minLength: 1
            description: Password reset token from the email
          password:
            type: string
            format: password
            minLength: 1
            description: New password
          password2:
            type: string
            format: password
            minLength: 1
            description: New password again
        required:
          - email
          - token
          - password
          - password2
responses:
  200:
    description: The password is changed
  400:
    description: The token is wrong or expired, the password is not valid,
      or the user is inactive
