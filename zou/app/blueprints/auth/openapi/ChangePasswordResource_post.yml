Change the password
---
description: Change the password of the current user. Give the current
  password and the new password two times.
tags:
  - Authentication
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          old_password:
            type: string
            format: password
            minLength: 1
            description: Current password
          password:
            type: string
            format: password
            minLength: 1
            description: New password
          password_2:
            type: string
            format: password
            minLength: 1
            description: New password again
        required:
          - old_password
          - password
          - password_2
responses:
  200:
    description: The password is changed
  400:
    description: The current password is wrong, the two new passwords are
      different, the new password is too short or the user is inactive
