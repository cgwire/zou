Log in
---
description: Log in a user and get authentication tokens. The email field
  accepts the email address or the desktop login of the user. Desktop tools
  that do not know the email address use the desktop login. If the user has
  two-factor authentication, give one second factor.
tags:
  - Authentication
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          email:
            type: string
            minLength: 1
            example: admin@example.com
            description: Email address or desktop login of the user
          password:
            type: string
            format: password
            example: "********"
            description: Password of the user
          totp:
            type: string
            example: "123456"
            description: TOTP code from the authenticator app
          email_otp:
            type: string
            example: "123456"
            description: One-time password that the user got by email
          fido_authentication_response:
            type: object
            description: Response of the FIDO device to the challenge
          recovery_code:
            type: string
            example: ABCD-EFGH-IJKL-MNOP
            description: One recovery code of the user
        required:
          - email
responses:
  200:
    description: The login is successful
  400:
    description: The login failed. The body tells the cause with the flags
      default_password, missing_OTP, wrong_OTP or
      too_many_failed_login_attemps.
  401:
    description: The user is inactive. The body has the flag unactive.
  409:
    description: The authentication strategy is not correctly configured
  500:
    description: The database is not available, or a server error occurred
