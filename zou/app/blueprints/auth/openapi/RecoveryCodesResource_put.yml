Make new recovery codes
---
description: Make new recovery codes for the two-factor authentication of the
  current user. The new codes replace the old codes. Give a second factor to
  confirm this operation.
tags:
  - Authentication
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        description: Give one of the second factors of the user.
        properties:
          totp:
            type: string
            description: TOTP code from the authenticator app
          email_otp:
            type: string
            description: One-time password that the user got by email
          fido_authentication_response:
            type: object
            description: Response of the FIDO device to the challenge
          recovery_code:
            type: string
            description: One recovery code of the user
responses:
  200:
    description: The new recovery codes
    content:
      application/json:
        schema:
          type: object
          properties:
            otp_recovery_codes:
              type: array
              items:
                type: string
  400:
    description: Two-factor authentication is not enabled, or the second
      factor is wrong
