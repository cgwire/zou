Receive the OIDC SSO callback
---
description: Receive the response of the OpenID Connect identity provider.
  This route changes the authorization code into tokens and validates the ID
  token. Then, it logs in the person linked to the issuer and the subject of
  the token. At the first login, the person with the email of the token is
  linked to this identity. If no person has this email, a new person is
  created.
tags:
  - Authentication
security: []
responses:
  302:
    description: The login is successful. Redirect to the home page.
  400:
    description: OIDC is not enabled, the authentication failed, the email
      is not verified, or the account is linked to a different identity
