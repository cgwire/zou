Log out
---
description: Log out the current user. This route revokes the access token
  and the refresh token. After this operation, the tokens cannot access the
  API.
tags:
  - Authentication
responses:
  200:
    description: The logout is successful
    content:
      application/json:
        schema:
          type: object
          properties:
            logout:
              type: boolean
              example: true
