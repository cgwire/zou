Refresh the access token
---
description: Get a new access token. Send the refresh token as the bearer
  token. An access token expires after a period. Use this route before the
  access token expires. A browser gets the new token in a cookie.
tags:
  - Authentication
responses:
  200:
    description: The new access token, or a refresh flag for a browser
    content:
      application/json:
        schema:
          type: object
          properties:
            access_token:
              type: string
            refresh:
              type: boolean
