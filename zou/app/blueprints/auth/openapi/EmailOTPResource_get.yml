Send an email OTP
---
description: Send a one-time password (OTP) by email to the user. You do not
  need a token for this route. The response is the same if the address is
  unknown, or if the account cannot get an OTP by email.
tags:
  - Authentication
security: []
parameters:
  - in: query
    name: email
    required: true
    schema:
      type: string
    example: admin@example.com
    description: Email address or desktop login of the user
responses:
  200:
    description: The request is received
    content:
      application/json:
        schema:
          type: object
          properties:
            success:
              type: boolean
              example: true
