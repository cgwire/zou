Register a FIDO device
---
description: Register a FIDO device for the current user. First, prepare the
  registration. Then, send the response of the device.
tags:
  - Authentication
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          registration_response:
            type: object
            description: Registration response of the FIDO device
          device_name:
            type: string
            minLength: 1
            description: Name of the FIDO device
        required:
          - registration_response
          - device_name
responses:
  200:
    description: The FIDO device is registered
  400:
    description: The registration failed, or the registration is not
      prepared
