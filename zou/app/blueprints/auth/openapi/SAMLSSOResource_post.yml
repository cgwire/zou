Receive the SAML SSO response
---
description: Receive the authentication response of the SAML identity
  provider. If SAML_SUBJECT_ATTRIBUTE is set, this route logs in the person
  linked to the issuer and the subject of the assertion. The email finds the
  account at the first login only. If no person has this email, a new person
  is created.
tags:
  - Authentication
security: []
responses:
  302:
    description: The login is successful. Redirect to the home page.
  400:
    description: SAML is not enabled, a parameter is wrong, or the account
      is linked to a different identity
