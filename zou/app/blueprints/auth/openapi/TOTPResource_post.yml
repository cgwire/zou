Enable the TOTP
---
description: Enable the authentication with a time-based one-time password
  (TOTP). Give a code from the authenticator app to confirm this operation.
tags:
  - Authentication
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          totp:
            type: string
            minLength: 1
            description: TOTP code from the authenticator app
        required:
          - totp
responses:
  200:
    description: The TOTP is enabled. The body has the recovery codes.
  400:
    description: The TOTP is already enabled, or the code is wrong
