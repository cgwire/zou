Disable the TOTP
---
description: Disable the authentication with a time-based one-time password
  (TOTP). Give a second factor to confirm this operation.
tags:
  - Authentication
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        description: Give one of the second factors of the user.
        properties:
          totp:
            type: string
            description: TOTP code from the authenticator app
          email_otp:
            type: string
            description: One-time password that the user got by email
          fido_authentication_response:
            type: object
            description: Response of the FIDO device to the challenge
          recovery_code:
            type: string
            description: One recovery code of the user
responses:
  200:
    description: The TOTP is disabled
  400:
    description: The TOTP is not enabled, or the second factor is wrong
