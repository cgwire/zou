Remove a FIDO device
---
description: Remove a FIDO device of the current user. Give a second factor
  to confirm this operation.
tags:
  - Authentication
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          device_name:
            type: string
            minLength: 1
            description: Name of the FIDO device to remove
          totp:
            type: string
            description: TOTP code from the authenticator app
          email_otp:
            type: string
            description: One-time password that the user got by email
          fido_authentication_response:
            type: object
            description: Response of the FIDO device to the challenge
          recovery_code:
            type: string
            description: One recovery code of the user
        required:
          - device_name
responses:
  200:
    description: The FIDO device is removed
  400:
    description: FIDO is not enabled, or the second factor is wrong
