Get the authentication status
---
description: Get the current user and the organisation if the token is
  valid. A browser frontend or a third-party tool uses this route to know if
  the user is still logged in.
tags:
  - Authentication
responses:
  200:
    description: The user is authenticated
    content:
      application/json:
        schema:
          type: object
          properties:
            authenticated:
              type: boolean
              example: true
            user:
              type: object
              description: Current user, with relations and FIDO devices
            organisation:
              type: object
  401:
    description: The token is missing, not valid or expired
