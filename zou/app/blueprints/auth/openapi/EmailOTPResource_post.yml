Enable the email OTP
---
description: Enable the authentication with a one-time password (OTP) sent
  by email. Give the code that the user got by email to confirm this
  operation.
tags:
  - Authentication
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          email_otp:
            type: string
            minLength: 1
            description: One-time password that the user got by email
        required:
          - email_otp
responses:
  200:
    description: The email OTP is enabled
  400:
    description: The email OTP is already enabled, or the code is wrong
