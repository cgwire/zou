Ask for a password reset
---
description: Send an email with a password reset link to the user. You do
  not need a token for this route. The response is the same if the address
  is unknown or if the user is inactive.
tags:
  - Authentication
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          email:
            type: string
            format: email
            minLength: 1
            example: admin@example.com
            description: Email address of the user
        required:
          - email
responses:
  200:
    description: The request is received
