Make a browser login code
---
description: Make a one-time code for the current user. A desktop app or a
  script on the same computer uses this code to get its own tokens. The code
  is linked to the PKCE challenge in the body. The code expires after 60
  seconds. A bot cannot make a code.
tags:
  - Authentication
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          code_challenge:
            type: string
            pattern: "^[A-Za-z0-9_-]{43}$"
            example: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
            description: SHA-256 of the PKCE code verifier, encoded in
              base64url without padding (43 characters)
        required:
          - code_challenge
responses:
  201:
    description: The one-time login code
    content:
      application/json:
        schema:
          type: object
          properties:
            code:
              type: string
              description: One-time login code
  400:
    description: The code challenge is not correct
  403:
    description: The token belongs to a bot
