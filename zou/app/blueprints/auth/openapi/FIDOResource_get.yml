Get a FIDO challenge
---
description: Get a challenge for the FIDO devices of the user. You do not
  need a token for this route. Use the challenge to log in with WebAuthn.
tags:
  - Authentication
security: []
parameters:
  - in: query
    name: email
    required: true
    schema:
      type: string
    example: admin@example.com
    description: Email address or desktop login of the user
responses:
  200:
    description: The FIDO challenge
  400:
    description: No FIDO challenge is available for this user
