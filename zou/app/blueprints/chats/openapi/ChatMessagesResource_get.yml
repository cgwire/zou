Get the chat messages
---
description: Get the messages of the chat of an entity. Each message has
  its author and its date. Clients cannot use this route.
tags:
  - Chat
parameters:
  - in: path
    name: entity_id
    description: Unique identifier of the entity that has the chat
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    schema:
      type: string
      format: uuid
responses:
  200:
    description: The list of messages
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Message unique identifier
              message:
                type: string
                description: Message content
              person_id:
                type: string
                format: uuid
                description: ID of the message sender
              created_at:
                type: string
                format: date-time
                description: Message creation timestamp
              attachments:
                type: array
                items:
                  type: object
                description: Array of file attachments
  403:
    description: You are a client, or you do not have access to this
      entity
  404:
    description: The entity does not exist
