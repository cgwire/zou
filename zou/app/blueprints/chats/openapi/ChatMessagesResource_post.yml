Send a chat message
---
description: Send a message in the chat of an entity. Only the
  participants of the chat can send messages. Send JSON for a text
  message. Send multipart form data to attach files. Clients cannot use
  this route.
tags:
  - Chat
parameters:
  - in: path
    name: entity_id
    description: Unique identifier of the entity that has the chat
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    schema:
      type: string
      format: uuid
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          message:
            type: string
            description: Message content to send
            example: Hello, world!
        required:
          - message
    multipart/form-data:
      schema:
        type: object
        properties:
          message:
            type: string
            description: Message content to send
            example: Hello, world!
          files:
            type: array
            items:
              type: string
              format: binary
            description: Files to attach to the message
        required:
          - message
responses:
  201:
    description: The new message
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Created message unique identifier
            message:
              type: string
              description: Message content
            person_id:
              type: string
              format: uuid
              description: ID of the message sender
            created_at:
              type: string
              format: date-time
              description: Message creation timestamp
            attachments:
              type: array
              items:
                type: object
              description: Array of attached files
  400:
    description: The message is missing, or you are not a participant of the
      chat
  403:
    description: You are a client, or you do not have access to this
      entity
  404:
    description: The entity does not exist
