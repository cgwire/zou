Get a chat message
---
description: Get a message of the chat of an entity. Clients cannot use
  this route.
tags:
  - Chat
parameters:
  - in: path
    name: entity_id
    description: Unique identifier of the entity that has the chat
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    schema:
      type: string
      format: uuid
  - in: path
    name: chat_message_id
    description: Unique identifier of the message
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    schema:
      type: string
      format: uuid
responses:
  200:
    description: The message
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Message unique identifier
            message:
              type: string
              description: Message content
            person_id:
              type: string
              format: uuid
              description: ID of the message sender
            created_at:
              type: string
              format: date-time
              description: Message creation timestamp
            updated_at:
              type: string
              format: date-time
              description: Message last update timestamp
            attachments:
              type: array
              items:
                type: object
              description: Array of file attachments
  403:
    description: You are a client, or you do not have access to this
      entity, or the message is
      not in this chat
  404:
    description: The entity or the message does not exist
