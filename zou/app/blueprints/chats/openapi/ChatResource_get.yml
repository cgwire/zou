Get the chat of an entity
---
description: Get the chat of an entity, with its participants and its
  messages. Clients cannot use this route.
tags:
  - Chat
parameters:
  - in: path
    name: entity_id
    description: Unique identifier of the entity that has the chat
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    schema:
      type: string
      format: uuid
responses:
  200:
    description: The chat and its messages
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Chat unique identifier
            entity_id:
              type: string
              format: uuid
              description: Entity ID this chat is associated with
            participants:
              type: array
              items:
                type: string
                format: uuid
              description: List of participant user IDs
            messages:
              type: array
              items:
                type: object
              description: Array of chat messages
  403:
    description: You are a client, or you do not have access to this
      entity
  404:
    description: The entity does not exist
