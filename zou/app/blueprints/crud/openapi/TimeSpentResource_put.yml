Update a time spent
---
tags:
  - Crud
description: Update the fields of a time spent. Send only the fields to
  change. You cannot change id, created_at, updated_at. Dates use the ISO 8601
  format. The task duration becomes the sum of its time spents. You must be an
  administrator.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the time spent
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          date:
            type: string
            format: date
            example: '2024-01-16'
          duration:
            type: number
            example: 7.5
responses:
  200:
    description: The updated time spent
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            task_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            person_id:
              type: string
              format: uuid
              example: c24a6ea4-ce75-4665-a070-57453082c250
            date:
              type: string
              format: date
              example: '2024-01-16'
            duration:
              type: number
              example: 7.5
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T11:00:00Z'
  400:
    description: The body is not valid, a date is not valid, or a field
      breaks a database constraint
  403:
    description: You are not an administrator
  404:
    description: The time spent does not exist
