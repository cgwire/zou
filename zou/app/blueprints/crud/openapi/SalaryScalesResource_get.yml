Get the salary scales
---
tags:
  - Crud
description: Get the salary scales of the studio. Each department has a
  salary scale for each position and each seniority. This route creates the
  missing salary scales before it sends the list. You must be an
  administrator.
responses:
  200:
    description: The list of salary scales
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              department_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              position:
                type: string
                example: artist
              seniority:
                type: string
                example: junior
              rate:
                type: number
                example: 50.0
  400:
    description: Query error
  403:
    description: You are not an administrator
