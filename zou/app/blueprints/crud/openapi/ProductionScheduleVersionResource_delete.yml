Delete a production schedule version
---
tags:
  - Crud
description: Delete a production schedule version. The versions copied from
  it and the project that uses it lose their link to it first. You must be a
  manager in the team of the project, or an administrator.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the production schedule version
responses:
  204:
    description: The production schedule version is deleted
  400:
    description: Other data uses this row
  403:
    description: You are not a manager in the team of the project
  404:
    description: The production schedule version does not exist
