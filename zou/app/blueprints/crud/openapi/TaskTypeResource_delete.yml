Delete a task type
---
tags:
  - Crud
description: Delete a task type. You must be an administrator.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the task type
responses:
  204:
    description: The task type is deleted
  400:
    description: Other data uses this row
  403:
    description: You cannot delete this task type
  404:
    description: The task type does not exist
