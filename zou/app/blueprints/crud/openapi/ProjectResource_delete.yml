Delete project
---
tags:
  - Crud
description: Delete a project by its ID. Only closed projects can
  be deleted. Returns empty response on success.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: query
    name: force
    required: false
    schema:
      type: boolean
    default: false
    example: false
    description: Force deletion with cascading removal
responses:
    204:
      description: Project deleted successfully
    400:
      description: Only closed projects can be deleted or integrity error
