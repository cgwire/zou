Update an entity
---
tags:
  - Crud
description: 'Update the fields of an entity: an asset, a shot, a sequence, an
  episode, an edit or a concept. The data field is merged with the current data.
  Send only the keys to change. When the frames or the name of a shot change,
  a new version of the shot is saved. Changes of one person that are less than
  one minute apart update the same version, for five minutes at most.'
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the entity
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            example: SH010
          data:
            type: object
            example: {frame_in: 1001, frame_out: 1120}
responses:
  200:
    description: The updated entity
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              example: SH010
            project_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            data:
              type: object
              example: {frame_in: 1001, frame_out: 1120}
  400:
    description: The body is not valid
  403:
    description: You cannot update this entity
  404:
    description: The entity does not exist
