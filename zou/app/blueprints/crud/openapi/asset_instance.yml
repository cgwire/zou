AssetInstanceResource_delete:
  summary: Delete an asset instance
  tags:
    - Crud
  description: Delete an asset instance. You must be an administrator.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the asset instance
  responses:
    204:
      description: The asset instance is deleted
    400:
      description: Other data uses this row
    403:
      description: You are not an administrator
    404:
      description: The asset instance does not exist

AssetInstanceResource_get:
  summary: Get an asset instance
  tags:
    - Crud
  description: Get an asset instance. An administrator can read all the asset
    instances. Other users must have access to the project of the asset. A
    vendor must also have a task on the asset.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the asset instance
    - in: query
      name: relations
      required: false
      schema:
        type: boolean
        default: true
      example: true
      description: Add the related data. The default value is true.
  responses:
    200:
      description: The asset instance
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              asset_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: Instance Name
              number:
                type: integer
                example: 1
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
    400:
      description: The identifier is not a valid UUID
    403:
      description: You do not have access to the project of the asset, or you
        are a vendor without a task on the asset
    404:
      description: The asset instance does not exist

AssetInstanceResource_put:
  summary: Update an asset instance
  tags:
    - Crud
  description: Update the fields of an asset instance. Send only the fields to
    change. You cannot change id, created_at, updated_at, number, asset_id,
    scene_id and target_asset_id. Dates use the ISO 8601 format. An
    administrator can update all the asset instances. Other users must be in
    the team of the project of the asset. A client or a vendor of the project
    cannot update it.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the asset instance
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
              example: Updated Instance Name
  responses:
    200:
      description: The updated asset instance
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              asset_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: Updated Instance Name
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T11:00:00Z'
    400:
      description: The body is not valid, a date is not valid, or a field
        breaks a database constraint
    403:
      description: You do not have access to the project of the asset, or
        you are a client or a vendor
    404:
      description: The asset instance does not exist

AssetInstancesResource_get:
  summary: Get asset instance rows
  tags:
    - Crud
  description: Get the asset instance rows. Add a query parameter for each
    column to filter on, for example name=Modeling. The name filter does not
    make a difference between upper case and lower case. To get the rows that
    have one value of a list, give the list in JSON, for example
    task_status_id=["<id1>","<id2>"]. You must be an administrator.
  parameters:
    - in: query
      name: page
      required: false
      description: Page to get. Without this parameter, the response has all
        the rows.
      example: 1
      schema:
        type: integer
    - in: query
      name: limit
      required: false
      description: Number of rows in a page. The default value is 100.
      example: 100
      schema:
        type: integer
    - in: query
      name: relations
      required: false
      description: Add the related data to each row
      schema:
        type: boolean
        default: false
    - in: query
      name: fields
      required: false
      description: Comma-separated list of the fields to get for each row. The
        response always has id and type. The names that are not fields are
        ignored.
      example: id,name
      schema:
        type: string
  responses:
    200:
      description: The list of asset instance rows, or a page of rows if you
        give page
      content:
        application/json:
          schema:
            oneOf:
              - type: array
                items:
                  type: object
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                    example: []
                  total:
                    type: integer
                    example: 100
                  nb_pages:
                    type: integer
                    example: 2
                  limit:
                    type: integer
                    example: 50
                  offset:
                    type: integer
                    example: 0
                  page:
                    type: integer
                    example: 1
    400:
      description: A filter is not valid
    403:
      description: You are not an administrator

AssetInstancesResource_post:
  summary: Create an asset instance
  tags:
    - Crud
  description: Create an asset instance. Send the fields of the new row in
    JSON. You must be an administrator.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - asset_id
          properties:
            asset_id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              example: Instance Name
  responses:
    201:
      description: The new asset instance
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              asset_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: Instance Name
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
    400:
      description: The body is not valid, or a field breaks a database
        constraint
    403:
      description: You are not an administrator
