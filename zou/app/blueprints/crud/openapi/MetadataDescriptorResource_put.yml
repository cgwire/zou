Update a metadata descriptor
---
tags:
  - Crud
description: Update the fields of a metadata descriptor. Send only the
  fields to change. You cannot change id, created_at, updated_at and
  project_id. Dates use the ISO 8601 format. data_type must be a known type.
  For an entity column, a new field_name cannot be the name of a built-in
  field. You must be an administrator.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the metadata descriptor
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            example: Updated Custom Field
          data_type:
            type: string
            example: number
responses:
  200:
    description: The updated metadata descriptor
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              example: Updated Custom Field
            field_name:
              type: string
              example: custom_field
            data_type:
              type: string
              example: number
            departments:
              type: array
              description: Departments the descriptor is limited to
              items:
                type: string
                format: uuid
              example: [a24a6ea4-ce75-4665-a070-57453082c250]
            project_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T11:00:00Z'
  400:
    description: The body is not valid, a date is not valid, or a field
      breaks a database constraint
  403:
    description: You are not an administrator
  404:
    description: The metadata descriptor does not exist
