Get events
---
tags:
  - Crud
description: Retrieve all events. Supports filtering via query
  parameters and pagination. Limited to 1000 results.
parameters:
  - in: query
    name: page
    required: false
    schema:
      type: integer
    example: 1
    description: Page number for pagination
  - in: query
    name: limit
    required: false
    schema:
      type: integer
    example: 50
    description: Number of results per page
  - in: query
    name: relations
    required: false
    schema:
      type: boolean
    default: false
    example: false
    description: Whether to include relations
responses:
    200:
      description: Events retrieved successfully
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  example: a24a6ea4-ce75-4665-a070-57453082c25
                name:
                  type: string
                  example: Event Name
                created_at:
                  type: string
                  format: date-time
                  example: "2024-01-15T10:30:00Z"
                updated_at:
                  type: string
                  format: date-time
                  example: "2024-01-15T10:30:00Z"
    400:
      description: Invalid filter format or query error
