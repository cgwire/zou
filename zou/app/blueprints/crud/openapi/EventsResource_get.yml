Get events
---
tags:
  - Crud
description: Get the events of the API, for example task:update. Add a query
  parameter for each column to filter on. Use page and limit to get the
  events page by page. You must be an administrator.
parameters:
  - in: query
    name: page
    required: false
    schema:
      type: integer
    example: 1
    description: Page number for pagination
  - in: query
    name: limit
    required: false
    schema:
      type: integer
    example: 50
    description: Number of results per page
  - in: query
    name: relations
    required: false
    schema:
      type: boolean
      default: false
    example: false
    description: Whether to include relations
responses:
  200:
    description: The list of events, or a page of events if you give page
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: Event Name
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
  400:
    description: A filter is not valid
  403:
    description: You are not an administrator
