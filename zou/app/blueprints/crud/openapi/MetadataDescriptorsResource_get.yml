Get metadata descriptor rows
---
tags:
  - Crud
description: Get the metadata descriptor rows. Add a query parameter for
  each column to filter on, for example name=Modeling. The name filter does
  not make a difference between upper case and lower case. To get the rows
  that have one value of a list, give the list in JSON, for example
  task_status_id=["<id1>","<id2>"].
parameters:
  - in: query
    name: page
    required: false
    description: Page to get. Without this parameter, the response has all
      the rows.
    example: 1
    schema:
      type: integer
  - in: query
    name: limit
    required: false
    description: Number of rows in a page. The default value is 100.
    example: 100
    schema:
      type: integer
  - in: query
    name: relations
    required: false
    description: Add the related data to each row
    schema:
      type: boolean
      default: false
  - in: query
    name: fields
    required: false
    description: Comma-separated list of the fields to get for each row. The
      response always has id and type. The names that are not fields are
      ignored.
    example: id,name
    schema:
      type: string
responses:
  200:
    description: The list of metadata descriptor rows, or a page of rows if
      you give page
    content:
      application/json:
        schema:
          oneOf:
            - type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    example: a24a6ea4-ce75-4665-a070-57453082c250
                  name:
                    type: string
                    example: Custom Field
                  field_name:
                    type: string
                    example: custom_field
                  data_type:
                    type: string
                    example: text
                  project_id:
                    type: string
                    format: uuid
                    example: b24a6ea4-ce75-4665-a070-57453082c250
                  created_at:
                    type: string
                    format: date-time
                    example: '2024-01-15T10:30:00Z'
                  updated_at:
                    type: string
                    format: date-time
                    example: '2024-01-15T10:30:00Z'
            - type: object
              description: Response when you give page
              properties:
                data:
                  type: array
                  items:
                    type: object
                total:
                  type: integer
                nb_pages:
                  type: integer
                limit:
                  type: integer
                offset:
                  type: integer
                page:
                  type: integer
  400:
    description: A filter is not valid
  403:
    description: You cannot read these rows
