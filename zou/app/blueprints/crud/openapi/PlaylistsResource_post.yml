Create a playlist
---
tags:
  - Crud
description: Create a playlist. Send the fields of the new row in JSON. You
  must be an administrator, or a manager or a supervisor in the team of the
  project. The route sets created_by to you. for_entity must be a valid
  value. An episode_id of all or main gives no episode. In shots, the route
  removes a preview that does not belong to its entity.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - project_id
        properties:
          name:
            type: string
            example: Playlist Name
          project_id:
            type: string
            format: uuid
            example: a24a6ea4-ce75-4665-a070-57453082c250
          episode_id:
            type: string
            format: uuid
            example: b24a6ea4-ce75-4665-a070-57453082c250
          task_type_id:
            type: string
            format: uuid
            example: c24a6ea4-ce75-4665-a070-57453082c250
responses:
  201:
    description: The new playlist
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              example: Playlist Name
            project_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            episode_id:
              type: string
              format: uuid
              example: c24a6ea4-ce75-4665-a070-57453082c250
            task_type_id:
              type: string
              format: uuid
              example: d24a6ea4-ce75-4665-a070-57453082c250
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
  400:
    description: The body is not valid, or a field breaks a database
      constraint
  403:
    description: You are not an administrator, or a manager or a supervisor
      in the team of the project
