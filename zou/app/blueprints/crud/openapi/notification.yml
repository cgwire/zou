NotificationResource_delete:
  summary: Delete a notification
  tags:
    - Crud
  description: Delete a notification. You must be an administrator.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the notification
  responses:
    204:
      description: The notification is deleted
    400:
      description: Other data uses this row
    403:
      description: You are not an administrator
    404:
      description: The notification does not exist

NotificationResource_get:
  summary: Get a notification
  tags:
    - Crud
  description: Get a notification. You must be an administrator.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the notification
    - in: query
      name: relations
      required: false
      schema:
        type: boolean
        default: true
      example: true
      description: Add the related data. The default value is true.
  responses:
    200:
      description: The notification
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              person_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              comment_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
              type:
                type: string
                enum: [comment, mention, assignation, reply, reply-mention, playlist-ready]
                example: comment
              author_id:
                type: string
                format: uuid
                example: d24a6ea4-ce75-4665-a070-57453082c250
              task_id:
                type: string
                format: uuid
                example: d24a6ea4-ce75-4665-a070-57453082c250
              playlist_id:
                type: string
                format: uuid
                example: d24a6ea4-ce75-4665-a070-57453082c250
              reply_id:
                type: string
                format: uuid
                example: d24a6ea4-ce75-4665-a070-57453082c250
              change:
                type: boolean
                example: false
              read:
                type: boolean
                example: false
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
    400:
      description: The identifier is not a valid UUID
    403:
      description: You are not an administrator
    404:
      description: The notification does not exist

NotificationResource_put:
  summary: Update a notification
  tags:
    - Crud
  description: Update the fields of a notification. Send only the fields to
    change. You cannot change id, created_at, updated_at. Dates use the ISO
    8601 format. You must be an administrator.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the notification
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            read:
              type: boolean
              example: true
  responses:
    200:
      description: The updated notification
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              person_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              comment_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
              type:
                type: string
                enum: [comment, mention, assignation, reply, reply-mention, playlist-ready]
                example: comment
              author_id:
                type: string
                format: uuid
                example: d24a6ea4-ce75-4665-a070-57453082c250
              task_id:
                type: string
                format: uuid
                example: d24a6ea4-ce75-4665-a070-57453082c250
              playlist_id:
                type: string
                format: uuid
                example: d24a6ea4-ce75-4665-a070-57453082c250
              reply_id:
                type: string
                format: uuid
                example: d24a6ea4-ce75-4665-a070-57453082c250
              change:
                type: boolean
                example: false
              read:
                type: boolean
                example: true
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T11:00:00Z'
    400:
      description: The body is not valid, a date is not valid, or a field
        breaks a database constraint
    403:
      description: You are not an administrator
    404:
      description: The notification does not exist

NotificationsResource_get:
  summary: Get notification rows
  tags:
    - Crud
  description: Get the notification rows. Add a query parameter for each
    column to filter on, for example name=Modeling. The name filter does not
    make a difference between upper case and lower case. To get the rows that
    have one value of a list, give the list in JSON, for example
    task_status_id=["<id1>","<id2>"]. You must be an administrator.
  parameters:
    - in: query
      name: page
      required: false
      description: Page to get. Without this parameter, the response has all
        the rows.
      example: 1
      schema:
        type: integer
    - in: query
      name: limit
      required: false
      description: Number of rows in a page. The default value is 100.
      example: 100
      schema:
        type: integer
    - in: query
      name: relations
      required: false
      description: Add the related data to each row
      schema:
        type: boolean
        default: false
    - in: query
      name: fields
      required: false
      description: Comma-separated list of the fields to get for each row. The
        response always has id and type. The names that are not fields are
        ignored.
      example: id,name
      schema:
        type: string
  responses:
    200:
      description: The list of notification rows, or a page of rows if you
        give page
      content:
        application/json:
          schema:
            oneOf:
              - type: array
                items:
                  type: object
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                    example: []
                  total:
                    type: integer
                    example: 100
                  nb_pages:
                    type: integer
                    example: 2
                  limit:
                    type: integer
                    example: 50
                  offset:
                    type: integer
                    example: 0
                  page:
                    type: integer
                    example: 1
    400:
      description: A filter is not valid
    403:
      description: You are not an administrator

