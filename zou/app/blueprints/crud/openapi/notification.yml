              task_id:
                type: string
                format: uuid
                example: d24a6ea4-ce75-4665-a070-57453082c250
              playlist_id:
                type: string
                format: uuid
                example: d24a6ea4-ce75-4665-a070-57453082c250
              reply_id:
                type: string
                format: uuid
                example: d24a6ea4-ce75-4665-a070-57453082c250
              change:
                type: boolean
