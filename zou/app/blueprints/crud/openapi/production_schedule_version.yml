ProductionScheduleVersionResource_delete:
  summary: Delete a production schedule version
  tags:
    - Crud
  description: Delete a production schedule version. The versions copied from
    it and the project that uses it lose their link to it first. You must be a
    manager in the team of the project, or an administrator.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the production schedule version
  responses:
    204:
      description: The production schedule version is deleted
    400:
      description: Other data uses this row
    403:
      description: You are not a manager in the team of the project
    404:
      description: The production schedule version does not exist

ProductionScheduleVersionResource_get:
  summary: Get a production schedule version
  tags:
    - Crud
  description: Get a production schedule version. You must be in the team of
    the project, or an administrator. A vendor or a client cannot read
    schedule versions.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the production schedule version
    - in: query
      name: relations
      required: false
      schema:
        type: boolean
        default: true
      example: true
      description: Add the related data. The default value is true.
  responses:
    200:
      description: The production schedule version
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: Schedule Version 1
              project_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
    400:
      description: The identifier is not a valid UUID
    403:
      description: You are not in the team of the project, or you are a vendor
        or a client
    404:
      description: The production schedule version does not exist

ProductionScheduleVersionResource_put:
  summary: Update a production schedule version
  tags:
    - Crud
  description: Update the fields of a production schedule version. Send only
    the fields to change. You must be a manager in the team of the project, or
    an administrator. You cannot change id, created_at, updated_at and
    project_id. Dates use the ISO 8601 format.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the production schedule version
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
              example: Updated Schedule Version 1
  responses:
    200:
      description: The updated production schedule version
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: Updated Schedule Version 1
              project_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T11:00:00Z'
    400:
      description: The body is not valid, a date is not valid, or a field
        breaks a database constraint
    403:
      description: You are not a manager in the team of the project
    404:
      description: The production schedule version does not exist

