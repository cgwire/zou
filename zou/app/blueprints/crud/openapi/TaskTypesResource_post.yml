Create task type
---
tags:
  - Crud
description: Create a new task type with data provided in the
  request body. JSON format is expected. Task type names must
  be unique.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - for_entity
        properties:
          name:
            type: string
            example: Animation
          for_entity:
            type: string
            example: Shot
          color:
            type: string
            example: "#FF5733"
responses:
    201:
      description: Task type created successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: Animation
              for_entity:
                type: string
                example: Shot
              color:
                type: string
                example: "#FF5733"
              created_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
    400:
      description: Invalid data format or task type name already exists
