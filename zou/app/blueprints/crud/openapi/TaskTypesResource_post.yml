Create a task type
---
tags:
  - Crud
description: Create a task type. Send the fields of the new row in JSON. You
  must be an administrator.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - for_entity
        properties:
          name:
            type: string
            example: Animation
          for_entity:
            type: string
            example: Shot
          color:
            type: string
            example: '#FF5733'
responses:
  201:
    description: The new task type
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              example: Animation
            for_entity:
              type: string
              example: Shot
            color:
              type: string
              example: '#FF5733'
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
  400:
    description: The body is not valid, or a field breaks a database
      constraint
  403:
    description: You cannot create a task type
