Create a search filter
---
tags:
  - Crud
description: Create a search filter. Send the fields of the new row in JSON.
  You must be an administrator.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - person_id
          - search_filter_group_id
        properties:
          name:
            type: string
            example: My Filter
          person_id:
            type: string
            format: uuid
            example: a24a6ea4-ce75-4665-a070-57453082c250
          search_filter_group_id:
            type: string
            format: uuid
            example: b24a6ea4-ce75-4665-a070-57453082c250
          list_type:
            type: string
            example: assets
responses:
  201:
    description: The new search filter
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              example: My Filter
            person_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            search_filter_group_id:
              type: string
              format: uuid
              example: c24a6ea4-ce75-4665-a070-57453082c250
            list_type:
              type: string
              example: assets
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
  400:
    description: The body is not valid, or a field breaks a database
      constraint
  403:
    description: You are not an administrator
