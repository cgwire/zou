Create a preview background file
---
tags:
  - Crud
description: Create a preview background file. Send the fields of the new
  row in JSON. You must be an administrator.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
        properties:
          name:
            type: string
            example: background_file_name
          is_default:
            type: boolean
            default: false
            example: false
responses:
  201:
    description: The new preview background file
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              example: background_file_name
            is_default:
              type: boolean
              example: false
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
  400:
    description: The body is not valid, or a field breaks a database
      constraint
  403:
    description: You cannot create a preview background file
