Update a chat
---
tags:
  - Crud
description: Update the fields of a chat. Send only the fields to change.
  You cannot change id, created_at, updated_at. Dates use the ISO 8601
  format. You must be an administrator.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the chat
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          object_id:
            type: string
            format: uuid
            description: Entity of the chat
            example: a24a6ea4-ce75-4665-a070-57453082c250
          object_type:
            type: string
            description: Type of the entity of the chat
responses:
  200:
    description: The updated chat
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            object_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            object_type:
              type: string
              example: Asset
            name:
              type: string
              example: Updated Chat Name
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T11:00:00Z'
  400:
    description: The body is not valid, a date is not valid, or a field
      breaks a database constraint
  403:
    description: You cannot update this chat
  404:
    description: The chat does not exist
