Get a working file
---
tags:
  - Crud
description: Get a working file. You must be an administrator or a member of
  the project team of the task. A vendor must also have a task assigned on the
  entity of the task.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the working file
responses:
  200:
    description: The working file
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              example: work_file_v001
            task_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
  400:
    description: The identifier is not valid
  403:
    description: You are not in the project team, or you are a vendor without
      a task on this entity
  404:
    description: The working file does not exist
