Create a custom action
---
tags:
  - Crud
description: Create a custom action. Send the fields of the new row in JSON.
  The name is required. You must be an administrator.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
        properties:
          name:
            type: string
            example: Custom Action Name
          url:
            type: string
            description: URL that the action calls
            example: https://example.com/hook
responses:
  201:
    description: The new custom action
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              example: Custom Action Name
            url_pattern:
              type: string
              example: /api/actions/{id}
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
  400:
    description: The name is missing, the body is not valid, or a field
      breaks a database constraint
  403:
    description: You are not an administrator
