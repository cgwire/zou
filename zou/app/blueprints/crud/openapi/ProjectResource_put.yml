Update a project
---
tags:
  - Crud
description: Update the fields of a project. Send only the fields to change.
  You cannot change id, created_at, updated_at. Dates use the ISO 8601
  format.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the project
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            example: Updated Project Name
          production_style:
            type: string
            example: 2d
          default_preview_background_file_id:
            type: string
            format: uuid
            description: Default preview background file of the project
            example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  200:
    description: The updated project
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              example: Updated Project Name
            production_type:
              type: string
              example: feature
            production_style:
              type: string
              example: 2d
            project_status_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            first_episode_id:
              type: string
              format: uuid
              example: c24a6ea4-ce75-4665-a070-57453082c250
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T11:00:00Z'
  400:
    description: The body is not valid, a date is not valid, or a field
      breaks a database constraint
  403:
    description: You cannot update this project
  404:
    description: The project does not exist
