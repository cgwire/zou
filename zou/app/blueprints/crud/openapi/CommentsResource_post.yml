Create comment
---
tags:
  - Crud
description: Create a new comment with data provided in the request
  body. JSON format is expected.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - object_id
          - person_id
          - task_status_id
        properties:
          object_id:
            type: string
            format: uuid
            example: a24a6ea4-ce75-4665-a070-57453082c250
          person_id:
            type: string
            format: uuid
            example: b24a6ea4-ce75-4665-a070-57453082c250
          task_status_id:
            type: string
            format: uuid
            example: c24a6ea4-ce75-4665-a070-57453082c250
          text:
            type: string
            example: Comment text
responses:
    201:
      description: Comment created successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              object_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              person_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
              task_status_id:
                type: string
                format: uuid
                example: d24a6ea4-ce75-4665-a070-57453082c250
              text:
                type: string
                example: Comment text
              created_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
    400:
      description: Invalid data format or validation error
