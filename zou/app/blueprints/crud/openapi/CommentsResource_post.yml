Create a comment
---
tags:
  - Crud
description: Create a comment. Send the fields of the new row in JSON. You
  must be an administrator.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - object_id
          - person_id
          - task_status_id
        properties:
          object_id:
            type: string
            format: uuid
            example: a24a6ea4-ce75-4665-a070-57453082c250
          person_id:
            type: string
            format: uuid
            example: b24a6ea4-ce75-4665-a070-57453082c250
          task_status_id:
            type: string
            format: uuid
            example: c24a6ea4-ce75-4665-a070-57453082c250
          text:
            type: string
            example: Comment text
responses:
  201:
    description: The new comment
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            object_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            person_id:
              type: string
              format: uuid
              example: c24a6ea4-ce75-4665-a070-57453082c250
            task_status_id:
              type: string
              format: uuid
              example: d24a6ea4-ce75-4665-a070-57453082c250
            text:
              type: string
              example: Comment text
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
  400:
    description: The body is not valid, or a field breaks a database
      constraint
  403:
    description: You are not an administrator
