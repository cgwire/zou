WorkingFileResource_delete:
  summary: Delete a working file
  tags:
    - Crud
  description: Delete a working file. You must be an administrator.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the working file
  responses:
    204:
      description: The working file is deleted
    400:
      description: Other data uses this row
    403:
      description: You are not an administrator
    404:
      description: The working file does not exist

WorkingFileResource_get:
  summary: Get a working file
  tags:
    - Crud
  description: Get a working file. Assigned artists, project managers, and
    administrators may read it. Supervisors may read it when assigned to the
    task. Clients, vendors, and unassigned artists are denied.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the working file
  responses:
    200:
      description: The working file
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: work_file_v001
              task_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
    403:
      description: You are not in the project team, or you are a vendor without
        a task on this entity
    404:
      description: The working file does not exist, or the identifier is not
        valid

WorkingFileResource_put:
  summary: Update a working file
  tags:
    - Crud
  description: Update the fields of a working file. Only an artist assigned to
    the working file's task may update it. You cannot change id, created_at, or
    updated_at directly. Dates use the ISO 8601 format. The validation_status
    must be validated, rejected or neutral.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the working file
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
              example: updated_work_file_v001
            revision:
              type: integer
              example: 2
            validation_status:
              type: string
              enum: [neutral, validated, rejected]
              example: validated
  responses:
    200:
      description: The updated working file
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: updated_work_file_v001
              task_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              entity_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
              revision:
                type: integer
                example: 2
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T11:00:00Z'
    400:
      description: The body is not valid, a date is not valid, or a field
        breaks a database constraint
    403:
      description: You cannot act on the task of this working file
    404:
      description: The working file does not exist

WorkingFilesResource_get:
  summary: Get working file rows
  tags:
    - Crud
  description: Get working file rows. Non-admin users must scope the request by
    task_id or entity_id. Assigned artists, assigned supervisors, and project
    managers can query a task; project managers can query an entity.
    Administrators may query without a scope. Clients, vendors, and unassigned
    artists are denied. Additional query parameters filter rows, such as
    name=Modeling. List values can be supplied as JSON, for example
    task_status_id=["<id1>","<id2>"].
  parameters:
    - in: query
      name: page
      required: false
      description: Page to get. Without this parameter, the response has all
        the rows.
      example: 1
      schema:
        type: integer
    - in: query
      name: limit
      required: false
      description: Number of rows in a page. The default value is 100.
      example: 100
      schema:
        type: integer
    - in: query
      name: relations
      required: false
      description: Add the related data to each row
      schema:
        type: boolean
        default: false
    - in: query
      name: fields
      required: false
      description: Comma-separated list of the fields to get for each row. The
        response always has id and type. The names that are not fields are
        ignored.
      example: id,name
      schema:
        type: string
    - in: query
      name: task_id
      required: false
      description: Restrict the result to a task the current user may access
      schema:
        type: string
        format: uuid
    - in: query
      name: entity_id
      required: false
      description: Restrict the result to an entity a project manager may access
      schema:
        type: string
        format: uuid
  responses:
    200:
      description: The list of working file rows, or a page of rows if you
        give page
      content:
        application/json:
          schema:
            oneOf:
              - type: array
                items:
                  type: object
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                    example: []
                  total:
                    type: integer
                    example: 100
                  nb_pages:
                    type: integer
                    example: 2
                  limit:
                    type: integer
                    example: 50
                  offset:
                    type: integer
                    example: 0
                  page:
                    type: integer
                    example: 1
    400:
      description: A filter is not valid
    403:
      description: A required task or entity scope is missing or access is denied

WorkingFilesResource_post:
  summary: Create a working file
  tags:
    - Crud
  description: Generic WorkingFile creation is disabled. Create a revision via
    POST /data/tasks/{task_id}/working-files/new so task assignment, revision
    numbering, and the server-generated path are checked together.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
            - task_id
            - entity_id
          properties:
            name:
              type: string
              example: work_file_v001
            task_id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            entity_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            revision:
              type: integer
              default: 1
              example: 1
  responses:
    201:
      description: The new working file
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: work_file_v001
              task_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              entity_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
              revision:
                type: integer
                example: 1
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
    400:
      description: The body is not valid, or a field breaks a database
        constraint
    403:
      description: Generic WorkingFile creation is disabled
