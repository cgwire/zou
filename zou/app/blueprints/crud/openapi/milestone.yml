MilestoneResource_delete:
  summary: Delete a milestone
  tags:
    - Crud
  description: Delete a milestone. You must be an administrator, or a manager
    in the team of the project.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the milestone
  responses:
    204:
      description: The milestone is deleted
    400:
      description: Other data uses this row
    403:
      description: You are not an administrator or a manager in the
        team of the project
    404:
      description: The milestone does not exist

MilestoneResource_get:
  summary: Get a milestone
  tags:
    - Crud
  description: Get a milestone. You must be in the team of its project. A
    vendor cannot read it.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the milestone
    - in: query
      name: relations
      required: false
      schema:
        type: boolean
        default: true
      example: true
      description: Add the related data. The default value is true.
  responses:
    200:
      description: The milestone
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: Milestone Name
              project_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              date:
                type: string
                format: date
                example: '2024-03-31'
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
    400:
      description: The identifier is not a valid UUID
    403:
      description: You are not in the team of the project, or you
        are a vendor
    404:
      description: The milestone does not exist

MilestoneResource_put:
  summary: Update a milestone
  tags:
    - Crud
  description: Update the fields of a milestone. Send only the fields to
    change. You cannot change id, created_at, updated_at and project_id. Dates
    use the ISO 8601 format. You must be an administrator, or a manager in the
    team of the project.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the milestone
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
              example: Updated Milestone Name
            date:
              type: string
              format: date
              example: '2024-04-30'
  responses:
    200:
      description: The updated milestone
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: Updated Milestone Name
              project_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              date:
                type: string
                format: date
                example: '2024-04-30'
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T11:00:00Z'
    400:
      description: The body is not valid, a date is not valid, or a field
        breaks a database constraint
    403:
      description: You are not an administrator or a manager in the
        team of the project
    404:
      description: The milestone does not exist

MilestonesResource_get:
  summary: Get milestone rows
  tags:
    - Crud
  description: Get the milestone rows. Add a query parameter for each column
    to filter on, for example name=Modeling. The name filter does not make a
    difference between upper case and lower case. To get the rows that have
    one value of a list, give the list in JSON, for example
    task_status_id=["<id1>","<id2>"]. You must be an administrator.
  parameters:
    - in: query
      name: page
      required: false
      description: Page to get. Without this parameter, the response has all
        the rows.
      example: 1
      schema:
        type: integer
    - in: query
      name: limit
      required: false
      description: Number of rows in a page. The default value is 100.
      example: 100
      schema:
        type: integer
    - in: query
      name: relations
      required: false
      description: Add the related data to each row
      schema:
        type: boolean
        default: false
    - in: query
      name: fields
      required: false
      description: Comma-separated list of the fields to get for each row. The
        response always has id and type. The names that are not fields are
        ignored.
      example: id,name
      schema:
        type: string
  responses:
    200:
      description: The list of milestone rows, or a page of rows if you give
        page
      content:
        application/json:
          schema:
            oneOf:
              - type: array
                items:
                  type: object
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                    example: []
                  total:
                    type: integer
                    example: 100
                  nb_pages:
                    type: integer
                    example: 2
                  limit:
                    type: integer
                    example: 50
                  offset:
                    type: integer
                    example: 0
                  page:
                    type: integer
                    example: 1
    400:
      description: A filter is not valid
    403:
      description: You are not an administrator

MilestonesResource_post:
  summary: Create a milestone
  tags:
    - Crud
  description: Create a milestone. Send the fields of the new row in JSON. You
    must be an administrator, or a manager in the team of the project.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
            - project_id
            - date
          properties:
            name:
              type: string
              example: Milestone Name
            project_id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            date:
              type: string
              format: date
              example: '2024-03-31'
  responses:
    201:
      description: The new milestone
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: Milestone Name
              project_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              date:
                type: string
                format: date
                example: '2024-03-31'
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
    400:
      description: The body is not valid, or a field breaks a database
        constraint
    403:
      description: You are not an administrator or a manager in the
        team of the project
