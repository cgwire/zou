Get time spents
---
tags:
  - Crud
description: Retrieve all time spent records. Supports filtering
  via query parameters and pagination. Supports date range
  filtering with start_date and end_date.
parameters:
  - in: query
    name: page
    required: false
    schema:
      type: integer
    example: 1
    description: Page number for pagination
  - in: query
    name: limit
    required: false
    schema:
      type: integer
    example: 50
    description: Number of results per page
  - in: query
    name: relations
    required: false
    schema:
      type: boolean
    default: false
    example: false
    description: Whether to include relations
  - in: query
    name: start_date
    required: false
    schema:
      type: string
      format: date
    example: "2024-01-01"
    description: Start date for date range filter
  - in: query
    name: end_date
    required: false
    schema:
      type: string
      format: date
    example: "2024-01-31"
    description: End date for date range filter
responses:
    200:
      description: Time spent records retrieved successfully
      content:
        application/json:
          schema:
            oneOf:
              - type: array
                items:
                  type: object
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                    example: []
                  total:
                    type: integer
                    example: 100
                  nb_pages:
                    type: integer
                    example: 2
                  limit:
                    type: integer
                    example: 50
                  offset:
                    type: integer
                    example: 0
                  page:
                    type: integer
                    example: 1
    400:
      description: Invalid filter format or query error
