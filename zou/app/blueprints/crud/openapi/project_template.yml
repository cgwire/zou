ProjectTemplateResource_delete:
  summary: Delete a project template
  tags:
    - Crud
  description: Delete a project template. The projects made from this template
    do not change. You must be an administrator.
  responses:
    204:
      description: The project template is deleted
    403:
      description: You are not an administrator
    404:
      description: The project template does not exist
  parameters:
    - in: path
      name: instance_id
      required: true
      description: Unique identifier of the project template
      example: a24a6ea4-ce75-4665-a070-57453082c250
      schema:
        type: string
        format: uuid

ProjectTemplateResource_get:
  summary: Get a project template
  tags:
    - Crud
  description: Get a project template. You must be a manager or an
    administrator.
  responses:
    200:
      description: The project template
    400:
      description: The identifier is not a valid UUID
    403:
      description: You are not a manager or an administrator
    404:
      description: The project template does not exist
  parameters:
    - in: path
      name: instance_id
      required: true
      description: Unique identifier of the project template
      example: a24a6ea4-ce75-4665-a070-57453082c250
      schema:
        type: string
        format: uuid

ProjectTemplateResource_put:
  summary: Update a project template
  tags:
    - Crud
  description: Update the name, the description or the production settings of
    a project template. You must be an administrator.
  responses:
    200:
      description: The updated project template
    400:
      description: A value is not valid
    403:
      description: You are not an administrator
    404:
      description: The project template does not exist
  parameters:
    - in: path
      name: instance_id
      required: true
      description: Unique identifier of the project template
      example: a24a6ea4-ce75-4665-a070-57453082c250
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
            description:
              type: string
            fps:
              type: string
            ratio:
              type: string
            resolution:
              type: string
            production_type:
              type: string
            production_style:
              type: string

ProjectTemplatesResource_get:
  summary: Get project template rows
  tags:
    - Crud
  description: Get the project template rows. You must be a manager or an
    administrator. Add a query parameter for each column to filter on, for
    example name=Modeling. The name filter does not make a difference between
    upper case and lower case. To get the rows that have one value of a list,
    give the list in JSON, for example task_status_id=["<id1>","<id2>"].
  responses:
    200:
      description: The list of project template rows, or a page of rows if you
        give page
    400:
      description: A filter is not valid
    403:
      description: You are not a manager or an administrator
  parameters:
    - in: query
      name: page
      required: false
      description: Page to get. Without this parameter, the response has all
        the rows.
      example: 1
      schema:
        type: integer
    - in: query
      name: limit
      required: false
      description: Number of rows in a page. The default value is 100.
      example: 100
      schema:
        type: integer
    - in: query
      name: relations
      required: false
      description: Add the related data to each row
      schema:
        type: boolean
        default: false
    - in: query
      name: fields
      required: false
      description: Comma-separated list of the fields to get for each row. The
        response always has id and type. The names that are not fields are
        ignored.
      example: id,name
      schema:
        type: string

ProjectTemplatesResource_post:
  summary: Create a project template
  tags:
    - Crud
  description: Create an empty project template. Give a name and the
    production settings of the template. You must be an administrator.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
          properties:
            name:
              type: string
            description:
              type: string
            fps:
              type: string
            ratio:
              type: string
            resolution:
              type: string
            production_type:
              type: string
            production_style:
              type: string
  responses:
    201:
      description: The new project template
    400:
      description: The name is missing, a bitrate is not valid, or the name is
        already used
    403:
      description: You are not an administrator
