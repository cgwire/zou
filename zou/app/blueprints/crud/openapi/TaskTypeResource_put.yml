Update a task type
---
tags:
  - Crud
description: Update the fields of a task type. Send only the fields to change.
  You cannot change id, created_at, updated_at. Dates use the ISO 8601 format.
  A new name must be unique. The check does not make a difference between
  upper case and lower case. You must be an administrator.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the task type
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            example: Updated Animation
          color:
            type: string
            example: '#FF5734'
responses:
  200:
    description: The updated task type
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              example: Updated Animation
            for_entity:
              type: string
              example: Shot
            color:
              type: string
              example: '#FF5734'
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T11:00:00Z'
  400:
    description: The body is not valid, a date is not valid, or a field
      breaks a database constraint
  403:
    description: You are not an administrator
  404:
    description: The task type does not exist
