Update task type
---
tags:
  - Crud
description: Update a task type with data provided in the
  request body. JSON format is expected. Task type names must
  be unique.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c25
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            example: Updated Animation
          color:
            type: string
            example: "#FF5734"
responses:
    200:
      description: Task type updated successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c25
              name:
                type: string
                example: Updated Animation
              for_entity:
                type: string
                example: Shot
              color:
                type: string
                example: "#FF5734"
              created_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                example: "2024-01-15T11:00:00Z"
    400:
      description: Invalid data format or task type name already exists
