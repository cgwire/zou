Create notification
---
tags:
  - Crud
description: Create a new notification with data provided in the
  request body. JSON format is expected.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - person_id
          - comment_id
        properties:
          person_id:
            type: string
            format: uuid
            example: a24a6ea4-ce75-4665-a070-57453082c250
          comment_id:
            type: string
            format: uuid
            example: b24a6ea4-ce75-4665-a070-57453082c250
          read:
            type: boolean
            default: false
            example: false
responses:
    201:
      description: Notification created successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              person_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              comment_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
              read:
                type: boolean
                example: false
              created_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
    400:
      description: Invalid data format or validation error
