Create a project template
---
tags:
  - Crud
description: Create an empty project template. Give a name and the
  production settings of the template. You must be an administrator.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
        properties:
          name:
            type: string
          description:
            type: string
          fps:
            type: string
          ratio:
            type: string
          resolution:
            type: string
          production_type:
            type: string
          production_style:
            type: string
responses:
  201:
    description: The new project template
  400:
    description: The name is missing, a bitrate is not valid, or the name is
      already used
  403:
    description: You are not an administrator
