Update a production schedule version task link
---
tags:
  - Crud
description: Update the fields of a production schedule version task link.
  Send only the fields to change. You cannot change id, created_at,
  updated_at. Dates use the ISO 8601 format.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the production schedule version task
      link
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties: {}
responses:
  200:
    description: The updated production schedule version task link
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            production_schedule_version_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            task_id:
              type: string
              format: uuid
              example: c24a6ea4-ce75-4665-a070-57453082c250
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T11:00:00Z'
  400:
    description: The body is not valid, a date is not valid, or a field
      breaks a database constraint
  403:
    description: You cannot update this production schedule version task
      link
  404:
    description: The production schedule version task link does not exist
