Update salary scale
---
tags:
  - Crud
description: Update a salary scale with data provided in the
  request body. JSON format is expected. Department ID cannot
  be changed.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c25
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          rate:
            type: number
            example: 55.0
responses:
    200:
      description: Salary scale updated successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c25
              department_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c25
              position:
                type: string
                example: artist
              seniority:
                type: string
                example: junior
              rate:
                type: number
                example: 55.0
              created_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                example: "2024-01-15T11:00:00Z"
    400:
      description: Invalid data format or validation error
