Reorder project task type links
---
tags:
  - Crud
description: Set the priority of the project's task type links from
  the given ordered id list in a single request, replacing one link
  request per task type.
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - task_type_ids
        properties:
          task_type_ids:
            type: array
            items:
              type: string
              format: uuid
responses:
    200:
      description: Updated task type links
