Reorder the task types of a project
---
tags:
  - Crud
description: Set the priority of the task types of a project in one request.
  The order of the list gives the priority. You must be a manager of the
  project.
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the project
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - task_type_ids
        properties:
          task_type_ids:
            type: array
            items:
              type: string
              format: uuid
            description: Task types of the project in the new order
responses:
  200:
    description: The updated links
  400:
    description: The body does not have a valid task_type_ids list
  403:
    description: You are not a manager of the project
