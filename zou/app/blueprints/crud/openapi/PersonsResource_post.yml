Create a person
---
tags:
  - Crud
description: Create a person. Send the fields of the new row in JSON. You
  must be an administrator. You cannot create an active person who is not a
  bot when the user limit is reached. The route checks role, contract_type,
  country, locale, display_date_format, two_factor_authentication and
  expiration_date. The expiration date cannot be in the past. The email must
  be valid. Only one person who is not a bot can use an email. The route
  ignores the preview account fields. For a bot, the response also gives its
  access_token.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - first_name
          - last_name
          - email
        properties:
          first_name:
            type: string
            example: John
          last_name:
            type: string
            example: Doe
          email:
            type: string
            format: email
            example: john.doe@example.com
          password:
            type: string
            example: securepassword123
          role:
            type: string
            example: user
          active:
            type: boolean
            default: true
            example: true
          contract_type:
            type: string
            example: permanent
          expiration_date:
            type: string
            format: date
            example: '2025-12-31'
          is_bot:
            type: boolean
            default: false
            example: false
          country:
            type: string
            description: ISO 3166-1 alpha-2 country code (nullable)
            example: FR
responses:
  201:
    description: The new person
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            first_name:
              type: string
              example: John
            last_name:
              type: string
              example: Doe
            email:
              type: string
              format: email
              example: john.doe@example.com
            role:
              type: string
              example: user
            active:
              type: boolean
              example: true
            contract_type:
              type: string
              example: permanent
            two_factor_authentication:
              type: string
              example: none
            country:
              type: string
              description: ISO 3166-1 alpha-2 country code (nullable)
              example: FR
            access_token:
              type: string
              example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
  400:
    description: The body is not valid, or a field breaks a database
      constraint
  403:
    description: You are not an administrator
