Create person
---
tags:
  - Crud
description: Create a new person with data provided in the
  request body. JSON format is expected. Requires admin
  permissions. Validates role, contract_type, two_factor_authentication,
  email, and expiration_date. Checks user limit for active non-bot users.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - first_name
          - last_name
          - email
        properties:
          first_name:
            type: string
            example: John
          last_name:
            type: string
            example: Doe
          email:
            type: string
            format: email
            example: john.doe@example.com
          password:
            type: string
            example: securepassword123
          role:
            type: string
            example: user
          active:
            type: boolean
            default: true
            example: true
          contract_type:
            type: string
            example: permanent
          two_factor_authentication:
            type: string
            example: none
          expiration_date:
            type: string
            format: date
            example: "2025-12-31"
          is_bot:
            type: boolean
            default: false
            example: false
          country:
            type: string
            description: ISO 3166-1 alpha-2 country code (nullable)
            example: FR
responses:
    201:
      description: Person created successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c25
              first_name:
                type: string
                example: John
              last_name:
                type: string
                example: Doe
              email:
                type: string
                format: email
                example: john.doe@example.com
              role:
                type: string
                example: user
              active:
                type: boolean
                example: true
              contract_type:
                type: string
                example: permanent
              two_factor_authentication:
                type: string
                example: none
              country:
                type: string
                description: ISO 3166-1 alpha-2 country code (nullable)
                example: FR
              access_token:
                type: string
                example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9
              created_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
    400:
      description: Invalid data format or validation error or user limit reached
