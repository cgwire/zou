Update a preview file
---
tags:
  - Crud
description: Update the fields of a preview file. Send only the fields to
  change. You must be in the team of the project of its task, or an
  administrator. If you are not a manager, the task must be assigned to you,
  or you must be a supervisor of the task type. You cannot change id,
  created_at, updated_at. For a main preview (position 1), the new revision
  must be unique for the task. The extra previews of the same revision get
  the new revision too. Dates use the ISO 8601 format.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the preview file
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            example: updated_preview_file_v001
          revision:
            type: integer
            example: 2
responses:
  200:
    description: The updated preview file
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              example: updated_preview_file_v001
            task_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            revision:
              type: integer
              example: 2
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T11:00:00Z'
  400:
    description: The body is not valid, a date is not valid, or a field
      breaks a database constraint
  403:
    description: You are not in the team of the project, or you are not a
      manager, the task is not assigned to you and you are not a supervisor
      of the task type
  404:
    description: The preview file does not exist
