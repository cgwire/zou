Get entity link
---
tags:
  - Crud
description: Retrieve an entity link by its ID and return it as a
  JSON object. Supports including relations.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c25
  - in: query
    name: relations
    required: false
    schema:
      type: boolean
    default: true
    example: true
    description: Whether to include relations
responses:
    200:
      description: Entity link retrieved successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c25
              entity_in_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c25
              entity_out_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c25
              nb_occurences:
                type: integer
                example: 1
              label:
                type: string
                example: fixed
              created_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
    400:
      description: Invalid ID format or query error
