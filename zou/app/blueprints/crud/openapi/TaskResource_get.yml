Get a task
---
tags:
  - Crud
description: Get a task. You must be an administrator or a member of the
  project team. A vendor must also have a task assigned on the entity of the
  task. A client gets the studio fields blank, for example assignees,
  duration, estimation and dates.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the task
  - in: query
    name: relations
    required: false
    schema:
      type: boolean
      default: true
    example: true
    description: Add the related data. The default value is true.
responses:
  200:
    description: The task
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            task_type_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            entity_id:
              type: string
              format: uuid
              example: c24a6ea4-ce75-4665-a070-57453082c250
            project_id:
              type: string
              format: uuid
              example: d24a6ea4-ce75-4665-a070-57453082c250
            task_status_id:
              type: string
              format: uuid
              example: e24a6ea4-ce75-4665-a070-57453082c250
            assignees:
              type: array
              items:
                type: string
                format: uuid
              example: [f24a6ea4-ce75-4665-a070-57453082c250]
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
  400:
    description: The identifier is not a valid UUID
  403:
    description: You are not in the project team, or you are a vendor without
      a task on this entity
  404:
    description: The task does not exist
