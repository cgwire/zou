Create news
---
tags:
  - Crud
description: Create a new news entry with data provided in the
  request body. JSON format is expected.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - title
          - project_id
        properties:
          title:
            type: string
            example: Project Update
          project_id:
            type: string
            format: uuid
            example: a24a6ea4-ce75-4665-a070-57453082c25
          content:
            type: string
            example: News content text
responses:
    201:
      description: News entry created successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c25
              title:
                type: string
                example: Project Update
              project_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c25
              content:
                type: string
                example: News content text
              created_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
    400:
      description: Invalid data format or validation error
