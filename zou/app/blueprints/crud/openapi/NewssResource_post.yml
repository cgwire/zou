Create a news
---
tags:
  - Crud
description: Create a news. Send the fields of the new row in JSON. You must
  be an administrator.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          change:
            type: boolean
            description: True if the comment changes the task status
          author_id:
            type: string
            format: uuid
            description: Author of the comment
            example: a24a6ea4-ce75-4665-a070-57453082c250
          task_id:
            type: string
            format: uuid
            description: Task of the comment
            example: a24a6ea4-ce75-4665-a070-57453082c250
          comment_id:
            type: string
            format: uuid
            description: Comment of the news
            example: a24a6ea4-ce75-4665-a070-57453082c250
          preview_file_id:
            type: string
            format: uuid
            description: Preview of the comment
            example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  201:
    description: The new news
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            title:
              type: string
              example: Project Update
            project_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            content:
              type: string
              example: News content text
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
  400:
    description: The body is not valid, or a field breaks a database
      constraint
  403:
    description: You cannot create a news
