Delete a time spent
---
tags:
  - Crud
description: Delete a time spent. The task duration becomes the sum of its
  time spents. The person of the time spent must be an assignee of the task.
  Then you must be this person, an administrator or a manager of the project.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the time spent
responses:
  204:
    description: The time spent is deleted
  400:
    description: Other data uses this row
  403:
    description: The person is not an assignee of the task, or you are not
      this person, an administrator or a manager of the project
  404:
    description: The time spent does not exist
