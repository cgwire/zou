Delete a file status
---
tags:
  - Crud
description: Delete a file status. You must be an administrator.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the file status
responses:
  204:
    description: The file status is deleted
  400:
    description: Other data uses this row
  403:
    description: You cannot delete this file status
  404:
    description: The file status does not exist
