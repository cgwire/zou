Get production schedule versions
---
tags:
  - Crud
description: Retrieve all production schedule versions. Supports
  filtering via query parameters and pagination. Vendor and
  client access is blocked. Requires project access or admin
  permissions.
parameters:
  - in: query
    name: page
    required: false
    schema:
      type: integer
    example: 1
    description: Page number for pagination
  - in: query
    name: limit
    required: false
    schema:
      type: integer
    example: 50
    description: Number of results per page
  - in: query
    name: relations
    required: false
    schema:
      type: boolean
    default: false
    example: false
    description: Whether to include relations
  - in: query
    name: project_id
    required: false
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Filter by project ID
responses:
    200:
      description: Production schedule versions retrieved successfully
      content:
        application/json:
          schema:
            oneOf:
              - type: array
                items:
                  type: object
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                    example: []
                  total:
                    type: integer
                    example: 100
                  nb_pages:
                    type: integer
                    example: 2
                  limit:
                    type: integer
                    example: 50
                  offset:
                    type: integer
                    example: 0
                  page:
                    type: integer
                    example: 1
    400:
      description: Invalid filter format or query error
