Get an output file
---
tags:
  - Crud
description: Get an output file. You must be in the team of the project of
  its entity. A vendor must also be assigned to a task of the entity.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the output file
responses:
  200:
    description: The output file
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              example: output_file_v001
            entity_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
  400:
    description: The identifier is not valid
  403:
    description: You are not in the team of the project, or you
      are a vendor with no task on the entity
  404:
    description: The output file does not exist
