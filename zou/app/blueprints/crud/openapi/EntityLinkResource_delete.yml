Delete an entity link
---
tags:
  - Crud
description: Delete an entity link. You must be an administrator.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the entity link
responses:
  204:
    description: The entity link is deleted
  400:
    description: Other data uses this row
  403:
    description: You are not an administrator
  404:
    description: The entity link does not exist
