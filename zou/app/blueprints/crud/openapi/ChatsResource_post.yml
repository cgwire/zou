Create a chat
---
tags:
  - Crud
description: Create a chat. Send the fields of the new row in JSON. You must
  be an administrator.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - object_id
          - object_type
        properties:
          object_id:
            type: string
            format: uuid
            description: Entity of the chat
            example: a24a6ea4-ce75-4665-a070-57453082c250
          object_type:
            type: string
            description: Type of the entity of the chat
responses:
  201:
    description: The new chat
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            object_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            object_type:
              type: string
              example: Asset
            name:
              type: string
              example: Chat Name
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
  400:
    description: The body is not valid, or a field breaks a database
      constraint
  403:
    description: You cannot create a chat
