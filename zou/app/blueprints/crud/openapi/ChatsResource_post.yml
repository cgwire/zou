Create chat
---
tags:
  - Crud
description: Create a new chat with data provided in the request
  body. JSON format is expected.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - object_id
          - object_type
        properties:
          object_id:
            type: string
            format: uuid
            example: a24a6ea4-ce75-4665-a070-57453082c25
          object_type:
            type: string
            example: Asset
          name:
            type: string
            example: Chat Name
responses:
    201:
      description: Chat created successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c25
              object_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c25
              object_type:
                type: string
                example: Asset
              name:
                type: string
                example: Chat Name
              created_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
    400:
      description: Invalid data format or validation error
