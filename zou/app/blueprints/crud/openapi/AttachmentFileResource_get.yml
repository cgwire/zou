Get an attachment file
---
tags:
  - Crud
description: Get an attachment file. For the file of a comment, you must
  have access to the project of its task. A vendor must also have a task on
  the entity. For the file of a chat message, you must have access to the
  project of the entity. A client cannot read it, and a vendor must have a
  task on the entity. You cannot read a file that has no comment and no chat
  message, even as an administrator.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the attachment file
  - in: query
    name: relations
    required: false
    schema:
      type: boolean
      default: true
    example: true
    description: Add the related data. The default value is true.
responses:
  200:
    description: The attachment file
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              example: attachment.pdf
            comment_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
  400:
    description: The identifier is not a valid UUID
  403:
    description: You do not have access to the task or the chat of the file,
      or the file has no comment and no chat message
  404:
    description: The attachment file does not exist
