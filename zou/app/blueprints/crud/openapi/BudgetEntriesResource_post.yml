Create a budget entry
---
tags:
  - Crud
description: Create a budget entry. Send the fields of the new row in JSON.
  You must be an administrator.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - budget_id
        properties:
          budget_id:
            type: string
            format: uuid
            example: a24a6ea4-ce75-4665-a070-57453082c250
          daily_salary:
            type: number
            description: Daily salary of the entry
responses:
  201:
    description: The new budget entry
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            budget_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            amount:
              type: number
              example: 1000.0
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
  400:
    description: The body is not valid, or a field breaks a database
      constraint
  403:
    description: You cannot create a budget entry
