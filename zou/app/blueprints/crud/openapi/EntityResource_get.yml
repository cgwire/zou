Get an entity
---
tags:
  - Crud
description: Get an entity. You must have access to its project. A vendor
  must also have a task on the entity. The response has a type field, for
  example Asset or Shot.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the entity
  - in: query
    name: relations
    required: false
    schema:
      type: boolean
      default: true
    example: true
    description: Add the related data. The default value is true.
responses:
  200:
    description: The entity
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              example: SH010
            project_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            entity_type_id:
              type: string
              format: uuid
              example: c24a6ea4-ce75-4665-a070-57453082c250
            status:
              type: string
              example: running
            data:
              type: object
              example: {frame_in: 1001, frame_out: 1120}
            type:
              type: string
              example: shot
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
  400:
    description: The identifier is not a valid UUID
  403:
    description: You do not have access to the project, or you are a vendor
      without a task on the entity
  404:
    description: The entity does not exist
