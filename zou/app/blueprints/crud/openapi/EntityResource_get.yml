Get entity
---
tags:
  - Crud
description: Retrieve an entity by its ID and return it as a JSON
  object. Supports including relations. Requires project access.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: query
    name: relations
    required: false
    schema:
      type: boolean
    default: true
    example: true
    description: Whether to include relations
responses:
    200:
      description: Entity retrieved successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: SH010
              project_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              entity_type_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
              status:
                type: string
                example: running
              data:
                type: object
                example: {"frame_in": 1001, "frame_out": 1120}
              type:
                type: string
                example: shot
              created_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
    400:
      description: Invalid ID format or query error
