Get a day off
---
tags:
  - Crud
description: Get a day off.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the day off
  - in: query
    name: relations
    required: false
    schema:
      type: boolean
      default: true
    example: true
    description: Add the related data. The default value is true.
responses:
  200:
    description: The day off
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            date:
              type: string
              format: date
              example: '2024-01-15'
            end_date:
              type: string
              format: date
              example: '2024-01-20'
            person_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
  400:
    description: The identifier is not a valid UUID
  403:
    description: You cannot read this day off
  404:
    description: The day off does not exist
