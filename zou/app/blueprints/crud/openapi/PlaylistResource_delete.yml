Delete a playlist
---
tags:
  - Crud
description: Delete a playlist. Its notifications, build jobs, movie files
  and share links are deleted too. You must be an administrator, or a
  manager in the team of the project. A supervisor in the team can also do
  it on the playlists they created and on the playlists with no creator.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the playlist
responses:
  204:
    description: The playlist is deleted
  400:
    description: Other data uses this row
  403:
    description: You are not a manager in the team of the project, or a
      supervisor in the team who created the playlist
  404:
    description: The playlist does not exist
