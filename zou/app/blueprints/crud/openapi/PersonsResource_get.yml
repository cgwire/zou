Get person rows
---
tags:
  - Crud
description: Get the person rows. All users can call this route. Preview
  accounts are not in the list. An administrator gets all the fields but the
  password and the two-factor secrets. With with_pass_hash=true, an
  administrator also gets the password hash. A client gets only the people
  of the teams of their open projects, with a short set of fields. The other
  users get a minimal set of fields. Add a query parameter for each column
  to filter on, for example first_name=John. An administrator can filter on
  all the columns but the sensitive ones. The other users can filter only on
  the fields they get. A user who is not a client can also filter on email.
  To get the rows that have one value of a list, give the list in JSON.
parameters:
  - in: query
    name: with_pass_hash
    required: false
    schema:
      type: boolean
      default: false
    example: false
    description: Include password hash (admin only)
  - in: query
    name: page
    required: false
    description: Page to get. Without this parameter, the response has all
      the rows.
    example: 1
    schema:
      type: integer
  - in: query
    name: limit
    required: false
    description: Number of rows in a page. The default value is 100.
    example: 100
    schema:
      type: integer
  - in: query
    name: relations
    required: false
    description: Add the related data to each row
    schema:
      type: boolean
      default: false
  - in: query
    name: fields
    required: false
    description: Comma-separated list of the fields to get for each row. The
      response always has id and type. The names that are not fields are
      ignored.
    example: id,name
    schema:
      type: string
responses:
  200:
    description: The list of person rows, or a page of rows if you give page
    content:
      application/json:
        schema:
          oneOf:
            - type: array
              items:
                type: object
            - type: object
              properties:
                data:
                  type: array
                  items:
                    type: object
                  example: []
                total:
                  type: integer
                  example: 100
                nb_pages:
                  type: integer
                  example: 2
                limit:
                  type: integer
                  example: 50
                offset:
                  type: integer
                  example: 0
                page:
                  type: integer
                  example: 1
  400:
    description: A filter is not valid
  403:
    description: You cannot read these rows
