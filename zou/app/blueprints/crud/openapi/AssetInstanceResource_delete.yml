Delete a asset instance
---
tags:
  - Crud
description: Delete a asset instance. You must be an administrator.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the asset instance
responses:
  204:
    description: The asset instance is deleted
  400:
    description: Other data uses this row
  403:
    description: You cannot delete this asset instance
  404:
    description: The asset instance does not exist
