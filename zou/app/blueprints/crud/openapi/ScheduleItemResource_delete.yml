Delete a schedule item
---
tags:
  - Crud
description: Delete a schedule item. You must be an administrator or a manager
  of the project.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the schedule item
responses:
  204:
    description: The schedule item is deleted
  400:
    description: Other data uses this row
  403:
    description: You are not a manager of the project
  404:
    description: The schedule item does not exist
