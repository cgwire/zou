ProjectResource_delete:
  summary: Delete a project
  tags:
    - Crud
  description: Delete a project. Close the project first. Without force, the
    project is deleted only if no other data uses it. With force=true, all the
    data of the project is deleted. You must be an administrator.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the project
    - in: query
      name: force
      required: false
      schema:
        type: boolean
        default: false
      example: false
      description: Delete all the data of the project
  responses:
    204:
      description: The project is deleted
    400:
      description: The project is open
    403:
      description: You are not an administrator
    404:
      description: The project does not exist
    500:
      description: Other data uses the project and force is false

ProjectResource_get:
  summary: Get a project
  tags:
    - Crud
  description: Get a project. You must be in the team of the project, or an
    administrator. The response gives project_status_name. With relations (the
    default), it also gives the metadata descriptors, the task type priorities
    and the task status links. A client gets only the descriptors shared with
    clients. A vendor gets only the descriptors of their departments.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the project
    - in: query
      name: relations
      required: false
      schema:
        type: boolean
        default: true
      example: true
      description: Add the related data. The default value is true.
  responses:
    200:
      description: The project
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: Project Name
              production_type:
                type: string
                example: feature
              production_style:
                type: string
                example: 2d3d
              project_status_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              project_status_name:
                type: string
                example: Open
              descriptors:
                type: array
                items:
                  type: object
                description: Metadata descriptors of the project, narrowed to
                  the ones published to a client or to the departments of a
                  vendor
              task_types_priority:
                type: object
                description: Priority of each task type, by id
              task_statuses_link:
                type: object
                description: Priority and board roles of each task status, by
                  id
              first_episode_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
    400:
      description: The identifier is not a valid UUID
    403:
      description: You are not in the team of the project
    404:
      description: The project does not exist

ProjectResource_put:
  summary: Update a project
  tags:
    - Crud
  description: Update the fields of a project. Send only the fields to change.
    You must be a manager in the team of the project, or an administrator. You
    cannot change id, created_at, updated_at and team. Use the team routes to
    change the team. The route checks production_style, resolution and the
    movie bitrates. A null production_style gives 2d3d. You can send
    preview_background_files, a list of preview background file identifiers.
    default_preview_background_file_id must be in the preview background files
    of the project. A tvshow project gets a first episode if it has none.
    Dates use the ISO 8601 format.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the project
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
              example: Updated Project Name
            production_style:
              type: string
              example: 2d
            default_preview_background_file_id:
              type: string
              format: uuid
              description: Default preview background file of the project
              example: a24a6ea4-ce75-4665-a070-57453082c250
            preview_background_files:
              type: array
              items:
                type: string
                format: uuid
              description: Preview background files of the project
  responses:
    200:
      description: The updated project
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: Updated Project Name
              production_type:
                type: string
                example: feature
              production_style:
                type: string
                example: 2d
              project_status_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              first_episode_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T11:00:00Z'
    400:
      description: The body is not valid, a date is not valid, a field
        breaks a database constraint, or a preview background file is not
        one of the preview background files of the project
    403:
      description: You are not a manager in the team of the project
    404:
      description: The project does not exist

ProjectTaskStatusLinksReorderResource_post:
  summary: Reorder the task statuses of a project
  tags:
    - Crud
  description: Set the priority of the task statuses of a project in one
    request. The order of the list gives the priority. The board roles of each
    link do not change. The identifiers that are not task statuses of the
    project are skipped. The response has only the updated links. You must be
    a manager of the project.
  parameters:
    - in: path
      name: project_id
      required: true
      schema:
        type: string
        format: uuid
      description: Unique identifier of the project
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - task_status_ids
          properties:
            task_status_ids:
              type: array
              items:
                type: string
                format: uuid
              description: Task statuses of the project in the new order
  responses:
    200:
      description: The updated links
    400:
      description: The body does not have a valid task_status_ids list
    403:
      description: You are not a manager of the project
    404:
      description: The project does not exist

ProjectTaskStatusLinksResource_post:
  summary: Add a task status to a project
  tags:
    - Crud
  description: Add a task status to a project, with its priority and the roles
    that see it on the board. If the task status is already in the project,
    the route replaces its priority and its board roles. You must be a manager
    of the project.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - project_id
            - task_status_id
          properties:
            project_id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            task_status_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            priority:
              type: integer
              default: 1
              example: 1
              description: Priority of the task status in the project
            roles_for_board:
              type: array
              items:
                type: string
              example: [admin, manager]
              description: Roles allowed to see this status on the board
  responses:
    201:
      description: The new link
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
              project_id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              task_status_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              priority:
                type: integer
                example: 1
              roles_for_board:
                type: array
                items:
                  type: string
                example: [admin, manager]
    400:
      description: The project or the task status is missing
    403:
      description: You are not a manager of the project
    404:
      description: The project does not exist

