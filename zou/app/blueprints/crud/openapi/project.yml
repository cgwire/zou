      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
              project_id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              task_type_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
