                type: integer
                example: 1
    400:
      description: project_id or task_type_id is missing or not a valid UUID
    403:
      description: You are not a manager of the project
    404:
      description: The project does not exist

ProjectsResource_get:
  summary: Get project rows
  tags:
    - Crud
  description: Get the project rows. All users can call this route. An
    administrator gets all the projects. The other users get only the open
    projects of their teams. Add a query parameter for each column to filter
    on, for example name=Modeling. The name filter does not make a difference
    between upper case and lower case. To get the rows that have one value of
    a list, give the list in JSON, for example
    task_status_id=["<id1>","<id2>"].
  parameters:
    - in: query
      name: page
      required: false
      description: Page to get. Without this parameter, the response has all
        the rows.
      example: 1
      schema:
        type: integer
    - in: query
      name: limit
      required: false
      description: Number of rows in a page. The default value is 100.
      example: 100
      schema:
        type: integer
    - in: query
      name: relations
      required: false
      description: Add the related data to each row
      schema:
        type: boolean
        default: false
    - in: query
      name: fields
      required: false
      description: Comma-separated list of the fields to get for each row. The
        response always has id and type. The names that are not fields are
        ignored.
      example: id,name
      schema:
        type: string
  responses:
    200:
      description: The list of project rows, or a page of rows if you give
        page
      content:
        application/json:
          schema:
            oneOf:
              - type: array
                items:
                  type: object
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                    example: []
                  total:
                    type: integer
                    example: 100
                  nb_pages:
                    type: integer
                    example: 2
                  limit:
                    type: integer
                    example: 50
                  offset:
                    type: integer
                    example: 0
                  page:
                    type: integer
                    example: 1
    400:
      description: A filter is not valid

ProjectsResource_post:
  summary: Create a project
  tags:
    - Crud
  description: Create a project. Send the fields of the new row in JSON. You
    must be an administrator. A null production_style gives 2d3d. The route
    checks production_style, resolution and the movie bitrates. With
    project_template_id, the route applies the template. The fields you send
    override the template values. Without project_status_id, the project gets
    the open status. default_preview_background_file_id must be in
    preview_background_files. A tvshow project gets a first episode E01. The
    project gets a copy of the metadata descriptors set for all projects.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
          properties:
            name:
              type: string
              example: Project Name
            production_type:
              type: string
              example: feature
            production_style:
              type: string
              default: 2d3d
              example: 2d3d
            project_status_id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
  responses:
    201:
      description: The new project
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: Project Name
              production_type:
                type: string
                example: feature
              production_style:
                type: string
                example: 2d3d
              project_status_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              first_episode_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
    400:
      description: The body is not valid, or a field breaks a database
        constraint
    403:
      description: You are not an administrator
