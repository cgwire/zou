PreviewBackgroundFileResource_delete:
  summary: Delete a preview background file
  tags:
    - Crud
  description: Delete a preview background file. Its stored files are deleted
    too. You must be an administrator.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the preview background file
  responses:
    204:
      description: The preview background file is deleted
    400:
      description: Other data uses this row
    403:
      description: You are not an administrator
    404:
      description: The preview background file does not exist

PreviewBackgroundFileResource_get:
  summary: Get a preview background file
  tags:
    - Crud
  description: Get a preview background file. All users can read preview
    background files.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the preview background file
    - in: query
      name: relations
      required: false
      schema:
        type: boolean
        default: true
      example: true
      description: Add the related data. The default value is true.
  responses:
    200:
      description: The preview background file
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: background_file_name
              is_default:
                type: boolean
                example: false
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
    400:
      description: The identifier is not a valid UUID
    404:
      description: The preview background file does not exist

PreviewBackgroundFileResource_put:
  summary: Update a preview background file
  tags:
    - Crud
  description: Update the fields of a preview background file. Send only the
    fields to change. You must be an administrator. You cannot change id,
    created_at, updated_at. The name must be unique. If is_default is true,
    the other files stop being the default. Dates use the ISO 8601 format.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the preview background file
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
              example: updated_background_file_name
            is_default:
              type: boolean
              example: true
  responses:
    200:
      description: The updated preview background file
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: updated_background_file_name
              is_default:
                type: boolean
                example: true
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T11:00:00Z'
    400:
      description: The body is not valid, a date is not valid, or a field
        breaks a database constraint
    403:
      description: You are not an administrator
    404:
      description: The preview background file does not exist

PreviewBackgroundFilesResource_get:
  summary: Get preview background file rows
  tags:
    - Crud
  description: Get the preview background file rows. All users can call this
    route. Add a query parameter for each column to filter on, for example
    name=Modeling. The name filter does not make a difference between upper
    case and lower case. To get the rows that have one value of a list, give
    the list in JSON, for example task_status_id=["<id1>","<id2>"].
  parameters:
    - in: query
      name: page
      required: false
      description: Page to get. Without this parameter, the response has all
        the rows.
      example: 1
      schema:
        type: integer
    - in: query
      name: limit
      required: false
      description: Number of rows in a page. The default value is 100.
      example: 100
      schema:
        type: integer
    - in: query
      name: relations
      required: false
      description: Add the related data to each row
      schema:
        type: boolean
        default: false
    - in: query
      name: fields
      required: false
      description: Comma-separated list of the fields to get for each row. The
        response always has id and type. The names that are not fields are
        ignored.
      example: id,name
      schema:
        type: string
  responses:
    200:
      description: The list of preview background file rows, or a page of rows
        if you give page
      content:
        application/json:
          schema:
            oneOf:
              - type: array
                items:
                  type: object
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                    example: []
                  total:
                    type: integer
                    example: 100
                  nb_pages:
                    type: integer
                    example: 2
                  limit:
                    type: integer
                    example: 50
                  offset:
                    type: integer
                    example: 0
                  page:
                    type: integer
                    example: 1
    400:
      description: A filter is not valid

PreviewBackgroundFilesResource_post:
  summary: Create a preview background file
  tags:
    - Crud
  description: Create a preview background file. Send the fields of the new
    row in JSON. You must be an administrator. The name must be unique. If
    is_default is true, the other files stop being the default.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
          properties:
            name:
              type: string
              example: background_file_name
            is_default:
              type: boolean
              default: false
              example: false
  responses:
    201:
      description: The new preview background file
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: background_file_name
              is_default:
                type: boolean
                example: false
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
    400:
      description: The body is not valid, or a field breaks a database
        constraint
    403:
      description: You are not an administrator
