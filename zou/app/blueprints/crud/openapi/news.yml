NewsResource_delete:
  summary: Delete a news
  tags:
    - Crud
  description: Delete a news. You must be an administrator.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the news
  responses:
    204:
      description: The news is deleted
    400:
      description: Other data uses this row
    403:
      description: You are not an administrator
    404:
      description: The news does not exist

NewsResource_get:
  summary: Get a news
  tags:
    - Crud
  description: Get a news. You must be an administrator.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the news
    - in: query
      name: relations
      required: false
      schema:
        type: boolean
        default: true
      example: true
      description: Add the related data. The default value is true.
  responses:
    200:
      description: The news
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              change:
                type: boolean
                example: false
              author_id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              task_id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              comment_id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              preview_file_id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
    400:
      description: The identifier is not a valid UUID
    403:
      description: You are not an administrator
    404:
      description: The news does not exist

NewsResource_put:
  summary: Update a news
  tags:
    - Crud
  description: Update the fields of a news. Send only the fields to change.
    You cannot change id, created_at, updated_at. Dates use the ISO 8601
    format. You must be an administrator.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the news
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            change:
              type: boolean
              description: True if the comment changes the task status
            author_id:
              type: string
              format: uuid
              description: Author of the comment
              example: a24a6ea4-ce75-4665-a070-57453082c250
            task_id:
              type: string
              format: uuid
              description: Task of the comment
              example: a24a6ea4-ce75-4665-a070-57453082c250
            comment_id:
              type: string
              format: uuid
              description: Comment of the news
              example: a24a6ea4-ce75-4665-a070-57453082c250
            preview_file_id:
              type: string
              format: uuid
              description: Preview of the comment
              example: a24a6ea4-ce75-4665-a070-57453082c250
  responses:
    200:
      description: The updated news
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              change:
                type: boolean
                example: false
              author_id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              task_id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              comment_id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              preview_file_id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T11:00:00Z'
    400:
      description: The body is not valid, a date is not valid, or a field
        breaks a database constraint
    403:
      description: You are not an administrator
    404:
      description: The news does not exist

NewssResource_get:
  summary: Get news rows
  tags:
    - Crud
  description: Get the news rows. Add a query parameter for each column to
    filter on, for example name=Modeling. The name filter does not make a
    difference between upper case and lower case. To get the rows that have
    one value of a list, give the list in JSON, for example
    task_status_id=["<id1>","<id2>"]. You must be an administrator.
  parameters:
    - in: query
      name: page
      required: false
      description: Page to get. Without this parameter, the response has all
        the rows.
      example: 1
      schema:
        type: integer
    - in: query
      name: limit
      required: false
      description: Number of rows in a page. The default value is 100.
      example: 100
      schema:
        type: integer
    - in: query
      name: relations
      required: false
      description: Add the related data to each row
      schema:
        type: boolean
        default: false
    - in: query
      name: fields
      required: false
      description: Comma-separated list of the fields to get for each row. The
        response always has id and type. The names that are not fields are
        ignored.
      example: id,name
      schema:
        type: string
  responses:
    200:
      description: The list of news rows, or a page of rows if you give page
      content:
        application/json:
          schema:
            oneOf:
              - type: array
                items:
                  type: object
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                    example: []
                  total:
                    type: integer
                    example: 100
                  nb_pages:
                    type: integer
                    example: 2
                  limit:
                    type: integer
                    example: 50
                  offset:
                    type: integer
                    example: 0
                  page:
                    type: integer
                    example: 1
    400:
      description: A filter is not valid
    403:
      description: You are not an administrator

NewssResource_post:
  summary: Create a news
  tags:
    - Crud
  description: Create a news. Send the fields of the new row in JSON. You must
    be an administrator.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - author_id
            - task_id
          properties:
            change:
              type: boolean
              description: True if the comment changes the task status
            author_id:
              type: string
              format: uuid
              description: Author of the comment
              example: a24a6ea4-ce75-4665-a070-57453082c250
            task_id:
              type: string
              format: uuid
              description: Task of the comment
              example: a24a6ea4-ce75-4665-a070-57453082c250
            comment_id:
              type: string
              format: uuid
              description: Comment of the news
              example: a24a6ea4-ce75-4665-a070-57453082c250
            preview_file_id:
              type: string
              format: uuid
              description: Preview of the comment
              example: a24a6ea4-ce75-4665-a070-57453082c250
  responses:
    201:
      description: The new news
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              change:
                type: boolean
                example: false
              author_id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              task_id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              comment_id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              preview_file_id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
    400:
      description: The body is not valid, or a field breaks a database
        constraint
    403:
      description: You cannot create a news
