SearchFilterResource_delete:
  summary: Delete a search filter
  tags:
    - Crud
  description: Delete a search filter. You must be an administrator.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the search filter
  responses:
    204:
      description: The search filter is deleted
    400:
      description: Other data uses this row
    403:
      description: You are not an administrator
    404:
      description: The search filter does not exist

SearchFilterResource_get:
  summary: Get a search filter
  tags:
    - Crud
  description: Get a search filter. You must be an administrator.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the search filter
    - in: query
      name: relations
      required: false
      schema:
        type: boolean
        default: true
      example: true
      description: Add the related data. The default value is true.
  responses:
    200:
      description: The search filter
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: My Filter
              person_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              search_filter_group_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
              list_type:
                type: string
                example: assets
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
    400:
      description: The identifier is not a valid UUID
    403:
      description: You are not an administrator
    404:
      description: The search filter does not exist

SearchFilterResource_put:
  summary: Update a search filter
  tags:
    - Crud
  description: Update the fields of a search filter. Send only the fields to
    change. You cannot change id, created_at, updated_at and project_id. Dates
    use the ISO 8601 format. You must be an administrator.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the search filter
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
              example: Updated Filter Name
            list_type:
              type: string
              example: shots
  responses:
    200:
      description: The updated search filter
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: Updated Filter Name
              person_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              search_filter_group_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
              list_type:
                type: string
                example: shots
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T11:00:00Z'
    400:
      description: The body is not valid, a date is not valid, or a field
        breaks a database constraint
    403:
      description: You are not an administrator
    404:
      description: The search filter does not exist

SearchFiltersResource_get:
  summary: Get search filter rows
  tags:
    - Crud
  description: Get the search filter rows. Add a query parameter for each
    column to filter on, for example name=Modeling. The name filter does not
    make a difference between upper case and lower case. To get the rows that
    have one value of a list, give the list in JSON, for example
    task_status_id=["<id1>","<id2>"]. You must be an administrator.
  parameters:
    - in: query
      name: page
      required: false
      description: Page to get. Without this parameter, the response has all
        the rows.
      example: 1
      schema:
        type: integer
    - in: query
      name: limit
      required: false
      description: Number of rows in a page. The default value is 100.
      example: 100
      schema:
        type: integer
    - in: query
      name: relations
      required: false
      description: Add the related data to each row
      schema:
        type: boolean
        default: false
    - in: query
      name: fields
      required: false
      description: Comma-separated list of the fields to get for each row. The
        response always has id and type. The names that are not fields are
        ignored.
      example: id,name
      schema:
        type: string
  responses:
    200:
      description: The list of search filter rows, or a page of rows if you
        give page
      content:
        application/json:
          schema:
            oneOf:
              - type: array
                items:
                  type: object
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                    example: []
                  total:
                    type: integer
                    example: 100
                  nb_pages:
                    type: integer
                    example: 2
                  limit:
                    type: integer
                    example: 50
                  offset:
                    type: integer
                    example: 0
                  page:
                    type: integer
                    example: 1
    400:
      description: A filter is not valid
    403:
      description: You are not an administrator

SearchFiltersResource_post:
  summary: Create a search filter
  tags:
    - Crud
  description: Create a search filter. Send the fields of the new row in JSON.
    You must be an administrator.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - person_id
            - search_filter_group_id
            - list_type
          properties:
            name:
              type: string
              example: My Filter
            person_id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            search_filter_group_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            list_type:
              type: string
              example: assets
  responses:
    201:
      description: The new search filter
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: My Filter
              person_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              search_filter_group_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
              list_type:
                type: string
                example: assets
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
    400:
      description: The body is not valid, or a field breaks a database
        constraint
    403:
      description: You are not an administrator
