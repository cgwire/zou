Delete notification
---
tags:
  - Crud
description: Delete a notification by its ID. Returns empty
  response on success.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c25
responses:
    204:
      description: Notification deleted successfully
    400:
      description: Integrity error or cannot delete
