Update milestone
---
tags:
  - Crud
description: Update a milestone with data provided in the request
  body. JSON format is expected. Requires manager access to the
  project.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c25
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            example: Updated Milestone Name
          date:
            type: string
            format: date
            example: "2024-04-30"
responses:
    200:
      description: Milestone updated successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c25
              name:
                type: string
                example: Updated Milestone Name
              project_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c25
              date:
                type: string
                format: date
                example: "2024-04-30"
              created_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                example: "2024-01-15T11:00:00Z"
    400:
      description: Invalid data format or validation error
