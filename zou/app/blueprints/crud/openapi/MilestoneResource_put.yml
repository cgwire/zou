Update a milestone
---
tags:
  - Crud
description: Update the fields of a milestone. Send only the fields to
  change. You cannot change id, created_at, updated_at and project_id. Dates
  use the ISO 8601 format.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the milestone
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            example: Updated Milestone Name
          date:
            type: string
            format: date
            example: '2024-04-30'
responses:
  200:
    description: The updated milestone
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              example: Updated Milestone Name
            project_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            date:
              type: string
              format: date
              example: '2024-04-30'
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T11:00:00Z'
  400:
    description: The body is not valid, a date is not valid, or a field
      breaks a database constraint
  403:
    description: You cannot update this milestone
  404:
    description: The milestone does not exist
