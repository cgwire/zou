Create search filter group
---
tags:
  - Crud
description: Create a new search filter group with data
  provided in the request body. JSON format is expected.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - person_id
        properties:
          name:
            type: string
            example: My Filter Group
          person_id:
            type: string
            format: uuid
            example: a24a6ea4-ce75-4665-a070-57453082c25
responses:
    201:
      description: Search filter group created successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c25
              name:
                type: string
                example: My Filter Group
              person_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c25
              created_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
    400:
      description: Invalid data format or validation error
