Get preview file
---
tags:
  - Crud
description: Retrieve a preview file by its ID and return it as
  a JSON object. Supports including relations. Vendors must be
  working on the task. Artists must have project access.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: query
    name: relations
    required: false
    schema:
      type: boolean
    default: true
    example: true
    description: Whether to include relations
responses:
    200:
      description: Preview file retrieved successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: preview_file_v001
              task_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              revision:
                type: integer
                example: 1
              created_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
    400:
      description: Invalid ID format or query error
