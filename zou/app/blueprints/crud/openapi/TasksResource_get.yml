Get task rows
---
tags:
  - Crud
description: Get the task rows. Add a query parameter for each column to
  filter on, for example name=Modeling. The name filter does not make a
  difference between upper case and lower case. To get the rows that have one
  value of a list, give the list in JSON, for example
  task_status_id=["<id1>","<id2>"]. Add episode_id to get the tasks of the
  shots of this episode. An administrator gets all the tasks. A vendor gets
  only the tasks assigned to them. Other users get the tasks of the open
  projects of their team. A client gets the studio fields blank, for example
  assignees, duration, estimation and dates.
parameters:
  - in: query
    name: episode_id
    required: false
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Filter tasks by episode ID
  - in: query
    name: page
    required: false
    description: Page to get. Without this parameter, the response has all
      the rows.
    example: 1
    schema:
      type: integer
  - in: query
    name: limit
    required: false
    description: Number of rows in a page. The default value is 100.
    example: 100
    schema:
      type: integer
  - in: query
    name: relations
    required: false
    description: Add the related data to each row
    schema:
      type: boolean
      default: false
  - in: query
    name: fields
    required: false
    description: Comma-separated list of the fields to get for each row. The
      response always has id and type. The names that are not fields are
      ignored.
    example: id,name
    schema:
      type: string
responses:
  200:
    description: The list of task rows, or a page of rows if you give page
    content:
      application/json:
        schema:
          oneOf:
            - type: array
              items:
                type: object
            - type: object
              properties:
                data:
                  type: array
                  items:
                    type: object
                  example: []
                total:
                  type: integer
                  example: 100
                nb_pages:
                  type: integer
                  example: 2
                limit:
                  type: integer
                  example: 50
                offset:
                  type: integer
                  example: 0
                page:
                  type: integer
                  example: 1
  400:
    description: A filter is not valid
