SoftwareResource_get:
  summary: Get a software
  tags:
    - Crud
  description: Get a software. All users can read it.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the software
  responses:
    200:
      description: The software
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: Maya
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
    404:
      description: The software does not exist, or the identifier is not valid
