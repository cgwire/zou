HardwareItemResource_delete:
  summary: Delete a hardware item
  tags:
    - Crud
  description: Delete a hardware item. You must be an administrator.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the hardware item
  responses:
    204:
      description: The hardware item is deleted
    400:
      description: Other data uses this row
    403:
      description: You are not an administrator
    404:
      description: The hardware item does not exist

HardwareItemResource_get:
  summary: Get a hardware item
  tags:
    - Crud
  description: Get a hardware item. You must be an administrator.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the hardware item
    - in: query
      name: relations
      required: false
      schema:
        type: boolean
        default: true
      example: true
      description: Add the related data. The default value is true.
  responses:
    200:
      description: The hardware item
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: Workstation 01
              short_name:
                type: string
                example: WS01
              archived:
                type: boolean
                example: false
              monthly_cost:
                type: integer
                example: 50
              inventory_amount:
                type: integer
                example: 3
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
    400:
      description: The identifier is not a valid UUID
    403:
      description: You are not an administrator
    404:
      description: The hardware item does not exist

HardwareItemResource_put:
  summary: Update a hardware item
  tags:
    - Crud
  description: Update the fields of a hardware item. Send only the fields to
    change. You cannot change id, created_at, updated_at. Dates use the ISO
    8601 format. You must be an administrator.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the hardware item
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
              example: Updated Workstation 01
            short_name:
              type: string
              example: WS01
            archived:
              type: boolean
              example: false
            monthly_cost:
              type: integer
              description: Monthly cost of the item
            inventory_amount:
              type: integer
              description: Number of items in the inventory
  responses:
    200:
      description: The updated hardware item
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: Updated Workstation 01
              short_name:
                type: string
                example: WS01
              archived:
                type: boolean
                example: false
              monthly_cost:
                type: integer
                example: 50
              inventory_amount:
                type: integer
                example: 3
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T11:00:00Z'
    400:
      description: The body is not valid, a date is not valid, or a field
        breaks a database constraint
    403:
      description: You are not an administrator
    404:
      description: The hardware item does not exist

HardwareItemsResource_get:
  summary: Get hardware item rows
  tags:
    - Crud
  description: Get the hardware item rows. Add a query parameter for each
    column to filter on, for example name=Modeling. The name filter does not
    make a difference between upper case and lower case. To get the rows that
    have one value of a list, give the list in JSON, for example
    task_status_id=["<id1>","<id2>"]. You must be an administrator.
  parameters:
    - in: query
      name: page
      required: false
      description: Page to get. Without this parameter, the response has all
        the rows.
      example: 1
      schema:
        type: integer
    - in: query
      name: limit
      required: false
      description: Number of rows in a page. The default value is 100.
      example: 100
      schema:
        type: integer
    - in: query
      name: relations
      required: false
      description: Add the related data to each row
      schema:
        type: boolean
        default: false
    - in: query
      name: fields
      required: false
      description: Comma-separated list of the fields to get for each row. The
        response always has id and type. The names that are not fields are
        ignored.
      example: id,name
      schema:
        type: string
  responses:
    200:
      description: The list of hardware item rows, or a page of rows if you
        give page
      content:
        application/json:
          schema:
            oneOf:
              - type: array
                items:
                  type: object
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                    example: []
                  total:
                    type: integer
                    example: 100
                  nb_pages:
                    type: integer
                    example: 2
                  limit:
                    type: integer
                    example: 50
                  offset:
                    type: integer
                    example: 0
                  page:
                    type: integer
                    example: 1
    400:
      description: A filter is not valid
    403:
      description: You are not an administrator

HardwareItemsResource_post:
  summary: Create a hardware item
  tags:
    - Crud
  description: Create a hardware item. Send the fields of the new row in JSON.
    You must be an administrator.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
            - short_name
          properties:
            name:
              type: string
              example: Workstation 01
            short_name:
              type: string
              example: WS01
            monthly_cost:
              type: integer
              description: Monthly cost of the item
            inventory_amount:
              type: integer
              description: Number of items in the inventory
  responses:
    201:
      description: The new hardware item
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: Workstation 01
              short_name:
                type: string
                example: WS01
              archived:
                type: boolean
                example: false
              monthly_cost:
                type: integer
                example: 50
              inventory_amount:
                type: integer
                example: 3
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
    400:
      description: The body is not valid, or a field breaks a database
        constraint
    403:
      description: You are not an administrator
