TimeSpentResource_delete:
  summary: Delete a time spent
  tags:
    - Crud
  description: Delete a time spent. The task duration becomes the sum of its
    time spents. An administrator can delete all the time spents. For other
    users, the person of the time spent must be an assignee of the task. Then
    you must be this person or a manager of the project.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the time spent
  responses:
    204:
      description: The time spent is deleted
    400:
      description: Other data uses this row
    403:
      description: The person is not an assignee of the task, or you are not
        this person or a manager of the project
    404:
      description: The time spent does not exist

TimeSpentResource_get:
  summary: Get a time spent
  tags:
    - Crud
  description: Get a time spent. You must be an administrator.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the time spent
    - in: query
      name: relations
      required: false
      schema:
        type: boolean
        default: true
      example: true
      description: Add the related data. The default value is true.
  responses:
    200:
      description: The time spent
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              task_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              person_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
              date:
                type: string
                format: date
                example: '2024-01-15'
              duration:
                type: number
                example: 8.5
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
    400:
      description: The identifier is not a valid UUID
    403:
      description: You are not an administrator
    404:
      description: The time spent does not exist

TimeSpentResource_put:
  summary: Update a time spent
  tags:
    - Crud
  description: Update the fields of a time spent. Send only the fields to
    change. You cannot change id, created_at, updated_at. Dates use the ISO 8601
    format. The task duration becomes the sum of its time spents. You must be an
    administrator.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the time spent
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            date:
              type: string
              format: date
              example: '2024-01-16'
            duration:
              type: number
              example: 7.5
  responses:
    200:
      description: The updated time spent
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              task_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              person_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
              date:
                type: string
                format: date
                example: '2024-01-16'
              duration:
                type: number
                example: 7.5
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T11:00:00Z'
    400:
      description: The body is not valid, a date is not valid, or a field
        breaks a database constraint
    403:
      description: You are not an administrator
    404:
      description: The time spent does not exist

TimeSpentsResource_get:
  summary: Get time spent rows
  tags:
    - Crud
  description: Get the time spent rows. Add a query parameter for each column to
    filter on, for example name=Modeling. The name filter does not make a
    difference between upper case and lower case. To get the rows that have one
    value of a list, give the list in JSON, for example
    task_status_id=["<id1>","<id2>"]. To get a range of dates, give both
    start_date and end_date. You must be an administrator.
  parameters:
    - in: query
      name: start_date
      required: false
      schema:
        type: string
        format: date
      example: '2024-01-01'
      description: Start date for date range filter
    - in: query
      name: end_date
      required: false
      schema:
        type: string
        format: date
      example: '2024-01-31'
      description: End date for date range filter
    - in: query
      name: page
      required: false
      description: Page to get. Without this parameter, the response has all
        the rows.
      example: 1
      schema:
        type: integer
    - in: query
      name: limit
      required: false
      description: Number of rows in a page. The default value is 100.
      example: 100
      schema:
        type: integer
    - in: query
      name: relations
      required: false
      description: Add the related data to each row
      schema:
        type: boolean
        default: false
    - in: query
      name: fields
      required: false
      description: Comma-separated list of the fields to get for each row. The
        response always has id and type. The names that are not fields are
        ignored.
      example: id,name
      schema:
        type: string
  responses:
    200:
      description: The list of time spent rows, or a page of rows if you give
        page
      content:
        application/json:
          schema:
            oneOf:
              - type: array
                items:
                  type: object
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                    example: []
                  total:
                    type: integer
                    example: 100
                  nb_pages:
                    type: integer
                    example: 2
                  limit:
                    type: integer
                    example: 50
                  offset:
                    type: integer
                    example: 0
                  page:
                    type: integer
                    example: 1
    400:
      description: A filter is not valid
    403:
      description: You are not an administrator

TimeSpentsResource_post:
  summary: Create a time spent
  tags:
    - Crud
  description: Create a time spent. Send the fields of the new row in JSON. The
    task duration becomes the sum of its time spents. You must be an
    administrator.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - task_id
            - person_id
            - date
            - duration
          properties:
            task_id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            person_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            date:
              type: string
              format: date
              example: '2024-01-15'
            duration:
              type: number
              example: 8.5
  responses:
    201:
      description: The new time spent
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              task_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              person_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
              date:
                type: string
                format: date
                example: '2024-01-15'
              duration:
                type: number
                example: 8.5
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
    400:
      description: The body is not valid, or a field breaks a database
        constraint
    403:
      description: You are not an administrator
