Get project
---
tags:
  - Crud
description: Retrieve a project by its ID and return it as a JSON
  object, with the extra data of the open projects listing (metadata
  descriptors, task type priorities, task status links, first
  episode). Without relations, the bare project is returned.
  Requires project access.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: query
    name: relations
    required: false
    schema:
      type: boolean
    default: true
    example: true
    description: Whether to include relations
responses:
    200:
      description: Project retrieved successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: Project Name
              production_type:
                type: string
                example: feature
              production_style:
                type: string
                example: 2d3d
              project_status_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              project_status_name:
                type: string
                example: Open
              descriptors:
                type: array
                items:
                  type: object
                description: Metadata descriptors of the project,
                  narrowed to the ones published to a client or to
                  the departments of a vendor
              task_types_priority:
                type: object
                description: Priority of each task type, by id
              task_statuses_link:
                type: object
                description: Priority and board roles of each task
                  status, by id
              first_episode_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c25
              created_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
    400:
      description: Invalid ID format or query error
