Update a entity link
---
tags:
  - Crud
description: Update the fields of a entity link. Send only the fields to
  change. You cannot change id, created_at, updated_at. Dates use the ISO
  8601 format. You must be an administrator.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the entity link
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          nb_occurences:
            type: integer
            example: 2
          label:
            type: string
            example: updated
responses:
  200:
    description: The updated entity link
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            entity_in_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            entity_out_id:
              type: string
              format: uuid
              example: c24a6ea4-ce75-4665-a070-57453082c250
            nb_occurences:
              type: integer
              example: 2
            label:
              type: string
              example: updated
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T11:00:00Z'
  400:
    description: The body is not valid, a date is not valid, or a field
      breaks a database constraint
  403:
    description: You cannot update this entity link
  404:
    description: The entity link does not exist
