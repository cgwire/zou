Update entity link
---
tags:
  - Crud
description: Update an entity link with data provided in the
  request body. JSON format is expected.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          nb_occurences:
            type: integer
            example: 2
          label:
            type: string
            example: updated
responses:
    200:
      description: Entity link updated successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              entity_in_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              entity_out_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
              nb_occurences:
                type: integer
                example: 2
              label:
                type: string
                example: updated
              created_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                example: "2024-01-15T11:00:00Z"
    400:
      description: Invalid data format or validation error
