Create preview file
---
tags:
  - Crud
description: Create a new preview file with data provided in the
  request body. JSON format is expected.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - task_id
        properties:
          name:
            type: string
            example: preview_file_v001
          task_id:
            type: string
            format: uuid
            example: a24a6ea4-ce75-4665-a070-57453082c250
          revision:
            type: integer
            default: 1
            example: 1
responses:
    201:
      description: Preview file created successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: preview_file_v001
              task_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              revision:
                type: integer
                example: 1
              created_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
    400:
      description: Invalid data format or validation error
