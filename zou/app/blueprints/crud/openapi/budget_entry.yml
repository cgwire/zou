BudgetEntriesResource_get:
  summary: Get budget entry rows
  tags:
    - Crud
  description: Get the budget entry rows. Add a query parameter for each
    column to filter on, for example name=Modeling. The name filter does not
    make a difference between upper case and lower case. To get the rows that
    have one value of a list, give the list in JSON, for example
    task_status_id=["<id1>","<id2>"]. You must be an administrator.
  parameters:
    - in: query
      name: page
      required: false
      description: Page to get. Without this parameter, the response has all
        the rows.
      example: 1
      schema:
        type: integer
    - in: query
      name: limit
      required: false
      description: Number of rows in a page. The default value is 100.
      example: 100
      schema:
        type: integer
    - in: query
      name: relations
      required: false
      description: Add the related data to each row
      schema:
        type: boolean
        default: false
    - in: query
      name: fields
      required: false
      description: Comma-separated list of the fields to get for each row. The
        response always has id and type. The names that are not fields are
        ignored.
      example: id,name
      schema:
        type: string
  responses:
    200:
      description: The list of budget entry rows, or a page of rows if you
        give page
      content:
        application/json:
          schema:
            oneOf:
              - type: array
                items:
                  type: object
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                    example: []
                  total:
                    type: integer
                    example: 100
                  nb_pages:
                    type: integer
                    example: 2
                  limit:
                    type: integer
                    example: 50
                  offset:
                    type: integer
                    example: 0
                  page:
                    type: integer
                    example: 1
    400:
      description: A filter is not valid
    403:
      description: You are not an administrator

BudgetEntriesResource_post:
  summary: Create a budget entry
  tags:
    - Crud
  description: Create a budget entry. Send the fields of the new row in JSON.
    You must be an administrator.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - budget_id
            - department_id
            - start_date
            - months_duration
            - daily_salary
          properties:
            budget_id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            department_id:
              type: string
              format: uuid
              example: c24a6ea4-ce75-4665-a070-57453082c250
            person_id:
              type: string
              format: uuid
              example: d24a6ea4-ce75-4665-a070-57453082c250
            start_date:
              type: string
              format: date
              example: '2024-01-15'
            months_duration:
              type: integer
              example: 3
            daily_salary:
              type: number
              description: Daily salary of the entry
            position:
              type: string
              example: artist
            seniority:
              type: string
              example: mid
            exceptions:
              type: object
              description: Exceptions of the entry, as a JSON object
  responses:
    201:
      description: The new budget entry
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              budget_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              department_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
              person_id:
                type: string
                format: uuid
                nullable: true
                example: d24a6ea4-ce75-4665-a070-57453082c250
              start_date:
                type: string
                format: date
                example: '2024-01-15'
              months_duration:
                type: integer
                example: 3
              daily_salary:
                type: number
                example: 1000.0
              position:
                type: string
                example: artist
              seniority:
                type: string
                example: mid
              exceptions:
                type: object
                nullable: true
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
    400:
      description: The body is not valid, or a field breaks a database
        constraint
    403:
      description: You are not an administrator

BudgetEntryResource_delete:
  summary: Delete a budget entry
  tags:
    - Crud
  description: Delete a budget entry. You must be an administrator.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the budget entry
  responses:
    204:
      description: The budget entry is deleted
    400:
      description: Other data uses this row
    403:
      description: You are not an administrator
    404:
      description: The budget entry does not exist

