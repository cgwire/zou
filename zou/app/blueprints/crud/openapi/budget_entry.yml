  tags:
    - Crud
  description: Update the fields of a budget entry. Send only the fields to
    change. You cannot change id, created_at, updated_at and budget_id. Dates
    use the ISO 8601 format. You must be an administrator.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the budget entry
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            department_id:
              type: string
              format: uuid
              example: c24a6ea4-ce75-4665-a070-57453082c250
            person_id:
