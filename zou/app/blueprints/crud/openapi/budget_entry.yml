            months_duration:
              type: integer
              example: 3
            daily_salary:
              type: number
              description: Daily salary of the entry
            position:
              type: string
              example: artist
            seniority:
              type: string
              example: mid
            exceptions:
              type: object
              description: Exceptions of the entry, as a JSON object
  responses:
    200:
      description: The updated budget entry
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              budget_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
