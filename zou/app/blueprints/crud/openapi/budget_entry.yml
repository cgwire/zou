                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
              person_id:
                type: string
                format: uuid
                nullable: true
                example: d24a6ea4-ce75-4665-a070-57453082c250
              start_date:
                type: string
                format: date
                example: '2024-01-15'
              months_duration:
                type: integer
