Update a schedule item
---
tags:
  - Crud
description: Update the fields of a schedule item. Send only the fields to
  change. You cannot change id, created_at, updated_at and project_id. Dates
  use the ISO 8601 format. A man_days value sent as a string is ignored. You
  must be an administrator, or a manager or a supervisor of the project. A
  supervisor with departments can change only the items of a task type of
  these departments.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the schedule item
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          man_days:
            type: number
            example: 12.0
responses:
  200:
    description: The updated schedule item
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            project_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            task_type_id:
              type: string
              format: uuid
              example: c24a6ea4-ce75-4665-a070-57453082c250
            object_id:
              type: string
              format: uuid
              example: d24a6ea4-ce75-4665-a070-57453082c250
            man_days:
              type: number
              example: 12.0
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T11:00:00Z'
  400:
    description: The body is not valid, a date is not valid, or a field
      breaks a database constraint
  403:
    description: You are not a manager or a supervisor of the project, or the
      task type is not in your departments
  404:
    description: The schedule item does not exist
