Update a news
---
tags:
  - Crud
description: Update the fields of a news. Send only the fields to change.
  You cannot change id, created_at, updated_at. Dates use the ISO 8601
  format. You must be an administrator.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the news
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          change:
            type: boolean
            description: True if the comment changes the task status
          author_id:
            type: string
            format: uuid
            description: Author of the comment
            example: a24a6ea4-ce75-4665-a070-57453082c250
          task_id:
            type: string
            format: uuid
            description: Task of the comment
            example: a24a6ea4-ce75-4665-a070-57453082c250
          comment_id:
            type: string
            format: uuid
            description: Comment of the news
            example: a24a6ea4-ce75-4665-a070-57453082c250
          preview_file_id:
            type: string
            format: uuid
            description: Preview of the comment
            example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  200:
    description: The updated news
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            title:
              type: string
              example: Updated Project Update
            project_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            content:
              type: string
              example: Updated news content text
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T11:00:00Z'
  400:
    description: The body is not valid, a date is not valid, or a field
      breaks a database constraint
  403:
    description: You cannot update this news
  404:
    description: The news does not exist
