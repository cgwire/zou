PluginResource_delete:
  summary: Delete a plugin
  tags:
    - Crud
  description: Delete a plugin. You must be an administrator.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the plugin
  responses:
    204:
      description: The plugin is deleted
    400:
      description: Other data uses this row
    403:
      description: You are not an administrator
    404:
      description: The plugin does not exist

PluginResource_get:
  summary: Get a plugin
  tags:
    - Crud
  description: Get a plugin. You must be an administrator.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the plugin
    - in: query
      name: relations
      required: false
      schema:
        type: boolean
        default: true
      example: true
      description: Add the related data. The default value is true.
  responses:
    200:
      description: The plugin
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: Plugin Name
              plugin_id:
                type: string
                example: my-plugin
              version:
                type: string
                example: 1.0.0
              frontend_project_enabled:
                type: boolean
                example: false
              frontend_studio_enabled:
                type: boolean
                example: false
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
    400:
      description: The identifier is not a valid UUID
    403:
      description: You are not an administrator
    404:
      description: The plugin does not exist

PluginResource_put:
  summary: Update a plugin
  tags:
    - Crud
  description: Update the fields of a plugin. Send only the fields to change.
    You cannot change id, created_at, updated_at. Dates use the ISO 8601
    format. You must be an administrator.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the plugin
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
              example: Updated Plugin Name
            frontend_project_enabled:
              type: boolean
              description: Show the plugin in the project pages
            frontend_studio_enabled:
              type: boolean
              description: Show the plugin in the studio pages
  responses:
    200:
      description: The updated plugin
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: Updated Plugin Name
              plugin_id:
                type: string
                example: my-plugin
              version:
                type: string
                example: 1.0.0
              frontend_project_enabled:
                type: boolean
                example: false
              frontend_studio_enabled:
                type: boolean
                example: false
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T11:00:00Z'
    400:
      description: The body is not valid, a date is not valid, or a field
        breaks a database constraint
    403:
      description: You are not an administrator
    404:
      description: The plugin does not exist

PluginsResource_get:
  summary: Get plugin rows
  tags:
    - Crud
  description: Get the plugin rows. Add a query parameter for each column to
    filter on, for example name=Modeling. The name filter does not make a
    difference between upper case and lower case. To get the rows that have
    one value of a list, give the list in JSON, for example
    task_status_id=["<id1>","<id2>"]. You must be an administrator.
  parameters:
    - in: query
      name: page
      required: false
      description: Page to get. Without this parameter, the response has all
        the rows.
      example: 1
      schema:
        type: integer
    - in: query
      name: limit
      required: false
      description: Number of rows in a page. The default value is 100.
      example: 100
      schema:
        type: integer
    - in: query
      name: relations
      required: false
      description: Add the related data to each row
      schema:
        type: boolean
        default: false
    - in: query
      name: fields
      required: false
      description: Comma-separated list of the fields to get for each row. The
        response always has id and type. The names that are not fields are
        ignored.
      example: id,name
      schema:
        type: string
  responses:
    200:
      description: The list of plugin rows, or a page of rows if you give page
      content:
        application/json:
          schema:
            oneOf:
              - type: array
                items:
                  type: object
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                    example: []
                  total:
                    type: integer
                    example: 100
                  nb_pages:
                    type: integer
                    example: 2
                  limit:
                    type: integer
                    example: 50
                  offset:
                    type: integer
                    example: 0
                  page:
                    type: integer
                    example: 1
    400:
      description: A filter is not valid
    403:
      description: You are not an administrator

PluginsResource_post:
  summary: Create a plugin
  tags:
    - Crud
  description: Create a plugin. Send the fields of the new row in JSON. You
    must be an administrator.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - plugin_id
            - name
            - version
            - maintainer_name
            - license
          properties:
            plugin_id:
              type: string
              example: my-plugin
            name:
              type: string
              example: Plugin Name
            version:
              type: string
              example: 1.0.0
            maintainer_name:
              type: string
              example: John Doe
            maintainer_email:
              type: string
              format: email
              example: john.doe@example.com
            website:
              type: string
              format: uri
              example: https://example.com
            license:
              type: string
              example: MIT
            revision:
              type: string
              example: a1b2c3d
            description:
              type: string
              example: Adds a custom view
            icon:
              type: string
              description: Name of a lucide icon
              example: puzzle
            frontend_project_enabled:
              type: boolean
              description: Show the plugin in the project pages
            frontend_studio_enabled:
              type: boolean
              description: Show the plugin in the studio pages
  responses:
    201:
      description: The new plugin
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: Plugin Name
              plugin_id:
                type: string
                example: my-plugin
              version:
                type: string
                example: 1.0.0
              frontend_project_enabled:
                type: boolean
                example: false
              frontend_studio_enabled:
                type: boolean
                example: false
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
    400:
      description: The body is not valid, or a field breaks a database
        constraint
    403:
      description: You are not an administrator
