Create a entity
---
tags:
  - Crud
description: Create a entity. Send the fields of the new row in JSON.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - project_id
          - entity_type_id
        properties:
          name:
            type: string
            example: SH010
          project_id:
            type: string
            format: uuid
            example: a24a6ea4-ce75-4665-a070-57453082c250
          entity_type_id:
            type: string
            format: uuid
            example: b24a6ea4-ce75-4665-a070-57453082c250
          status:
            type: string
            example: running
          data:
            type: object
            example: {frame_in: 1001, frame_out: 1120}
responses:
  201:
    description: The new entity
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              example: SH010
            project_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            entity_type_id:
              type: string
              format: uuid
              example: c24a6ea4-ce75-4665-a070-57453082c250
            status:
              type: string
              example: running
            data:
              type: object
              example: {frame_in: 1001, frame_out: 1120}
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
  400:
    description: The body is not valid, or a field breaks a database
      constraint
  403:
    description: You cannot create a entity
