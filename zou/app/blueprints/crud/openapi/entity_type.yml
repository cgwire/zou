EntityTypeResource_delete:
  summary: Delete an entity type
  tags:
    - Crud
  description: Delete an entity type. You must be an administrator.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the entity type
  responses:
    204:
      description: The entity type is deleted
    400:
      description: Other data uses this row
    403:
      description: You are not an administrator
    404:
      description: The entity type does not exist

EntityTypeResource_get:
  summary: Get an entity type
  tags:
    - Crud
  description: Get an entity type. All signed-in users can read it.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the entity type
    - in: query
      name: relations
      required: false
      schema:
        type: boolean
        default: true
      example: true
      description: Add the related data. The default value is true.
  responses:
    200:
      description: The entity type
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: Character
              short_name:
                type: string
                example: char
              description:
                type: string
                example: Characters of the show
              archived:
                type: boolean
                example: false
              task_types:
                type: array
                items:
                  type: string
                  format: uuid
                example: [c24a6ea4-ce75-4665-a070-57453082c250]
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
    400:
      description: The identifier is not a valid UUID
    403:
      description: You cannot read this entity type
    404:
      description: The entity type does not exist

EntityTypeResource_put:
  summary: Update an entity type
  tags:
    - Crud
  description: Update the fields of an entity type. Send only the fields to
    change. You cannot change id, created_at, updated_at. Dates use the ISO
    8601 format. You must be an administrator.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the entity type
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
              example: Updated Character
            short_name:
              type: string
              example: char
            description:
              type: string
              example: Characters of the show
            archived:
              type: boolean
              example: false
            task_types:
              type: array
              items:
                type: string
                format: uuid
              description: Task types of the entity type
  responses:
    200:
      description: The updated entity type
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: Updated Character
              short_name:
                type: string
                example: char
              description:
                type: string
                example: Characters of the show
              archived:
                type: boolean
                example: false
              task_types:
                type: array
                items:
                  type: string
                  format: uuid
                example: [c24a6ea4-ce75-4665-a070-57453082c250]
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T11:00:00Z'
    400:
      description: The body is not valid, a date is not valid, or a field
        breaks a database constraint
    403:
      description: You are not an administrator
    404:
      description: The entity type does not exist

EntityTypesResource_get:
  summary: Get entity type rows
  tags:
    - Crud
  description: Get the entity type rows. Add a query parameter for each column
    to filter on, for example name=Modeling. The name filter does not make a
    difference between upper case and lower case. To get the rows that have
    one value of a list, give the list in JSON, for example
    task_status_id=["<id1>","<id2>"]. All signed-in users can read them.
  parameters:
    - in: query
      name: page
      required: false
      description: Page to get. Without this parameter, the response has all
        the rows.
      example: 1
      schema:
        type: integer
    - in: query
      name: limit
      required: false
      description: Number of rows in a page. The default value is 100.
      example: 100
      schema:
        type: integer
    - in: query
      name: relations
      required: false
      description: Add the related data to each row
      schema:
        type: boolean
        default: false
    - in: query
      name: fields
      required: false
      description: Comma-separated list of the fields to get for each row. The
        response always has id and type. The names that are not fields are
        ignored.
      example: id,name
      schema:
        type: string
  responses:
    200:
      description: The list of entity type rows, or a page of rows if you give
        page
      content:
        application/json:
          schema:
            oneOf:
              - type: array
                items:
                  type: object
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                    example: []
                  total:
                    type: integer
                    example: 100
                  nb_pages:
                    type: integer
                    example: 2
                  limit:
                    type: integer
                    example: 50
                  offset:
                    type: integer
                    example: 0
                  page:
                    type: integer
                    example: 1
    400:
      description: A filter is not valid
    403:
      description: You cannot read these rows

EntityTypesResource_post:
  summary: Create an entity type
  tags:
    - Crud
  description: Create an entity type. Send the fields of the new row in JSON.
    The name must be unique. The check does not make a difference between
    upper case and lower case. You must be an administrator.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
          properties:
            name:
              type: string
              example: Character
            short_name:
              type: string
              example: char
            description:
              type: string
              example: Characters of the show
            archived:
              type: boolean
              example: false
            task_types:
              type: array
              items:
                type: string
                format: uuid
              description: Task types of the entity type
  responses:
    201:
      description: The new entity type
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: Character
              short_name:
                type: string
                example: char
              description:
                type: string
                example: Characters of the show
              archived:
                type: boolean
                example: false
              task_types:
                type: array
                items:
                  type: string
                  format: uuid
                example: [c24a6ea4-ce75-4665-a070-57453082c250]
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
    400:
      description: The body is not valid, or a field breaks a database
        constraint
    403:
      description: You are not an administrator
