Create budget
---
tags:
  - Crud
description: Create a new budget with data provided in the request
  body. JSON format is expected.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - project_id
        properties:
          project_id:
            type: string
            format: uuid
            example: a24a6ea4-ce75-4665-a070-57453082c250
          name:
            type: string
            example: Budget Q1
          revision:
            type: integer
            example: 1
responses:
    201:
      description: Budget created successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              project_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: Budget Q1
              revision:
                type: integer
                example: 1
              created_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
    400:
      description: Invalid data format or validation error
