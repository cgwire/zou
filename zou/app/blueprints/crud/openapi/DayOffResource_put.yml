Update day off
---
tags:
  - Crud
description: Update a day off with data provided in the request
  body. JSON format is expected. Deletes overlapping time spent
  entries.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          date:
            type: string
            format: date
            example: "2024-01-16"
          end_date:
            type: string
            format: date
            example: "2024-01-21"
responses:
    200:
      description: Day off updated successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              date:
                type: string
                format: date
                example: "2024-01-16"
              end_date:
                type: string
                format: date
                example: "2024-01-21"
              person_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              created_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                example: "2024-01-15T11:00:00Z"
    400:
      description: Invalid data format or day off already exists
