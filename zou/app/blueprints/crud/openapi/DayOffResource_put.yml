Update a day off
---
tags:
  - Crud
description: Update the fields of a day off. Send only the fields to change.
  You cannot change id, created_at, updated_at. Dates use the ISO 8601
  format.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the day off
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          date:
            type: string
            format: date
            example: '2024-01-16'
          end_date:
            type: string
            format: date
            example: '2024-01-21'
responses:
  200:
    description: The updated day off
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            date:
              type: string
              format: date
              example: '2024-01-16'
            end_date:
              type: string
              format: date
              example: '2024-01-21'
            person_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T11:00:00Z'
  400:
    description: The body is not valid, a date is not valid, or a field
      breaks a database constraint
  403:
    description: You cannot update this day off
  404:
    description: The day off does not exist
