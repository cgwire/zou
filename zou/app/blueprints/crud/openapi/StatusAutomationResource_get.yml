Get a status automation
---
tags:
  - Crud
description: Get a status automation. You must be an administrator.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the status automation
  - in: query
    name: relations
    required: false
    schema:
      type: boolean
      default: true
    example: true
    description: Add the related data. The default value is true.
responses:
  200:
    description: The status automation
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            source_task_status_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            target_task_status_id:
              type: string
              format: uuid
              example: c24a6ea4-ce75-4665-a070-57453082c250
            field_name:
              type: string
              example: ready_for
            field_value:
              type: string
              example: production
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
  400:
    description: The identifier is not a valid UUID
  403:
    description: You are not an administrator
  404:
    description: The status automation does not exist
