Create time spent
---
tags:
  - Crud
description: Create a new time spent record with data provided
  in the request body. JSON format is expected. Updates task
  duration automatically.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - task_id
          - person_id
          - date
          - duration
        properties:
          task_id:
            type: string
            format: uuid
            example: a24a6ea4-ce75-4665-a070-57453082c250
          person_id:
            type: string
            format: uuid
            example: b24a6ea4-ce75-4665-a070-57453082c250
          date:
            type: string
            format: date
            example: "2024-01-15"
          duration:
            type: number
            example: 8.5
responses:
    201:
      description: Time spent record created successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              task_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              person_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
              date:
                type: string
                format: date
                example: "2024-01-15"
              duration:
                type: number
                example: 8.5
              created_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
    400:
      description: Invalid data format or validation error
