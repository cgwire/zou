Create a time spent
---
tags:
  - Crud
description: Create a time spent. Send the fields of the new row in JSON. The
  task duration becomes the sum of its time spents. You must be an
  administrator.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - task_id
          - person_id
          - date
          - duration
        properties:
          task_id:
            type: string
            format: uuid
            example: a24a6ea4-ce75-4665-a070-57453082c250
          person_id:
            type: string
            format: uuid
            example: b24a6ea4-ce75-4665-a070-57453082c250
          date:
            type: string
            format: date
            example: '2024-01-15'
          duration:
            type: number
            example: 8.5
responses:
  201:
    description: The new time spent
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            task_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            person_id:
              type: string
              format: uuid
              example: c24a6ea4-ce75-4665-a070-57453082c250
            date:
              type: string
              format: date
              example: '2024-01-15'
            duration:
              type: number
              example: 8.5
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
  400:
    description: The body is not valid, or a field breaks a database
      constraint
  403:
    description: You are not an administrator
