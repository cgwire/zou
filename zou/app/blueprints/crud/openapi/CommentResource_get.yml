Get comment
---
tags:
  - Crud
description: Retrieve a comment by its ID and return it as a JSON
  object. Supports including relations. Client users can only see
  their own comments or comments from other clients.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: query
    name: relations
    required: false
    schema:
      type: boolean
    default: true
    example: true
    description: Whether to include relations
  - in: query
    name: with_previews
    required: false
    schema:
      type: boolean
    default: false
    example: true
    description: Whether to expand preview IDs to full preview objects
responses:
    200:
      description: Comment retrieved successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              object_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              person_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
              task_status_id:
                type: string
                format: uuid
                example: d24a6ea4-ce75-4665-a070-57453082c250
              text:
                type: string
                example: Comment text
              created_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
    400:
      description: Invalid ID format or query error
