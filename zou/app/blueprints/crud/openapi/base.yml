BaseModelResource_delete:
  summary: Delete model
  tags:
    - Crud
  description: Delete a model instance by its ID. Returns empty
    response on success. Unless the model says otherwise, you must be an
    administrator.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
  responses:
      204:
        description: Model deleted successfully
      400:
        description: Integrity error or cannot delete
      403:
        description: You are not an administrator
      404:
        description: The row does not exist

BaseModelResource_get:
  summary: Get model
  tags:
    - Crud
  description: Retrieve a model instance by its ID and return it as a JSON
    object. Supports including relations. Unless the model says otherwise,
    you must be an administrator.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
    - in: query
      name: relations
      required: false
      schema:
        type: boolean
        default: true
      example: true
      description: Whether to include relations
  responses:
    200:
      description: Model retrieved successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: Model Name
              created_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
    400:
      description: Invalid ID format or query error
    403:
      description: You are not an administrator
    404:
      description: The row does not exist

BaseModelResource_put:
  summary: Update model
  tags:
    - Crud
  description: Update a model instance with data provided in the
    request body. JSON format is expected. Model performs validation
    automatically when fields are modified. Unless the model says otherwise,
    you must be an administrator.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
              example: Updated Model Name
  responses:
      200:
        description: Model updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  example: a24a6ea4-ce75-4665-a070-57453082c250
                name:
                  type: string
                  example: Updated Model Name
                created_at:
                  type: string
                  format: date-time
                  example: "2024-01-15T10:30:00Z"
                updated_at:
                  type: string
                  format: date-time
                  example: "2024-01-15T11:00:00Z"
      400:
        description: Invalid data format or validation error
      403:
        description: You are not an administrator
      404:
        description: The row does not exist

BaseModelsResource_get:
  summary: Get models
  tags:
    - Crud
  description: Retrieve all entries for the given model. Supports filtering
    via query parameters and pagination. Unless the model says otherwise,
    you must be an administrator.
  parameters:
    - in: query
      name: page
      required: false
      schema:
        type: integer
      example: 1
      description: Page number for pagination
    - in: query
      name: limit
      required: false
      schema:
        type: integer
      example: 50
      description: Number of results per page
    - in: query
      name: relations
      required: false
      schema:
        type: boolean
        default: false
      example: false
      description: Whether to include relations
    - in: query
      name: fields
      required: false
      schema:
        type: string
      example: first_name,last_name
      description: Comma-separated list of attributes to return for each entry
        (id and type are always included). Unknown names are ignored.
  responses:
    200:
      description: Models retrieved successfully
      content:
        application/json:
          schema:
            oneOf:
              - type: array
                items:
                  type: object
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                    example: []
                  total:
                    type: integer
                    example: 100
                  nb_pages:
                    type: integer
                    example: 2
                  limit:
                    type: integer
                    example: 50
                  offset:
                    type: integer
                    example: 0
                  page:
                    type: integer
                    example: 1
    400:
      description: Invalid filter format or query error
    403:
      description: You are not an administrator

BaseModelsResource_post:
  summary: Create model
  tags:
    - Crud
  description: Create a new model instance with data provided in the
    request body. JSON format is expected. The model performs validation
    automatically when instantiated. Unless the model says otherwise, you
    must be an administrator.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
              example: Model Name
  responses:
      201:
        description: Model created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  example: a24a6ea4-ce75-4665-a070-57453082c250
                name:
                  type: string
                  example: Model Name
                created_at:
                  type: string
                  format: date-time
                  example: "2024-01-15T10:30:00Z"
                updated_at:
                  type: string
                  format: date-time
                  example: "2024-01-15T10:30:00Z"
      400:
        description: Invalid data format or validation error
      403:
        description: You are not an administrator
