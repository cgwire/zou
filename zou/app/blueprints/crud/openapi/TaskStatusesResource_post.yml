Create a task status
---
tags:
  - Crud
description: Create a task status. Send the fields of the new row in JSON. If
  is_default is true, the previous default status stops being the default. You
  must be an administrator.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
        properties:
          name:
            type: string
            example: To Do
          short_name:
            type: string
            example: TODO
          color:
            type: string
            example: '#FF5733'
          is_default:
            type: boolean
            default: false
            example: false
responses:
  201:
    description: The new task status
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              example: To Do
            short_name:
              type: string
              example: TODO
            color:
              type: string
              example: '#FF5733'
            is_default:
              type: boolean
              example: false
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
  400:
    description: The body is not valid, or a field breaks a database
      constraint
  403:
    description: You are not an administrator
