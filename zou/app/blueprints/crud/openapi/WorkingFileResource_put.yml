Update a working file
---
tags:
  - Crud
description: Update the fields of a working file. Send only the fields to
  change. You cannot change id, created_at, updated_at. Dates use the ISO 8601
  format. The validation_status must be validated, rejected or neutral. You
  must be an administrator, or a manager or a client of the project. Other
  members of the project can change it if they are an assignee of the task or
  the creator of the entity. A supervisor can also change it if the task type
  is in their departments.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the working file
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            example: updated_work_file_v001
          revision:
            type: integer
            example: 2
          validation_status:
            type: string
            enum: [neutral, validated, rejected]
            example: validated
responses:
  200:
    description: The updated working file
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              example: updated_work_file_v001
            task_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            entity_id:
              type: string
              format: uuid
              example: c24a6ea4-ce75-4665-a070-57453082c250
            revision:
              type: integer
              example: 2
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T11:00:00Z'
  400:
    description: The body is not valid, a date is not valid, or a field
      breaks a database constraint
  403:
    description: You cannot act on the task of this working file
  404:
    description: The working file does not exist
