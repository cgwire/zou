Update working file
---
tags:
  - Crud
description: Update a working file with data provided in the
  request body. JSON format is expected. Requires task action
  access.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            example: updated_work_file_v001
          revision:
            type: integer
            example: 2
responses:
    200:
      description: Working file updated successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: updated_work_file_v001
              task_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              entity_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
              revision:
                type: integer
                example: 2
              created_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                example: "2024-01-15T11:00:00Z"
    400:
      description: Invalid data format or validation error
