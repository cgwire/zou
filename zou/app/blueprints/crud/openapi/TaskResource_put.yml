Update a task
---
tags:
  - Crud
description: Update the fields of a task. Send only the fields to change. You
  cannot change id, created_at, updated_at and project_id. Dates use the ISO
  8601 format. You must be an administrator or a manager of the project. A
  supervisor of the project can change only priority, start_date, due_date,
  estimation, difficulty and data. The task type must also be in the
  departments of the supervisor, if they have departments. The data field
  merges into the current metadata. A bot made for previews cannot be an
  assignee. A change of assignees sends task:assign and task:unassign events
  and notifies the new assignees.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the task
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          task_status_id:
            type: string
            format: uuid
            example: b24a6ea4-ce75-4665-a070-57453082c250
          assignees:
            type: array
            items:
              type: string
              format: uuid
            example: [c24a6ea4-ce75-4665-a070-57453082c250]
          duration:
            type: number
            example: 8.5
responses:
  200:
    description: The updated task
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            task_type_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            entity_id:
              type: string
              format: uuid
              example: c24a6ea4-ce75-4665-a070-57453082c250
            project_id:
              type: string
              format: uuid
              example: d24a6ea4-ce75-4665-a070-57453082c250
            task_status_id:
              type: string
              format: uuid
              example: e24a6ea4-ce75-4665-a070-57453082c250
            assignees:
              type: array
              items:
                type: string
                format: uuid
              example: [f24a6ea4-ce75-4665-a070-57453082c250]
            duration:
              type: number
              example: 8.5
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T11:00:00Z'
  400:
    description: The body is not valid, a date is not valid, or a field
      breaks a database constraint
  403:
    description: You are not a manager of the project, or you are a supervisor
      and you change a field or a task type that you cannot change
  404:
    description: The task does not exist
