Update a person
---
tags:
  - Crud
description: Update the fields of a person. Send only the fields to change.
  You can change your own person. To change another person, you must be an
  administrator. If you are not an administrator, the route ignores role,
  departments, active, is_bot, archived, studio_id, last_presence, the login
  failure fields and the LDAP, OIDC and SAML fields. A bot cannot change its
  own expiration_date. You cannot change id, created_at, updated_at,
  password, jti, the two-factor fields and the preview account fields. You
  cannot change a preview account. You cannot deactivate a protected account
  of another person or change its role. You cannot activate a person who is
  not a bot when the user limit is reached. The route checks role,
  contract_type, country, locale, display_date_format,
  two_factor_authentication, email and expiration_date. A new expiration
  date cannot be in the past. When you change expiration_date, the response
  gives a new access_token, unless the date is in the past. Dates use the
  ISO 8601 format.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the person
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          first_name:
            type: string
            example: Jane
          last_name:
            type: string
            example: Smith
          email:
            type: string
            format: email
            example: jane.smith@example.com
          password:
            type: string
            example: newsecurepassword123
          role:
            type: string
            example: manager
            description: Admin only
          active:
            type: boolean
            example: true
            description: Admin only
          contract_type:
            type: string
            example: freelance
          expiration_date:
            type: string
            format: date
            example: '2025-12-31'
            description: Person or admin only
          country:
            type: string
            description: ISO 3166-1 alpha-2 country code (nullable)
            example: FR
responses:
  200:
    description: The updated person
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            first_name:
              type: string
              example: Jane
            last_name:
              type: string
              example: Smith
            email:
              type: string
              format: email
              example: jane.smith@example.com
            role:
              type: string
              example: manager
            active:
              type: boolean
              example: true
            contract_type:
              type: string
              example: freelance
            two_factor_authentication:
              type: string
              example: totp
            departments:
              type: array
              items:
                type: string
                format: uuid
              example: []
            country:
              type: string
              description: ISO 3166-1 alpha-2 country code (nullable)
              example: FR
            access_token:
              type: string
              example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T11:00:00Z'
  400:
    description: The body is not valid, a date is not valid, or a field
      breaks a database constraint
  403:
    description: The person is not you and you are not an administrator, or
      the person is a preview account
  404:
    description: The person does not exist
