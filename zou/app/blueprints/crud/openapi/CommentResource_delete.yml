Delete a comment
---
tags:
  - Crud
description: Delete a comment. After the deletion, the task gets the status
  and the data of its last comment. A manager of the project can delete all
  the comments of the project. Other users can delete their own comments
  only.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the comment
responses:
  204:
    description: The comment is deleted
  400:
    description: Cannot delete comment or integrity error
  403:
    description: You cannot delete this comment
  404:
    description: The comment does not exist
