Delete a api event
---
tags:
  - Crud
description: Delete a api event. You must be an administrator.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the api event
responses:
  204:
    description: The api event is deleted
  400:
    description: Other data uses this row
  403:
    description: You cannot delete this api event
  404:
    description: The api event does not exist
