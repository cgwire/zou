Create an asset instance
---
tags:
  - Crud
description: Create an asset instance. Send the fields of the new row in
  JSON. You must be an administrator.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - asset_id
        properties:
          asset_id:
            type: string
            format: uuid
            example: a24a6ea4-ce75-4665-a070-57453082c250
          name:
            type: string
            example: Instance Name
responses:
  201:
    description: The new asset instance
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            asset_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              example: Instance Name
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
  400:
    description: The body is not valid, or a field breaks a database
      constraint
  403:
    description: You are not an administrator
