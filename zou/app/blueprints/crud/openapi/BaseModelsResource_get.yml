Get models
---
tags:
  - Crud
description: Retrieve all entries for the given model. Supports
  filtering via query parameters and pagination.
parameters:
  - in: query
    name: page
    required: false
    schema:
      type: integer
    example: 1
    description: Page number for pagination
  - in: query
    name: limit
    required: false
    schema:
      type: integer
    example: 50
    description: Number of results per page
  - in: query
    name: relations
    required: false
    schema:
      type: boolean
    default: false
    example: false
    description: Whether to include relations
  - in: query
    name: fields
    required: false
    schema:
      type: string
    example: first_name,last_name
    description: Comma-separated list of attributes to return for
      each entry (id and type are always included). Unknown names
      are ignored.
responses:
    200:
      description: Models retrieved successfully
      content:
        application/json:
          schema:
            oneOf:
              - type: array
                items:
                  type: object
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                    example: []
                  total:
                    type: integer
                    example: 100
                  nb_pages:
                    type: integer
                    example: 2
                  limit:
                    type: integer
                    example: 50
                  offset:
                    type: integer
                    example: 0
                  page:
                    type: integer
                    example: 1
    400:
      description: Invalid filter format or query error
