Delete a task
---
tags:
  - Crud
description: Delete a task. Without force, the task is deleted only if it
  has no comments and no files. With force=true, the comments, previews and
  files of the task are deleted too. If the entity showed a preview of this
  task, the entity gets the newest preview of its other tasks. You must be a
  manager of the project.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the task
  - in: query
    name: force
    required: false
    schema:
      type: boolean
      default: false
    example: false
    description: Delete the comments, previews and files of the task too
responses:
  204:
    description: The task is deleted
  400:
    description: The task has comments or files
  403:
    description: You are not a manager of the project
  404:
    description: The task does not exist
