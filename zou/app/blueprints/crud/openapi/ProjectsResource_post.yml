Create project
---
tags:
  - Crud
description: Create a new project with data provided in the
  request body. JSON format is expected. Validates production_style.
  For tvshow production type, automatically creates first episode.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
        properties:
          name:
            type: string
            example: Project Name
          production_type:
            type: string
            example: feature
          production_style:
            type: string
            default: 2d3d
            example: 2d3d
          project_status_id:
            type: string
            format: uuid
            example: a24a6ea4-ce75-4665-a070-57453082c25
responses:
    201:
      description: Project created successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c25
              name:
                type: string
                example: Project Name
              production_type:
                type: string
                example: feature
              production_style:
                type: string
                example: 2d3d
              project_status_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c25
              first_episode_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c25
              created_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
    400:
      description: Invalid data format or invalid production_style
