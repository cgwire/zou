Create task
---
tags:
  - Crud
description: Create a task with data provided in the request
  body. JSON format is expected. The task type must match the
  entity type.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - task_type_id
          - entity_id
        properties:
          task_type_id:
            type: string
            format: uuid
            example: a24a6ea4-ce75-4665-a070-57453082c250
          entity_id:
            type: string
            format: uuid
            example: b24a6ea4-ce75-4665-a070-57453082c250
          assignees:
            type: array
            items:
              type: string
              format: uuid
            example: ["c24a6ea4-ce75-4665-a070-57453082c250"]
responses:
    201:
      description: Task created successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: d24a6ea4-ce75-4665-a070-57453082c250
              task_type_id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              entity_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              assignees:
                type: array
                items:
                  type: string
                  format: uuid
                example: ["c24a6ea4-ce75-4665-a070-57453082c250"]
    400:
      description: Task type does not match entity type or task already exists
