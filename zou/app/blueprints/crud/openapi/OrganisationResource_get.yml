Get an organisation
---
tags:
  - Crud
description: Get an organisation. All signed-in users can read it. If you
  are not an administrator, you do not get the chat tokens and webhooks
  (chat_token_slack, chat_webhook_mattermost, chat_token_discord).
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the organisation
  - in: query
    name: relations
    required: false
    schema:
      type: boolean
      default: true
    example: true
    description: Add the related data. The default value is true.
responses:
  200:
    description: The organisation
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              example: Studio Name
            hours_by_day:
              type: number
              example: 8.0
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
  400:
    description: The identifier is not a valid UUID
  403:
    description: You cannot read this organisation
  404:
    description: The organisation does not exist
