SalaryScaleResource_delete:
  summary: Delete a salary scale
  tags:
    - Crud
  description: Delete a salary scale. You must be an administrator.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the salary scale
  responses:
    204:
      description: The salary scale is deleted
    400:
      description: Other data uses this row
    403:
      description: You are not an administrator
    404:
      description: The salary scale does not exist

SalaryScaleResource_get:
  summary: Get a salary scale
  tags:
    - Crud
  description: Get a salary scale. You must be an administrator.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the salary scale
    - in: query
      name: relations
      required: false
      schema:
        type: boolean
        default: true
      example: true
      description: Add the related data. The default value is true.
  responses:
    200:
      description: The salary scale
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              department_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              position:
                type: string
                example: artist
              seniority:
                type: string
                example: junior
              salary:
                type: integer
                description: Daily salary
                example: 50
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
    400:
      description: The identifier is not a valid UUID
    403:
      description: You are not an administrator
    404:
      description: The salary scale does not exist

SalaryScaleResource_put:
  summary: Update a salary scale
  tags:
    - Crud
  description: Update the fields of a salary scale. Send only the fields to
    change. You must be an administrator. You cannot change id, created_at,
    updated_at and department_id. Dates use the ISO 8601 format.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the salary scale
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            salary:
              type: integer
              description: Daily salary
  responses:
    200:
      description: The updated salary scale
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              department_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              position:
                type: string
                example: artist
              seniority:
                type: string
                example: junior
              salary:
                type: integer
                description: Daily salary
                example: 55
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T11:00:00Z'
    400:
      description: The body is not valid, a date is not valid, or a field
        breaks a database constraint
    403:
      description: You are not an administrator
    404:
      description: The salary scale does not exist

SalaryScalesResource_get:
  summary: Get the salary scales
  tags:
    - Crud
  description: Get the salary scales of the studio. Each department has a
    salary scale for each position and each seniority. This route creates the
    missing salary scales before it sends the list. You must be an
    administrator.
  responses:
    200:
      description: The list of salary scales
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  example: a24a6ea4-ce75-4665-a070-57453082c250
                department_id:
                  type: string
                  format: uuid
                  example: b24a6ea4-ce75-4665-a070-57453082c250
                position:
                  type: string
                  example: artist
                seniority:
                  type: string
                  example: junior
                salary:
                  type: integer
                  description: Daily salary
                  example: 50
    400:
      description: Query error
    403:
      description: You are not an administrator
