PlaylistResource_delete:
  summary: Delete a playlist
  tags:
    - Crud
  description: Delete a playlist. Its notifications, build jobs, movie files
    and share links are deleted too. You must be an administrator, or a
    manager in the team of the project. A supervisor in the team can also do
    it on the playlists they created and on the playlists with no creator.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the playlist
  responses:
    204:
      description: The playlist is deleted
    400:
      description: Other data uses this row
    403:
      description: You are not a manager in the team of the project, or a
        supervisor in the team who created the playlist
    404:
      description: The playlist does not exist

PlaylistResource_get:
  summary: Get a playlist
  tags:
    - Crud
  description: Get a playlist. You must be in the team of the project, or an
    administrator. A vendor cannot read playlists. A client can read only the
    playlists shared with clients.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the playlist
    - in: query
      name: relations
      required: false
      schema:
        type: boolean
        default: true
      example: true
      description: Add the related data. The default value is true.
  responses:
    200:
      description: The playlist
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: Playlist Name
              project_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              episode_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
              task_type_id:
                type: string
                format: uuid
                example: d24a6ea4-ce75-4665-a070-57453082c250
              shots:
                type: array
                items:
                  type: object
                example: []
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
    400:
      description: The identifier is not a valid UUID
    403:
      description: You are not in the team of the project, you are a vendor,
        or you are a client and the playlist is not shared with clients
    404:
      description: The playlist does not exist

PlaylistResource_put:
  summary: Update a playlist
  tags:
    - Crud
  description: Update the fields of a playlist. Send only the fields to
    change. You must be an administrator, or a manager in the team of the
    project. A supervisor in the team can also do it on the playlists they
    created and on the playlists with no creator. You cannot change id,
    created_at, updated_at and project_id. for_entity must be a valid value.
    In shots, each entry keeps only entity_id and preview_file_id. The route
    removes a preview that does not belong to its entity. Dates use the ISO
    8601 format.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the playlist
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
              example: Updated Playlist Name
            shots:
              type: array
              items:
                type: object
                properties:
                  entity_id:
                    type: string
                    format: uuid
                    example: b24a6ea4-ce75-4665-a070-57453082c250
                  preview_file_id:
                    type: string
                    format: uuid
                    example: c24a6ea4-ce75-4665-a070-57453082c250
              example: []
  responses:
    200:
      description: The updated playlist
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: Updated Playlist Name
              project_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              shots:
                type: array
                items:
                  type: object
                example: []
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T11:00:00Z'
    400:
      description: The body is not valid, a date is not valid, or a field
        breaks a database constraint
    403:
      description: You are not a manager in the team of the project, or a
        supervisor in the team who created the playlist
    404:
      description: The playlist does not exist

PlaylistsResource_get:
  summary: Get playlist rows
  tags:
    - Crud
  description: Get the playlist rows. A vendor cannot call this route. An
    administrator gets all the playlists. The other users get only the
    playlists of the projects of their teams. On a project where you are a
    client, you get only the playlists shared with clients. On a project where
    you are a vendor, you get no playlists. Add a query parameter for each
    column to filter on, for example name=Modeling. The name filter does not
    make a difference between upper case and lower case. To get the rows that
    have one value of a list, give the list in JSON, for example
    task_status_id=["<id1>","<id2>"].
  parameters:
    - in: query
      name: page
      required: false
      description: Page to get. Without this parameter, the response has all
        the rows.
      example: 1
      schema:
        type: integer
    - in: query
      name: limit
      required: false
      description: Number of rows in a page. The default value is 100.
      example: 100
      schema:
        type: integer
    - in: query
      name: relations
      required: false
      description: Add the related data to each row
      schema:
        type: boolean
        default: false
    - in: query
      name: fields
      required: false
      description: Comma-separated list of the fields to get for each row. The
        response always has id and type. The names that are not fields are
        ignored.
      example: id,name
      schema:
        type: string
  responses:
    200:
      description: The list of playlist rows, or a page of rows if you give
        page
      content:
        application/json:
          schema:
            oneOf:
              - type: array
                items:
                  type: object
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                    example: []
                  total:
                    type: integer
                    example: 100
                  nb_pages:
                    type: integer
                    example: 2
                  limit:
                    type: integer
                    example: 50
                  offset:
                    type: integer
                    example: 0
                  page:
                    type: integer
                    example: 1
    400:
      description: A filter is not valid
    403:
      description: You are a vendor

PlaylistsResource_post:
  summary: Create a playlist
  tags:
    - Crud
  description: Create a playlist. Send the fields of the new row in JSON. You
    must be an administrator, or a manager or a supervisor in the team of the
    project. The route sets created_by to you. for_entity must be a valid
    value. An episode_id of all or main gives no episode. A task_type_id that
    is not a valid UUID gives no task type. In shots, the route removes a
    preview that does not belong to its entity.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
            - project_id
          properties:
            name:
              type: string
              example: Playlist Name
            project_id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            episode_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            task_type_id:
              type: string
              format: uuid
              example: c24a6ea4-ce75-4665-a070-57453082c250
            shots:
              type: array
              description: Shots of the playlist with their previews
              items:
                type: object
                properties:
                  entity_id:
                    type: string
                    format: uuid
                  preview_file_id:
                    type: string
                    format: uuid
  responses:
    201:
      description: The new playlist
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: Playlist Name
              project_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              episode_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
              task_type_id:
                type: string
                format: uuid
                example: d24a6ea4-ce75-4665-a070-57453082c250
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
    400:
      description: The body is not valid, or a field breaks a database
        constraint
    403:
      description: You are not an administrator, or a manager or a supervisor
        in the team of the project
