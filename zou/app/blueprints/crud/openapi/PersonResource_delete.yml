Delete a person
---
tags:
  - Crud
description: Delete a person. You cannot delete yourself or a protected
  account. Without force, the person is deleted only if no other data uses
  it. With force=true, the comments, notifications, logs, subscriptions,
  time spents, team memberships and task assignments of the person are
  deleted or detached first. You must be an administrator.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the person
  - in: query
    name: force
    required: false
    schema:
      type: boolean
      default: false
    example: false
    description: Delete or detach all the data of the person first
responses:
  204:
    description: The person is deleted
  400:
    description: Other data uses the person, or the account is protected
  403:
    description: You are not an administrator, or you try to delete yourself
  404:
    description: The person does not exist
