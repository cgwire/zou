Get a person
---
tags:
  - Crud
description: Get a person. All users can call this route. A manager or an
  administrator gets all the fields but the password and the two-factor
  secrets. A client can read only the people of the teams of their open
  projects, with a short set of fields. The other users get a minimal set of
  fields.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the person
  - in: query
    name: relations
    required: false
    schema:
      type: boolean
      default: true
    example: true
    description: Add the related data. The default value is true.
responses:
  200:
    description: The person
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            first_name:
              type: string
              example: John
            last_name:
              type: string
              example: Doe
            email:
              type: string
              format: email
              example: john.doe@example.com
            role:
              type: string
              example: user
            active:
              type: boolean
              example: true
            contract_type:
              type: string
              example: permanent
            two_factor_authentication:
              type: string
              example: none
            departments:
              type: array
              items:
                type: string
                format: uuid
              example: []
            country:
              type: string
              description: ISO 3166-1 alpha-2 country code (nullable)
              example: FR
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
  400:
    description: The identifier is not a valid UUID
  403:
    description: You are a client and the person is not in the teams of your
      projects
  404:
    description: The person does not exist
