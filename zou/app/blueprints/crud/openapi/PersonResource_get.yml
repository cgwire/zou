Get person
---
tags:
  - Crud
description: Retrieve a person by their ID and return it as a
  JSON object. Supports including relations. Managers see safe
  serialization, others see minimal information.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: query
    name: relations
    required: false
    schema:
      type: boolean
    default: true
    example: true
    description: Whether to include relations
responses:
    200:
      description: Person retrieved successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              first_name:
                type: string
                example: John
              last_name:
                type: string
                example: Doe
              email:
                type: string
                format: email
                example: john.doe@example.com
              role:
                type: string
                example: user
              active:
                type: boolean
                example: true
              contract_type:
                type: string
                example: permanent
              two_factor_authentication:
                type: string
                example: none
              departments:
                type: array
                items:
                  type: string
                  format: uuid
                example: []
              country:
                type: string
                description: ISO 3166-1 alpha-2 country code (nullable)
                example: FR
              created_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
    400:
      description: Invalid ID format or query error
