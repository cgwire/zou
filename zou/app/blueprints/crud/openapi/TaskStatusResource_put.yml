Update a task status
---
tags:
  - Crud
description: Update the fields of a task status. Send only the fields to
  change. You cannot change id, created_at, updated_at. Dates use the ISO 8601
  format. If is_default is true, the previous default status stops being the
  default. You must be an administrator.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the task status
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            example: In Progress
          short_name:
            type: string
            example: WIP
          color:
            type: string
            example: '#00FF00'
          is_default:
            type: boolean
            example: true
responses:
  200:
    description: The updated task status
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              example: In Progress
            short_name:
              type: string
              example: WIP
            color:
              type: string
              example: '#00FF00'
            is_default:
              type: boolean
              example: true
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T11:00:00Z'
  400:
    description: The body is not valid, a date is not valid, or a field
      breaks a database constraint
  403:
    description: You are not an administrator
  404:
    description: The task status does not exist
