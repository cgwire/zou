Create a status automation
---
tags:
  - Crud
description: Create a status automation. Send the fields of the new row in
  JSON. You must be an administrator.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          entity_type:
            type: string
            description: Type of entity of the tasks, for example asset or
              shot
            default: asset
          in_task_type_id:
            type: string
            format: uuid
            description: Task type that starts the automation
            example: a24a6ea4-ce75-4665-a070-57453082c250
          in_task_status_id:
            type: string
            format: uuid
            description: Task status that starts the automation
            example: a24a6ea4-ce75-4665-a070-57453082c250
          out_field_type:
            type: string
            enum:
              - status
              - ready_for
            description: Field that the automation changes
          out_task_type_id:
            type: string
            format: uuid
            description: Task type that the automation changes
            example: a24a6ea4-ce75-4665-a070-57453082c250
          out_task_status_id:
            type: string
            format: uuid
            description: New task status
            example: a24a6ea4-ce75-4665-a070-57453082c250
          import_last_revision:
            type: boolean
            description: Copy the last preview to the changed task
responses:
  201:
    description: The new status automation
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            source_task_status_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            target_task_status_id:
              type: string
              format: uuid
              example: c24a6ea4-ce75-4665-a070-57453082c250
            field_name:
              type: string
              example: ready_for
            field_value:
              type: string
              example: production
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
  400:
    description: The body is not valid, or a field breaks a database
      constraint
  403:
    description: You are not an administrator
