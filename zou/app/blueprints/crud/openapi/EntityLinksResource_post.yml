Create an entity link
---
tags:
  - Crud
description: Create an entity link. Send the fields of the new row in JSON.
  You must be an administrator.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - entity_in_id
          - entity_out_id
        properties:
          entity_in_id:
            type: string
            format: uuid
            example: a24a6ea4-ce75-4665-a070-57453082c250
          entity_out_id:
            type: string
            format: uuid
            example: b24a6ea4-ce75-4665-a070-57453082c250
          nb_occurences:
            type: integer
            default: 1
            example: 1
          label:
            type: string
            example: fixed
responses:
  201:
    description: The new entity link
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            entity_in_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            entity_out_id:
              type: string
              format: uuid
              example: c24a6ea4-ce75-4665-a070-57453082c250
            nb_occurences:
              type: integer
              example: 1
            label:
              type: string
              example: fixed
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
  400:
    description: The body is not valid, or a field breaks a database
      constraint
  403:
    description: You are not an administrator
