Update a budget entry
---
tags:
  - Crud
description: Update the fields of a budget entry. Send only the fields to
  change. You cannot change id, created_at, updated_at. Dates use the ISO
  8601 format. You must be an administrator.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the budget entry
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          daily_salary:
            type: number
            description: Daily salary of the entry
responses:
  200:
    description: The updated budget entry
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            budget_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            amount:
              type: number
              example: 1500.0
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T11:00:00Z'
  400:
    description: The body is not valid, a date is not valid, or a field
      breaks a database constraint
  403:
    description: You cannot update this budget entry
  404:
    description: The budget entry does not exist
