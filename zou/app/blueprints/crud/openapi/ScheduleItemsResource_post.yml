Create schedule item
---
tags:
  - Crud
description: Create a new schedule item with data provided in
  the request body. JSON format is expected. Similar schedule
  items cannot exist with same project, task type, and object.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - project_id
          - task_type_id
          - object_id
        properties:
          project_id:
            type: string
            format: uuid
            example: a24a6ea4-ce75-4665-a070-57453082c250
          task_type_id:
            type: string
            format: uuid
            example: b24a6ea4-ce75-4665-a070-57453082c250
          object_id:
            type: string
            format: uuid
            example: c24a6ea4-ce75-4665-a070-57453082c250
          man_days:
            type: number
            example: 10.5
responses:
    201:
      description: Schedule item created successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              project_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              task_type_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
              object_id:
                type: string
                format: uuid
                example: d24a6ea4-ce75-4665-a070-57453082c250
              man_days:
                type: number
                example: 10.5
              created_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
    400:
      description: Invalid data format or similar schedule item exists
