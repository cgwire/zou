StatusAutomationResource_delete:
  summary: Delete a status automation
  tags:
    - Crud
  description: Delete a status automation. You cannot delete an automation
    that a project or a project template uses. You must be an administrator.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the status automation
  responses:
    204:
      description: The status automation is deleted
    400:
      description: A project or a project template uses this automation
    403:
      description: You are not an administrator
    404:
      description: The status automation does not exist

StatusAutomationResource_get:
  summary: Get a status automation
  tags:
    - Crud
  description: Get a status automation. You must be an administrator.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the status automation
    - in: query
      name: relations
      required: false
      schema:
        type: boolean
        default: true
      example: true
      description: Add the related data. The default value is true.
  responses:
    200:
      description: The status automation
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              entity_type:
                type: string
                example: asset
              in_conditions:
                type: object
                nullable: true
                example:
                  operator: and
                  conditions:
                    - task_type_id: b24a6ea4-ce75-4665-a070-57453082c250
                      task_status_ids:
                        - c24a6ea4-ce75-4665-a070-57453082c250
                    - task_type_id: d24a6ea4-ce75-4665-a070-57453082c250
                      task_status_ids:
                        - c24a6ea4-ce75-4665-a070-57453082c250
                        - e24a6ea4-ce75-4665-a070-57453082c250
              in_task_type_id:
                type: string
                format: uuid
                nullable: true
                deprecated: true
                description: Set for a trigger of one condition with one status
                  only
                example: null
              in_task_status_id:
                type: string
                format: uuid
                nullable: true
                deprecated: true
                description: Set for a trigger of one condition with one status
                  only
                example: null
              out_field_type:
                type: string
                example: status
              out_task_type_id:
                type: string
                format: uuid
                example: f24a6ea4-ce75-4665-a070-57453082c250
              out_task_status_id:
                type: string
                format: uuid
                nullable: true
                example: a34a6ea4-ce75-4665-a070-57453082c250
              out_only_if_task_status_ids:
                type: array
                nullable: true
                items:
                  type: string
                  format: uuid
                example: null
              import_last_revision:
                type: boolean
                example: false
              archived:
                type: boolean
                example: false
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
    400:
      description: The identifier is not a valid UUID
    403:
      description: You are not an administrator
    404:
      description: The status automation does not exist

StatusAutomationResource_put:
  summary: Update a status automation
  tags:
    - Crud
  description: Update the fields of a status automation. Send only the fields to
    change. You cannot change id, created_at, updated_at. Dates use the ISO 8601
    format. The automation is validated when you change its trigger, entity
    type or output. You must be an administrator.
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the status automation
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            entity_type:
              type: string
              description: Type of entity of the tasks (asset, shot, sequence,
                episode or edit). Empty means asset.
              default: asset
            in_conditions:
              type: object
              description: >-
                Conditions that start the automation. It runs when a comment
                changes a task status and turns the group from false to true. A
                condition is met when every task of its task type on the entity
                has one of its statuses, and a condition on a task type that
                the entity has no task of is ignored. Each task type appears
                once and belongs to the entity type. With a status output, the
                task type that the automation changes cannot be a condition,
                and a condition on a task type after it in the production never
                starts the automation: under and it still has to be met, under
                or it is left out. Other keys are refused.
              additionalProperties: false
              required:
                - operator
                - conditions
              properties:
                operator:
                  type: string
                  enum:
                    - and
                    - or
                conditions:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - task_type_id
                      - task_status_ids
                    properties:
                      task_type_id:
                        type: string
                        format: uuid
                      task_status_ids:
                        type: array
                        minItems: 1
                        items:
                          type: string
                          format: uuid
              example:
                operator: and
                conditions:
                  - task_type_id: b24a6ea4-ce75-4665-a070-57453082c250
                    task_status_ids:
                      - c24a6ea4-ce75-4665-a070-57453082c250
                  - task_type_id: d24a6ea4-ce75-4665-a070-57453082c250
                    task_status_ids:
                      - c24a6ea4-ce75-4665-a070-57453082c250
                      - e24a6ea4-ce75-4665-a070-57453082c250
            in_task_type_id:
              type: string
              format: uuid
              nullable: true
              deprecated: true
              description: >-
                Task type that starts the automation, with in_task_status_id,
                when in_conditions is not given or sent back as stored. Both
                null next to in_conditions, they are ignored. The pair cannot
                clear the trigger: archive the automation instead. Refused on
                an automation whose trigger has several conditions or statuses.
              example: a24a6ea4-ce75-4665-a070-57453082c250
            in_task_status_id:
              type: string
              format: uuid
              nullable: true
              deprecated: true
              description: Task status that starts the automation, see
                in_task_type_id
              example: a24a6ea4-ce75-4665-a070-57453082c250
            out_field_type:
              type: string
              enum:
                - status
                - ready_for
              description: Field that the automation changes. ready_for applies
                to assets only.
            out_task_type_id:
              type: string
              format: uuid
              description: Task type that the automation changes
              example: a24a6ea4-ce75-4665-a070-57453082c250
            out_task_status_id:
              type: string
              format: uuid
              nullable: true
              description: New task status, null with a ready for output
              example: a24a6ea4-ce75-4665-a070-57453082c250
            out_only_if_task_status_ids:
              type: array
              nullable: true
              items:
                type: string
                format: uuid
              description: With a status output, the change applies only to a
                task in one of these statuses. Empty or null means always.
              example: []
            import_last_revision:
              type: boolean
              description: Copy the last preview to the changed task, from the
                task of the first condition the entity has with and, from the
                commented task with or
            archived:
              type: boolean
              example: false
  responses:
    200:
      description: The updated status automation
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              entity_type:
                type: string
                example: asset
              in_conditions:
                type: object
                nullable: true
                example:
                  operator: and
                  conditions:
                    - task_type_id: b24a6ea4-ce75-4665-a070-57453082c250
                      task_status_ids:
                        - c24a6ea4-ce75-4665-a070-57453082c250
                    - task_type_id: d24a6ea4-ce75-4665-a070-57453082c250
                      task_status_ids:
                        - c24a6ea4-ce75-4665-a070-57453082c250
                        - e24a6ea4-ce75-4665-a070-57453082c250
              in_task_type_id:
                type: string
                format: uuid
                nullable: true
                deprecated: true
                description: Set for a trigger of one condition with one status
                  only
                example: null
              in_task_status_id:
                type: string
                format: uuid
                nullable: true
                deprecated: true
                description: Set for a trigger of one condition with one status
                  only
                example: null
              out_field_type:
                type: string
                example: status
              out_task_type_id:
                type: string
                format: uuid
                example: f24a6ea4-ce75-4665-a070-57453082c250
              out_task_status_id:
                type: string
                format: uuid
                nullable: true
                example: a34a6ea4-ce75-4665-a070-57453082c250
              out_only_if_task_status_ids:
                type: array
                nullable: true
                items:
                  type: string
                  format: uuid
                example: null
              import_last_revision:
                type: boolean
                example: false
              archived:
                type: boolean
                example: false
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
              updated_at:
                type: string
                format: date-time
                example: '2024-01-15T11:00:00Z'
    400:
      description: >-
        The body is not valid, a date is not valid, a field breaks a database
        constraint, or the automation is not valid, for example "Trigger
        operator must be 'and' or 'or'.", "Task type Layout is not a task type
        of assets.", "Task type Layout appears in two conditions: merge their
        statuses into one." or "This automation has several trigger
        conditions: update it through in_conditions."
    403:
      description: You are not an administrator
    404:
      description: The status automation does not exist

StatusAutomationsResource_get:
  summary: Get status automation rows
  tags:
    - Crud
  description: Get the status automation rows. Add a query parameter for each
    column to filter on, for example name=Modeling. The name filter does not
    make a difference between upper case and lower case. To get the rows that
    have one value of a list, give the list in JSON, for example
    task_status_id=["<id1>","<id2>"]. All users can read them, except vendors.
  parameters:
    - in: query
      name: page
      required: false
      description: Page to get. Without this parameter, the response has all
        the rows.
      example: 1
      schema:
        type: integer
    - in: query
      name: limit
      required: false
      description: Number of rows in a page. The default value is 100.
      example: 100
      schema:
        type: integer
    - in: query
      name: relations
      required: false
      description: Add the related data to each row
      schema:
        type: boolean
        default: false
    - in: query
      name: fields
      required: false
      description: Comma-separated list of the fields to get for each row. The
        response always has id and type. The names that are not fields are
        ignored.
      example: id,name
      schema:
        type: string
  responses:
    200:
      description: The list of status automation rows, or a page of rows if
        you give page
      content:
        application/json:
          schema:
            oneOf:
              - type: array
                items:
                  type: object
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                    example: []
                  total:
                    type: integer
                    example: 100
                  nb_pages:
                    type: integer
                    example: 2
                  limit:
                    type: integer
                    example: 50
                  offset:
                    type: integer
                    example: 0
                  page:
                    type: integer
                    example: 1
    400:
      description: A filter is not valid
    403:
      description: You are a vendor

