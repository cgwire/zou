Update preview background file
---
tags:
  - Crud
description: Update a preview background file with data provided
  in the request body. JSON format is expected. Names must be
  unique. If is_default is set to true, resets other defaults.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            example: updated_background_file_name
          is_default:
            type: boolean
            example: true
responses:
    200:
      description: Preview background file updated successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: updated_background_file_name
              is_default:
                type: boolean
                example: true
              created_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                example: "2024-01-15T11:00:00Z"
    400:
      description: Invalid data format or name already exists
