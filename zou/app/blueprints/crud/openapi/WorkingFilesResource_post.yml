Create a working file
---
tags:
  - Crud
description: Create a working file. Send the fields of the new row in JSON.
  You must be an administrator.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - task_id
          - entity_id
        properties:
          name:
            type: string
            example: work_file_v001
          task_id:
            type: string
            format: uuid
            example: a24a6ea4-ce75-4665-a070-57453082c250
          entity_id:
            type: string
            format: uuid
            example: b24a6ea4-ce75-4665-a070-57453082c250
          revision:
            type: integer
            default: 1
            example: 1
responses:
  201:
    description: The new working file
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              example: work_file_v001
            task_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            entity_id:
              type: string
              format: uuid
              example: c24a6ea4-ce75-4665-a070-57453082c250
            revision:
              type: integer
              example: 1
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
  400:
    description: The body is not valid, or a field breaks a database
      constraint
  403:
    description: You cannot create a working file
