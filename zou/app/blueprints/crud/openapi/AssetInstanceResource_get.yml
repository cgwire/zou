Get an asset instance
---
tags:
  - Crud
description: Get an asset instance. An administrator can read all the asset
  instances. Other users must have access to the project of the asset. A
  vendor must also have a task on the asset.
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the asset instance
  - in: query
    name: relations
    required: false
    schema:
      type: boolean
      default: true
    example: true
    description: Add the related data. The default value is true.
responses:
  200:
    description: The asset instance
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            asset_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              example: Instance Name
            number:
              type: integer
              example: 1
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
  400:
    description: The identifier is not a valid UUID
  403:
    description: You do not have access to the project of the asset, or you
      are a vendor without a task on the asset
  404:
    description: The asset instance does not exist
