AddToDepartmentResource_post:
  summary: Add a person to a department
  description: Add a person to a department. You must be an administrator.
  tags:
    - Persons
  parameters:
    - in: path
      name: person_id
      required: true
      schema:
        type: string
        format: uuid
      description: Person unique identifier
      example: a24a6ea4-ce75-4665-a070-57453082c250
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - department_id
          properties:
            department_id:
              type: string
              format: uuid
              description: Department unique identifier
              example: b35b7fb5-df86-5776-b181-68564193d360
  responses:
    201:
      description: The person, with its departments
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Person unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              departments:
                type: array
                items:
                  type: string
                  format: uuid
                description: The departments of the person
                example: [b35b7fb5-df86-5776-b181-68564193d360]
    400:
      description: The department does not exist, or the identifier is not
        valid
    403:
      description: You are not an administrator
    404:
      description: The person does not exist

ChangePasswordForPersonResource_post:
  summary: Change the password of a person
  description: Set a new password for a person. Give the new password two
    times. You cannot change the password of a protected account. You cannot
    change the password of another administrator who already has a password.
    You can set the first password of a new administrator. The person gets an
    email about the change. You must be an administrator.
  tags:
    - Persons
  parameters:
    - in: path
      name: person_id
      required: true
      schema:
        type: string
        format: uuid
      description: Person unique identifier
      example: a24a6ea4-ce75-4665-a070-57453082c250
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - password
            - password_2
          properties:
            password:
              type: string
              format: password
              description: New password
              example: newSecurePassword123
            password_2:
              type: string
              format: password
              description: Password confirmation
              example: newSecurePassword123
  responses:
    200:
      description: The password is changed
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                description: Success flag
                example: true
    400:
      description: The two passwords are different, the password is too short,
        the person is a protected account, or the person is another
        administrator who already has a password
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: boolean
                description: Error flag
                example: true
              message:
                type: string
                description: Error message
                example: Password is too short.
    403:
      description: You are not an administrator, or the person is a bot
    404:
      description: The person does not exist

ClearAvatarPersonResource_delete:
  summary: Delete the avatar of a person
  description: Delete the avatar file of a person and set has_avatar to false.
    You must be an administrator.
  tags:
    - Persons
  parameters:
    - in: path
      name: person_id
      required: true
      schema:
        type: string
        format: uuid
      description: Person unique identifier
      example: a24a6ea4-ce75-4665-a070-57453082c250
  responses:
    204:
      description: The avatar is deleted
    403:
      description: You are not an administrator
    404:
      description: The person does not exist

DateTimeSpentsResource_get:
  summary: Get the time spents of a person for a date
  description: Get the time spent entries of a person for one date. An
    administrator and the person get all the entries. A manager gets the
    entries of the projects they manage. A supervisor gets the entries of the
    projects they supervise, for the task types of their departments. A
    supervisor without department gets all the task types. Other users cannot
    read the time spents of other persons. You cannot read the time spents of
    a bot. The manager and supervisor roles are the roles held on the project
    team.
  tags:
    - Persons
  parameters:
    - in: path
      name: person_id
      required: true
      schema:
        type: string
        format: uuid
      description: Person unique identifier
      example: a24a6ea4-ce75-4665-a070-57453082c250
    - in: path
      name: date
      required: true
      schema:
        type: string
        format: date
      description: Date in the YYYY-MM-DD format
      example: '2022-07-12'
  responses:
    200:
      description: The list of time spent entries
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: Time spent unique identifier
                  example: a24a6ea4-ce75-4665-a070-57453082c250
                person_id:
                  type: string
                  format: uuid
                  description: Person unique identifier
                  example: b35b7fb5-df86-5776-b181-68564193d360
                duration:
                  type: number
                  format: float
                  description: Time spent duration in hours
                  example: 8.5
                date:
                  type: string
                  format: date
                  description: Date of time spent entry
                  example: '2022-07-12'
    400:
      description: The date is not valid
    403:
      description: You cannot read the time spents of this person, or the
        person is a bot
    404:
      description: The person does not exist

DayOffForMonthResource_get:
  summary: Get the day offs of a month
  description: Get the day offs of a month. An administrator gets all the day
    offs. A manager gets the day offs of the persons of their projects. A
    supervisor gets the dates only, for the persons of their projects who
    share one of their departments. A supervisor without department gets all
    the persons of their projects. Other users get their own day offs.
  tags:
    - Persons
  parameters:
    - in: path
      name: year
      required: true
      schema:
        type: integer
      description: Year, for example 2026
      example: 2022
    - in: path
      name: month
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 12
      description: Month, from 1 to 12
      example: 7
  responses:
    200:
      description: The list of day offs
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
    400:
      description: The year or the month is not valid

DayOffForYearResource_get:
  summary: Get the day offs of a year
  description: Get the day offs of a year. An administrator gets all the day
    offs. A manager gets the day offs of the persons of their projects. A
    supervisor gets the dates only, for the persons of their projects who
