    project team. Other users cannot read them.
  tags:
    - Persons
  parameters:
    - in: path
      name: person_id
      required: true
      schema:
        type: string
        format: uuid
      description: Person unique identifier
      example: a24a6ea4-ce75-4665-a070-57453082c250
  responses:
    200:
      description: The list of day offs
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
    403:
      description: You cannot read the day offs of this person, or the person
        is a bot
    404:
      description: The person does not exist

PersonDayQuotaShotsResource_get:
  summary: Get the quota shots of a person for a day
  description: Get the shots that count in the quota of a person for a day. A
    quota shot is a shot that the person ended. An administrator reads the
    quotas of all persons. The person reads their own quotas. Give project_id
    to read the quotas of another person. You must then be a manager or a
    supervisor in the team of this project. The role held on the project team
    applies. A manager or a supervisor who gives a project_id of a project
    they are not a team member of gets a 403, also for their own quotas.
  tags:
    - Persons
  parameters:
    - in: path
      name: person_id
      required: true
      schema:
        type: string
        format: uuid
      description: Person unique identifier
      example: a24a6ea4-ce75-4665-a070-57453082c250
    - in: path
      name: year
      required: true
      schema:
        type: integer
      description: Year, for example 2026
      example: 2022
    - in: path
      name: month
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 12
      description: Month, from 1 to 12
      example: 7
    - in: path
      name: day
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 31
      description: Day of the month
      example: 12
    - in: query
      name: count_mode
      required: false
      schema:
        type: string
        enum: [weighted, weighteddone, feedback, done]
      description: 'How to count the shots: weighted, weighteddone, feedback or
        done. The default value is weighted. The weighted modes give each shot the
        part of its work time that is in the period. The other modes count each
        shot on its end date. The feedback modes end a shot at its first feedback.
        The done modes end a shot when it is done.'
      example: weighted
    - in: query
      name: project_id
      required: false
      schema:
        type: string
        format: uuid
      description: >-
        Get only the shots of this project
      example: a24a6ea4-ce75-4665-a070-57453082c250
    - in: query
      name: task_type_id
      required: false
      schema:
        type: string
        format: uuid
      description: >-
        Get only the shots of this task type
      example: b35b7fb5-df86-5776-b181-68564193d361
  responses:
    200:
      description: The list of quota shots
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              description: >-
                A serialized shot, with its project_id, full_name and the
                weight it carries in the period.
    400:
      description: The date or count_mode is not valid
    403:
      description: You cannot read the quotas of this person, or the person is
        a bot
    404:
      description: The person does not exist

PersonDayTimeSpentsResource_get:
  summary: Get the time spent of a person for a day, by task
  description: Get the time spent of a person for a day, with one entry per
    task. Give project_id to keep the tasks of one project. An administrator
    and the person get all the tasks. A manager gets the tasks of the projects
    they manage. A supervisor gets the tasks of the projects they supervise,
    for the task types of their departments. A supervisor without department
    gets all the task types. A manager or a supervisor who gives a project_id
    of another project gets a 403. Other users cannot read the time spents of
    other persons. You cannot read the time spents of a bot. The manager and
    supervisor roles are the roles held on the project team.
  tags:
    - Persons
  parameters:
    - in: path
      name: person_id
      required: true
      schema:
        type: string
        format: uuid
      description: Person unique identifier
      example: a24a6ea4-ce75-4665-a070-57453082c250
    - in: path
      name: year
      required: true
      schema:
        type: integer
      description: Year, for example 2026
      example: 2022
    - in: path
      name: month
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 12
      description: Month, from 1 to 12
      example: 7
    - in: path
      name: day
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 31
      description: Day of the month
      example: 12
    - in: query
      name: project_id
      required: false
      description: Get only the time spent on this project
      schema:
        type: string
        format: uuid
  responses:
    200:
      description: The time spent of each task for the day
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                task_id:
                  type: string
                  format: uuid
                  description: Task unique identifier
                task_type_id:
                  type: string
                  format: uuid
                  description: Task type of the task
                project_id:
                  type: string
                  format: uuid
                  description: Project of the task
                project_name:
                  type: string
                  description: Project name
                entity_name:
                  type: string
                  description: Name of the entity of the task
                entity_type_name:
                  type: string
                  description: Name of the entity type of the task
                sequence_name:
                  type: string
                  description: Sequence name, for a shot
                episode_name:
                  type: string
                  description: Episode name, for a shot
                duration:
                  type: number
                  format: float
                  description: Time spent on the task in hours
                  example: 8.5
    400:
      description: The date is not valid
    403:
      description: You cannot read the time spents of this person, or the
        person is a bot, or you cannot access this project
    404:
      description: The person does not exist

