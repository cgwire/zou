DayOffResource_get:
  summary: Get the day off of a person for a date
  description: Get the day off of a person for one date. An administrator, the
    person, and a manager of a project where the person is a team member get
    the day off with its description. A supervisor of such a project who
    shares a department with the person gets the day off without its
    description. A supervisor without department gets it for all the persons
    of their projects. The manager and supervisor roles are the roles held on
    the project team. Other users cannot read it.
  tags:
    - Persons
  parameters:
    - in: path
      name: person_id
      required: true
      schema:
        type: string
        format: uuid
      description: Person unique identifier
      example: a24a6ea4-ce75-4665-a070-57453082c250
    - in: path
      name: date
      required: true
      schema:
        type: string
        format: date
      description: Date in the YYYY-MM-DD format
      example: '2022-07-12'
  responses:
    200:
      description: The day off, or an empty object if the person works on this
        date
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Day off unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              person_id:
                type: string
                format: uuid
                description: Person unique identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
              date:
                type: string
                format: date
                description: Day off date
                example: '2022-07-12'
              end_date:
                type: string
                format: date
                description: Last date of the day off
                example: '2022-07-12'
              description:
                type: string
                description: Day off description, absent for a supervisor
                example: Holidays
    400:
      description: The date is not valid
    403:
      description: You cannot read the day offs of this person, or the person
        is a bot
    404:
      description: The person does not exist

DesktopLoginsResource_get:
  summary: Get the desktop logins of a person
  description: Get the login logs of the desktop tools of a person. A manager
    can read the logs of all persons. Other users can read their own logs
    only.
  tags:
    - Persons
  parameters:
    - in: path
      name: person_id
      required: true
      schema:
        type: string
        format: uuid
      description: Person unique identifier
      example: a24a6ea4-ce75-4665-a070-57453082c250
  responses:
    200:
      description: The list of desktop login logs
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: Log entry unique identifier
                  example: a24a6ea4-ce75-4665-a070-57453082c250
                person_id:
                  type: string
                  format: uuid
                  description: Person unique identifier
                  example: b35b7fb5-df86-5776-b181-68564193d360
                date:
                  type: string
                  format: date-time
                  description: Login date and time
                  example: '2022-07-12T10:30:00Z'
    403:
      description: You cannot read the logs of this person
    404:
      description: The person does not exist

DesktopLoginsResource_post:
  summary: Add a desktop login of a person
  description: Add a login log of a desktop tool for a person. Without date,
    the log uses the current date. You can add logs for yourself only. An
    administrator can add logs for all persons.
  tags:
    - Persons
  parameters:
    - in: path
      name: person_id
      required: true
      schema:
        type: string
        format: uuid
      description: Person unique identifier
      example: a24a6ea4-ce75-4665-a070-57453082c250
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            date:
              type: string
              format: date
              description: Login date
              example: '2022-07-12'
  responses:
    201:
      description: The new desktop login log
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Log entry unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              person_id:
                type: string
                format: uuid
                description: Person unique identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
              date:
                type: string
                format: date-time
                description: Login date and time
                example: '2022-07-12T10:30:00Z'
    400:
      description: The date is not valid
    403:
      description: You cannot add logs for this person

DisableTwoFactorAuthenticationPersonResource_delete:
