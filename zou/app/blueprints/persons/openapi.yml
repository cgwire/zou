ResetPasswordLinkResource_post:
  summary: Get a password reset link
  description: Get the password reset link of a person. This link is the same
    as the link in the password reset email. Thus, an administrator can send
    it by another way, for example when the email server is not set. If a
    reset token is valid, the route uses it again. Thus, a link that you sent
    before stays valid. Else, the route makes a new token. You must be an
    administrator.
  tags:
    - Persons
  parameters:
    - in: path
      name: person_id
      required: true
      schema:
        type: string
        format: uuid
      description: Person unique identifier
      example: a24a6ea4-ce75-4665-a070-57453082c250
  responses:
    200:
      description: The password reset link
      content:
        application/json:
          schema:
            type: object
            properties:
              reset_password_link:
                type: string
                description: Link to follow to choose a new password
    400:
      description: The person is a protected account, or another
        administrator who has a password
    403:
      description: You are not an administrator, or the person is a bot
    404:
      description: The person does not exist

TimeSpentMonthResource_get:
  summary: Get the time spent table of a month
  description: Get a table of the time spent of each person for each day of a
    month. Add project_id, department_id or studio_id to filter the table. An
    administrator gets the time spent of all persons. A manager gets the time
    spent logged on the tasks of the projects they manage, for all persons. A
    supervisor gets the time spent of the projects they supervise, for the
    task types of their departments. A supervisor without department gets all
    the task types. A manager or a supervisor who gives a project_id of
    another project gets a 403. A supervisor who gives a department_id that is
    not one of their departments gets a 400. Other users get their own time
    spent only. The filters still apply to them. The manager and supervisor
    roles are the roles held on the project team.
  tags:
    - Persons
  parameters:
    - in: path
      name: year
      required: true
      schema:
        type: integer
      description: Year, for example 2026
      example: 2022
    - in: path
      name: month
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 12
      description: Month, from 1 to 12
      example: 7
    - in: query
      name: project_id
      required: false
      description: Get only the time spents of this project
      schema:
        type: string
        format: uuid
    - in: query
      name: department_id
      required: false
      description: Get only the persons of this department
      schema:
        type: string
        format: uuid
    - in: query
      name: studio_id
      required: false
      description: Get only the persons of this studio
      schema:
        type: string
        format: uuid
  responses:
    200:
      description: A map of each day of the month to a map of person
        identifiers to the time spent in hours
      content:
        application/json:
          schema:
            type: object
    400:
      description: The date is not valid, or a supervisor asks for another
        department
    403:
      description: You cannot access this project

