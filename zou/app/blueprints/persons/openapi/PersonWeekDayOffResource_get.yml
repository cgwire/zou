Get person week day offs
---
description: Return all day off recorded for given week and person.
tags:
  - Persons
parameters:
  - in: path
    name: person_id
    required: true
    schema:
      type: string
      format: uuid
    description: Person unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c25
  - in: path
    name: year
    required: true
    schema:
      type: integer
    description: Year to get day offs for
    example: 2022
  - in: path
    name: week
    required: true
    schema:
      type: integer
    description: Week number to get day offs for
    example: 35
    minimum: 1
    maximum: 52
responses:
  200:
    description: All day off recorded for given week and person
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
