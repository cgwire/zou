Get the time spent table of a year by week
---
description: Get a table of the time spent of each person for each week of a
  year. Add project_id, department_id or studio_id to filter the table. An
  administrator gets all the persons. A manager gets the persons of their
  projects. A supervisor gets the persons of their projects and departments.
  Other users get their own row only.
tags:
  - Persons
parameters:
  - in: path
    name: year
    required: true
    schema:
      type: integer
    description: Year, for example 2026
    example: 2022
  - in: query
    name: project_id
    required: false
    description: Get only the time spents of this project
    schema:
      type: string
      format: uuid
  - in: query
    name: department_id
    required: false
    description: Get only the persons of this department
    schema:
      type: string
      format: uuid
  - in: query
    name: studio_id
    required: false
    description: Get only the persons of this studio
    schema:
      type: string
      format: uuid
responses:
  200:
    description: A map of person identifiers to the time spent of each
      period
    content:
      application/json:
        schema:
          type: object
  400:
    description: The date is not valid, or a supervisor asks for another
      department
  403:
    description: You cannot access this project
