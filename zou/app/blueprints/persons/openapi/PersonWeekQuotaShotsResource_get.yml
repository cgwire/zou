Get week quota shots
---
description: Get ended shots used for quota calculation of this week.
tags:
  - Persons
parameters:
  - in: path
    name: person_id
    required: true
    schema:
      type: string
      format: uuid
    description: Person unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: year
    required: true
    schema:
      type: integer
    description: Year to get quota shots for
    example: 2022
  - in: path
    name: week
    required: true
    schema:
      type: integer
    description: Week number to get quota shots for
    example: 35
    minimum: 1
    maximum: 52
  - in: query
    name: count_mode
    required: false
    schema:
      type: string
      enum: [weighted, weighteddone, feedback, done]
    description: Count mode for quota calculation
    example: weighted
  - in: query
    name: project_id
    required: false
    schema:
      type: string
      format: uuid
    description: >-
      Restrict the shots to this production. Without it, the shots of every
      production are listed; a manager can then only read their own quotas.
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: query
    name: task_type_id
    required: false
    schema:
      type: string
      format: uuid
    description: >-
      Restrict the shots to this task type. Without it, the shots of every
      task type are listed.
    example: b35b7fb5-df86-5776-b181-68564193d361
responses:
  200:
    description: Ended shots used for quota calculation of this week
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            description: >-
              A serialized shot, with its project_id, full_name and the
              weight it carries in the period.
  400:
    description: Wrong date format or invalid count mode
