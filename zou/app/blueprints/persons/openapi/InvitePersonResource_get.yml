Invite a person
---
description: Send an email that invites a person to log in to Kitsu. The
  email has a link to set the password. The link is valid for 7 days. You
  must be an administrator.
tags:
  - Persons
parameters:
  - in: path
    name: person_id
    required: true
    schema:
      type: string
      format: uuid
    description: Person unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  200:
    description: The email is sent
    content:
      application/json:
        schema:
          type: object
          properties:
            success:
              type: boolean
              description: Success flag
              example: true
            message:
              type: string
              description: Success message
              example: Email sent
  403:
    description: You are not an administrator, or the person is a bot
  404:
    description: The person does not exist
