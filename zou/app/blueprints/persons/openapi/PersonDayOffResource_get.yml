Get person day offs
---
description: Return all day offs recorded for given person.
tags:
  - Persons
parameters:
  - in: path
    name: person_id
    required: true
    schema:
      type: string
      format: uuid
    description: Person unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c25
responses:
  200:
    description: All day off recorded for given person
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
