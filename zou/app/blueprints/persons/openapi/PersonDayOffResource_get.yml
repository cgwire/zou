Get the day offs of a person
---
description: Get all the day offs of a person. An administrator, the person,
  and a manager of a project of the person get the day offs with their
  description. A supervisor of the department of the person gets the dates
  only. Other users cannot read them.
tags:
  - Persons
parameters:
  - in: path
    name: person_id
    required: true
    schema:
      type: string
      format: uuid
    description: Person unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  200:
    description: The list of day offs
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
  403:
    description: You cannot read the day offs of this person, or the person
      is a bot
