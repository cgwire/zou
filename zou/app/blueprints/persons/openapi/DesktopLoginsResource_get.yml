Get the desktop logins of a person
---
description: Get the login logs of the desktop tools of a person. A manager
  can read the logs of all persons. Other users can read their own logs
  only.
tags:
  - Persons
parameters:
  - in: path
    name: person_id
    required: true
    schema:
      type: string
      format: uuid
    description: Person unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  200:
    description: The list of desktop login logs
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Log entry unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              person_id:
                type: string
                format: uuid
                description: Person unique identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
              date:
                type: string
                format: date-time
                description: Login date and time
                example: '2022-07-12T10:30:00Z'
  403:
    description: You cannot read the logs of this person
  404:
    description: The person does not exist
