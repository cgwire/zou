Change person password
---
description: Allow admin to change password for given user.
  An admin can't change another admin's existing password, but can
  set the initial password of a newly created admin. The new password
  requires a confirmation to ensure that the admin didn't make a
  mistake by typing the new password.
tags:
  - Persons
parameters:
  - in: path
    name: person_id
    required: true
    schema:
      type: string
      format: uuid
    description: Person unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - password
          - password_2
        properties:
          password:
            type: string
            format: password
            description: New password
            example: "newSecurePassword123"
          password_2:
            type: string
            format: password
            description: Password confirmation
            example: "newSecurePassword123"
responses:
  200:
    description: Password changed successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            success:
              type: boolean
              description: Success flag
              example: true
  400:
    description: Invalid password or inactive user
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: boolean
              description: Error flag
              example: true
            message:
              type: string
              description: Error message
              example: "Password is too short."
