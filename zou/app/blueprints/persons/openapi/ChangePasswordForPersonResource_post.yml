Change the password of a person
---
description: Set a new password for a person. Give the new password two
  times. You cannot change the password of a protected account. You cannot
  change the password of an other administrator who already has a password.
  You can set the first password of a new administrator. The person gets an
  email about the change. You must be an administrator.
tags:
  - Persons
parameters:
  - in: path
    name: person_id
    required: true
    schema:
      type: string
      format: uuid
    description: Person unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - password
          - password_2
        properties:
          password:
            type: string
            format: password
            description: New password
            example: newSecurePassword123
          password_2:
            type: string
            format: password
            description: Password confirmation
            example: newSecurePassword123
responses:
  200:
    description: The password is changed
    content:
      application/json:
        schema:
          type: object
          properties:
            success:
              type: boolean
              description: Success flag
              example: true
  400:
    description: The two passwords are different, the password is too short,
      the person is inactive, or you cannot change the password of this
      person
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: boolean
              description: Error flag
              example: true
            message:
              type: string
              description: Error message
              example: Password is too short.
  403:
    description: You are not an administrator, or the person is a bot
