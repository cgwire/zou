Remove a person from a department
---
description: Remove a person from a department. You must be an
  administrator.
tags:
  - Persons
parameters:
  - in: path
    name: person_id
    required: true
    schema:
      type: string
      format: uuid
    description: Person unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: department_id
    required: true
    schema:
      type: string
      format: uuid
    description: Department unique identifier
    example: b35b7fb5-df86-5776-b181-68564193d360
responses:
  204:
    description: The person is removed from the department
  400:
    description: The department does not exist
  403:
    description: You are not an administrator
