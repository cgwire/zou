Get the time spents of a person
---
description: Get the time spent entries of a person. To get the entries of a
  period, give start_date and end_date. An administrator and the person get
  all the entries. A manager gets the entries of their projects. A
  supervisor gets the entries of their projects and departments. Other users
  cannot read the time spents of other persons. You cannot read the time
  spents of a bot.
tags:
  - Persons
parameters:
  - in: path
    name: person_id
    required: true
    schema:
      type: string
      format: uuid
    description: Person unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: query
    name: start_date
    required: false
    schema:
      type: string
      format: date
    description: First date of the period, in the YYYY-MM-DD format
    example: '2022-07-01'
  - in: query
    name: end_date
    required: false
    schema:
      type: string
      format: date
    description: Last date of the period, in the YYYY-MM-DD format
    example: '2022-07-31'
responses:
  200:
    description: The list of time spent entries
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Time spent unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              person_id:
                type: string
                format: uuid
                description: Person unique identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
              project_id:
                type: string
                format: uuid
                description: Project of the task
                example: d57d91d7-f1a8-7998-d3a3-8a786315f581
              task_type_id:
                type: string
                format: uuid
                description: Task type of the task
                example: e68ea2e8-a2b9-8aa9-e4b4-9b897426a692
              duration:
                type: number
                format: float
                description: Time spent duration in hours
                example: 8.5
              date:
                type: string
                format: date
                description: Date of time spent entry
                example: '2022-07-12'
  400:
    description: Only one date of the period is given, or a date is not
      valid
  403:
    description: You cannot read the time spents of this person, or the
      person is a bot
