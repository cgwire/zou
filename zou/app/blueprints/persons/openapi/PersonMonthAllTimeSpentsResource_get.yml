Get all the time spents of a person for a month
---
description: Get all the time spent entries of a person for a month. Only an
  administrator and the person can use this route.
tags:
  - Persons
parameters:
  - in: path
    name: person_id
    required: true
    schema:
      type: string
      format: uuid
    description: Person unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: year
    required: true
    schema:
      type: integer
    description: Year, for example 2026
    example: 2022
  - in: path
    name: month
    required: true
    schema:
      type: integer
      minimum: 1
      maximum: 12
    description: Month, from 1 to 12
    example: 7
responses:
  200:
    description: The list of time spent entries
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
  400:
    description: The month or the year is not valid
  403:
    description: You are not an administrator or this person, or the person
      is a bot
