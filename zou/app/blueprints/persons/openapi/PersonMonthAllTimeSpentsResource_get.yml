Get all month time spents
---
description: Get all time spents for a given person and month.
tags:
  - Persons
parameters:
  - in: path
    name: person_id
    required: true
    schema:
      type: string
      format: uuid
    description: Person unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c25
  - in: path
    name: year
    required: true
    schema:
      type: integer
    description: Year to get time spents for
    example: 2022
  - in: path
    name: month
    required: true
    schema:
      type: integer
    description: Month to get time spents for
    example: 7
    minimum: 1
    maximum: 12
responses:
  200:
    description: All time spents for the given person and month
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
