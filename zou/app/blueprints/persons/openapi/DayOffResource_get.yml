Get day off
---
description: Get day off object for given person and date.
tags:
  - Persons
parameters:
  - in: path
    name: person_id
    required: true
    schema:
      type: string
      format: uuid
    description: Person unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c25
  - in: path
    name: date
    required: true
    schema:
      type: string
      format: date
    description: Date to get day off for
    example: "2022-07-12"
responses:
  200:
    description: Day off object for given person and date
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Day off unique identifier
              example: a24a6ea4-ce75-4665-a070-57453082c25
            person_id:
              type: string
              format: uuid
              description: Person unique identifier
              example: b35b7fb5-df86-5776-b181-68564193d36
            date:
              type: string
              format: date
              description: Day off date
              example: "2022-07-12"
            type:
              type: string
              description: Day off type
              example: "vacation"
  400:
    description: Wrong date format
