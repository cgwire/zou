Get the day off of a person for a date
---
description: Get the day off of a person for one date. An administrator, the
  person, and a manager of a project of the person get the day offs with
  their description. A supervisor of the department of the person gets the
  dates only. Other users cannot read them.
tags:
  - Persons
parameters:
  - in: path
    name: person_id
    required: true
    schema:
      type: string
      format: uuid
    description: Person unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: date
    required: true
    schema:
      type: string
      format: date
    description: Date in the YYYY-MM-DD format
    example: '2022-07-12'
responses:
  200:
    description: The day off, or an empty object if the person works on this
      date
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Day off unique identifier
              example: a24a6ea4-ce75-4665-a070-57453082c250
            person_id:
              type: string
              format: uuid
              description: Person unique identifier
              example: b35b7fb5-df86-5776-b181-68564193d360
            date:
              type: string
              format: date
              description: Day off date
              example: '2022-07-12'
            type:
              type: string
              description: Day off type
              example: vacation
  400:
    description: The date is not valid
  403:
    description: You cannot read the day offs of this person, or the person
      is a bot
