Get the time spents of a person for a date
---
description: Get the time spent entries of a person for one date. An
  administrator and the person get all the entries. A manager gets the
  entries of their projects. A supervisor gets the entries of their projects
  and departments. Other users cannot read the time spents of other persons.
  You cannot read the time spents of a bot.
tags:
  - Persons
parameters:
  - in: path
    name: person_id
    required: true
    schema:
      type: string
      format: uuid
    description: Person unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: date
    required: true
    schema:
      type: string
      format: date
    description: Date in the YYYY-MM-DD format
    example: '2022-07-12'
responses:
  200:
    description: The list of time spent entries
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Time spent unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              person_id:
                type: string
                format: uuid
                description: Person unique identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
              duration:
                type: number
                format: float
                description: Time spent duration in hours
                example: 8.5
              date:
                type: string
                format: date
                description: Date of time spent entry
                example: '2022-07-12'
  400:
    description: The date is not valid
  403:
    description: You cannot read the time spents of this person, or the
      person is a bot
