Get the quota shots of a person for a month
---
description: 'Get the shots that count in the quota of a person for a month. A
  quota shot is a shot that the person ended. Give project_id to read the quotas
  of another person: you must be a manager or a supervisor of the project. Without
  project_id, you can read your own quotas only.'
tags:
  - Persons
parameters:
  - in: path
    name: person_id
    required: true
    schema:
      type: string
      format: uuid
    description: Person unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: year
    required: true
    schema:
      type: integer
    description: Year, for example 2026
    example: 2022
  - in: path
    name: month
    required: true
    schema:
      type: integer
      minimum: 1
      maximum: 12
    description: Month, from 1 to 12
    example: 7
  - in: query
    name: count_mode
    required: false
    schema:
      type: string
      enum: [weighted, weighteddone, feedback, done]
    description: 'How to count the shots: weighted, weighteddone, feedback or
      done. The default value is weighted. The weighted modes give each shot the
      part of its work time that is in the period. The other modes count each
      shot on its end date. The feedback modes end a shot at its first feedback.
      The done modes end a shot when it is done.'
    example: weighted
  - in: query
    name: project_id
    required: false
    schema:
      type: string
      format: uuid
    description: >-
      Get only the shots of this project
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: query
    name: task_type_id
    required: false
    schema:
      type: string
      format: uuid
    description: >-
      Get only the shots of this task type
    example: b35b7fb5-df86-5776-b181-68564193d361
responses:
  200:
    description: The list of quota shots
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            description: >-
              A serialized shot, with its project_id, full_name and the
              weight it carries in the period.
  400:
    description: The date or count_mode is not valid
  403:
    description: You cannot read the quotas of this person, or the person is
      a bot
