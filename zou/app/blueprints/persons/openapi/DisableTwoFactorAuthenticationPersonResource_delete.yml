Disable the two-factor authentication of a person
---
description: Disable the two-factor authentication of a person. You cannot
  disable it for another administrator. The person gets an email about the
  change. You must be an administrator.
tags:
  - Persons
parameters:
  - in: path
    name: person_id
    required: true
    schema:
      type: string
      format: uuid
    description: Person unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  200:
    description: The two-factor authentication is disabled
    content:
      application/json:
        schema:
          type: object
          properties:
            success:
              type: boolean
              description: Success flag
              example: true
  400:
    description: The person is inactive, the person is another
      administrator, or the two-factor authentication is not enabled
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: boolean
              description: Error flag
              example: true
            message:
              type: string
              description: Error message
              example: User is unactive.
  403:
    description: You are not an administrator, or the person is a bot
