Clear person avatar
---
description: Set has_avatar flag to False for current user and remove
  its avatar file.
tags:
  - Persons
parameters:
  - in: path
    name: person_id
    required: true
    schema:
      type: string
      format: uuid
    description: Person unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c25
responses:
  204:
    description: Avatar file deleted
