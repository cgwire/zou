Create desktop login log
---
description: Add a new log entry for desktop logins for a person.
tags:
  - Persons
parameters:
  - in: path
    name: person_id
    required: true
    schema:
      type: string
      format: uuid
    description: Person unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - date
        properties:
          date:
            type: string
            format: date
            description: Login date
            example: "2022-07-12"
responses:
  201:
    description: Desktop login log entry created
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Log entry unique identifier
              example: a24a6ea4-ce75-4665-a070-57453082c250
            person_id:
              type: string
              format: uuid
              description: Person unique identifier
              example: b35b7fb5-df86-5776-b181-68564193d360
            date:
              type: string
              format: date-time
              description: Login date and time
              example: "2022-07-12T10:30:00Z"
  400:
    description: Invalid date format
