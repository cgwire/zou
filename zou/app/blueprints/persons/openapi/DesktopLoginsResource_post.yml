Add a desktop login of a person
---
description: Add a login log of a desktop tool for a person. Without date,
  the log uses the current date. You can add logs for yourself only. An
  administrator can add logs for all persons.
tags:
  - Persons
parameters:
  - in: path
    name: person_id
    required: true
    schema:
      type: string
      format: uuid
    description: Person unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
requestBody:
  required: false
  content:
    application/json:
      schema:
        type: object
        properties:
          date:
            type: string
            format: date
            description: Login date
            example: '2022-07-12'
responses:
  201:
    description: The new desktop login log
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Log entry unique identifier
              example: a24a6ea4-ce75-4665-a070-57453082c250
            person_id:
              type: string
              format: uuid
              description: Person unique identifier
              example: b35b7fb5-df86-5776-b181-68564193d360
            date:
              type: string
              format: date-time
              description: Login date and time
              example: '2022-07-12T10:30:00Z'
  400:
    description: The date is not valid
  403:
    description: You cannot add logs for this person
