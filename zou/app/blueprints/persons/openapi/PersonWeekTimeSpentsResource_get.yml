Get the total time spent of a person for a week
---
description: Get the total time spent of a person for a week. Give
  project_id to get the total of one project. An administrator and the
  person get all the entries. A manager gets the entries of their projects.
  A supervisor gets the entries of their projects and departments. Other
  users cannot read the time spents of other persons. You cannot read the
  time spents of a bot.
tags:
  - Persons
parameters:
  - in: path
    name: person_id
    required: true
    schema:
      type: string
      format: uuid
    description: Person unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: year
    required: true
    schema:
      type: integer
    description: Year, for example 2026
    example: 2022
  - in: path
    name: week
    required: true
    schema:
      type: integer
      minimum: 1
      maximum: 52
    description: Week number of the ISO year, from 1 to 53
    example: 35
  - in: query
    name: project_id
    required: false
    description: Get only the time spent on this project
    schema:
      type: string
      format: uuid
responses:
  200:
    description: The total time spent for the week
    content:
      application/json:
        schema:
          type: object
          properties:
            total_duration:
              type: number
              format: float
              description: Total duration in hours
              example: 40.0
            year:
              type: integer
              description: Year
              example: 2022
            week:
              type: integer
              description: Week number
              example: 35
  400:
    description: The date is not valid
  403:
    description: You cannot read the time spents of this person, or the
      person is a bot, or you cannot access this project
