Get week time spents
---
description: Get aggregated time spents for given person and week.
tags:
  - Persons
parameters:
  - in: path
    name: person_id
    required: true
    schema:
      type: string
      format: uuid
    description: Person unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: year
    required: true
    schema:
      type: integer
    description: Year to get aggregated time spents for
    example: 2022
  - in: path
    name: week
    required: true
    schema:
      type: integer
    description: Week number to get aggregated time spents for
    example: 35
    minimum: 1
    maximum: 52
responses:
  200:
    description: Aggregated time spents for given person and week
    content:
      application/json:
        schema:
          type: object
          properties:
            total_duration:
              type: number
              format: float
              description: Total duration in hours
              example: 40.0
            year:
              type: integer
              description: Year
              example: 2022
            week:
              type: integer
              description: Week number
              example: 35
  400:
    description: Wrong date format
