Get the day offs of a person for a year
---
description: Get the day offs of a person for a year. An administrator, the
  person, and a manager of a project of the person get the day offs with
  their description. A supervisor of the department of the person gets the
  dates only. Other users cannot read them.
tags:
  - Persons
parameters:
  - in: path
    name: person_id
    required: true
    schema:
      type: string
      format: uuid
    description: Person unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: year
    required: true
    schema:
      type: integer
    description: Year, for example 2026
    example: 2022
responses:
  200:
    description: The list of day offs
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
  403:
    description: You cannot read the day offs of this person, or the person
      is a bot
