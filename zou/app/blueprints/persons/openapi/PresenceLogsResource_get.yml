Get the presence logs of a month
---
description: Get a CSV file with the presence of each person for each day of
  a month. You must be an administrator.
tags:
  - Persons
parameters:
  - in: path
    name: month_date
    required: true
    schema:
      type: string
      format: date
    description: Month in the YYYY-MM format
    example: 2022-07
responses:
  200:
    description: The CSV file
    content:
      text/csv:
        schema:
          type: string
          format: binary
  400:
    description: The month is not valid
  403:
    description: You are not an administrator
