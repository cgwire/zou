Get the original file of a preview
---
description: Get the original file of a preview. The extension of the path
  must be the extension of the preview. You must have access to the task.
tags:
  - Previews
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the preview file
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: extension
    required: true
    schema:
      type: string
    description: Extension of the file, for example pdf
    example: png
responses:
  200:
    description: The file
    content:
      application/octet-stream:
        schema:
          type: string
          format: binary
  400:
    description: The extension is not the extension of the preview
  403:
    description: You do not have access to the task of this preview
  404:
    description: The preview file or its file does not exist
