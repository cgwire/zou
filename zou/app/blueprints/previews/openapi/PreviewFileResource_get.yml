Get preview file
---
description: Download a generic file preview by extension.
tags:
  - Previews
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    description: Preview file unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: extension
    required: true
    schema:
      type: string
    description: File extension
    example: png
responses:
  200:
    description: Generic file preview downloaded
    content:
      application/octet-stream:
        schema:
          type: string
          format: binary
