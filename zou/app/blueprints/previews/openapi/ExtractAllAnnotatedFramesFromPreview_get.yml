Get the annotated frames of a preview as a ZIP file
---
description: Get a ZIP file with one PNG picture for each annotation. For a
  movie, each picture is the frame of the annotation. For a picture, each
  picture is the picture with the annotation on it. You must be a manager of
  the project.
tags:
  - Previews
parameters:
  - in: path
    name: preview_file_id
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the preview file
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  200:
    description: The ZIP file
    content:
      application/zip:
        schema:
          type: string
          format: binary
  400:
    description: The preview has no annotations, or its extension is not
      supported
  403:
    description: You are not a manager of the project
  404:
    description: The file of the preview is not available
