Get a picture of a preview
---
description: 'Get a picture of a preview file: the thumbnail, the square thumbnail,
  the original picture or the preview picture. Anybody can get the main thumbnail
  of a shared asset, except vendors. For the other pictures, you must have access
  to the task.'
tags:
  - Previews
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the preview file
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  200:
    description: The PNG picture
    content:
      image/png:
        schema:
          type: string
          format: binary
  403:
    description: You do not have access to the task of this preview
  404:
    description: The preview file or its file does not exist
