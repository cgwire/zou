Comment several tasks
---
description: Add comments to several tasks in one request. Each comment
  gives its task_id. Send a multipart form. Each comments field is a JSON
  object with task_status_id, comment, and optional checklist and links.
  Each comment sets the status of its task. Files in the form are added as
  previews or attachments. Only a manager can set person_id and created_at.
  You must be able to do actions on each task.
tags:
  - Comments
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - comments
        properties:
          comments:
            type: string
            description: JSON string containing array of comments
            example: '[{"task_id": "uuid", "text": "Good work", "task_status_id":
              "uuid"}]'
responses:
  201:
    description: The new comments
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
  400:
    description: The body is not valid
  403:
    description: You cannot do actions on a task, or you cannot use a task
      status
