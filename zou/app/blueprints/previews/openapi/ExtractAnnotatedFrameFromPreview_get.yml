Get an annotated frame of a preview
---
description: Get a frame of a movie preview, or the picture of a picture
  preview, with the annotation of this frame on it. For a movie,
  frame_number is required. For a picture, frame_number is ignored. You must
  be a manager of the project.
tags:
  - Previews
parameters:
  - in: path
    name: preview_file_id
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the preview file
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: query
    name: frame_number
    required: false
    schema:
      type: integer
      minimum: 1
    description: Number of the frame, from 1. Movies only.
    example: 120
responses:
  200:
    description: The PNG picture
    content:
      image/png:
        schema:
          type: string
          format: binary
  400:
    description: There is no annotation, frame_number is missing for a
      movie, or the extension is not supported
  403:
    description: You are not a manager of the project
  404:
    description: The file of the preview is not available
