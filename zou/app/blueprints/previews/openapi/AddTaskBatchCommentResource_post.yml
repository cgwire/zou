Comment a task several times
---
description: Add several comments to a task in one request. Send a multipart
  form. Each comments field is a JSON object with task_status_id, comment,
  and optional checklist and links. Each comment sets the status of its
  task. Files in the form are added as previews or attachments. Only a
  manager can set person_id and created_at. You must be able to do actions
  on each task.
tags:
  - Comments
parameters:
  - in: path
    name: task_id
    required: true
    schema:
      type: string
      format: uuid
    description: Task unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - comments
        properties:
          comments:
            type: string
            description: JSON string containing array of comments
            example: '[{"text": "Good work", "task_status_id": "uuid"}]'
responses:
  201:
    description: The new comments
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
  400:
    description: The body is not valid
  403:
    description: You cannot do actions on this task, or you cannot use a
      task status
