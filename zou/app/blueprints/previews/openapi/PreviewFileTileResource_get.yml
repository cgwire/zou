Get the tile sheet of a movie preview
---
description: Get the tile sheet of a movie preview. If a ready movie has no
  tile sheet, the route starts to make it for the next request. You must
  have access to the task.
tags:
  - Previews
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the preview file
responses:
  200:
    description: The PNG tile sheet
    content:
      image/png:
        schema:
          type: string
          format: binary
  403:
    description: You do not have access to the task of this preview
  404:
    description: The preview has no tile sheet
