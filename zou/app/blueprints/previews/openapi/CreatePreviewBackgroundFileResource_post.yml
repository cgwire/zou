Upload a preview background file
---
description: Upload the file of a preview background. The route also makes a
  thumbnail. Send the file in a multipart form. You must be an
  administrator.
tags:
  - Previews
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the preview background file
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  201:
    description: The preview background file
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Preview background file unique identifier
              example: a24a6ea4-ce75-4665-a070-57453082c250
            extension:
              type: string
              description: File extension
              example: hdr
            file_size:
              type: integer
              description: File size in bytes
              example: 2048000
  400:
    description: The file is missing, or its format is not valid
  403:
    description: You are not an administrator
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          file:
            type: string
            description: HDR file to upload
            format: binary
        required:
          - file
