Change the position of a preview
---
description: Change the position of a preview in its revision. A revision
  can have several previews. You must be able to do actions on the task.
tags:
  - Previews
parameters:
  - in: path
    name: preview_file_id
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the preview file
    example: a24a6ea4-ce75-4665-a070-57453082c250
requestBody:
  required: false
  content:
    application/json:
      schema:
        type: object
        properties:
          position:
            type: integer
            description: New position for the preview
            example: 2
responses:
  200:
    description: The previews of the revision
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Preview file unique identifier
              example: a24a6ea4-ce75-4665-a070-57453082c250
            position:
              type: integer
              description: Preview position
              example: 2
  403:
    description: You cannot do actions on this task
  404:
    description: The preview file does not exist
