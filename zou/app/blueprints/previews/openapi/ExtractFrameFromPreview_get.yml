Get a frame of a movie preview
---
description: Get a frame of a movie preview as a PNG picture. The default
  frame number is 0. You must be a manager of the project.
tags:
  - Previews
parameters:
  - in: path
    name: preview_file_id
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the preview file
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: query
    name: frame_number
    required: false
    schema:
      type: integer
    description: Number of the frame. The default value is 0.
    example: 120
responses:
  200:
    description: The PNG picture
    content:
      image/png:
        schema:
          type: string
          format: binary
  403:
    description: You are not a manager of the project
  404:
    description: The file of the preview is not available
