Get preview background file
---
description: Download a preview background file.
tags:
  - Previews
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    description: Preview background file unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: extension
    required: true
    schema:
      type: string
    description: File extension
    example: hdr
responses:
  200:
    description: Preview background file downloaded
    content:
      image/vnd.radiance:
        schema:
          type: string
          format: binary
