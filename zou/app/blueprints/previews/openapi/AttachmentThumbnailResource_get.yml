Get the thumbnail of an attachment
---
description: Get the thumbnail of a file attached to a comment or to a
  chat message. You must have access to the task or to the chat. Clients
  cannot get the files of a chat.
tags:
  - Previews
parameters:
  - in: path
    name: attachment_file_id
    required: true
    schema:
      type: string
      format: uuid
    description: Attachment file unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  200:
    description: The PNG thumbnail
    content:
      image/png:
        schema:
          type: string
          format: binary
  403:
    description: You do not have access to the comment or to the chat
  404:
    description: The attachment or its thumbnail does not exist
