Make the tile sheet of a movie preview
---
description: Make the tile sheet of a movie preview and save it in the
  storage. A tile sheet is a picture with small frames of the movie. You
  must have access to the task.
tags:
  - Previews
parameters:
  - in: path
    name: preview_file_id
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the preview file
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  200:
    description: The PNG tile sheet
    content:
      image/png:
        schema:
          type: string
          format: binary
  403:
    description: You do not have access to the task of this preview
  404:
    description: The file of the preview is not available
