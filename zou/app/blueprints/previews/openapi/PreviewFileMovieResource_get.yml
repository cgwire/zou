Get the movie of a preview
---
description: Get the full quality movie of a preview. If this movie does not
  exist, the route sends the low definition movie. Then it sends the
  uploaded source. You must have access to the task.
tags:
  - Previews
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the preview file
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  200:
    description: The MP4 movie
    content:
      video/mp4:
        schema:
          type: string
          format: binary
  403:
    description: You do not have access to the task of this preview
  404:
    description: The preview file or its file does not exist
