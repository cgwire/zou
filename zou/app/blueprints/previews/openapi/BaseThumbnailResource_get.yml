Get thumbnail
---
description: Download the thumbnail linked to given object instance.
tags:
  - Previews
parameters:
  - in: path
    name: instance_id
    required: true
    schema:
      type: string
      format: uuid
    description: Object instance unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  200:
    description: Thumbnail downloaded
    content:
      image/png:
        schema:
          type: string
          format: binary
