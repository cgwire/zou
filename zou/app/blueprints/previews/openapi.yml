AddTaskBatchCommentResource_post:
  summary: Comment a task several times
  description: Add several comments to a task in one request. Send a multipart
    form. Each entry of comments is a JSON object with task_status_id and
    text, and optional checklist, links, person_id and created_at. You can
    also send a JSON body with a comments list. Each comment sets the status
    of its task. To attach files to the comment at index i, name the form
    fields attachment_file-i for attachments and preview_file-i for previews.
    Only a manager can set person_id and created_at. You must be able to do
    actions on each task.
  tags:
    - Comments
  parameters:
    - in: path
      name: task_id
      required: true
      schema:
        type: string
        format: uuid
      description: Task unique identifier
      example: a24a6ea4-ce75-4665-a070-57453082c250
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          required:
            - comments
          properties:
            comments:
              type: string
              description: JSON string containing array of comments
              example: '[{"text": "Good work", "task_status_id": "uuid"}]'
      application/json:
        schema:
          type: object
          required:
            - comments
          properties:
            comments:
              type: array
              description: List of comments
              items:
                type: object
  responses:
    201:
      description: The new comments
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
    400:
      description: The body is not valid
    403:
      description: You cannot do actions on this task, or you cannot use a
        task status
    404:
      description: The task does not exist

AddTasksBatchCommentResource_post:
  summary: Comment several tasks
  description: Add comments to several tasks in one request. Send a multipart
    form. Each entry of comments is a JSON object with task_id,
    task_status_id and text, and optional checklist, links, person_id and
    created_at. You can also send a JSON body with a comments list. Each
    comment sets the status of its task. To attach files to the comment at
    index i, name the form fields attachment_file-i and preview_file-i. Only
    a manager can set person_id and created_at. You must be able to do
    actions on each task.
  tags:
    - Comments
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          required:
            - comments
          properties:
            comments:
              type: string
              description: JSON string containing array of comments
              example: '[{"task_id": "uuid", "text": "Good work", "task_status_id":
                "uuid"}]'
      application/json:
        schema:
          type: object
          required:
            - comments
          properties:
            comments:
              type: array
              description: List of comments
              items:
                type: object
  responses:
    201:
      description: The new comments
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
    400:
      description: The body is not valid
    403:
      description: You cannot do actions on a task, or you cannot use a task
        status
    404:
      description: A task does not exist

AttachmentThumbnailResource_get:
  summary: Get the thumbnail of an attachment
  description: Get the thumbnail of a file attached to a comment or to a
    chat message. You must have access to the task or to the chat. Clients
    cannot get the files of a chat. A vendor must have a task on the entity.
  tags:
    - Previews
  parameters:
    - in: path
      name: attachment_file_id
      required: true
      schema:
        type: string
        format: uuid
      description: Attachment file unique identifier
      example: a24a6ea4-ce75-4665-a070-57453082c250
  responses:
    200:
      description: The PNG thumbnail
      content:
        image/png:
          schema:
            type: string
            format: binary
    403:
      description: You do not have access to the task of the comment or to the
        chat, you are a client and the file is in a chat, or the file is linked
        to nothing
    404:
      description: The attachment or its thumbnail does not exist

BasePreviewPictureResource_get:
  summary: Get a picture of a preview
  description: Get a picture of a preview file. It can be the thumbnail, the
    square thumbnail, the original picture or the preview picture. For the
    thumbnail, the square thumbnail and the original picture, anybody who is
    logged in can get the main preview of a shared entity, except vendors.
    For the preview picture, and for the other previews, you must have access
    to the task. A vendor must have a task on the entity.
  tags:
    - Previews
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      description: Unique identifier of the preview file
      example: a24a6ea4-ce75-4665-a070-57453082c250
  responses:
    200:
      description: The PNG picture
      content:
        image/png:
          schema:
            type: string
            format: binary
    202:
      description: The preview is still processing. The body has the status
        and the Retry-After header gives the delay. Only for a client that
        accepts application/json. Other clients get a 404.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: processing
              preview_file_id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
    403:
      description: You do not have access to the task of this preview
    404:
      description: The preview file or its file does not exist

BaseThumbnailResource_get:
  summary: Get a thumbnail
  description: Get the thumbnail of a person, an organisation, a project or a
    preview background file. For a project, you must have access to the
    project, if you are not a manager.
  tags:
    - Previews
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      description: Unique identifier of the person, organisation, project or
        preview background file
      example: a24a6ea4-ce75-4665-a070-57453082c250
  responses:
    200:
      description: The PNG thumbnail
      content:
        image/png:
          schema:
            type: string
            format: binary
    403:
      description: You do not have access to this project
    404:
      description: The thumbnail does not exist

BaseThumbnailResource_post:
  summary: Upload a thumbnail
  description: Upload the thumbnail of a person, an organisation or a project.
    Send the picture in a multipart form. For a person, you must be this
    person or an administrator. For a project, you must be a manager of the
    project. For an organisation, you must be an administrator. The route with
    the .png extension cannot receive uploads and returns 405.
  tags:
    - Previews
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      description: Unique identifier of the person, organisation or project
      example: a24a6ea4-ce75-4665-a070-57453082c250
  responses:
    201:
      description: The path of the new thumbnail
      content:
        application/json:
          schema:
            type: object
            properties:
              thumbnail_path:
                type: string
                description: URL path to the thumbnail
                example: /api/thumbnails/persons/uuid
    400:
      description: The file is missing or is not a picture
    403:
      description: You cannot change this thumbnail
    404:
      description: The person or the project does not exist
    405:
      description: This route is read only. Use the route without extension.
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            file:
              type: string
              description: Image file to use as thumbnail
              format: binary
          required:
            - file

CreatePreviewBackgroundFileResource_post:
  summary: Upload a preview background file
  description: Upload the file of a preview background. The route also makes a
    thumbnail. Send the file in a multipart form. You must be an
    administrator.
  tags:
    - Previews
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      description: Unique identifier of the preview background file
      example: a24a6ea4-ce75-4665-a070-57453082c250
  responses:
    201:
      description: The preview background file
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Preview background file unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              extension:
                type: string
                description: File extension
                example: hdr
              file_size:
                type: integer
                description: File size in bytes
                example: 2048000
    400:
      description: The file is missing, or its format is not valid
    403:
      description: You are not an administrator
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            file:
              type: string
              description: HDR file to upload
              format: binary
          required:
            - file

CreatePreviewFilePictureResource_post:
  summary: Upload the file of a preview
  description: Upload the file of a preview. Send the file in a multipart
    form. For a picture, the route makes a square thumbnail, a rectangle
    thumbnail and a preview picture. For a movie, the route normalizes the
    movie and makes the thumbnails. Use normalize=false to keep the movie as
    it is. You cannot upload a file again for a preview that already has a
    file. You must be able to do actions on the task. A client of the project
    cannot use this route.
  tags:
    - Previews
  parameters:
    - in: path
      name: instance_id
      required: true
      schema:
        type: string
        format: uuid
      description: Unique identifier of the preview file
      example: a24a6ea4-ce75-4665-a070-57453082c250
    - in: query
      name: normalize
      required: false
      description: Normalize the movie
      schema:
        type: boolean
        default: true
    - in: query
      name: no_job
      required: false
      description: Process the file in the request instead of the job queue
      schema:
        type: boolean
        default: false
  responses:
    201:
      description: The preview file
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Preview file unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              extension:
                type: string
                description: File extension
                example: png
              file_size:
                type: integer
                description: File size in bytes
                example: 1024000
    400:
      description: The file is missing, its format is not valid, or the
        preview already has a file
    403:
      description: You cannot do actions on this task
    404:
      description: The preview file does not exist
    500:
      description: The processing of the movie failed
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            file:
              type: string
              description: Preview file to upload
              format: binary
          required:
            - file

ExtractAllAnnotatedFramesAsPdfFromPreview_get:
  summary: Get the annotated frames of a preview as a PDF
  description: Get a PDF file with one page for each annotation. For a movie,
    each picture is the frame of the annotation. For a picture, each picture
    is the picture with the annotation on it. You must be a manager of the
    project.
  tags:
    - Previews
  parameters:
    - in: path
      name: preview_file_id
      required: true
      schema:
        type: string
        format: uuid
      description: Unique identifier of the preview file
      example: a24a6ea4-ce75-4665-a070-57453082c250
  responses:
    200:
      description: The PDF file
      content:
        application/pdf:
          schema:
            type: string
            format: binary
    400:
      description: The preview has no annotations, or its extension is not
        supported
    403:
      description: You are not a manager of the project
    404:
      description: The file of the preview is not available

ExtractAllAnnotatedFramesFromPreview_get:
