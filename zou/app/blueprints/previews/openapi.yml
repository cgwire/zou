  description: Get the preview files of the open projects that have the
    processing or broken status. To get the next page, give the identifier of
    the last preview in cursor_preview_file_id. You must be an administrator.
  tags:
    - Previews
  parameters:
    - in: query
      name: cursor_preview_file_id
      required: false
      description: Get the previews that come after this preview
      example: a24a6ea4-ce75-4665-a070-57453082c250
      schema:
        type: string
        format: uuid
    - in: query
      name: limit
      required: false
      description: Maximum number of previews
      example: 100
      schema:
        type: integer
  responses:
    200:
      description: The list of preview files
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: Preview file unique identifier
                  example: a24a6ea4-ce75-4665-a070-57453082c250
                status:
                  type: string
                  description: Preview file status
                  example: processing
    400:
      description: The cursor is not a valid identifier
    403:
      description: You are not an administrator

SetMainPreviewResource_put:
  summary: Set the main preview of an entity
  description: Use a preview as the picture of its entity. For a movie, give
    frame_number to use this frame as the picture. Clients cannot use this
    route.
  tags:
    - Previews
  parameters:
    - in: path
      name: preview_file_id
      required: true
      schema:
        type: string
        format: uuid
      description: Unique identifier of the preview file
      example: a24a6ea4-ce75-4665-a070-57453082c250
    - in: query
      name: no_job
      required: false
      schema:
        type: boolean
        default: false
      description: Extract the frame in the request instead of the job queue
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            frame_number:
              type: integer
              description: Frame of the movie to use as the picture. You can
                also give it as a query parameter when the request has no
                JSON body.
              example: 120
  responses:
    200:
      description: The entity
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Entity unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              preview_file_id:
                type: string
                format: uuid
                description: Preview file unique identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
              preview_file_status:
                type: string
                enum: [processing, ready, broken, missing]
                description: Status of the preview file. Its pictures can be
                  read once it is ready.
                example: processing
    400:
      description: frame_number is given for a preview that is not a movie
    403:
      description: You do not have access to this entity, or you are a client
    404:
      description: The preview file does not exist

UpdateAnnotationsResource_put:
  summary: Change the annotations of a preview
  description: Change the annotations of a preview. Give the annotations to
    add in additions, the annotations to change in updates, and the
    annotations to delete in deletions. Managers and clients of the project
    can use this route. A supervisor can use it for the tasks of their
    departments, or for all the tasks if the supervisor has no department.
    Other users cannot use this route.
  tags:
    - Previews
  parameters:
    - in: path
      name: preview_file_id
      required: true
      schema:
        type: string
        format: uuid
      description: Unique identifier of the preview file
      example: a24a6ea4-ce75-4665-a070-57453082c250
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            additions:
              type: array
              description: Annotations to add
              items:
                type: object
              example: [{type: drawing, x: 100, y: 200}]
            updates:
              type: array
              description: Annotations to update
              items:
                type: object
              example: [{id: uuid, x: 150, y: 250}]
            deletions:
              type: array
              description: Annotation IDs to remove
              items:
                type: string
                format: uuid
              example: [a24a6ea4-ce75-4665-a070-57453082c250]
  responses:
    200:
      description: The preview with its annotations
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Preview file unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              annotations:
                type: array
                description: Updated annotations
                items:
                  type: object
    400:
      description: additions, updates or deletions is not a list
    403:
      description: You cannot change the annotations of this preview
    404:
      description: The preview file does not exist

UpdatePreviewPositionResource_put:
  summary: Change the position of a preview
  description: Change the position of a preview in its revision. A revision
    can have several previews. You must be able to do actions on the task. A
    client of the project cannot use this route.
  tags:
    - Previews
  parameters:
    - in: path
      name: preview_file_id
      required: true
      schema:
        type: string
        format: uuid
      description: Unique identifier of the preview file
      example: a24a6ea4-ce75-4665-a070-57453082c250
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            position:
              type: integer
              minimum: 0
              default: 0
              description: New position for the preview
              example: 2
  responses:
    200:
      description: The previews of the revision
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Preview file unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              position:
                type: integer
                description: Preview position
                example: 2
    400:
      description: position is negative or is not an integer
    403:
      description: You cannot do actions on this task
    404:
      description: The preview file does not exist
