    - in: path
      name: asset_id
      required: true
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the asset
      schema:
        type: string
        format: uuid
  responses:
    200:
      description: The list of assets cast in the asset
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: Linked asset unique identifier
                  example: a24a6ea4-ce75-4665-a070-57453082c250
                name:
                  type: string
                  description: Linked asset name
                  example: Character Name
                project_id:
                  type: string
                  format: uuid
                  description: Project identifier
                  example: b35b7fb5-df86-5776-b181-68564193d360
                entity_type_id:
                  type: string
                  format: uuid
                  description: Asset type identifier
                  example: c46c80c6-e097-6887-c292-79675204e470
    403:
      description: You do not have access to this project, or you are a vendor
        without a task on this asset
    404:
      description: The asset does not exist

AssetCastInResource_get:
  summary: Get the shots where an asset is cast
  description: Get the shots and the assets that have this asset in their
    casting. A shot entry has shot_id, shot_name, sequence_name and
    episode_id. An asset entry has asset_id, asset_name and asset_type_name.
  tags:
    - Assets
  parameters:
    - in: path
      name: asset_id
      required: true
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the asset
      schema:
        type: string
        format: uuid
  responses:
    200:
      description: The list of shots and assets that cast the asset
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: Shot unique identifier
                  example: d57d91d7-f108-7998-d403-80786315f580
                name:
                  type: string
                  description: Shot name
                  example: SH001
                project_id:
                  type: string
                  format: uuid
                  description: Project identifier
                  example: b35b7fb5-df86-5776-b181-68564193d360
                sequence_id:
                  type: string
                  format: uuid
                  description: Sequence identifier
                  example: e68e02e8-0219-8009-e514-918974260690
                frame_in:
                  type: integer
                  description: Frame in
                  example: 100
                frame_out:
                  type: integer
                  description: Frame out
                  example: 200
                duration:
                  type: integer
                  description: Shot duration in frames
                  example: 100
    403:
      description: You do not have access to this project, or you are a vendor
        without a task on this asset
    404:
      description: The asset does not exist

AssetCastingResource_get:
  summary: Get the casting of an asset
  description: Get the casting of an asset. The casting is the list of assets
    that the asset contains, with the number of occurrences of each asset.
  tags:
    - Assets
  parameters:
    - in: path
      name: asset_id
      required: true
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the asset
      schema:
        type: string
        format: uuid
  responses:
    200:
      description: The casting of the asset
      content:
        application/json:
          schema:
            type: object
            properties:
              asset_id:
                type: string
                format: uuid
                description: Asset unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              casting:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      description: Casting entry unique identifier
                      example: b35b7fb5-df86-5776-b181-68564193d360
                    entity_id:
                      type: string
                      format: uuid
                      description: Entity identifier (shot/sequence)
                      example: d57d91d7-f108-7998-d403-80786315f580
                    entity_name:
                      type: string
                      description: Entity name
                      example: SH001
                    entity_type:
                      type: string
                      description: Entity type (shot/sequence)
                      example: shot
    403:
      description: You do not have access to this project, or you are a vendor
        without a task on this asset
    404:
      description: The asset does not exist

AssetCastingResource_put:
  summary: Replace the casting of an asset
  description: Replace the casting of an asset. Send the full list of assets
    that the asset contains. The assets that are not in the list are removed
    from the casting. You must be a manager of the project.
  tags:
    - Assets
  parameters:
    - in: path
      name: asset_id
      required: true
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the asset
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            required:
              - asset_id
            properties:
              asset_id:
                type: string
                format: uuid
                description: Asset to cast
                example: b35b7fb5-df86-5776-b181-68564193d360
              nb_occurences:
                type: integer
                minimum: 0
                default: 1
                description: Number of occurrences of the asset
              label:
                type: string
                default: ''
                description: Label of the link
  responses:
    200:
      description: The new casting of the asset
      content:
        application/json:
          schema:
            type: object
            properties:
              asset_id:
                type: string
                format: uuid
                description: Asset unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              casting:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      description: Casting entry unique identifier
                      example: b35b7fb5-df86-5776-b181-68564193d360
                    entity_id:
                      type: string
                      format: uuid
                      description: Entity identifier
                      example: d57d91d7-f108-7998-d403-80786315f580
                    entity_name:
                      type: string
                      description: Entity name
                      example: SH001
    400:
      description: The body is not valid
    403:
      description: You are not a manager of the project
    404:
      description: The asset does not exist

AssetResource_delete:
  summary: Delete an asset
  description: Delete an asset. The creator of the asset can delete it if the
    creator is in the project team. Other users must be managers of the
    project. If the asset has tasks, the asset is only marked as canceled. Use
    force=true to delete the asset and all its related data.
    Only a manager of the project can use force=true.
  tags:
    - Assets
  parameters:
    - in: path
      name: asset_id
      example: a24a6ea4-ce75-4665-a070-57453082c250
      required: true
      description: Unique identifier of the asset to delete
      schema:
        type: string
        format: uuid
    - in: query
      name: force
      required: false
      description: Delete the asset and all its related data
      example: false
      schema:
        type: boolean
  responses:
    204:
      description: The asset is deleted
    403:
      description: You cannot delete this asset
    404:
      description: The asset does not exist

