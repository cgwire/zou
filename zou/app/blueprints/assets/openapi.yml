AssetsAndTasksResource_get:
  summary: Get assets with their tasks
  description: Get the assets of the projects that you can access, with the
    tasks of each asset. Each asset has its project name and asset type name.
    Filter with project_id, episode_id or assigned_to. The other columns are
    not filters on this route. A vendor gets only the assets of their assigned
    tasks, without the metadata columns hidden from their departments. A
    client gets the tasks without the studio fields (assignees, estimation,
    dates, retake count). The response can have an ETag. Send it in
    If-None-Match to get a 304 response when the data did not change.
  tags:
    - Assets
  parameters:
    - in: query
      name: project_id
      description: Filter assets by specific project
      example: a24a6ea4-ce75-4665-a070-57453082c250
      schema:
        type: string
        format: uuid
    - in: query
      name: episode_id
      description: Get the assets of this episode and the assets cast in this
        episode. Use main to get the assets that have no episode. Use all to
        get the assets of all episodes.
      example: a24a6ea4-ce75-4665-a070-57453082c250
      schema:
        type: string
    - in: query
      name: compact
      description: Encode assets and tasks as positional value arrays (halves
        the payload). Field names are given by the asset_fields and
        task_fields entries of the response, map values by name, never by
        hardcoded position.
      schema:
        type: boolean
        default: false
    - in: query
      name: stream
      description: Stream the response as NDJSON (one header line, then one
        asset per line) instead of a single JSON document, to keep server
        memory flat on large productions.
      schema:
        type: boolean
        default: false
    - in: query
      name: assigned_to
      description: With any value, get only the assets that have a task
        assigned to you.
      schema:
        type: string
  responses:
    200:
      description: The list of assets with their tasks
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
