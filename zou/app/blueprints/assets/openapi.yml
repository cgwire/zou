AllAssetsResource_get:
  summary: Get assets
  description: Get the assets of the projects that you can access. An
    administrator gets the assets of all projects. Add a query parameter for
    each column to filter on. For example, use name=Chair to get the assets
    with this name. The route /data/assets/all gives the same result. A vendor
    gets only the assets of their assigned tasks, without the metadata columns
    hidden from their departments.
  tags:
    - Assets
  parameters:
    - in: query
      name: project_id
      description: Get only the assets of this project
      example: a24a6ea4-ce75-4665-a070-57453082c250
      schema:
        type: string
        format: uuid
    - in: query
      name: entity_type_id
      description: Get only the assets of this asset type
      example: a24a6ea4-ce75-4665-a070-57453082c250
      schema:
        type: string
        format: uuid
    - in: query
      name: episode_id
      description: Get the assets of this episode and the assets cast in this
        episode. The project of the episode is used for the access check.
      example: a24a6ea4-ce75-4665-a070-57453082c250
      schema:
        type: string
        format: uuid
    - in: query
      name: assigned_to
      description: With any value, get only the assets that have a task
        assigned to you.
      schema:
        type: string
  responses:
    200:
      description: The list of assets
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: Asset unique identifier
                  example: a24a6ea4-ce75-4665-a070-57453082c250
                name:
                  type: string
                  description: Asset name
                  example: Character Name
                project_id:
                  type: string
                  format: uuid
                  description: Project identifier
                  example: b35b7fb5-df86-5776-b181-68564193d360
                entity_type_id:
                  type: string
                  format: uuid
                  description: Asset type identifier
                  example: c46c80c6-e097-6887-c292-79675204e470
                project_name:
                  type: string
                  description: Project name
                  example: My Project
                asset_type_name:
                  type: string
                  description: Asset type name
                  example: Character
    403:
      description: You do not have access to this project

AssetAssetInstancesResource_get:
  summary: Get the asset instances of an asset
  description: Get the asset instances that are in an asset. An asset instance
    is a copy of an asset in another asset.
  tags:
    - Assets
  parameters:
    - in: path
      name: asset_id
      required: true
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the asset
      schema:
        type: string
        format: uuid
  responses:
    200:
      description: The list of asset instances
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: Asset instance unique identifier
                  example: f79f13f9-1320-9110-f625-029085371700
                asset_id:
                  type: string
                  format: uuid
                  description: Parent asset identifier
                  example: a24a6ea4-ce75-4665-a070-57453082c250
                target_asset_id:
                  type: string
                  format: uuid
                  description: Target asset identifier
                  example: b35b7fb5-df86-5776-b181-68564193d360
                number:
                  type: string
                  description: Instance number
                  example: '001'
                description:
                  type: string
                  description: Instance description
                  example: Main character instance
    403:
      description: You do not have access to this project
    404:
      description: The asset does not exist

AssetAssetInstancesResource_post:
  summary: Add an asset instance to an asset
  description: Make an instance of an asset and put it in the asset of the
    path. A client or a vendor of the project cannot use this route.
  tags:
    - Assets
  parameters:
    - in: path
      name: asset_id
      required: true
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the asset that receives the instance
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - asset_to_instantiate_id
          properties:
            asset_to_instantiate_id:
              type: string
              format: uuid
              description: Unique identifier of the asset to instantiate
              example: a24a6ea4-ce75-4665-a070-57453082c250
            description:
              type: string
              description: Description for the asset instance
              example: Asset instance description
  responses:
    201:
      description: The new asset instance
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Created asset instance unique identifier
                example: f79f13f9-1320-9110-f625-029085371700
              asset_id:
                type: string
                format: uuid
                description: Parent asset identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              target_asset_id:
                type: string
                format: uuid
                description: Target asset identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
              number:
                type: string
                description: Instance number
                example: '001'
              description:
                type: string
                description: Instance description
                example: Main character instance
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: '2023-01-01T12:00:00Z'
    403:
      description: You do not have access to this project, or you are a
        client or a vendor
    404:
      description: The asset does not exist

