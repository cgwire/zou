Get asset
---
description: Retrieve detailed information about a specific asset including metadata, project context, and related data
tags:
  - Assets
parameters:
  - in: path
    name: asset_id
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    required: true
    description: Unique identifier of the asset
responses:
  200:
    description: Asset information successfully retrieved
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Asset unique identifier
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              description: Asset name
              example: "Character Name"
            project_id:
              type: string
              format: uuid
              description: Project identifier
              example: b35b7fb5-df86-5776-b181-68564193d360
            entity_type_id:
              type: string
              format: uuid
              description: Asset type identifier
              example: c46c80c6-e097-6887-c292-79675204e470
            created_at:
              type: string
              format: date-time
              description: Creation timestamp
              example: "2023-01-01T12:00:00Z"
            updated_at:
              type: string
              format: date-time
              description: Last update timestamp
              example: "2023-01-01T12:30:00Z"
