Get an asset
---
description: Get an asset with its project name, asset type name, tasks and
  other related data.
tags:
  - Assets
parameters:
  - in: path
    name: asset_id
    example: a24a6ea4-ce75-4665-a070-57453082c250
    required: true
    description: Unique identifier of the asset
    schema:
      type: string
      format: uuid
responses:
  200:
    description: The asset
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Asset unique identifier
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              description: Asset name
              example: Character Name
            project_id:
              type: string
              format: uuid
              description: Project identifier
              example: b35b7fb5-df86-5776-b181-68564193d360
            entity_type_id:
              type: string
              format: uuid
              description: Asset type identifier
              example: c46c80c6-e097-6887-c292-79675204e470
            created_at:
              type: string
              format: date-time
              description: Creation timestamp
              example: '2023-01-01T12:00:00Z'
            updated_at:
              type: string
              format: date-time
              description: Last update timestamp
              example: '2023-01-01T12:30:00Z'
  403:
    description: You do not have access to this project
  404:
    description: The asset does not exist
