Add an asset instance to an asset
---
description: Make an instance of an asset and put it in the asset of the
  path.
tags:
  - Assets
parameters:
  - in: path
    name: asset_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the asset that receives the instance
    schema:
      type: string
      format: uuid
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - asset_to_instantiate_id
        properties:
          asset_to_instantiate_id:
            type: string
            format: uuid
            description: Unique identifier of the asset to instantiate
            example: a24a6ea4-ce75-4665-a070-57453082c250
          description:
            type: string
            description: Description for the asset instance
            example: Asset instance description
responses:
  201:
    description: The new asset instance
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Created asset instance unique identifier
              example: f79f13f9-1320-9110-f625-029085371700
            asset_id:
              type: string
              format: uuid
              description: Parent asset identifier
              example: a24a6ea4-ce75-4665-a070-57453082c250
            target_asset_id:
              type: string
              format: uuid
              description: Target asset identifier
              example: b35b7fb5-df86-5776-b181-68564193d360
            number:
              type: string
              description: Instance number
              example: '001'
            description:
              type: string
              description: Instance description
              example: Main character instance
            created_at:
              type: string
              format: date-time
              description: Creation timestamp
              example: '2023-01-01T12:00:00Z'
  403:
    description: You do not have access to this project
  404:
    description: The asset does not exist
