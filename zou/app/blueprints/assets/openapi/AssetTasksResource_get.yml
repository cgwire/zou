Get the tasks of an asset
---
description: Get the tasks of an asset.
tags:
  - Assets
parameters:
  - in: path
    name: asset_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the asset
    schema:
      type: string
      format: uuid
  - in: query
    name: relations
    required: false
    description: Add the related data to each task
    schema:
      type: boolean
      default: false
responses:
  200:
    description: The list of tasks
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Task unique identifier
                example: e68e02e8-0219-8009-e514-918974260690
              name:
                type: string
                description: Task name
                example: Modeling Task
              task_type_id:
                type: string
                format: uuid
                description: Task type identifier
                example: f79f13f9-1320-9110-f625-029085371700
              task_status_id:
                type: string
                format: uuid
                description: Task status identifier
                example: 08002400-2431-0221-0736-130196482810
              entity_id:
                type: string
                format: uuid
                description: Asset identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              assigned_to:
                type: string
                format: uuid
                description: Assigned user identifier
                example: 19113511-3542-1332-1847-241207593920
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: '2023-01-01T12:00:00Z'
              updated_at:
                type: string
                format: date-time
                description: Last update timestamp
                example: '2023-01-01T12:30:00Z'
  403:
    description: You do not have access to this project
  404:
    description: The asset does not exist
