Get asset tasks
---
description: Retrieve all tasks related to a specific asset.
tags:
  - Assets
parameters:
  - in: path
    name: asset_id
    required: true
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c25
    description: Unique identifier of the asset
  - in: query
    name: task_type_id
    type: string
    format: uuid
    description: Filter tasks by task type
    example: a24a6ea4-ce75-4665-a070-57453082c25
  - in: query
    name: task_status_id
    type: string
    format: uuid
    description: Filter tasks by task status
    example: a24a6ea4-ce75-4665-a070-57453082c25
responses:
  200:
    description: List of asset tasks successfully retrieved
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Task unique identifier
                example: e68e0ie8-gi19-8009-e514-91897426g69
              name:
                type: string
                description: Task name
                example: "Modeling Task"
              task_type_id:
                type: string
                format: uuid
                description: Task type identifier
                example: f79f1jf9-hj20-9110-f625-02908537h70
              task_status_id:
                type: string
                format: uuid
                description: Task status identifier
                example: g80g2kg0-ik31-0221-g736-13019648i81
              entity_id:
                type: string
                format: uuid
                description: Asset identifier
                example: a24a6ea4-ce75-4665-a070-57453082c25
              assigned_to:
                type: string
                format: uuid
                description: Assigned user identifier
                example: h91h3lh1-jl42-1332-h847-24120759j92
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: "2023-01-01T12:00:00Z"
              updated_at:
                type: string
                format: date-time
                description: Last update timestamp
                example: "2023-01-01T12:30:00Z"
