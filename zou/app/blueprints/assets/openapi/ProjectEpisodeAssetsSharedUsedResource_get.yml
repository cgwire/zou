Get the shared assets used in an episode
---
description: Get the shared assets of other projects that are cast in an
  episode.
tags:
  - Assets
parameters:
  - in: path
    name: project_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the project
    schema:
      type: string
      format: uuid
  - in: path
    name: episode_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the episode
    schema:
      type: string
      format: uuid
responses:
  200:
    description: The list of shared assets
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Asset unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                description: Asset name
                example: Character Name
              project_id:
                type: string
                format: uuid
                description: Original project identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
              entity_type_id:
                type: string
                format: uuid
                description: Asset type identifier
                example: c46c80c6-e097-6887-c292-79675204e470
              is_shared:
                type: boolean
                description: Whether the asset is shared
                example: true
              episode_id:
                type: string
                format: uuid
                description: Episode identifier
                example: d57d91d7-f108-7998-d403-80786315f580
  403:
    description: You do not have access to this project
