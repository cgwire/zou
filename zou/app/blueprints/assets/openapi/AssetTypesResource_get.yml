Get asset types
---
description: Get the asset types. An asset type is an entity type that is
  not shot, sequence, episode, edit, scene, concept or concept folder. Add a
  query parameter for each column to filter on.
tags:
  - Assets
parameters:
  - in: query
    name: project_id
    description: Get only the asset types that the assets of this project
      use
    example: a24a6ea4-ce75-4665-a070-57453082c250
    schema:
      type: string
      format: uuid
responses:
  200:
    description: The list of asset types
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Asset type unique identifier
                example: c46c80c6-e097-6887-c292-79675204e470
              name:
                type: string
                description: Asset type name
                example: Character
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: '2023-01-01T12:00:00Z'
              updated_at:
                type: string
                format: date-time
                description: Last update timestamp
                example: '2023-01-01T12:30:00Z'
