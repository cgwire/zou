Get asset types
---
description: Retrieve all available asset types (entity types that are not shot, sequence, or episode) with filtering support
tags:
  - Assets
parameters:
  - in: query
    name: project_id
    type: string
    format: uuid
    description: Filter asset types by project
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  200:
    description: List of asset types successfully retrieved
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Asset type unique identifier
                example: c46c80c6-e097-6887-c292-79675204e470
              name:
                type: string
                description: Asset type name
                example: "Character"
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: "2023-01-01T12:00:00Z"
              updated_at:
                type: string
                format: date-time
                description: Last update timestamp
                example: "2023-01-01T12:30:00Z"
