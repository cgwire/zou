Get assets with their tasks
---
description: Get the assets of the projects that you can access, with the
  tasks of each asset. Each asset has its project name and asset type name.
  Add a query parameter for each column to filter on. For example, use
  name=Chair to get the assets with this name. The response can have an
  ETag. Send it in If-None-Match to get a 304 response when the data did not
  change.
tags:
  - Assets
parameters:
  - in: query
    name: project_id
    description: Filter assets by specific project
    example: a24a6ea4-ce75-4665-a070-57453082c250
    schema:
      type: string
      format: uuid
  - in: query
    name: episode_id
    description: Get the assets of this episode and the assets that have no
      episode
    example: a24a6ea4-ce75-4665-a070-57453082c250
    schema:
      type: string
      format: uuid
  - in: query
    name: compact
    description: Encode assets and tasks as positional value arrays (halves
      the payload). Field names are given by the asset_fields and
      task_fields entries of the response, map values by name, never by
      hardcoded position.
    schema:
      type: boolean
      default: false
  - in: query
    name: stream
    description: Stream the response as NDJSON (one header line, then one
      asset per line) instead of a single JSON document, to keep server
      memory flat on large productions.
    schema:
      type: boolean
      default: false
  - in: query
    name: asset_type_id
    description: Filter assets by asset type
    example: a24a6ea4-ce75-4665-a070-57453082c250
    schema:
      type: string
      format: uuid
responses:
  200:
    description: The list of assets with their tasks
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Asset unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                description: Asset name
                example: Character Name
              project_id:
                type: string
                format: uuid
                description: Project identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
              entity_type_id:
                type: string
                format: uuid
                description: Asset type identifier
                example: c46c80c6-e097-6887-c292-79675204e470
              project_name:
                type: string
                description: Project name
                example: My Project
              asset_type_name:
                type: string
                description: Asset type name
                example: Character
              tasks:
                type: array
                items:
                  type: object
                description: Array of related tasks
  304:
    description: The data did not change
  400:
    description: An identifier is not a valid UUID
  403:
    description: You do not have access to this project
