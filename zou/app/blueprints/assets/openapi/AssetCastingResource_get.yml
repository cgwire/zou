Get asset casting
---
description: Retrieve the casting information for a specific asset showing which shots or sequences use this asset
tags:
  - Assets
parameters:
  - in: path
    name: asset_id
    required: true
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c25
    description: Unique identifier of the asset
responses:
  200:
    description: Asset casting information successfully retrieved
    content:
      application/json:
        schema:
          type: object
          properties:
            asset_id:
              type: string
              format: uuid
              description: Asset unique identifier
              example: a24a6ea4-ce75-4665-a070-57453082c25
            casting:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Casting entry unique identifier
                    example: b35b7fb5-df86-5776-b181-68564193d36
                  entity_id:
                    type: string
                    format: uuid
                    description: Entity identifier (shot/sequence)
                    example: d57d9hd7-fh08-7998-d403-80786315f58
                  entity_name:
                    type: string
                    description: Entity name
                    example: "SH001"
                  entity_type:
                    type: string
                    description: Entity type (shot/sequence)
                    example: "shot"
