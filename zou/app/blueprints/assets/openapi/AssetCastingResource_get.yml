Get the casting of an asset
---
description: Get the casting of an asset. The casting is the list of assets
  that the asset contains, with the number of occurrences of each asset.
tags:
  - Assets
parameters:
  - in: path
    name: asset_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the asset
    schema:
      type: string
      format: uuid
responses:
  200:
    description: The casting of the asset
    content:
      application/json:
        schema:
          type: object
          properties:
            asset_id:
              type: string
              format: uuid
              description: Asset unique identifier
              example: a24a6ea4-ce75-4665-a070-57453082c250
            casting:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Casting entry unique identifier
                    example: b35b7fb5-df86-5776-b181-68564193d360
                  entity_id:
                    type: string
                    format: uuid
                    description: Entity identifier (shot/sequence)
                    example: d57d91d7-f108-7998-d403-80786315f580
                  entity_name:
                    type: string
                    description: Entity name
                    example: SH001
                  entity_type:
                    type: string
                    description: Entity type (shot/sequence)
                    example: shot
  403:
    description: You do not have access to this project
  404:
    description: The asset does not exist
