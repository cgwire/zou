Get the asset types of a project
---
description: Get the asset types that the assets of a project use.
tags:
  - Assets
parameters:
  - in: path
    name: project_id
    example: a24a6ea4-ce75-4665-a070-57453082c250
    required: true
    description: Unique identifier of the project
    schema:
      type: string
      format: uuid
responses:
  200:
    description: The list of asset types
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Asset type unique identifier
                example: c46c80c6-e097-6887-c292-79675204e470
              name:
                type: string
                description: Asset type name
                example: Character
              project_id:
                type: string
                format: uuid
                description: Project identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
  403:
    description: You do not have access to this project
