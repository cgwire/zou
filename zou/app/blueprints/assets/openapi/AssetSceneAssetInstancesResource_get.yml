Get the scene instances of an asset
---
description: Get the asset instances of an asset that are in scenes.
tags:
  - Assets
parameters:
  - in: path
    name: asset_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the asset
    schema:
      type: string
      format: uuid
responses:
  200:
    description: The list of asset instances
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Asset instance unique identifier
                example: f79f13f9-1320-9110-f625-029085371700
              asset_id:
                type: string
                format: uuid
                description: Asset identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              scene_id:
                type: string
                format: uuid
                description: Scene identifier
                example: 08002400-2431-0221-0736-130196482810
              number:
                type: string
                description: Instance number
                example: '001'
              description:
                type: string
                description: Instance description
                example: Main character instance
  403:
    description: You do not have access to this project
  404:
    description: The asset does not exist
