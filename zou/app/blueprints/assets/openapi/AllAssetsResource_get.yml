Get all assets
---
description: Retrieve all production assets with filtering and pagination. Supports advanced filtering by project, asset type, task status, and other criteria
tags:
  - Assets
parameters:
  - in: query
    name: project_id
    type: string
    format: uuid
    description: Filter assets by specific project
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: query
    name: asset_type_id
    type: string
    format: uuid
    description: Filter assets by asset type
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: query
    name: page
    required: false
    type: integer
    example: 1
    description: Page number. Without page nor limit, the whole list is
      returned; with either, a paginated envelope is returned.
  - in: query
    name: limit
    required: false
    type: integer
    example: 100
    description: Number of entries per page (default 100, max 5000). A
      limit alone returns the first page.
responses:
  200:
    description: List of assets successfully retrieved
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Asset unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                description: Asset name
                example: "Character Name"
              project_id:
                type: string
                format: uuid
                description: Project identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
              entity_type_id:
                type: string
                format: uuid
                description: Asset type identifier
                example: c46c80c6-e097-6887-c292-79675204e470
              project_name:
                type: string
                description: Project name
                example: "My Project"
              asset_type_name:
                type: string
                description: Asset type name
                example: "Character"
