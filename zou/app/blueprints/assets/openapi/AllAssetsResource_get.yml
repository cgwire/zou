Get assets
---
description: Get the assets of the projects that you can access. An
  administrator gets the assets of all projects. Add a query parameter for
  each column to filter on. For example, use name=Chair to get the assets
  with this name. The route /data/assets/all gives the same result.
tags:
  - Assets
parameters:
  - in: query
    name: project_id
    description: Get only the assets of this project
    example: a24a6ea4-ce75-4665-a070-57453082c250
    schema:
      type: string
      format: uuid
  - in: query
    name: asset_type_id
    description: Get only the assets of this asset type
    example: a24a6ea4-ce75-4665-a070-57453082c250
    schema:
      type: string
      format: uuid
responses:
  200:
    description: The list of assets
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Asset unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                description: Asset name
                example: Character Name
              project_id:
                type: string
                format: uuid
                description: Project identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
              entity_type_id:
                type: string
                format: uuid
                description: Asset type identifier
                example: c46c80c6-e097-6887-c292-79675204e470
              project_name:
                type: string
                description: Project name
                example: My Project
              asset_type_name:
                type: string
                description: Asset type name
                example: Character
  403:
    description: You do not have access to this project
