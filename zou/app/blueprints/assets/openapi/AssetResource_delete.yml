Delete an asset
---
description: Delete an asset. The creator of the asset can delete it if the
  creator is in the project team. Other users must be managers of the
  project. If the asset has tasks, the asset is only marked as canceled. Use
  force=true to delete the asset and all its related data.
tags:
  - Assets
parameters:
  - in: path
    name: asset_id
    example: a24a6ea4-ce75-4665-a070-57453082c250
    required: true
    description: Unique identifier of the asset to delete
    schema:
      type: string
      format: uuid
  - in: query
    name: force
    required: false
    description: Delete the asset and all its related data
    example: false
    schema:
      type: boolean
responses:
  204:
    description: The asset is deleted
  403:
    description: You cannot delete this asset
  404:
    description: The asset does not exist
