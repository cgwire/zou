Share or unshare the assets of a project
---
description: Share or unshare the assets of a project. If you give
  asset_ids, only these assets change. Else, all the assets of the project
  change. You must be a manager of the project.
tags:
  - Assets
parameters:
  - in: path
    name: project_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the project
    schema:
      type: string
      format: uuid
requestBody:
  required: false
  content:
    application/json:
      schema:
        type: object
        properties:
          is_shared:
            type: boolean
            description: Whether to share or unshare the assets
            example: true
          asset_ids:
            type: array
            items:
              type: string
              format: uuid
            description: Specific asset IDs to update.
            example: [a24a6ea4-ce75-4665-a070-57453082c250,
                  b35b7fb5-df86-5776-b181-68564193d360]
responses:
  200:
    description: The updated assets
    content:
      application/json:
        schema:
          type: object
          properties:
            updated_count:
              type: integer
              description: Number of assets updated
              example: 5
            project_id:
              type: string
              format: uuid
              description: Project identifier
              example: b35b7fb5-df86-5776-b181-68564193d360
  400:
    description: The body is not valid
  403:
    description: You are not a manager of the project
