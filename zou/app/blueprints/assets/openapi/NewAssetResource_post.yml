Create an asset
---
description: Create an asset in a project, with the asset type of the path.
  You must be a manager of the project.
tags:
  - Assets
parameters:
  - in: path
    name: project_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the project
    schema:
      type: string
      format: uuid
  - in: path
    name: asset_type_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the asset type
    schema:
      type: string
      format: uuid
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
        properties:
          name:
            type: string
            minLength: 1
            example: Chair
            description: Name of the asset
          description:
            type: string
            default: ''
            description: Description of the asset
          data:
            type: object
            default: {}
            description: Values of the metadata columns
          is_shared:
            type: boolean
            default: false
            description: Share the asset with the other projects of the
              studio
          episode_id:
            type: string
            format: uuid
            nullable: true
            example: c46c80c6-e097-6887-c292-79675204e470
            description: Episode where the asset is created
responses:
  201:
    description: The new asset
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Created asset unique identifier
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              description: Asset name
              example: Character Name
            description:
              type: string
              description: Asset description
              example: Main character
            project_id:
              type: string
              format: uuid
              description: Project identifier
              example: b35b7fb5-df86-5776-b181-68564193d360
            entity_type_id:
              type: string
              format: uuid
              description: Asset type identifier
              example: c46c80c6-e097-6887-c292-79675204e470
            created_at:
              type: string
              format: date-time
              description: Creation timestamp
              example: '2023-01-01T12:00:00Z'
            updated_at:
              type: string
              format: date-time
              description: Last update timestamp
              example: '2023-01-01T12:30:00Z'
  400:
    description: The body is not valid
  403:
    description: You are not a manager of the project
