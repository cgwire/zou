Create asset
---
description: Create a new asset in a specific project with the given asset type and parameters.
tags:
  - Assets
parameters:
  - in: path
    name: project_id
    required: true
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c25
    description: Unique identifier of the project
  - in: path
    name: asset_type_id
    required: true
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c25
    description: Unique identifier of the asset type
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - description
          - data
          - is_shared
          - source_id
        properties:
          name:
            type: string
            description: Asset name
            example: "Character Name"
          description:
            type: string
            description: Asset description
            example: "Main character"
          data:
            type: object
            description: Asset metadata and custom data
            example: [{"difficulty": "easy", "atmsophere": "sunny"}]
          is_shared:
            type: boolean
            description: Whether the asset is shared across projects
            example: false
          source_id:
            type: string
            format: uuid
            description: Source asset identifier for duplication
            example: a24a6ea4-ce75-4665-a070-57453082c25
          episode_id:
            type: string
            format: uuid
            description: Episode identifier for episodic assets
            example: a24a6ea4-ce75-4665-a070-57453082c25
responses:
  201:
    description: Asset successfully created
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Created asset unique identifier
              example: a24a6ea4-ce75-4665-a070-57453082c25
            name:
              type: string
              description: Asset name
              example: "Character Name"
            description:
              type: string
              description: Asset description
              example: "Main character"
            project_id:
              type: string
              format: uuid
              description: Project identifier
              example: b35b7fb5-df86-5776-b181-68564193d36
            entity_type_id:
              type: string
              format: uuid
              description: Asset type identifier
              example: c46c8gc6-eg97-6887-c292-79675204e47
            created_at:
              type: string
              format: date-time
              description: Creation timestamp
              example: "2023-01-01T12:00:00Z"
            updated_at:
              type: string
              format: date-time
              description: Last update timestamp
              example: "2023-01-01T12:30:00Z"
