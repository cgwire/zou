Get the asset instances of an asset
---
description: Get the asset instances that are in an asset. An asset instance
  is a copy of an asset in another asset.
tags:
  - Assets
parameters:
  - in: path
    name: asset_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the asset
    schema:
      type: string
      format: uuid
responses:
  200:
    description: The list of asset instances
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Asset instance unique identifier
                example: f79f13f9-1320-9110-f625-029085371700
              asset_id:
                type: string
                format: uuid
                description: Parent asset identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              target_asset_id:
                type: string
                format: uuid
                description: Target asset identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
              number:
                type: string
                description: Instance number
                example: '001'
              description:
                type: string
                description: Instance description
                example: Main character instance
  403:
    description: You do not have access to this project
  404:
    description: The asset does not exist
