Share or unshare the assets of an asset type
---
description: Share or unshare all the assets of a project that have the
  asset type of the path. You must be a manager of the project.
tags:
  - Assets
parameters:
  - in: path
    name: project_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the project
    schema:
      type: string
      format: uuid
  - in: path
    name: asset_type_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the asset type
    schema:
      type: string
      format: uuid
requestBody:
  required: false
  content:
    application/json:
      schema:
        type: object
        properties:
          is_shared:
            type: boolean
            description: Whether to share or unshare the assets
            example: true
responses:
  200:
    description: The updated assets
    content:
      application/json:
        schema:
          type: object
          properties:
            updated_count:
              type: integer
              description: Number of assets updated
              example: 3
            project_id:
              type: string
              format: uuid
              description: Project identifier
              example: b35b7fb5-df86-5776-b181-68564193d360
            asset_type_id:
              type: string
              format: uuid
              description: Asset type identifier
              example: c46c80c6-e097-6887-c292-79675204e470
  400:
    description: The body is not valid
  403:
    description: You are not a manager of the project
