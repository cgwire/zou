Get shared assets used in project
---
description: Retrieve all shared assets that are used in a specific project.
tags:
  - Assets
parameters:
  - in: path
    name: project_id
    required: true
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the project
responses:
  200:
    description: List of shared assets used in project successfully retrieved
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Asset unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                description: Asset name
                example: "Character Name"
              project_id:
                type: string
                format: uuid
                description: Original project identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
              entity_type_id:
                type: string
                format: uuid
                description: Asset type identifier
                example: c46c80c6-e097-6887-c292-79675204e470
              is_shared:
                type: boolean
                description: Whether the asset is shared
                example: true
