Get the assets of an asset type in a project
---
description: Get the assets of a project that have the asset type of the
  path. Add a query parameter for each column to filter on. For example, use
  name=Chair to get the assets with this name.
tags:
  - Assets
parameters:
  - in: path
    name: project_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the project
    schema:
      type: string
      format: uuid
  - in: path
    name: asset_type_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the asset type
    schema:
      type: string
      format: uuid
responses:
  200:
    description: The list of assets
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Asset unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                description: Asset name
                example: Character Name
              project_id:
                type: string
                format: uuid
                description: Project identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
              entity_type_id:
                type: string
                format: uuid
                description: Asset type identifier
                example: c46c80c6-e097-6887-c292-79675204e470
              project_name:
                type: string
                description: Project name
                example: My Project
              asset_type_name:
                type: string
                description: Asset type name
                example: Character
  403:
    description: You do not have access to this project
