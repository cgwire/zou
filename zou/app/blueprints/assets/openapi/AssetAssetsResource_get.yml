Get the assets cast in an asset
---
description: Get the assets that are cast in an asset. An asset can contain
  other assets. For example, a set contains props.
tags:
  - Assets
parameters:
  - in: path
    name: asset_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the asset
    schema:
      type: string
      format: uuid
responses:
  200:
    description: The list of assets cast in the asset
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Linked asset unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                description: Linked asset name
                example: Character Name
              project_id:
                type: string
                format: uuid
                description: Project identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
              entity_type_id:
                type: string
                format: uuid
                description: Asset type identifier
                example: c46c80c6-e097-6887-c292-79675204e470
  403:
    description: You do not have access to this project
  404:
    description: The asset does not exist
