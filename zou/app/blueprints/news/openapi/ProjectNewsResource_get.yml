Get project latest news
---
description: Get the 50 latest news object (activity feed) for a project
tags:
  - News
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the project
  - in: query
    name: before
    required: false
    schema:
      type: string
      format: date
    example: "2022-07-12"
    description: Filter news before this date
  - in: query
    name: after
    required: false
    schema:
      type: string
      format: date
    example: "2022-07-12"
    description: Filter news after this date
  - in: query
    name: page
    required: false
    schema:
      type: integer
      default: 1
    example: 1
    description: Page number for pagination
  - in: query
    name: limit
    required: false
    schema:
      type: integer
      default: 50
    example: 50
    description: Number of news items per page
  - in: query
    name: person_id
    required: false
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Filter news by specific team member
  - in: query
    name: task_type_id
    required: false
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Filter news by task type
  - in: query
    name: task_status_id
    required: false
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Filter news by task status
  - in: query
    name: episode_id
    required: false
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Filter news by specific episode
  - in: query
    name: only_preview
    required: false
    schema:
      type: boolean
      default: false
    example: false
    description: Show only news related to preview uploads
responses:
  '200':
    description: All news related to given project
    content:
      application/json:
        schema:
          type: object
          properties:
            data:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Unique news item identifier
                  title:
                    type: string
                    description: News item title
                  content:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                  author_id:
                    type: string
                    format: uuid
            stats:
              type: object
              properties:
                total:
                  type: integer
  '404':
    description: Project not found
