Get a news of a project
---
description: Get a news of a project. Clients and vendors cannot use this
  route.
tags:
  - News
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the project
  - in: path
    name: news_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the news item
responses:
  200:
    description: The news
  403:
    description: You do not have access to this project, or you are a client
      or a vendor
  404:
    description: The project or the news does not exist
