Get open projects news
---
description: Returns the latest news and activity feed from all
  projects the user has access to.
tags:
  - News
parameters:
  - in: query
    name: project_id
    required: false
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c25
    description: Filter news by specific project
  - in: query
    name: before
    required: false
    schema:
      type: string
      format: date
    example: "2022-07-12"
    description: Filter news before this date
  - in: query
    name: after
    required: false
    schema:
      type: string
      format: date
    example: "2022-07-12"
    description: Filter news after this date
  - in: query
    name: page
    required: false
    schema:
      type: integer
      default: 1
    example: 1
    description: Page number for pagination
  - in: query
    name: limit
    required: false
    schema:
      type: integer
      default: 50
    example: 50
    description: Number of news items per page
  - in: query
    name: person_id
    required: false
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c25
    description: Filter news by specific team member
  - in: query
    name: task_type_id
    required: false
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c25
    description: Filter news by task type
  - in: query
    name: task_status_id
    required: false
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c25
    description: Filter news by task status
  - in: query
    name: episode_id
    required: false
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c25
    description: Filter news by specific episode
  - in: query
    name: only_preview
    required: false
    schema:
      type: boolean
      default: false
    example: false
    description: Show only news related to preview uploads
responses:
  '200':
    description: News feed successfully retrieved
    content:
      application/json:
        schema:
          type: object
          properties:
            data:
              type: array
              items:
                type: object
              description: Array of news items
            stats:
              type: object
              description: News statistics
            total:
              type: integer
              description: Total number of news items
