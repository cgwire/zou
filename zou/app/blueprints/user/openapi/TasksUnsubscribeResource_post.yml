Unsubscribe from tasks
---
description: Remove your subscriptions to the tasks of the list in one
  request.
tags:
  - User
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - task_ids
        properties:
          task_ids:
            type: array
            items:
              type: string
              format: uuid
responses:
  200:
    description: The identifiers of the tasks
  400:
    description: The body is not valid
