Get sequence shots
---
description: Retrieve shots related to a specific sequence for the
  current user.
tags:
- User
parameters:
  - in: path
    name: sequence_id
    required: true
    schema:
      type: string
      format: uuid
    description: Sequence unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
    200:
      description: Shots related to given sequence
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: Shot unique identifier
                  example: b35b7fb5-df86-5776-b181-68564193d360
                name:
                  type: string
                  description: Shot name
                  example: "SH001"
                description:
                  type: string
                  description: Shot description
                  example: "Main shot"
                sequence_id:
                  type: string
                  format: uuid
                  description: Sequence identifier
                  example: c46c80c6-e097-6887-c292-79675204e470
                project_id:
                  type: string
                  format: uuid
                  description: Project identifier
                  example: d57d91d7-f108-7998-d403-80786315f580
                created_at:
                  type: string
                  format: date-time
                  description: Creation timestamp
                  example: "2023-01-01T12:00:00Z"
                updated_at:
                  type: string
                  format: date-time
                  description: Last update timestamp
                  example: "2023-01-01T12:30:00Z"
