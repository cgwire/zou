Get day off
---
description: Retrieve day off information for the current user on a
  specific date.
tags:
- User
parameters:
  - in: path
    name: date
    required: true
    schema:
      type: string
      format: date
    description: Date to check for day off
    example: "2023-01-01"
responses:
    200:
      description: Day off object for the current user on given date
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Day off unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c25
              person_id:
                type: string
                format: uuid
                description: Person identifier
                example: b35b7fb5-df86-5776-b181-68564193d36
              date:
                type: string
                format: date
                description: Day off date
                example: "2023-01-01"
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: "2023-01-01T12:00:00Z"
              updated_at:
                type: string
                format: date-time
                description: Last update timestamp
                example: "2023-01-01T12:30:00Z"
