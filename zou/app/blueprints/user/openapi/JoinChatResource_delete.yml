Leave a chat
---
description: Leave the chat of an entity. You do not get the messages of
  this chat after.
tags:
  - User
parameters:
  - in: path
    name: entity_id
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the entity
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  204:
    description: You left the chat
  403:
    description: You do not have access to this entity
  404:
    description: The entity does not exist
