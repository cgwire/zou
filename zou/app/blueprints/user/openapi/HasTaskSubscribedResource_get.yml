Check my subscription to a task
---
description: Check if you get the notifications of a task.
tags:
  - User
parameters:
  - in: path
    name: task_id
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the task
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  200:
    description: True if you are subscribed
    content:
      application/json:
        schema:
          type: boolean
          example: true
