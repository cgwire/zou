Get the filter values of my tasks to check
---
description: Get the projects, task types, task statuses, episodes and
  assignees of the tasks that you must check. The filters of the list use
  these values.
tags:
  - User
responses:
  200:
    description: The filter values
    content:
      application/json:
        schema:
          type: object
          properties:
            project_ids:
              type: array
              items:
                type: string
                format: uuid
            task_type_ids:
              type: array
              items:
                type: string
                format: uuid
            task_status_ids:
              type: array
              items:
                type: string
                format: uuid
            episode_ids:
              type: array
              items:
                type: string
                format: uuid
            person_ids:
              type: array
              items:
                type: string
                format: uuid
