Get sequence tasks
---
description: Retrieve tasks related to a specific sequence for the
  current user.
  sequence.
tags:
- User
parameters:
  - in: path
    name: sequence_id
    required: true
    schema:
      type: string
      format: uuid
    description: Sequence unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c25
responses:
    200:
      description: Tasks related to given sequence
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: Task unique identifier
                  example: b35b7fb5-df86-5776-b181-68564193d36
                name:
                  type: string
                  description: Task name
                  example: "Compositing"
                task_type_id:
                  type: string
                  format: uuid
                  description: Task type identifier
                  example: c46c8gc6-eg97-6887-c292-79675204e47
                task_status_id:
                  type: string
                  format: uuid
                  description: Task status identifier
                  example: d57d9hd7-fh08-7998-d403-80786315f58
                assigner_id:
                  type: string
                  format: uuid
                  description: Person who assigned the task
                  example: e68e0ie8-gi19-8009-e514-91897426g69
                assignees:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: List of assigned person identifiers
                  example: ["f79f1jf9-hj20-9010-f625-a09008537h80"]
                created_at:
                  type: string
                  format: date-time
                  description: Creation timestamp
                  example: "2023-01-01T12:00:00Z"
                updated_at:
                  type: string
                  format: date-time
                  description: Last update timestamp
                  example: "2023-01-01T12:30:00Z"
