Create filter
---
description: Create a new filter for the current user limited to open
  projects only.
tags:
- User
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - query
          - list_type
          - project_id
        properties:
          name:
            type: string
            description: Filter name
            example: "My Custom Filter"
          query:
            type: string
            description: Filter query as JSON string
            example: '{"project_id": "uuid"}'
          list_type:
            type: string
            description: Type of list this filter applies to
            example: "todo"
          entity_type:
            type: string
            description: Entity type this filter applies to
            example: "Asset"
          project_id:
            type: string
            format: uuid
            description: Project identifier
            example: a24a6ea4-ce75-4665-a070-57453082c25
          is_shared:
            type: boolean
            description: Whether to share this filter with others
            default: false
            example: false
          search_filter_group_id:
            type: string
            format: uuid
            description: Filter group identifier
            example: b35b7fb5-df86-5776-b181-68564193d36
          department_id:
            type: string
            format: uuid
            description: Department identifier
            example: c46c8gc6-eg97-6887-c292-79675204e47
responses:
    201:
      description: Filter created successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Filter unique identifier
                example: d57d9hd7-fh08-7998-d403-80786315f58
              name:
                type: string
                description: Filter name
                example: "My Custom Filter"
              query:
                type: string
                description: Filter query JSON
                example: '{"project_id": "uuid"}'
              list_type:
                type: string
                description: List type
                example: "todo"
              entity_type:
                type: string
                description: Entity type
                example: "Asset"
              project_id:
                type: string
                format: uuid
                description: Project identifier
                example: e68e0ie8-gi19-8009-e514-91897426g69
              is_shared:
                type: boolean
                description: Whether filter is shared
                example: false
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: "2023-01-01T12:00:00Z"
              updated_at:
                type: string
                format: date-time
                description: Last update timestamp
                example: "2023-01-01T12:30:00Z"
    400:
      description: Bad request
