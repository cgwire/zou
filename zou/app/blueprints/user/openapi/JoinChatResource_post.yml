Join chat
---
description: Join a chat for a specific entity by adding the current
  user as a participant. The user will be listed as a participant in
  the chat.
tags:
- User
parameters:
  - in: path
    name: entity_id
    required: true
    schema:
      type: string
      format: uuid
    description: Entity unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c25
responses:
    201:
      description: Chat joined successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Chat unique identifier
                example: b35b7fb5-df86-5776-b181-68564193d36
              entity_id:
                type: string
                format: uuid
                description: Entity identifier
                example: c46c8gc6-eg97-6887-c292-79675204e47
              entity_type:
                type: string
                description: Entity type
                example: "Asset"
              participants:
                type: array
                items:
                  type: string
                  format: uuid
                description: List of participant person identifiers
                example: ["d57d9hd7-fh08-7998-d403-80786315f58"]
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: "2023-01-01T12:00:00Z"
              updated_at:
                type: string
                format: date-time
                description: Last update timestamp
                example: "2023-01-01T12:30:00Z"
