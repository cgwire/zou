Join a chat
---
description: Join the chat of an entity as a participant. Clients cannot
  use this route.
tags:
  - User
parameters:
  - in: path
    name: entity_id
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the entity
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  201:
    description: The chat
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Chat unique identifier
              example: b35b7fb5-df86-5776-b181-68564193d360
            entity_id:
              type: string
              format: uuid
              description: Entity identifier
              example: c46c80c6-e097-6887-c292-79675204e470
            entity_type:
              type: string
              description: Entity type
              example: Asset
            participants:
              type: array
              items:
                type: string
                format: uuid
              description: List of participant person identifiers
              example: [d57d91d7-f108-7998-d403-80786315f580]
            created_at:
              type: string
              format: date-time
              description: Creation timestamp
              example: '2023-01-01T12:00:00Z'
            updated_at:
              type: string
              format: date-time
              description: Last update timestamp
              example: '2023-01-01T12:30:00Z'
  403:
    description: You are a client, or you do not have access to this entity
  404:
    description: The entity does not exist
