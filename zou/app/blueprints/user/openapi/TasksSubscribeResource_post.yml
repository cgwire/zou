Subscribe to tasks
---
description: Subscribe to each task of the list in one request. A
  subscription sends you a notification for each comment on these tasks.
tags:
  - User
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - task_ids
        properties:
          task_ids:
            type: array
            items:
              type: string
              format: uuid
responses:
  201:
    description: The new subscriptions
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
  400:
    description: The body is not valid
