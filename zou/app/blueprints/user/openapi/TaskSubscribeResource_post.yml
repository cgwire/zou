Subscribe to a task
---
description: Subscribe to a task. A subscription sends you a notification
  for each comment on this task.
tags:
  - User
parameters:
  - in: path
    name: task_id
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the task
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  201:
    description: The new subscription
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Subscription unique identifier
              example: b35b7fb5-df86-5776-b181-68564193d360
            person_id:
              type: string
              format: uuid
              description: Person identifier
              example: c46c80c6-e097-6887-c292-79675204e470
            task_id:
              type: string
              format: uuid
              description: Task identifier
              example: d57d91d7-f108-7998-d403-80786315f580
            created_at:
              type: string
              format: date-time
              description: Creation timestamp
              example: '2023-01-01T12:00:00Z'
            updated_at:
              type: string
              format: date-time
              description: Last update timestamp
              example: '2023-01-01T12:30:00Z'
  403:
    description: You do not have access to this task
