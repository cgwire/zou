Subscribe to task
---
description: Create a subscription entry for the current user and
  given task. When subscribed, the user receives notifications for all
  comments posted on the task.
tags:
- User
parameters:
  - in: path
    name: task_id
    required: true
    schema:
      type: string
      format: uuid
    description: Task unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c25
responses:
    201:
      description: Subscription created successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Subscription unique identifier
                example: b35b7fb5-df86-5776-b181-68564193d36
              person_id:
                type: string
                format: uuid
                description: Person identifier
                example: c46c8gc6-eg97-6887-c292-79675204e47
              task_id:
                type: string
                format: uuid
                description: Task identifier
                example: d57d9hd7-fh08-7998-d403-80786315f58
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: "2023-01-01T12:00:00Z"
              updated_at:
                type: string
                format: date-time
                description: Last update timestamp
                example: "2023-01-01T12:30:00Z"
