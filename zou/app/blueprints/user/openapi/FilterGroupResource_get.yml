Get filter group
---
description: Retrieve a specific filter group for the current user.
  Returns detailed information about the filter group.
tags:
- User
parameters:
  - in: path
    name: search_filter_group_id
    required: true
    schema:
      type: string
      format: uuid
    description: Filter group unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
    200:
      description: Filter group details
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Filter group unique identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
              name:
                type: string
                description: Filter group name
                example: "My Filter Group"
              color:
                type: string
                description: Filter group color
                example: "#FF0000"
              list_type:
                type: string
                description: List type
                example: "todo"
              entity_type:
                type: string
                description: Entity type
                example: "Asset"
              project_id:
                type: string
                format: uuid
                description: Project identifier
                example: c46c80c6-e097-6887-c292-79675204e470
              is_shared:
                type: boolean
                description: Whether filter group is shared
                example: false
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: "2023-01-01T12:00:00Z"
              updated_at:
                type: string
                format: date-time
                description: Last update timestamp
                example: "2023-01-01T12:30:00Z"
