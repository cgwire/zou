Get my notifications
---
description: Get your last 100 notifications that match the filters, the
  newest first.
tags:
  - User
parameters:
  - in: query
    name: after
    required: false
    schema:
      type: string
      format: date
    description: Get the notifications after this date
    example: '2023-01-01'
  - in: query
    name: before
    required: false
    schema:
      type: string
      format: date
    description: Get the notifications before this date
    example: '2023-12-31'
  - in: query
    name: task_type_id
    required: false
    schema:
      type: string
      format: uuid
    description: Get only the notifications of this task type
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: query
    name: task_status_id
    required: false
    schema:
      type: string
      format: uuid
    description: Get only the notifications of this task status
    example: b35b7fb5-df86-5776-b181-68564193d360
  - in: query
    name: type
    required: false
    schema:
      type: string
    description: Get only the notifications of this type, for example
      comment or mention
    example: comment
  - in: query
    name: read
    required: false
    schema:
      type: boolean
    description: Get only the read notifications, or only the unread
      notifications
    example: false
  - in: query
    name: watching
    required: false
    schema:
      type: boolean
    description: Get only the notifications of the tasks that you watch, or
      of the other tasks
    example: true
responses:
  200:
    description: The list of notifications
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Notification unique identifier
                example: c46c80c6-e097-6887-c292-79675204e470
              type:
                type: string
                description: Notification type
                example: comment
              read:
                type: boolean
                description: Whether notification is read
                example: false
              author_id:
                type: string
                format: uuid
                description: Author person identifier
                example: d57d91d7-f108-7998-d403-80786315f580
              comment_id:
                type: string
                format: uuid
                description: Comment identifier
                example: e68e02e8-0219-8009-e514-918974260690
              task_id:
                type: string
                format: uuid
                description: Task identifier
                example: f79f13f9-1320-9010-f625-a09008537180
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: '2023-01-01T12:00:00Z'
              updated_at:
                type: string
                format: date-time
                description: Last update timestamp
                example: '2023-01-01T12:30:00Z'
