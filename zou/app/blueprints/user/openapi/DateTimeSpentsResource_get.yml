Get time spents by date
---
description: Retrieve time spent entries for the current user on a
  specific date. Returns all time entries for the given date.
tags:
- User
parameters:
  - in: path
    name: date
    required: true
    schema:
      type: string
      format: date
    description: Date to get time spents for
    example: "2023-01-01"
responses:
    200:
      description: Time spent entries for the current user on given date
      content:
        application/json:
          schema:
            type: object
            properties:
              date:
                type: string
                format: date
                description: Date of time spent
                example: "2023-01-01"
              total_duration:
                type: number
                description: Total duration in seconds
                example: 28800
              entries:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      description: Time spent unique identifier
                      example: a24a6ea4-ce75-4665-a070-57453082c25
                    task_id:
                      type: string
                      format: uuid
                      description: Task identifier
                      example: b35b7fb5-df86-5776-b181-68564193d36
                    duration:
                      type: number
                      description: Duration in seconds
                      example: 3600
                    created_at:
                      type: string
                      format: date-time
                      description: Creation timestamp
                      example: "2023-01-01T12:00:00Z"
    400:
      description: Wrong date format
