Get scene task types
---
description: Retrieve task types related to a specific scene for the
  current user.
tags:
- User
parameters:
  - in: path
    name: scene_id
    required: true
    schema:
      type: string
      format: uuid
    description: Scene unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c25
responses:
    200:
      description: Task types related to given scene for current user
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: Task type unique identifier
                  example: b35b7fb5-df86-5776-b181-68564193d36
                name:
                  type: string
                  description: Task type name
                  example: "Layout"
                short_name:
                  type: string
                  description: Task type short name
                  example: "LAY"
                color:
                  type: string
                  description: Task type color
                  example: "#0000FF"
                priority:
                  type: integer
                  description: Task type priority
                  example: 3
                for_entity:
                  type: string
                  description: Entity type this task type applies to
                  example: "Scene"
                created_at:
                  type: string
                  format: date-time
                  description: Creation timestamp
                  example: "2023-01-01T12:00:00Z"
                updated_at:
                  type: string
                  format: date-time
                  description: Last update timestamp
                  example: "2023-01-01T12:30:00Z"
