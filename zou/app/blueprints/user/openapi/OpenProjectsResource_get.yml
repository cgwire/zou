Get my open projects
---
description: Get the open projects of your teams. Give name to get the
  projects with this name.
tags:
  - User
parameters:
  - in: query
    name: name
    required: false
    schema:
      type: string
    description: Get only the projects with this name
    example: My Project
responses:
  200:
    description: The list of open projects
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Project unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                description: Project name
                example: My Project
              description:
                type: string
                description: Project description
                example: A sample project
              status:
                type: string
                description: Project status
                example: Active
              fps:
                type: number
                description: Frames per second
                example: 24.0
              ratio:
                type: string
                description: Aspect ratio
                example: 16:9
              resolution:
                type: string
                description: Project resolution
                example: 1920x1080
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: '2023-01-01T12:00:00Z'
              updated_at:
                type: string
                format: date-time
                description: Last update timestamp
                example: '2023-01-01T12:30:00Z'
