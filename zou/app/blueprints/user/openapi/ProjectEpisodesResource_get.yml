Get my episodes of a project
---
description: Get the episodes of a project. The route uses only the entities
  where you have an assigned task.
tags:
  - User
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the project
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  200:
    description: The list
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Episode unique identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
              name:
                type: string
                description: Episode name
                example: Episode 01
              description:
                type: string
                description: Episode description
                example: First episode
              project_id:
                type: string
                format: uuid
                description: Project identifier
                example: c46c80c6-e097-6887-c292-79675204e470
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: '2023-01-01T12:00:00Z'
              updated_at:
                type: string
                format: date-time
                description: Last update timestamp
                example: '2023-01-01T12:30:00Z'
