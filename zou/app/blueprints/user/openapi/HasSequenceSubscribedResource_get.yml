Check my subscription to a sequence
---
description: Check if you get the notifications of a sequence for a task
  type.
tags:
  - User
parameters:
  - in: path
    name: sequence_id
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the sequence
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: task_type_id
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the task type
    example: b35b7fb5-df86-5776-b181-68564193d360
responses:
  200:
    description: True if you are subscribed
    content:
      application/json:
        schema:
          type: boolean
          example: true
