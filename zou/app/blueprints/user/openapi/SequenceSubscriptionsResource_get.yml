Get sequence subscriptions
---
description: Retrieve list of sequence IDs to which the current user
  has subscribed for a given task type within a specific project.
tags:
- User
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: task_type_id
    required: true
    schema:
      type: string
      format: uuid
    description: Task type unique identifier
    example: b35b7fb5-df86-5776-b181-68564193d360
responses:
    200:
      description: List of subscribed sequence IDs for the task type
      content:
        application/json:
          schema:
            type: array
            items:
              type: string
              format: uuid
              example: c46c80c6-e097-6887-c292-79675204e470
