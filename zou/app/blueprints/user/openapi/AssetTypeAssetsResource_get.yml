Get project assets
---
description: Retrieve assets of a specific type within a project
  matching the asset type in the given project if the user has access.
tags:
- User
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c25
  - in: path
    name: asset_type_id
    required: true
    schema:
      type: string
      format: uuid
    description: Asset type unique identifier
    example: b35b7fb5-df86-5776-b181-68564193d36
responses:
    200:
      description: Assets of given type in the specified project
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: Asset unique identifier
                  example: c46c8gc6-eg97-6887-c292-79675204e47
                name:
                  type: string
                  description: Asset name
                  example: "Main Character"
                description:
                  type: string
                  description: Asset description
                  example: "Main character model for the project"
                asset_type_id:
                  type: string
                  format: uuid
                  description: Asset type identifier
                  example: d57d9hd7-fh08-7998-d403-80786315f58
                project_id:
                  type: string
                  format: uuid
                  description: Project identifier
                  example: e68e0ie8-gi19-8009-e514-91897426g69
                created_at:
                  type: string
                  format: date-time
                  description: Creation timestamp
                  example: "2023-01-01T12:00:00Z"
                updated_at:
                  type: string
                  format: date-time
                  description: Last update timestamp
                  example: "2023-01-01T12:30:00Z"
