Get project assets
---
description: Retrieve assets of a specific type within a project
  matching the asset type in the given project if the user has access.
tags:
- User
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: asset_type_id
    required: true
    schema:
      type: string
      format: uuid
    description: Asset type unique identifier
    example: b35b7fb5-df86-5776-b181-68564193d360
responses:
    200:
      description: Assets of given type in the specified project
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: Asset unique identifier
                  example: c46c80c6-e097-6887-c292-79675204e470
                name:
                  type: string
                  description: Asset name
                  example: "Main Character"
                description:
                  type: string
                  description: Asset description
                  example: "Main character model for the project"
                asset_type_id:
                  type: string
                  format: uuid
                  description: Asset type identifier
                  example: d57d91d7-f108-7998-d403-80786315f580
                project_id:
                  type: string
                  format: uuid
                  description: Project identifier
                  example: e68e02e8-0219-8009-e514-918974260690
                created_at:
                  type: string
                  format: date-time
                  description: Creation timestamp
                  example: "2023-01-01T12:00:00Z"
                updated_at:
                  type: string
                  format: date-time
                  description: Last update timestamp
                  example: "2023-01-01T12:30:00Z"
