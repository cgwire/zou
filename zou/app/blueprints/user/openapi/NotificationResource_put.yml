Update notification
---
description: Change the read status of a specific notification. Only
  the notification owner can update their notifications.
tags:
- User
parameters:
  - in: path
    name: notification_id
    required: true
    schema:
      type: string
      format: uuid
    description: Notification unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c25
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          read:
            type: boolean
            description: Mark notification as read or unread
            example: true
responses:
    200:
      description: Notification updated successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Notification unique identifier
                example: b35b7fb5-df86-5776-b181-68564193d36
              type:
                type: string
                description: Notification type
                example: "comment"
              read:
                type: boolean
                description: Whether notification is read
                example: true
              author_id:
                type: string
                format: uuid
                description: Author person identifier
                example: c46c8gc6-eg97-6887-c292-79675204e47
              comment_id:
                type: string
                format: uuid
                description: Comment identifier
                example: d57d9hd7-fh08-7998-d403-80786315f58
              task_id:
                type: string
                format: uuid
                description: Task identifier
                example: e68e0ie8-gi19-8009-e514-91897426g69
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: "2023-01-01T12:00:00Z"
              updated_at:
                type: string
                format: date-time
                description: Last update timestamp
                example: "2023-01-01T12:30:00Z"
