Get desktop login logs
---
description: Retrieve desktop login logs for the current user.
tags:
- User
responses:
    200:
      description: Desktop login logs for current user
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: Login log unique identifier
                  example: a24a6ea4-ce75-4665-a070-57453082c250
                person_id:
                  type: string
                  format: uuid
                  description: Person identifier
                  example: b35b7fb5-df86-5776-b181-68564193d360
                date:
                  type: string
                  format: date
                  description: Login date
                  example: "2023-01-01"
                created_at:
                  type: string
                  format: date-time
                  description: Creation timestamp
                  example: "2023-01-01T12:00:00Z"
                updated_at:
                  type: string
                  format: date-time
                  description: Last update timestamp
                  example: "2023-01-01T12:30:00Z"
