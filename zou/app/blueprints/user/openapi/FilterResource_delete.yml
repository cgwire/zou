Delete a filter
---
description: Delete a filter. The filter must be yours. An administrator can
  use the filters of all the users.
tags:
  - User
parameters:
  - in: path
    name: filter_id
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the filter
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  204:
    description: The filter is deleted
  404:
    description: You have no filter with this identifier
