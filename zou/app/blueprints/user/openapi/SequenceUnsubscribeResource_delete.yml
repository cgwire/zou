Unsubscribe from a sequence
---
description: Remove your subscription to the tasks of a task type in a
  sequence.
tags:
  - User
parameters:
  - in: path
    name: sequence_id
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the sequence
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: task_type_id
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the task type
    example: b35b7fb5-df86-5776-b181-68564193d360
responses:
  204:
    description: The subscription is removed
