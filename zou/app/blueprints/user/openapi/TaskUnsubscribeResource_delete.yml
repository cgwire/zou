Unsubscribe from a task
---
description: Remove your subscription to a task.
tags:
  - User
parameters:
  - in: path
    name: task_id
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the task
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  204:
    description: The subscription is removed
