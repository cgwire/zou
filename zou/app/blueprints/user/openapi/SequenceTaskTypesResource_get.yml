Get my task types of a sequence
---
description: Get the task types of a sequence where you have an assigned
  task.
tags:
  - User
parameters:
  - in: path
    name: sequence_id
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the sequence
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  200:
    description: The list of task types
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Task type unique identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
              name:
                type: string
                description: Task type name
                example: Compositing
              short_name:
                type: string
                description: Task type short name
                example: COMP
              color:
                type: string
                description: Task type color
                example: '#FFFF00'
              priority:
                type: integer
                description: Task type priority
                example: 4
              for_entity:
                type: string
                description: Entity type this task type applies to
                example: Sequence
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: '2023-01-01T12:00:00Z'
              updated_at:
                type: string
                format: date-time
                description: Last update timestamp
                example: '2023-01-01T12:30:00Z'
