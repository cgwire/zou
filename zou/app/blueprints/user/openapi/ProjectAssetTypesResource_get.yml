Get project asset types
---
description: Retrieve asset types related to a specific project for the
  current user.
tags:
- User
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    description: Project unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
    200:
      description: Asset types related to given project
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: Asset type unique identifier
                  example: b35b7fb5-df86-5776-b181-68564193d360
                name:
                  type: string
                  description: Asset type name
                  example: "Character"
                short_name:
                  type: string
                  description: Asset type short name
                  example: "CHAR"
                color:
                  type: string
                  description: Asset type color
                  example: "#FF0000"
                project_id:
                  type: string
                  format: uuid
                  description: Project identifier
                  example: c46c80c6-e097-6887-c292-79675204e470
                created_at:
                  type: string
                  format: date-time
                  description: Creation timestamp
                  example: "2023-01-01T12:00:00Z"
                updated_at:
                  type: string
                  format: date-time
                  description: Last update timestamp
                  example: "2023-01-01T12:30:00Z"
