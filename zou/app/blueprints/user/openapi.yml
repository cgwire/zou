ClearAvatarResource_delete:
  summary: Delete my avatar
  description: Delete your avatar file and set has_avatar to false.
  tags:
    - User
  responses:
    204:
      description: The avatar is deleted
    403:
      description: You use a bot token

ContextResource_get:
  summary: Get my context
  description: Get the data that an application needs to start. projects are
    your open projects, or all the open projects for an administrator. persons
    depends on your role. A client gets only the members of the teams of their
    open projects, with a reduced set of fields. A manager or an administrator
    gets all the persons with all their fields. Another role gets all the
    persons with a minimal set of fields. An administrator also gets
    user_limit.
  tags:
    - User
  responses:
    200:
      description: The context
      content:
        application/json:
          schema:
            type: object
            properties:
              projects:
                type: array
                items:
                  type: object
                description: Available projects
                example: [{id: uuid, name: Project 1}]
              departments:
                type: array
                items:
                  type: object
                description: Available departments
                example: [{id: uuid, name: Animation}]
              asset_types:
                type: array
                items:
                  type: object
                description: Available asset types
                example: [{id: uuid, name: Character}]
              task_types:
                type: array
                items:
                  type: object
                description: Available task types
                example: [{id: uuid, name: Modeling}]
              task_status:
                type: array
                items:
                  type: object
                description: Available task statuses
                example: [{id: uuid, name: In Progress}]
              custom_actions:
                type: array
                items:
                  type: object
                description: Available custom actions
                example: [{id: uuid, name: Custom Action}]
              status_automations:
                type: array
                items:
                  type: object
                description: Available status automations
                example: [{id: uuid, name: Auto Status}]
              studios:
                type: array
                items:
                  type: object
                description: Available studios
                example: [{id: uuid, name: Studio Name}]
              notification_count:
                type: integer
                description: Number of unread notifications
                example: 5
              persons:
                type: array
                items:
                  type: object
                description: Available persons
                example: [{id: uuid, name: John Doe}]
              project_status:
                type: array
                items:
                  type: object
                description: Available project statuses
                example: [{id: uuid, name: Active}]
              search_filters:
                type: object
                description: Your filters by list type and by project, as in
                  the filters route
                example: {todo: {all: [{id: uuid, name: My Filter}]}}
              search_filter_groups:
                type: object
                description: Your filter groups by list type and by
                  project, as in the filter groups route
                example: {todo: {all: [{id: uuid, name: Filter Group}]}}
              preview_background_files:
                type: array
                items:
                  type: object
                description: Available preview background files
                example: [{id: uuid, name: background.jpg}]
              project_roles:
                type: object
                additionalProperties:
                  type: string
                description: The role you hold on each project where your team
                  link sets one, by project identifier
                example: {a24a6ea4-ce75-4665-a070-57453082c250: supervisor}
              plugins:
                type: array
                items:
                  type: object
                description: Installed plugins
              user_limit:
                type: integer
                description: Maximum number of active users, for an
                  administrator only
                example: 50
    403:
      description: You use a bot token

DateTimeSpentsResource_get:
  summary: Get my time spents for a date
  description: Get your time spent entries for a date.
  tags:
    - User
  parameters:
    - in: path
      name: date
      required: true
      schema:
        type: string
        format: date
      description: Date in the YYYY-MM-DD format
      example: '2023-01-01'
  responses:
    200:
      description: The list of your time spent entries for this date
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: Time spent unique identifier
                  example: a24a6ea4-ce75-4665-a070-57453082c250
                person_id:
                  type: string
                  format: uuid
                  description: Person identifier
                  example: b35b7fb5-df86-5776-b181-68564193d360
                task_id:
                  type: string
                  format: uuid
                  description: Task identifier
                  example: c46c80c6-e097-6887-c292-79675204e470
                date:
                  type: string
                  format: date
                  description: Date of time spent
                  example: '2023-01-01'
                duration:
                  type: number
                  description: Duration in seconds
                  example: 3600
                created_at:
                  type: string
                  format: date-time
                  description: Creation timestamp
                  example: '2023-01-01T12:00:00Z'
                updated_at:
                  type: string
                  format: date-time
                  description: Last update timestamp
                  example: '2023-01-01T12:30:00Z'
    400:
      description: The date is not valid
    403:
      description: You use a bot token

