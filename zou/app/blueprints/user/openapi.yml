TimeSpentsResource_get:
  summary: Get my time spents
  description: Get your time spent entries. To get the entries of a period,
    give start_date and end_date.
  tags:
    - User
  parameters:
    - in: query
      name: start_date
      required: false
      schema:
        type: string
        format: date
      description: First date of the period, in the YYYY-MM-DD format
      example: '2023-01-01'
    - in: query
      name: end_date
      required: false
      schema:
        type: string
        format: date
      description: Last date of the period, in the YYYY-MM-DD format
      example: '2023-12-31'
  responses:
    200:
      description: The list of time spent entries
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: Time spent unique identifier
                  example: a24a6ea4-ce75-4665-a070-57453082c250
                person_id:
                  type: string
                  format: uuid
                  description: Person identifier
                  example: b35b7fb5-df86-5776-b181-68564193d360
                task_id:
                  type: string
                  format: uuid
                  description: Task identifier
                  example: c46c80c6-e097-6887-c292-79675204e470
                project_id:
                  type: string
                  format: uuid
                  description: Project of the task, given with a date range
                  example: d57d91d7-f1a8-7998-d3a3-8a786315f581
                task_type_id:
                  type: string
                  format: uuid
                  description: Task type of the task, given with a date range
                  example: e68ea2e8-a2b9-8aa9-e4b4-9b897426a692
                date:
                  type: string
                  format: date
                  description: Date of time spent
                  example: '2023-01-01'
                duration:
                  type: number
                  description: Duration in seconds
                  example: 3600
                created_at:
                  type: string
                  format: date-time
                  description: Creation timestamp
                  example: '2023-01-01T12:00:00Z'
                updated_at:
                  type: string
                  format: date-time
                  description: Last update timestamp
                  example: '2023-01-01T12:30:00Z'
    400:
      description: Only one date of the period is given, or a date is not
        valid
    403:
      description: You use a bot token

ToChecksFilterValuesResource_get:
  summary: Get the filter values of my tasks to check
  description: Get the distinct project, task type, task status, episode and
    assignee identifiers of the tasks that wait for feedback in your scope.
    The scope is the one of the tasks-to-check route. If you do not manage or
    supervise a project, each list is empty. The filters of the list use these
    values.
  tags:
    - User
  responses:
    200:
      description: The filter values
      content:
        application/json:
          schema:
            type: object
            properties:
              project_ids:
                type: array
                items:
                  type: string
                  format: uuid
              task_type_ids:
                type: array
                items:
                  type: string
                  format: uuid
              task_status_ids:
                type: array
                items:
                  type: string
                  format: uuid
              episode_ids:
                type: array
                items:
                  type: string
                  format: uuid
              person_ids:
                type: array
                items:
                  type: string
                  format: uuid
    403:
      description: You use a bot token

ToChecksResource_get:
  summary: Get my tasks to check
  description: Get the tasks that wait for feedback. An administrator gets the
    tasks of all the open projects. A manager gets the tasks of the open
    projects they manage. A supervisor gets the tasks of the open projects
    they supervise, in their departments only. The manager and supervisor
    roles are the roles held on the project team. If you do not manage or
    supervise a project, you get an empty list. Without page, the response is
    a list without order. With page, the response is a page of tasks.
  tags:
    - User
  parameters:
    - in: query
      name: project_id
      required: false
      schema:
        type: string
        format: uuid
      description: Get only the tasks of this project
    - in: query
      name: task_type_id
      required: false
      schema:
        type: string
        format: uuid
      description: Get only the tasks of this task type
    - in: query
      name: task_status_id
      required: false
      schema:
        type: string
        format: uuid
      description: Get only the tasks of this task status
    - in: query
      name: person_id
      required: false
      schema:
        type: string
        format: uuid
      description: Get only the tasks of these assignees. Give a
        comma-separated list of person identifiers, or the value unassigned to
        get the tasks without assignee.
    - in: query
      name: episode_id
      required: false
      schema:
        type: string
        format: uuid
      description: Get only the tasks of this episode
    - in: query
      name: due_date_since
      required: false
      schema:
        type: string
        format: date
      example: '2022-07-12'
      description: Get only the tasks that end on this date or after
    - in: query
      name: due_date_until
      required: false
      schema:
        type: string
        format: date
      example: '2022-07-12'
      description: Get only the tasks that end on this date or before
    - in: query
      name: order_by
      required: false
      schema:
        type: string
        enum: [priority, due_date, entity_name, estimation]
      description: Sort order. One of priority, due_date, estimation or
        entity_name. Another value sorts by project, episode, sequence, entity
        type, entity and task type names.
    - in: query
      name: page
      required: false
      schema:
        type: integer
      example: 1
      description: Page to get. A value below 1 is read as 1.
    - in: query
      name: limit
      required: false
      schema:
        type: integer
        default: 100
      example: 100
      description: Number of tasks in a page. The default value is 100. A
        value below 1 is read as 1.
  responses:
    200:
      description: The list of tasks, or a page of tasks if you give page
      content:
        application/json:
          schema:
            oneOf:
              - type: array
                description: Bare task list, when no page is given
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      description: Task unique identifier
                      example: b35b7fb5-df86-5776-b181-68564193d360
                    name:
                      type: string
                      description: Task name
                      example: Review
                    task_type_id:
                      type: string
                      format: uuid
                      description: Task type identifier
                      example: c46c80c6-e097-6887-c292-79675204e470
                    task_status_id:
                      type: string
                      format: uuid
                      description: Task status identifier
                      example: d57d91d7-f108-7998-d403-80786315f580
                    assigner_id:
                      type: string
                      format: uuid
                      description: Person who assigned the task
                      example: e68e02e8-0219-8009-e514-918974260690
                    assignees:
                      type: array
                      items:
                        type: string
                        format: uuid
                      description: List of assigned person identifiers
                      example: [f79f13f9-1320-9010-f625-a09008537180]
                    created_at:
                      type: string
                      format: date-time
                      description: Creation timestamp
                      example: '2023-01-01T12:00:00Z'
                    updated_at:
                      type: string
                      format: date-time
                      description: Last update timestamp
                      example: '2023-01-01T12:30:00Z'
              - type: object
                description: Pagination envelope, when a page is given
                properties:
                  data:
                    type: array
                    items:
                      type: object
                    description: Tasks of the requested page
                  stats:
                    type: object
                    properties:
                      total:
                        type: integer
                        description: Total number of matching tasks
                      total_duration:
                        type: integer
                        description: Total duration in minutes
                      total_estimation:
                        type: integer
                        description: Total estimation in minutes
                  page:
                    type: integer
                    description: Page number, clamped to 1
                  limit:
                    type: integer
                    description: Number of tasks per page
                  is_more:
                    type: boolean
                    description: True if a later page holds more tasks
    400:
      description: A filter is not valid
    403:
      description: You use a bot token

