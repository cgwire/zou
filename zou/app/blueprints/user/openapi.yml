AssetTaskTypesResource_get:
  summary: Get my task types of an asset
  description: Get the task types of the tasks of an asset that are assigned
    to you. Task types of closed projects are not listed.
  tags:
    - User
  parameters:
    - in: path
      name: asset_id
      required: true
      schema:
        type: string
        format: uuid
      description: Unique identifier of the asset
      example: a24a6ea4-ce75-4665-a070-57453082c250
  responses:
    200:
      description: The list of task types
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: Task type unique identifier
                  example: b35b7fb5-df86-5776-b181-68564193d360
                name:
                  type: string
                  description: Task type name
                  example: Modeling
                short_name:
                  type: string
                  description: Task type short name
                  example: MOD
                color:
                  type: string
                  description: Task type color
                  example: '#FF0000'
                priority:
                  type: integer
                  description: Task type priority
                  example: 1
                for_entity:
                  type: string
                  description: Entity type this task type applies to
                  example: Asset
                created_at:
                  type: string
                  format: date-time
                  description: Creation timestamp
                  example: '2023-01-01T12:00:00Z'
                updated_at:
                  type: string
                  format: date-time
                  description: Last update timestamp
                  example: '2023-01-01T12:30:00Z'
    403:
      description: You use a bot token
    404:
      description: The asset does not exist

AssetTasksResource_get:
  summary: Get my tasks of an asset
  description: Get the tasks of an asset that are assigned to you. Tasks of
    closed projects are not listed.
  tags:
    - User
  parameters:
    - in: path
      name: asset_id
      required: true
      schema:
        type: string
        format: uuid
      description: Unique identifier of the asset
      example: a24a6ea4-ce75-4665-a070-57453082c250
  responses:
    200:
      description: The list of tasks
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: Task unique identifier
                  example: b35b7fb5-df86-5776-b181-68564193d360
                name:
                  type: string
                  description: Task name
                  example: Modeling
                task_type_id:
                  type: string
                  format: uuid
                  description: Task type identifier
                  example: c46c80c6-e097-6887-c292-79675204e470
                task_status_id:
                  type: string
                  format: uuid
                  description: Task status identifier
                  example: d57d91d7-f108-7998-d403-80786315f580
                assigner_id:
                  type: string
                  format: uuid
                  description: Person who assigned the task
                  example: e68e02e8-0219-8009-e514-918974260690
                assignees:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: List of assigned person identifiers
                  example: [f79f13f9-1320-9010-f625-a09008537180]
                created_at:
                  type: string
                  format: date-time
                  description: Creation timestamp
                  example: '2023-01-01T12:00:00Z'
                updated_at:
                  type: string
                  format: date-time
                  description: Last update timestamp
                  example: '2023-01-01T12:30:00Z'
    403:
      description: You use a bot token
    404:
      description: The asset does not exist

AssetTypeAssetsResource_get:
  summary: Get my assets of an asset type
  description: Get the assets of an asset type in a project. The route uses
    only the entities where you have an assigned task. If the project is
    closed, the list is empty.
  tags:
    - User
  parameters:
    - in: path
      name: project_id
      required: true
      schema:
        type: string
        format: uuid
      description: Unique identifier of the project
      example: a24a6ea4-ce75-4665-a070-57453082c250
    - in: path
      name: asset_type_id
      required: true
      schema:
        type: string
        format: uuid
      description: Unique identifier of the asset type
      example: b35b7fb5-df86-5776-b181-68564193d360
  responses:
    200:
      description: The list of assets
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: Asset unique identifier
                  example: c46c80c6-e097-6887-c292-79675204e470
                name:
                  type: string
                  description: Asset name
                  example: Main Character
                description:
                  type: string
                  description: Asset description
                  example: Main character model for the project
                asset_type_id:
                  type: string
                  format: uuid
                  description: Asset type identifier
                  example: d57d91d7-f108-7998-d403-80786315f580
                project_id:
                  type: string
                  format: uuid
                  description: Project identifier
                  example: e68e02e8-0219-8009-e514-918974260690
                created_at:
                  type: string
                  format: date-time
                  description: Creation timestamp
                  example: '2023-01-01T12:00:00Z'
                updated_at:
                  type: string
                  format: date-time
                  description: Last update timestamp
                  example: '2023-01-01T12:30:00Z'
    403:
      description: You use a bot token
    404:
      description: The project or the asset type does not exist

