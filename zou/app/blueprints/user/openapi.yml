FilterGroupResource_delete:
  summary: Delete a filter group
  description: Delete a filter group. The filter group must be yours. The
    route also deletes your filters in the group. In a shared group, the
    filters of the other users stay, out of the group. An administrator can
    use the filters of all the users.
  tags:
    - User
  parameters:
    - in: path
      name: filter_group_id
      required: true
      schema:
        type: string
        format: uuid
      description: Unique identifier of the filter group
      example: a24a6ea4-ce75-4665-a070-57453082c250
  responses:
    204:
      description: The filter group is deleted
    403:
      description: You use a bot token
    404:
      description: You have no filter group with this identifier

FilterGroupResource_get:
  summary: Get a filter group
  description: Get a filter group. The filter must be yours. An administrator
    can use the filters of all the users.
  tags:
    - User
  parameters:
    - in: path
      name: filter_group_id
      required: true
      schema:
        type: string
        format: uuid
      description: Unique identifier of the filter group
      example: a24a6ea4-ce75-4665-a070-57453082c250
  responses:
    200:
      description: The filter group
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Filter group unique identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
              name:
                type: string
                description: Filter group name
                example: My Filter Group
              color:
                type: string
                description: Filter group color
                example: '#FF0000'
              list_type:
                type: string
                description: List type
                example: todo
              entity_type:
                type: string
                description: Entity type
                example: Asset
              project_id:
                type: string
                format: uuid
                description: Project identifier
                example: c46c80c6-e097-6887-c292-79675204e470
              is_shared:
                type: boolean
                description: Whether filter group is shared
                example: false
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: '2023-01-01T12:00:00Z'
              updated_at:
                type: string
                format: date-time
                description: Last update timestamp
                example: '2023-01-01T12:30:00Z'
    403:
      description: You use a bot token
    404:
      description: You have no filter group with this identifier

FilterGroupResource_put:
  summary: Update a filter group
  description: Update a filter group. The group must be yours. An
    administrator can update the groups of all the users. To set is_shared to
    true, give project_id in the body too. You must be a manager of this
    project, or an administrator. Otherwise is_shared is set to false. If you
    change is_shared, the filters of the group take the same value.
  tags:
    - User
  parameters:
    - in: path
      name: filter_group_id
      required: true
      schema:
        type: string
        format: uuid
      description: Unique identifier of the filter group
      example: a24a6ea4-ce75-4665-a070-57453082c250
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
              description: Filter group name
              example: Updated Filter Group
            color:
              type: string
              description: Filter group color
              example: '#00FF00'
            is_shared:
              type: boolean
              description: Whether to share this filter group
              example: true
            project_id:
              type: string
              format: uuid
              description: Project identifier
              example: b35b7fb5-df86-5776-b181-68564193d360
            department_id:
              type: string
              format: uuid
              description: Department identifier
              example: c46c80c6-e097-6887-c292-79675204e470
  responses:
    200:
      description: The updated filter group
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Filter group unique identifier
                example: d57d91d7-f108-7998-d403-80786315f580
              name:
                type: string
                description: Filter group name
                example: Updated Filter Group
              color:
                type: string
                description: Filter group color
                example: '#00FF00'
              list_type:
                type: string
                description: List type
                example: todo
              entity_type:
                type: string
                description: Entity type
                example: Asset
              project_id:
                type: string
                format: uuid
                description: Project identifier
                example: e68e02e8-0219-8009-e514-918974260690
              is_shared:
                type: boolean
                description: Whether filter group is shared
                example: true
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: '2023-01-01T12:00:00Z'
              updated_at:
                type: string
                format: date-time
                description: Last update timestamp
                example: '2023-01-01T12:30:00Z'
    400:
      description: The body is not valid
    403:
      description: You use a bot token
    404:
      description: You have no filter group with this identifier

FilterGroupsResource_get:
  summary: Get my filter groups
  description: Get your filter groups and the shared filter groups of your
    open projects. A filter group linked to a department is listed only if you
    are in this department or if you are a manager or an administrator. The
    response is an object. The first key is the list type. The second key is
    the project identifier, or all for the groups without project.
  tags:
    - User
  responses:
    200:
      description: The filter groups, by list type and by project
      content:
        application/json:
          schema:
            type: object
            description: The first key is the list type. The second key is
              the project identifier, or all for the filter groups without
              project. The value is the list of filter groups.
            additionalProperties:
              type: object
              additionalProperties:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      description: Filter group unique identifier
                      example: a24a6ea4-ce75-4665-a070-57453082c250
                    name:
                      type: string
                      description: Filter group name
                      example: My Filter Group
                    color:
                      type: string
                      description: Filter group color
                      example: '#FF0000'
                    list_type:
                      type: string
                      description: List type
                      example: todo
                    entity_type:
                      type: string
                      description: Entity type
                      example: Asset
                    project_id:
                      type: string
                      format: uuid
                      description: Project identifier
                      example: b35b7fb5-df86-5776-b181-68564193d360
                    is_shared:
                      type: boolean
                      description: Whether filter group is shared
                      example: false
                    created_at:
                      type: string
                      format: date-time
                      description: Creation timestamp
                      example: '2023-01-01T12:00:00Z'
                    updated_at:
                      type: string
                      format: date-time
                      description: Last update timestamp
                      example: '2023-01-01T12:30:00Z'
    403:
      description: You use a bot token

FilterGroupsResource_post:
  summary: Create a filter group
  description: Create a filter group. A filter group puts several filters
    together. To share it, give project_id and set is_shared to true. You must
    be a manager of this project, or an administrator. Otherwise the group is
    created with is_shared set to false.
  tags:
    - User
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
          properties:
            name:
              type: string
              description: Filter group name
              example: My Filter Group
            color:
              type: string
              description: Filter group color in hex format
              example: '#FF0000'
            list_type:
