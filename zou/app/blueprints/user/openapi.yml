    - User
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
          properties:
            name:
              type: string
              description: Filter group name
              example: My Filter Group
            color:
              type: string
              description: Filter group color in hex format
              example: '#FF0000'
            list_type:
              type: string
              description: Type of list this filter group applies to
              example: todo
            entity_type:
              type: string
              description: Entity type this filter group applies to
              example: Asset
            is_shared:
              type: boolean
              description: Whether to share this filter group with others
              default: false
              example: false
            project_id:
              type: string
              format: uuid
              description: Project identifier
              example: a24a6ea4-ce75-4665-a070-57453082c250
            department_id:
              type: string
              format: uuid
              description: Department identifier
              example: b35b7fb5-df86-5776-b181-68564193d360
  responses:
    201:
      description: The new filter group
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Filter group unique identifier
                example: c46c80c6-e097-6887-c292-79675204e470
              name:
                type: string
                description: Filter group name
                example: My Filter Group
              color:
                type: string
                description: Filter group color
                example: '#FF0000'
              list_type:
                type: string
                description: List type
                example: todo
              entity_type:
                type: string
                description: Entity type
                example: Asset
              project_id:
                type: string
                format: uuid
                description: Project identifier
                example: d57d91d7-f108-7998-d403-80786315f580
              is_shared:
                type: boolean
                description: Whether filter group is shared
                example: false
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: '2023-01-01T12:00:00Z'
              updated_at:
                type: string
                format: date-time
                description: Last update timestamp
                example: '2023-01-01T12:30:00Z'
    400:
      description: The body is not valid

