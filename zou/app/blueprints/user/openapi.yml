ClearAvatarResource_delete:
  summary: Delete my avatar
  description: Delete your avatar file and set has_avatar to false.
  tags:
    - User
  responses:
    204:
      description: The avatar is deleted

ContextResource_get:
  summary: Get my context
  description: 'Get the data that an application needs to start: your projects,
    the task types, the task statuses, the asset types, the persons, the departments,
    the studios and the settings.'
  tags:
    - User
  responses:
    200:
      description: The context
      content:
        application/json:
          schema:
            type: object
            properties:
              user:
                type: object
                description: Current user information
                example: {id: uuid, name: John Doe}
              projects:
                type: array
                items:
                  type: object
                description: Available projects
                example: [{id: uuid, name: Project 1}]
              departments:
                type: array
                items:
                  type: object
                description: Available departments
                example: [{id: uuid, name: Animation}]
              asset_types:
                type: array
                items:
                  type: object
                description: Available asset types
                example: [{id: uuid, name: Character}]
              task_types:
                type: array
                items:
                  type: object
                description: Available task types
                example: [{id: uuid, name: Modeling}]
              task_status:
                type: array
                items:
                  type: object
                description: Available task statuses
                example: [{id: uuid, name: In Progress}]
              custom_actions:
                type: array
                items:
                  type: object
                description: Available custom actions
                example: [{id: uuid, name: Custom Action}]
              status_automations:
                type: array
                items:
                  type: object
                description: Available status automations
                example: [{id: uuid, name: Auto Status}]
              studios:
                type: array
                items:
                  type: object
                description: Available studios
                example: [{id: uuid, name: Studio Name}]
              notification_count:
                type: integer
                description: Number of unread notifications
                example: 5
              persons:
                type: array
                items:
                  type: object
                description: Available persons
                example: [{id: uuid, name: John Doe}]
              project_status:
                type: array
                items:
                  type: object
                description: Available project statuses
                example: [{id: uuid, name: Active}]
              search_filters:
                type: array
                items:
                  type: object
                description: Available search filters
                example: [{id: uuid, name: My Filter}]
              search_filter_groups:
                type: array
                items:
                  type: object
                description: Available search filter groups
                example: [{id: uuid, name: Filter Group}]
              preview_background_files:
                type: array
                items:
                  type: object
                description: Available preview background files
                example: [{id: uuid, name: background.jpg}]

DateTimeSpentsResource_get:
  summary: Get my time spents for a date
  description: Get your time spent entries for a date.
  tags:
    - User
  parameters:
    - in: path
      name: date
      required: true
      schema:
        type: string
        format: date
      description: Date in the YYYY-MM-DD format
      example: '2023-01-01'
  responses:
    200:
      description: The list of time spent entries
      content:
        application/json:
          schema:
            type: object
            properties:
              date:
                type: string
                format: date
                description: Date of time spent
                example: '2023-01-01'
              total_duration:
                type: number
                description: Total duration in seconds
                example: 28800
              entries:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      description: Time spent unique identifier
                      example: a24a6ea4-ce75-4665-a070-57453082c250
                    task_id:
                      type: string
                      format: uuid
                      description: Task identifier
                      example: b35b7fb5-df86-5776-b181-68564193d360
                    duration:
                      type: number
                      description: Duration in seconds
                      example: 3600
                    created_at:
                      type: string
                      format: date-time
                      description: Creation timestamp
                      example: '2023-01-01T12:00:00Z'
    400:
      description: The date is not valid

DayOffResource_get:
  summary: Get my day off for a date
  description: Get your day off for a date. If you work on this date, the
