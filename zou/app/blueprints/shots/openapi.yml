ShotsAndTasksResource_get:
  summary: Get shots with their tasks
  tags:
    - Shots
  description: Get the shots with the tasks of each shot. Filter with
    project_id or episode_id. Use episode_id=all to get all the episodes. A
    client gets the tasks without the studio fields. If you are not an
    administrator, you must give project_id. A vendor gets only the entities
    of their tasks, without the hidden metadata columns. The response can have
    an ETag. Send it in If-None-Match to get a 304 response when the data did
    not change.
  parameters:
    - in: query
      name: project_id
      required: false
      example: a24a6ea4-ce75-4665-a070-57453082c250
      schema:
        type: string
        format: uuid
      description: Get only the entities of this project
    - in: query
      name: compact
      description: Encode shots and tasks as positional value arrays (halves
        the payload). Field names are given by the shot_fields and task_fields
        entries of the response, map values by name, never by hardcoded
        position.
      schema:
        type: boolean
        default: false
    - in: query
      name: stream
      description: Stream the response as NDJSON (one header line, then one
        shot per line) instead of a single JSON document, to keep server
        memory flat on large productions.
      schema:
        type: boolean
        default: false
    - in: query
      name: episode_id
      required: false
      example: a24a6ea4-ce75-4665-a070-57453082c250
      schema:
        type: string
      description: Get only the entities of this episode. Use all to get the
        entities of all the episodes.
    - in: query
      name: assigned_to
      required: false
      schema:
        type: string
      description: With any value, get only the shots that have a task
        assigned to you.
  responses:
    200:
      description: The list of shots with their tasks
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  example: a24a6ea4-ce75-4665-a070-57453082c250
                name:
                  type: string
                  example: SH010
                project_id:
                  type: string
                  format: uuid
                  example: b24a6ea4-ce75-4665-a070-57453082c250
                tasks:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        example: c24a6ea4-ce75-4665-a070-57453082c250
                      name:
                        type: string
                        example: SH010 Animation
    304:
      description: The data did not change
    400:
      description: An identifier is not a valid UUID
    403:
      description: You do not have access to this project
