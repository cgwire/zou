      schema:
        type: string
        format: uuid
      description: Unique identifier of the project
    - in: path
      name: task_type_id
      required: true
      example: a24a6ea4-ce75-4665-a070-57453082c250
      schema:
        type: string
        format: uuid
      description: Unique identifier of the task type
    - in: query
      name: count_mode
      required: false
      example: weighted
      schema:
        type: string
        enum: [weighted, weigtheddone, feedback, done]
        default: weighted
      description: 'How to count the shots: weighted, weighteddone, feedback or
        done. The default value is weighted. The weighted modes give each shot the
        part of its work time that is in the period. The other modes count each
        shot on its end date. The feedback modes end a shot at its first feedback.
        The done modes end a shot when it is done.'
    - in: query
      name: studio_id
      required: false
      example: a24a6ea4-ce75-4665-a070-57453082c250
      schema:
        type: string
        format: uuid
      description: Get only the persons of this studio
  responses:
    200:
      description: >-
        Quotas statistics for shots, keyed by person id, with a total
        entry. The total counts each task once. In raw modes, and in
        weighted modes for a task without time spent, the entry of each
        assignee counts the whole task, so the entries of a task with
        several assignees add up to more than the total. In weighted
        modes, a task with time spent is shared out between the people
        who logged time on it.
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              type: object
              properties:
                count:
                  type: number
                  description: >-
                    Shots counted. In weighted modes a shot is split over
                    the days it was worked on, so counts are fractions
                    rounded to 2 decimals.
                  example: 42
                frames:
                  type: integer
                  example: 1200
    400:
      description: count_mode is not valid
    403:
      description: You do not have access to this project, or you are a client

