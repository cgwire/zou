ProjectEpisodesResource_post:
  summary: Create an episode
  tags:
    - Shots
  description: Create an episode in a project. The default status is running.
    You must be a manager of the project.
  parameters:
    - in: path
      name: project_id
      required: true
      example: a24a6ea4-ce75-4665-a070-57453082c250
      schema:
        type: string
        format: uuid
      description: Unique identifier of the project
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
          properties:
            name:
              type: string
              example: EP01
            description:
              type: string
              example: A short description of the episode
            status:
              type: string
              example: running
            data:
              type: object
              description: Values of the metadata columns
  responses:
    201:
      description: The new episode
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: EP01
              project_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              description:
                type: string
                example: A short description of the episode
              status:
                type: string
                example: running
    400:
      description: The body is not valid
    403:
      description: You are not a manager of the project

ProjectPersonQuotasResource_get:
  summary: Get the quotas of a person in a project
  tags:
    - Shots
  description: Get the quota statistics of a person in a project. A quota
    counts the shots that the person ended. A manager or a supervisor of the
    project can read the quotas of all the persons. Other users can read their
    own quotas only. Clients cannot use this route.
  parameters:
    - in: path
      name: project_id
      required: true
      example: a24a6ea4-ce75-4665-a070-57453082c250
      schema:
        type: string
        format: uuid
      description: Unique identifier of the project
    - in: path
      name: person_id
      required: true
      example: a24a6ea4-ce75-4665-a070-57453082c250
      schema:
        type: string
        format: uuid
      description: Unique identifier of the person
    - in: query
      name: count_mode
      required: false
      example: weighted
      schema:
        type: string
        enum: [weighted, weigtheddone, feedback, done]
        default: weighted
      description: 'How to count the shots: weighted, weighteddone, feedback or
        done. The default value is weighted. The weighted modes give each shot the
        part of its work time that is in the period. The other modes count each
        shot on its end date. The feedback modes end a shot at its first feedback.
        The done modes end a shot when it is done.'
    - in: query
      name: studio_id
      required: false
      example: a24a6ea4-ce75-4665-a070-57453082c250
      schema:
        type: string
        format: uuid
      description: Get only the persons of this studio
  responses:
    200:
      description: The quota statistics
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              type: object
              properties:
                count:
                  type: number
                  description: >-
                    Shots counted. In weighted modes a shot is split over
                    the days it was worked on, so counts are fractions
                    rounded to 2 decimals.
                  example: 15
                frames:
                  type: integer
                  example: 360
    400:
      description: count_mode is not valid
    403:
      description: You cannot read the quotas of this person, or you are a
        client

ProjectQuotasResource_get:
  summary: Get the quotas of a project for a task type
  tags:
    - Shots
  description: Get the quota statistics of each person of a project for a task
