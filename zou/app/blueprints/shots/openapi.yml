ProjectEpisodeRetakeStatsResource_get:
  summary: Get the retake statistics of the episodes
  tags:
    - Shots
  description: Get the number of retakes and of done tasks of a project, for
    each task type and each episode. The response also gives the change in
    time and the maximum number of retakes. A vendor gets the statistics of
    their tasks only. Clients cannot use this route.
  parameters:
    - in: path
      name: project_id
      required: true
      example: a24a6ea4-ce75-4665-a070-57453082c250
      schema:
        type: string
        format: uuid
      description: Unique identifier of the project
  responses:
    200:
      description: The retake statistics
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              type: object
              properties:
                max_retake_count:
                  type: integer
                  example: 4
                evolution:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      retake:
                        type: object
                        properties:
                          count:
                            type: integer
                            example: 80
                          frames:
                            type: integer
                            example: 7900
                          drawings:
                            type: integer
                            example: 8000
                      done:
                        type: object
                        properties:
                          count:
                            type: integer
                            example: 117
                          frames:
                            type: integer
                            example: 3900
                          drawings:
                            type: integer
                            example: 8000
                done:
                  type: object
                  properties:
                    count:
                      type: integer
                      example: 197
                    frames:
                      type: integer
                      example: 16090
                    drawings:
                      type: integer
                      example: 16090
                retake:
                  type: object
                  properties:
                    count:
                      type: integer
                      example: 0
                    frames:
                      type: integer
                      example: 0
                    drawings:
                      type: integer
                      example: 0
                other:
                  type: object
                  properties:
                    count:
                      type: integer
                      example: 5
                    frames:
                      type: integer
                      example: 185
                    drawings:
                      type: integer
                      example: 185
            example:
              episodeId1:
                max_retake_count: 4
                evolution:
                  '1':
                    retake:
                      count: 80
                      frames: 7900
                      drawings: 8000
                    done:
                      count: 117
                      frames: 3900
                      drawings: 8000
                done:
                  count: 197
                  frames: 16090
                  drawings: 16090
                retake:
                  count: 0
                  frames: 0
                  drawings: 0
                other:
                  count: 5
                  frames: 185
                  drawings: 185
              all:
                all:
                  max_retake_count: 4
                  done:
                    count: 500
                    frames: 50000
                    drawings: 50000
                  retake:
                    count: 100
                    frames: 10000
                    drawings: 10000
                  other:
                    count: 10
                    frames: 1000
                    drawings: 1000
    403:
      description: You do not have access to this project, or you are a client

ProjectEpisodeStatsResource_get:
  summary: Get the task statistics of the episodes
  tags:
    - Shots
  description: Get the number of tasks of a project for each task status, each
    task type and each episode. A vendor gets the statistics of their tasks
    only. A client can use this route only if the project makes its statistics
    visible to clients (is_client_stats_visible).
  parameters:
    - in: path
      name: project_id
      required: true
      example: a24a6ea4-ce75-4665-a070-57453082c250
      schema:
        type: string
        format: uuid
      description: Unique identifier of the project
  responses:
    200:
      description: The task statistics
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    count:
                      type: integer
                      example: 120
                    frames:
                      type: integer
                      example: 1440
                    drawings:
                      type: integer
                      example: 360
            example:
              episodeId1:
                taskTypeId1:
                  taskStatusId1:
                    count: 50
                    frames: 600
                    drawings: 150
                  taskStatusId2:
                    count: 70
                    frames: 840
                    drawings: 210
              all:
                all:
                  taskStatusId1:
                    count: 200
                    frames: 2400
                    drawings: 600
    403:
      description: You do not have access to this project, or you are a client
        and the project hides its statistics from clients

