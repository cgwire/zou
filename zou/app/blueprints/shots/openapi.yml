EpisodeResource_delete:
  summary: Delete an episode
  tags:
    - Shots
  description: Delete an episode. The creator of the episode can delete it if
    the creator is in the project team. Other users must be managers of the
    project. Without force, the episode is deleted only if nothing is linked
    to it. If sequences, assets or tasks are still linked, the route returns
    400. With force=true, the sequences, the shots, the assets and the tasks
    of the episode are deleted too.
    Only a manager of the project can use force=true.
  parameters:
    - in: path
      name: episode_id
      required: true
      example: a24a6ea4-ce75-4665-a070-57453082c250
      schema:
        type: string
        format: uuid
      description: Unique identifier of the episode
    - in: query
      name: force
      required: false
      example: false
      schema:
        type: boolean
      description: Delete the episode and all its related data
  responses:
    204:
      description: The episode is deleted
    400:
      description: Some data are still linked to this episode
    403:
      description: You cannot delete this episode
    404:
      description: The episode does not exist

