AllShotsResource_get:
  summary: Get shots
  tags:
    - Shots
  description: Get the shots. Add a query parameter for each column to filter
    on. If you are not an administrator, you must give project_id. With
    sequence_id, the route uses the project of the sequence. A vendor gets
    only the entities of their tasks, without the hidden metadata columns.
  parameters:
    - in: query
      name: sequence_id
      required: false
      example: a24a6ea4-ce75-4665-a070-57453082c250
      schema:
        type: string
        format: uuid
      description: Get only the shots of this sequence
    - in: query
      name: project_id
      required: false
      example: a24a6ea4-ce75-4665-a070-57453082c250
      schema:
        type: string
        format: uuid
      description: Unique identifier of the project
    - in: query
      name: parent_id
      required: false
      example: a24a6ea4-ce75-4665-a070-57453082c250
      schema:
        type: string
        format: uuid
      description: Get only the entities of this parent
  responses:
    200:
      description: The list of shots
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  example: a24a6ea4-ce75-4665-a070-57453082c250
                name:
                  type: string
                  example: SH020
                project_id:
                  type: string
                  format: uuid
                  example: b24a6ea4-ce75-4665-a070-57453082c250
                parent_id:
                  type: string
                  format: uuid
                  example: c24a6ea4-ce75-4665-a070-57453082c250
    400:
      description: An identifier is not a valid UUID
    403:
      description: You do not have access to this project
    404:
      description: The sequence does not exist

EpisodeAndTasksResource_get:
  summary: Get episodes with their tasks
  tags:
    - Shots
  description: Get the episodes with the tasks of each episode. Filter with
    project_id or episode_id. Use episode_id=all to get all the episodes. A
    client gets the tasks without the studio fields. If you are not an
    administrator, you must give project_id. A vendor gets only the episodes
    and the tasks that are assigned to the vendor.
  parameters:
    - in: query
      name: project_id
      required: false
      example: a24a6ea4-ce75-4665-a070-57453082c250
      schema:
        type: string
        format: uuid
      description: Unique identifier of the project
    - in: query
      name: episode_id
      required: false
      example: a24a6ea4-ce75-4665-a070-57453082c250
      schema:
        type: string
      description: Get only the entities of this episode. Use all to get the
        entities of all the episodes.
  responses:
    200:
      description: The list of episodes with their tasks
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  example: a24a6ea4-ce75-4665-a070-57453082c250
                name:
                  type: string
                  example: EP01
                project_id:
                  type: string
                  format: uuid
                  example: b24a6ea4-ce75-4665-a070-57453082c250
                tasks:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        example: c24a6ea4-ce75-4665-a070-57453082c250
                      name:
                        type: string
                        example: EP01 Layout
    400:
      description: An identifier is not a valid UUID
    403:
      description: You do not have access to this project

