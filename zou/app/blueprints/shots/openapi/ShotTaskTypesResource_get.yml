Get the task types of a shot
---
tags:
  - Shots
description: Get the task types of the tasks of a shot.
parameters:
  - in: path
    name: shot_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    schema:
      type: string
      format: uuid
    description: Unique identifier of the shot
responses:
  200:
    description: The list of task types
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: Animation
  403:
    description: You do not have access to this project
  404:
    description: The shot does not exist
