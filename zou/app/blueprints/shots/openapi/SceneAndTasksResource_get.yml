Get scenes and tasks
---
tags:
- Shots
description: Get scenes and their related tasks. Optionally filter by project.
parameters:
  - in: query
    name: project_id
    required: False
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: query
    name: page
    required: false
    type: integer
    example: 1
    description: Page number. Without page nor limit, the whole list is
      returned; with either, a paginated envelope is returned.
  - in: query
    name: limit
    required: false
    type: integer
    example: 100
    description: Number of entries per page (default 100, max 5000). A
      limit alone returns the first page.
responses:
    200:
        description: All scenes
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    example: a24a6ea4-ce75-4665-a070-57453082c250
                  name:
                    type: string
                    example: SC001
                  project_id:
                    type: string
                    format: uuid
                    example: b24a6ea4-ce75-4665-a070-57453082c250
                  tasks:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          example: c24a6ea4-ce75-4665-a070-57453082c250
                        name:
                          type: string
                          example: Layout
