Remove a shot from a scene
---
tags:
  - Shots
parameters:
  - in: path
    name: scene_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    schema:
      type: string
      format: uuid
    description: Unique identifier of the scene
  - in: path
    name: shot_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    schema:
      type: string
      format: uuid
    description: Unique identifier of the shot
responses:
  204:
    description: The shot is removed from the scene
  403:
    description: You do not have access to this project
  404:
    description: The scene or the shot does not exist
description: Remove a shot from a scene. The shot is not deleted.
