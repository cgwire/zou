Create project sequence
---
tags:
- Shots
description: Create a sequence in a project. Provide name and optional
  episode_id.
parameters:
  - in: path
    name: project_id
    required: True
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c25
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
        properties:
          name:
            type: string
            required: true
            example: SQ01
          episode_id:
            type: string
            format: uuid
            required: false
            example: a24a6ea4-ce75-4665-a070-57453082c25
responses:
    201:
        description: Sequence created
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  example: a24a6ea4-ce75-4665-a070-57453082c25
                name:
                  type: string
                  example: SQ01
                project_id:
                  type: string
                  format: uuid
                  example: b24a6ea4-ce75-4665-a070-57453082c25
                episode_id:
                  type: string
                  format: uuid
                  example: c24a6ea4-ce75-4665-a070-57453082c25
                description:
                  type: string
                  example: A sequence description
