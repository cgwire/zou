Get the scenes of a project
---
tags:
  - Shots
description: Get the scenes of a project. A vendor gets only the entities of
  their tasks, without the hidden metadata columns.
parameters:
  - in: path
    name: project_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    schema:
      type: string
      format: uuid
    description: Unique identifier of the project
responses:
  200:
    description: The list of scenes
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: SC001
              project_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              parent_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
  403:
    description: You do not have access to this project
