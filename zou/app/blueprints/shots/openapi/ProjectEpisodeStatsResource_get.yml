Get the task statistics of the episodes
---
tags:
  - Shots
description: Get the number of tasks of a project for each task status, each
  task type and each episode. A vendor gets the statistics of their tasks
  only.
parameters:
  - in: path
    name: project_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    schema:
      type: string
      format: uuid
    description: Unique identifier of the project
responses:
  200:
    description: The task statistics
    content:
      application/json:
        schema:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: object
              additionalProperties:
                type: object
                properties:
                  count:
                    type: integer
                    example: 120
                  frames:
                    type: integer
                    example: 1440
                  drawings:
                    type: integer
                    example: 360
          example:
            episodeId1:
              taskTypeId1:
                taskStatusId1:
                  count: 50
                  frames: 600
                  drawings: 150
                taskStatusId2:
                  count: 70
                  frames: 840
                  drawings: 210
            all:
              all:
                taskStatusId1:
                  count: 200
                  frames: 2400
                  drawings: 600
  403:
    description: You do not have access to this project
