Delete an episode
---
tags:
  - Shots
description: Delete a episode. The creator of the episode can delete it if
  the creator is in the project team. Other users must be managers of the
  project. If the episode has tasks, the episode is only marked as canceled.
  Use force=true to delete the episode and all its related data.
parameters:
  - in: path
    name: episode_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    schema:
      type: string
      format: uuid
    description: Unique identifier of the episode
responses:
  204:
    description: The episode is deleted
  403:
    description: You cannot delete this episode
  404:
    description: The episode does not exist
