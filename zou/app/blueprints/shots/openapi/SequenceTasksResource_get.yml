Get sequence tasks
---
tags:
- Shots
description: Get tasks for a sequence. Optionally include relations using
  query params.
parameters:
  - in: path
    name: sequence_id
    required: True
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: query
    name: page
    required: false
    type: integer
    example: 1
    description: Page number. Without page nor limit, the whole list is
      returned; with either, a paginated envelope is returned.
  - in: query
    name: limit
    required: false
    type: integer
    example: 100
    description: Number of entries per page (default 100, max 5000). A
      limit alone returns the first page.
responses:
    200:
        description: All tasks related to given shot
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    example: a24a6ea4-ce75-4665-a070-57453082c250
                  name:
                    type: string
                    example: SH010 Animation
                  task_type_id:
                    type: string
                    format: uuid
                    example: b24a6ea4-ce75-4665-a070-57453082c250
                  task_status_id:
                    type: string
                    format: uuid
                    example: c24a6ea4-ce75-4665-a070-57453082c250
                  entity_id:
                    type: string
                    format: uuid
                    example: d24a6ea4-ce75-4665-a070-57453082c250
                  project_id:
                    type: string
                    format: uuid
                    example: e24a6ea4-ce75-4665-a070-57453082c250
