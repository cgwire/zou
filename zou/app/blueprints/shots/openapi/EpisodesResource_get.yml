Get episodes
---
tags:
- Shots
description: Get episodes with optional filters. Use project_id to
  filter by project.
parameters:
  - in: query
    name: project_id
    required: False
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
    200:
        description: All episode entries
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    example: a24a6ea4-ce75-4665-a070-57453082c250
                  name:
                    type: string
                    example: EP01
                  project_id:
                    type: string
                    format: uuid
                    example: b24a6ea4-ce75-4665-a070-57453082c250
                  description:
                    type: string
                    example: A short description of the episode
                  status:
                    type: string
                    example: running
