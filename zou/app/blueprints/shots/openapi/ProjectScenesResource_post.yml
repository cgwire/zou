Create a scene
---
tags:
  - Shots
description: Create a scene in a project. Give the sequence of the scene.
  You must be a manager of the project.
parameters:
  - in: path
    name: project_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    schema:
      type: string
      format: uuid
    description: Unique identifier of the project
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - sequence_id
        properties:
          name:
            type: string
            example: Name of scene
          sequence_id:
            type: string
            format: uuid
            example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  201:
    description: The new scene
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              example: SC001
            project_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            parent_id:
              type: string
              format: uuid
              example: c24a6ea4-ce75-4665-a070-57453082c250
  400:
    description: The body is not valid
  403:
    description: You are not a manager of the project
