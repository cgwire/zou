Update shot
---
tags:
- Shots
description: Update a shot by id. Only mutable fields are allowed. Send a
  JSON body with the fields to change.
parameters:
  - in: path
    name: shot_id
    required: True
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c25
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        description: Data to update on the shot
        properties:
          name:
            type: string
            example: SH010 new name
          description:
            type: string
            example: Update description for the shot
          nb_frames:
            type: integer
            example: 24
          data:
            type: object
            example: {"camera": "camA", "cut_in": 1001}
responses:
    200:
        description: Shot updated
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  example: a24a6ea4-ce75-4665-a070-57453082c25
                name:
                  type: string
                  example: SH010
                project_id:
                  type: string
                  format: uuid
                  example: b24a6ea4-ce75-4665-a070-57453082c25
                parent_id:
                  type: string
                  format: uuid
                  example: c24a6ea4-ce75-4665-a070-57453082c25
                nb_frames:
                  type: integer
                  example: 120
                data:
                  type: object
                  example: {"camera": "camA", "cut_in": 1001}
    400:
        description: Invalid body or unsupported fields
