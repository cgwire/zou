Get sequence shots
---
tags:
- Shots
description: Get shots for a sequence. Supports filtering using query
  params.
parameters:
  - in: path
    name: sequence_id
    required: True
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c25
  - in: query
    name: project_id
    required: False
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c25
responses:
    200:
        description: All shot entries for given sequence
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    example: a24a6ea4-ce75-4665-a070-57453082c25
                  name:
                    type: string
                    example: SH010
                  project_id:
                    type: string
                    format: uuid
                    example: b24a6ea4-ce75-4665-a070-57453082c25
                  parent_id:
                    type: string
                    format: uuid
                    example: c24a6ea4-ce75-4665-a070-57453082c25
