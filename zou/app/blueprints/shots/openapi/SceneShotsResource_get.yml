Get the shots of a scene
---
tags:
  - Shots
description: Get the shots that come from a scene.
parameters:
  - in: path
    name: scene_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    schema:
      type: string
      format: uuid
    description: Unique identifier of the scene
responses:
  200:
    description: The list of shots
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: SH010
              project_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
  403:
    description: You do not have access to this project
  404:
    description: The scene does not exist
