Get the shot tasks of a sequence
---
tags:
  - Shots
description: Get the tasks of the shots of a sequence. Vendors cannot use
  this route.
parameters:
  - in: path
    name: sequence_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    schema:
      type: string
      format: uuid
    description: Unique identifier of the sequence
  - in: query
    name: relations
    required: false
    description: Add the related data to each row
    schema:
      type: boolean
      default: false
responses:
  200:
    description: The list of tasks
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: SH010 Animation
              task_type_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              entity_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
              task_status_id:
                type: string
                format: uuid
                example: d24a6ea4-ce75-4665-a070-57453082c250
  403:
    description: You do not have access to this project, or you are a vendor
  404:
    description: The sequence does not exist
