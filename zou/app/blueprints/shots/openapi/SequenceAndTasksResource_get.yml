Get sequences with their tasks
---
tags:
  - Shots
description: Get the sequences with the tasks of each sequence. Add a query
  parameter for each column to filter on. If you are not an administrator,
  you must give project_id. A vendor gets only the entities of their tasks,
  without the hidden metadata columns.
parameters:
  - in: query
    name: project_id
    required: false
    example: a24a6ea4-ce75-4665-a070-57453082c250
    schema:
      type: string
      format: uuid
    description: Get only the entities of this project
responses:
  200:
    description: The list of sequences with their tasks
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: SQ010
              project_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              tasks:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      example: c24a6ea4-ce75-4665-a070-57453082c250
                    name:
                      type: string
                      example: SQ010 Editing
  400:
    description: An identifier is not a valid UUID
  403:
    description: You do not have access to this project
