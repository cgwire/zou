Get a sequence
---
tags:
  - Shots
description: Get a sequence with its related data.
parameters:
  - in: path
    name: sequence_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    schema:
      type: string
      format: uuid
    description: Unique identifier of the sequence
responses:
  200:
    description: The sequence
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              example: SQ01
            project_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            parent_id:
              type: string
              format: uuid
              example: c24a6ea4-ce75-4665-a070-57453082c250
  403:
    description: You do not have access to this project
  404:
    description: The sequence does not exist
