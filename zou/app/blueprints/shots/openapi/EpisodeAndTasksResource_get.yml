Get episodes with their tasks
---
tags:
  - Shots
description: Get the episodes with the tasks of each episode. Add a query
  parameter for each column to filter on. If you are not an administrator,
  you must give project_id. A vendor gets only the episodes and the tasks
  that are assigned to the vendor.
parameters:
  - in: query
    name: project_id
    required: false
    example: a24a6ea4-ce75-4665-a070-57453082c250
    schema:
      type: string
      format: uuid
    description: Unique identifier of the project
responses:
  200:
    description: The list of episodes with their tasks
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: EP01
              project_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              tasks:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      example: c24a6ea4-ce75-4665-a070-57453082c250
                    name:
                      type: string
                      example: EP01 Layout
  400:
    description: An identifier is not a valid UUID
  403:
    description: You do not have access to this project
