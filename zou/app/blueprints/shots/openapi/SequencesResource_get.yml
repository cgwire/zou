Get sequences
---
tags:
  - Shots
description: Get the sequences. Add a query parameter for each column to
  filter on. If you are not an administrator, you must give project_id. A
  vendor gets only the sequences of their tasks.
parameters:
  - in: query
    name: episode_id
    required: false
    example: a24a6ea4-ce75-4665-a070-57453082c250
    schema:
      type: string
      format: uuid
    description: Get only the entities of this episode
responses:
  200:
    description: The list of sequences
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: SQ01
              project_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              parent_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
  403:
    description: You do not have access to this project
