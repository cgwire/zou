Set the frames of the shots from the previews
---
tags:
  - Shots
description: Set the number of frames of each shot of a project from the
  last preview of the shot for a task type. Give episode_id to change only
  the shots of one episode. You must be a manager of the project.
responses:
  200:
    description: The updated shots
    content:
      application/json:
        schema:
          type: object
          properties:
            updated:
              type: integer
              example: 12
  400:
    description: An identifier is not valid
  403:
    description: You are not a manager of the project
parameters:
  - in: path
    name: project_id
    required: true
    description: Get only the entities of this project
    schema:
      type: string
      format: uuid
  - in: path
    name: task_type_id
    required: true
    description: Unique identifier of the task type
    schema:
      type: string
      format: uuid
  - in: query
    name: episode_id
    required: false
    description: Get only the entities of this episode
    schema:
      type: string
      format: uuid
