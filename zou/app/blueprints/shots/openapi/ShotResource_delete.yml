Delete a shot
---
tags:
  - Shots
description: Delete a shot. The creator of the shot can delete it if the
  creator is in the project team. Other users must be managers of the
  project. If the shot has tasks, the shot is only marked as canceled. Use
  force=true to delete the shot and all its related data.
parameters:
  - in: path
    name: shot_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    schema:
      type: string
      format: uuid
    description: Unique identifier of the shot
responses:
  204:
    description: The shot is deleted
  403:
    description: You cannot delete this shot
  404:
    description: The shot does not exist
