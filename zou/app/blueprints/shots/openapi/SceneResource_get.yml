Get a scene
---
tags:
  - Shots
description: Get a scene with its related data.
parameters:
  - in: path
    name: scene_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    schema:
      type: string
      format: uuid
    description: Unique identifier of the scene
responses:
  200:
    description: The scene
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              example: SC001
            project_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
  403:
    description: You do not have access to this project
  404:
    description: The scene does not exist
