Get episode sequences
---
tags:
- Shots
description: Get sequences for an episode. You can add query filters
  if needed.
parameters:
  - in: path
    name: episode_id
    required: True
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: query
    name: project_id
    required: False
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
    200:
        description: All sequence entries for given episode
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    example: a24a6ea4-ce75-4665-a070-57453082c250
                  name:
                    type: string
                    example: SQ01
                  project_id:
                    type: string
                    format: uuid
                    example: b24a6ea4-ce75-4665-a070-57453082c250
                  parent_id:
                    type: string
                    format: uuid
                    example: c24a6ea4-ce75-4665-a070-57453082c250
