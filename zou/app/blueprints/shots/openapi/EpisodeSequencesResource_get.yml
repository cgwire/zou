Get the sequences of an episode
---
tags:
  - Shots
description: Get the sequences of an episode. Add a query parameter for each
  column to filter on. A vendor gets only the entities of their tasks,
  without the hidden metadata columns.
parameters:
  - in: path
    name: episode_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    schema:
      type: string
      format: uuid
    description: Unique identifier of the episode
  - in: query
    name: project_id
    required: false
    example: a24a6ea4-ce75-4665-a070-57453082c250
    schema:
      type: string
      format: uuid
    description: Get only the sequences of this project
responses:
  200:
    description: The list of sequences
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: SQ01
              project_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              parent_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
  403:
    description: You do not have access to this project
  404:
    description: The episode does not exist
