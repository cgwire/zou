Get the versions of a shot
---
tags:
  - Shots
description: Get the saved versions of the data of a shot. A version is
  saved when the frames or the name of the shot change.
parameters:
  - in: path
    name: shot_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    schema:
      type: string
      format: uuid
    description: Unique identifier of the shot
responses:
  200:
    description: The list of versions
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
  403:
    description: You do not have access to this project
  404:
    description: The shot does not exist
