Get scene tasks
---
tags:
- Shots
description: Get tasks for a scene.
parameters:
  - in: path
    name: scene_id
    required: True
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
    200:
        description: All tasks related to given scene
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    example: a24a6ea4-ce75-4665-a070-57453082c250
                  name:
                    type: string
                    example: SC001 Layout
                  task_type_id:
                    type: string
                    format: uuid
                    example: b24a6ea4-ce75-4665-a070-57453082c250
                  task_status_id:
                    type: string
                    format: uuid
                    example: c24a6ea4-ce75-4665-a070-57453082c250
                  entity_id:
                    type: string
                    format: uuid
                    example: d24a6ea4-ce75-4665-a070-57453082c250
                  project_id:
                    type: string
                    format: uuid
                    example: e24a6ea4-ce75-4665-a070-57453082c250
