Create a shot
---
tags:
  - Shots
description: Create a shot in a project. You can give the sequence, the
  description, the number of frames and the metadata. You must be a manager
  of the project.
parameters:
  - in: path
    name: project_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    schema:
      type: string
      format: uuid
    description: Unique identifier of the project
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
        properties:
          name:
            type: string
            example: SH010
          description:
            type: string
            example: A short description of the shot
          sequence_id:
            type: string
            format: uuid
            example: a24a6ea4-ce75-4665-a070-57453082c250
          nb_frames:
            type: integer
            example: 24
          data:
            type: object
            description: Values of the metadata columns
responses:
  201:
    description: The new shot
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              example: SH010
            project_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            sequence_id:
              type: string
              format: uuid
              example: c24a6ea4-ce75-4665-a070-57453082c250
            nb_frames:
              type: integer
              example: 24
            description:
              type: string
              example: A short description of the shot
  400:
    description: The body is not valid
  403:
    description: You are not a manager of the project
