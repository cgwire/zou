Link a shot to a scene
---
tags:
  - Shots
description: Mark a scene as the source of a shot.
parameters:
  - in: path
    name: scene_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    schema:
      type: string
      format: uuid
    description: Unique identifier of the scene
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - shot_id
        properties:
          shot_id:
            type: string
            format: uuid
            example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  201:
    description: The link between the scene and the shot
    content:
      application/json:
        schema:
          type: object
          properties:
            scene_id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            shot_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
  400:
    description: The body is not valid
  403:
    description: You do not have access to this project
  404:
    description: The scene or the shot does not exist
