Get shot assets
---
tags:
- Shots
description: Get assets linked to a shot. Returns the breakdown casting
  for the shot.
parameters:
  - in: path
    name: shot_id
    required: True
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c25
responses:
    200:
        description: All assets for given shot
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    example: a24a6ea4-ce75-4665-a070-57453082c25
                  name:
                    type: string
                    example: Character A
                  entity_type_id:
                    type: string
                    format: uuid
                    example: b24a6ea4-ce75-4665-a070-57453082c25
