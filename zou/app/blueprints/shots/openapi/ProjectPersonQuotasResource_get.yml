Get project person quotas
---
tags:
- Shots
description: Get quotas statistics for a person in a project. Supports
  weighted and raw modes with optional feedback filtering.
parameters:
  - in: path
    name: project_id
    required: True
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: person_id
    required: True
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: query
    name: count_mode
    required: True
    type: string
    enum: [weighted, weigtheddone, feedback, done]
    example: weighted
  - in: query
    name: studio_id
    required: False
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
    200:
        description: Quotas statistics for shots
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: object
                properties:
                  count:
                    type: number
                    description: >-
                      Shots counted. In weighted modes a shot is split over
                      the days it was worked on, so counts are fractions
                      rounded to 2 decimals.
                    example: 15
                  frames:
                    type: integer
                    example: 360
    400:
        description: Invalid count_mode or parameter
