Get an episode
---
tags:
  - Shots
description: Get an episode with its project name and related data.
parameters:
  - in: path
    name: episode_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    schema:
      type: string
      format: uuid
    description: Unique identifier of the episode
responses:
  200:
    description: The episode
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              example: EP01
            project_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            description:
              type: string
              example: A short description of the episode
            status:
              type: string
              example: running
  403:
    description: You do not have access to this project
  404:
    description: The episode does not exist
