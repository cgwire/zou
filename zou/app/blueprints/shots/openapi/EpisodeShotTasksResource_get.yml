Get the shot tasks of an episode
---
tags:
  - Shots
description: Get the tasks of the shots of an episode. Vendors cannot use
  this route.
parameters:
  - in: path
    name: episode_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    schema:
      type: string
      format: uuid
    description: Unique identifier of the episode
responses:
  200:
    description: The list of tasks
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: EP01 Layout
              task_type_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              entity_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
              task_status_id:
                type: string
                format: uuid
                example: d24a6ea4-ce75-4665-a070-57453082c250
  403:
    description: You do not have access to this project, or you are a vendor
  404:
    description: The episode does not exist
