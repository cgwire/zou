Get shot tasks
---
tags:
- Shots
description: Get tasks for a shot. Optionally include relations using
  query params.
parameters:
  - in: path
    name: shot_id
    required: True
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c25
responses:
    200:
        description: All tasks related to given shot
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    example: a24a6ea4-ce75-4665-a070-57453082c25
                  name:
                    type: string
                    example: SH010 Animation
                  task_type_id:
                    type: string
                    format: uuid
                    example: b24a6ea4-ce75-4665-a070-57453082c25
                  task_status_id:
                    type: string
                    format: uuid
                    example: c24a6ea4-ce75-4665-a070-57453082c25
                  entity_id:
                    type: string
                    format: uuid
                    example: d24a6ea4-ce75-4665-a070-57453082c25
                  project_id:
                    type: string
                    format: uuid
                    example: e24a6ea4-ce75-4665-a070-57453082c25
                  assignees:
                    type: array
                    items:
                      type: string
                      format: uuid
                    example: ["f24a6ea4-ce75-4665-a070-57453082c25"]
