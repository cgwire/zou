Get a shot
---
tags:
  - Shots
description: Get a shot with its project name, sequence, episode and tasks.
parameters:
  - in: path
    name: shot_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    schema:
      type: string
      format: uuid
    description: Unique identifier of the shot
responses:
  200:
    description: The shot
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              example: SH010
            project_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            parent_id:
              type: string
              format: uuid
              example: c24a6ea4-ce75-4665-a070-57453082c250
            nb_frames:
              type: integer
              example: 120
            data:
              type: object
              example: {camera: camA, cut_in: 1001}
  403:
    description: You do not have access to this project
  404:
    description: The shot does not exist
