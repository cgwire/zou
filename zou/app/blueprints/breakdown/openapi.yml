AssetTypeCastingResource_get:
  summary: Get the casting of an asset type
  description: Get the casting of each asset of an asset type in a project.
    The casting of an entity is the list of assets in the entity, with the
    number of occurrences of each asset.
  tags:
    - Breakdown
  parameters:
    - in: path
      name: project_id
      required: true
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the project
      schema:
        type: string
        format: uuid
    - in: path
      name: asset_type_id
      required: true
      example: 08002400-2431-0221-0736-130196482810
      description: Unique identifier of the asset type
      schema:
        type: string
        format: uuid
  responses:
    200:
      description: A map of asset identifiers to castings
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                asset_id:
                  type: string
                  format: uuid
                  description: Asset unique identifier
                  example: c46c80c6-e097-6887-c292-79675204e470
                asset_name:
                  type: string
                  description: Asset name
                  example: Main Character
                asset_type_id:
                  type: string
                  format: uuid
                  description: Asset type identifier
                  example: 08002400-2431-0221-0736-130196482810
                casting:
                  type: array
                  items:
                    type: object
                    properties:
                      entity_id:
                        type: string
                        format: uuid
                        description: Entity identifier
                        example: e68e02e8-0219-8009-e514-918974260690
                      entity_name:
                        type: string
                        description: Entity name
                        example: SH001
                      entity_type:
                        type: string
                        description: Entity type (shot/sequence)
                        example: shot
    403:
      description: You do not have access to this project, or you are a vendor
    404:
      description: The asset type does not exist

CastingResource_get:
  summary: Get the casting of an entity
  description: Get the casting of a shot, an asset or an episode. The casting
    of an entity is the list of assets in the entity, with the number of
    occurrences of each asset.
  tags:
    - Breakdown
  parameters:
    - in: path
      name: project_id
      required: true
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the project
      schema:
        type: string
        format: uuid
    - in: path
      name: entity_id
      required: true
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the entity
      schema:
        type: string
        format: uuid
  responses:
    200:
      description: The casting of the entity
      content:
        application/json:
          schema:
            type: object
            properties:
              entity_id:
                type: string
                format: uuid
                description: Entity unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              casting:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      description: Casting entry unique identifier
                      example: b35b7fb5-df86-5776-b181-68564193d360
                    asset_id:
                      type: string
                      format: uuid
                      description: Asset identifier
                      example: c46c80c6-e097-6887-c292-79675204e470
                    asset_name:
                      type: string
                      description: Asset name
                      example: Main Character
    403:
      description: You do not have access to this project, or you are a
        vendor, or the entity is not in the project
    404:
      description: The entity does not exist

CastingResource_put:
  summary: Replace the casting of an entity
  description: Replace the casting of a shot, an asset or an episode. Send the
    full list of assets. The assets that are not in the list are removed from
    the casting. To change one asset only, use the route that casts one asset
    in entities. You must be a manager of the project. Each entry must have
    asset_id and nb_occurences. An entry without nb_occurences is skipped and
    its asset is removed from the casting.
  tags:
    - Breakdown
  parameters:
    - in: path
      name: project_id
      required: true
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the project
      schema:
        type: string
        format: uuid
    - in: path
      name: entity_id
      required: true
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the entity
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            required:
              - asset_id
              - nb_occurences
            properties:
              asset_id:
                type: string
                format: uuid
                description: Asset to cast
                example: b35b7fb5-df86-5776-b181-68564193d360
              nb_occurences:
                type: integer
                minimum: 0
                description: Number of occurrences of the asset
              label:
                type: string
                default: ''
                description: Label of the link
  responses:
    200:
      description: The new casting of the entity
      content:
        application/json:
          schema:
            type: object
            properties:
              entity_id:
                type: string
                format: uuid
                description: Entity unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              casting:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      description: Casting entry unique identifier
                      example: b35b7fb5-df86-5776-b181-68564193d360
                    asset_id:
                      type: string
                      format: uuid
                      description: Asset identifier
                      example: c46c80c6-e097-6887-c292-79675204e470
                    asset_name:
                      type: string
                      description: Asset name
                      example: Main Character
    400:
      description: The body is not a JSON array
    403:
      description: You are not a manager of the project, or the entity is not
        in the project
    404:
      description: The entity does not exist

EntitiesAssetCastingResource_put:
  summary: Cast one asset in entities
  description: Set the casting of one asset in each entity of the list. The
    entities are shots, assets or episodes of the project. The other assets of
    each entity do not change. Thus two users can edit the casting at the same
    time. Set nb_occurences to 0 to remove the asset from the casting. You
    must be a manager of the project.
  tags:
    - Breakdown
  parameters:
    - in: path
      name: project_id
      required: true
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the project
      schema:
        type: string
        format: uuid
    - in: path
      name: asset_id
      required: true
      example: c46c80c6-e097-6887-c292-79675204e470
      description: Unique identifier of the asset to cast
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - entity_ids
          properties:
            entity_ids:
              type: array
              items:
                type: string
                format: uuid
              description: Entities to cast the asset in
            nb_occurences:
              type: integer
              description: Number of occurences, 0 removes the asset from the
                casting, omit to keep the current one (1 on a new link)
            label:
              type: string
              description: Casting label, omit to keep the current one
  responses:
    200:
      description: A map of entity identifiers to their new casting
      content:
        application/json:
          schema:
            type: object
    400:
      description: The list of entities is empty, or nb_occurences is negative
    403:
      description: You are not a manager of the project, or an entity is not
        in the project
    404:
      description: The asset or an entity does not exist

EntitiesCastingResource_put:
  summary: Replace the casting of entities
  description: Replace the casting of entities of a project in one request.
    The body is a map of entity identifiers to casting lists. Each list has
    the format of the route that replaces the casting of one entity. You must
    be a manager of the project. Each entry must have asset_id and
    nb_occurences. An entry without nb_occurences is skipped and its asset is
    removed from the casting.
  tags:
    - Breakdown
  parameters:
    - in: path
      name: project_id
      required: true
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the project
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              required:
                - asset_id
                - nb_occurences
              properties:
                asset_id:
                  type: string
                  format: uuid
                  description: Asset to cast
                  example: b35b7fb5-df86-5776-b181-68564193d360
                nb_occurences:
                  type: integer
                  minimum: 0
                  description: Number of occurrences of the asset
                label:
                  type: string
                  default: ''
                  description: Label of the link
          example:
            a24a6ea4-ce75-4665-a070-57453082c250:
              - asset_id: b35b7fb5-df86-5776-b181-68564193d360
                nb_occurences: 2
  responses:
    200:
      description: A map of entity identifiers to their new casting
      content:
        application/json:
          schema:
            type: object
    400:
      description: The body is not a map of casting lists
    403:
      description: You are not a manager of the project, or an entity is not
        in the project
    404:
      description: The entity does not exist

