ProjectEntityLinkResource_delete:
  summary: Delete an entity link
  description: Delete an entity link of a project. An entity link is one asset
    in the casting of an entity. Synchronization tools use this route. You
    must be a manager of the project.
  tags:
    - Breakdown
  parameters:
    - in: path
      name: project_id
      required: true
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the project
      schema:
        type: string
        format: uuid
    - in: path
      name: entity_link_id
      required: true
      example: 64668a66-8a97-6887-6403-807863158470
      description: Unique identifier of the entity link
      schema:
        type: string
        format: uuid
  responses:
    200:
      description: The deleted entity link
    403:
      description: You are not a manager of the project, or the link is not in
        the project
    404:
      description: The entity link does not exist

ProjectEntityLinksResource_get:
  summary: Get the entity links of a project
  description: Get the entity links of a project. An entity link is one asset
    in the casting of an entity. Use page and limit to get the links page by
    page. For a more stable pagination, give the created_at value of the last
    link in cursor_created_at to get the next page. Synchronization tools use
    this route. You must be a manager of the project. With page, the response
    is a pagination envelope with data, total, nb_pages, limit, offset and
    page. Without page, the response is a list. cursor_created_at is ignored
    when page is given.
  tags:
    - Breakdown
  parameters:
    - in: path
      name: project_id
      required: true
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the project
      schema:
        type: string
        format: uuid
    - in: query
      name: page
      required: false
      example: 2
      description: Page number for pagination
      schema:
        type: integer
    - in: query
      name: limit
      required: false
      example: 100
      description: Number of items per page
      schema:
        type: integer
    - in: query
      name: cursor_created_at
      required: false
      example: '2020-01-01T00:00:00'
      description: Get the links created after this date
      schema:
        type: string
        format: date-time
  responses:
    200:
      description: The list of entity links
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: Entity link unique identifier
                  example: 64668a66-8a97-6887-6403-807863158470
                entity_in_id:
                  type: string
                  format: uuid
                  description: Source entity identifier
                  example: c46c80c6-e097-6887-c292-79675204e470
                entity_out_id:
                  type: string
                  format: uuid
                  description: Target entity identifier
                  example: d57d91d7-f108-7998-d403-80786315f580
                created_at:
                  type: string
                  format: date-time
                  description: Creation timestamp
                  example: '2020-01-01T00:00:00'
    403:
      description: You are not a manager of the project
    404:
      description: The project does not exist

