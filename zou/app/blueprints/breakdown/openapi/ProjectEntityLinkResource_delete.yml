Delete entity link
---
description: Delete a specific entity link. It's mainly used for synchronisation purpose.
tags:
  - Breakdown
parameters:
  - in: path
    name: project_id
    required: true
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the project
  - in: path
    name: entity_link_id
    required: true
    type: string
    format: uuid
    example: 64668a66-8a97-6887-6403-807863158470
    description: Unique identifier of the entity link
responses:
  200:
    description: Entity link successfully deleted
