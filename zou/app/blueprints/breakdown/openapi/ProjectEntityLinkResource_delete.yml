Delete an entity link
---
description: Delete an entity link of a project. An entity link is one asset
  in the casting of an entity. Synchronization tools use this route. You
  must be a manager of the project.
tags:
  - Breakdown
parameters:
  - in: path
    name: project_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the project
    schema:
      type: string
      format: uuid
  - in: path
    name: entity_link_id
    required: true
    example: 64668a66-8a97-6887-6403-807863158470
    description: Unique identifier of the entity link
    schema:
      type: string
      format: uuid
responses:
  200:
    description: The deleted entity link
  403:
    description: You are not a manager of the project, or the link is not in
      the project
  404:
    description: The entity link does not exist
