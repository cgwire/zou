Add an asset instance to a scene
---
description: Make an instance of an asset in a scene.
tags:
  - Breakdown
parameters:
  - in: path
    name: scene_id
    required: true
    example: 20224622-4653-2443-2958-352318704030
    description: Unique identifier of the scene
    schema:
      type: string
      format: uuid
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - asset_id
        properties:
          asset_id:
            type: string
            format: uuid
            description: Asset identifier to create instance from
            example: c46c80c6-e097-6887-c292-79675204e470
          description:
            type: string
            description: Instance description
            example: Main character instance
responses:
  201:
    description: The new asset instance
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Asset instance unique identifier
              example: 31335733-5764-3554-3069-463429815140
            asset_id:
              type: string
              format: uuid
              description: Asset identifier
              example: c46c80c6-e097-6887-c292-79675204e470
            scene_id:
              type: string
              format: uuid
              description: Scene identifier
              example: 20224622-4653-2443-2958-352318704030
            number:
              type: string
              description: Instance number
              example: '001'
            description:
              type: string
              description: Instance description
              example: Main character instance
  400:
    description: The body is not valid
  403:
    description: You do not have access to this project
  404:
    description: The scene does not exist
