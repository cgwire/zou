Get project shots casting
---
description: Retrieve the casting information for all shots from all sequences in a specific project.
tags:
  - Breakdown
parameters:
  - in: path
    name: project_id
    required: true
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the project
responses:
  200:
    description: Project shots casting information successfully retrieved
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              shot_id:
                type: string
                format: uuid
                description: Shot unique identifier
                example: e68e02e8-0219-8009-e514-918974260690
              shot_name:
                type: string
                description: Shot name
                example: "SH001"
              sequence_id:
                type: string
                format: uuid
                description: Sequence identifier
                example: f79f13f9-1320-9110-f625-029085371700
              sequence_name:
                type: string
                description: Sequence name
                example: "SEQ01"
              casting:
                type: array
                items:
                  type: object
                  properties:
                    asset_id:
                      type: string
                      format: uuid
                      description: Asset identifier
                      example: c46c80c6-e097-6887-c292-79675204e470
                    asset_name:
                      type: string
                      description: Asset name
                      example: "Main Character"
