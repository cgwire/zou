Get project shots casting
---
description: Retrieve the casting information for all shots from all sequences in a specific project.
tags:
  - Breakdown
parameters:
  - in: path
    name: project_id
    required: true
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c25
    description: Unique identifier of the project
responses:
  200:
    description: Project shots casting information successfully retrieved
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              shot_id:
                type: string
                format: uuid
                description: Shot unique identifier
                example: e68e0ie8-gi19-8009-e514-91897426g69
              shot_name:
                type: string
                description: Shot name
                example: "SH001"
              sequence_id:
                type: string
                format: uuid
                description: Sequence identifier
                example: f79f1jf9-hj20-9110-f625-02908537h70
              sequence_name:
                type: string
                description: Sequence name
                example: "SEQ01"
              casting:
                type: array
                items:
                  type: object
                  properties:
                    asset_id:
                      type: string
                      format: uuid
                      description: Asset identifier
                      example: c46c8gc6-eg97-6887-c292-79675204e47
                    asset_name:
                      type: string
                      description: Asset name
                      example: "Main Character"
