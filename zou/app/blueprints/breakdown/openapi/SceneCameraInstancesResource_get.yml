Get the camera instances of a scene
---
description: Get the camera instances of a scene.
tags:
  - Breakdown
parameters:
  - in: path
    name: scene_id
    required: true
    example: 20224622-4653-2443-2958-352318704030
    description: Unique identifier of the scene
    schema:
      type: string
      format: uuid
responses:
  200:
    description: The list of camera instances
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Camera instance unique identifier
                example: 42446844-6875-4665-4180-574530826250
              camera_id:
                type: string
                format: uuid
                description: Camera identifier
                example: 53557955-7986-5776-5291-685641937360
              scene_id:
                type: string
                format: uuid
                description: Scene identifier
                example: 20224622-4653-2443-2958-352318704030
              number:
                type: string
                description: Instance number
                example: '001'
              description:
                type: string
                description: Instance description
                example: Main camera instance
  403:
    description: You do not have access to this project
  404:
    description: The scene does not exist
