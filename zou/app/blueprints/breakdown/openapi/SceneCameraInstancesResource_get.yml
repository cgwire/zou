Get scene camera instances
---
description: Retrieve all camera instances that are linked to a specific scene.
tags:
  - Breakdown
parameters:
  - in: path
    name: scene_id
    required: true
    type: string
    format: uuid
    example: 20224622-4653-2443-2958-352318704030
    description: Unique identifier of the scene
responses:
  200:
    description: Scene camera instances successfully retrieved
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Camera instance unique identifier
                example: 42446844-6875-4665-4180-574530826250
              camera_id:
                type: string
                format: uuid
                description: Camera identifier
                example: 53557955-7986-5776-5291-685641937360
              scene_id:
                type: string
                format: uuid
                description: Scene identifier
                example: 20224622-4653-2443-2958-352318704030
              number:
                type: string
                description: Instance number
                example: "001"
              description:
                type: string
                description: Instance description
                example: "Main camera instance"
