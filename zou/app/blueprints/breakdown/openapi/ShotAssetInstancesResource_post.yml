Add shot asset instance
---
description: Add an asset instance to a specific shot.
tags:
  - Breakdown
parameters:
  - in: path
    name: shot_id
    required: true
    type: string
    format: uuid
    example: e68e0ie8-gi19-8009-e514-91897426g69
    description: Unique identifier of the shot
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - asset_instance_id
        properties:
          asset_instance_id:
            type: string
            format: uuid
            description: Asset instance identifier to add
            example: h91h3lh1-jl42-1332-h847-24120759j92
responses:
  201:
    description: Asset instance successfully added to shot
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Shot unique identifier
              example: e68e0ie8-gi19-8009-e514-91897426g69
            name:
              type: string
              description: Shot name
              example: "SH001"
            asset_instances:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Asset instance unique identifier
                    example: h91h3lh1-jl42-1332-h847-24120759j92
                  asset_id:
                    type: string
                    format: uuid
                    description: Asset identifier
                    example: c46c8gc6-eg97-6887-c292-79675204e47
