Get entity casting
---
description: Retrieve the casting information for a specific entity showing which assets are linked to it.
tags:
  - Breakdown
parameters:
  - in: path
    name: project_id
    required: true
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c25
    description: Unique identifier of the project
  - in: path
    name: entity_id
    required: true
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c25
    description: Unique identifier of the entity
responses:
  200:
    description: Entity casting information successfully retrieved
    content:
      application/json:
        schema:
          type: object
          properties:
            entity_id:
              type: string
              format: uuid
              description: Entity unique identifier
              example: a24a6ea4-ce75-4665-a070-57453082c25
            casting:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Casting entry unique identifier
                    example: b35b7fb5-df86-5776-b181-68564193d36
                  asset_id:
                    type: string
                    format: uuid
                    description: Asset identifier
                    example: c46c8gc6-eg97-6887-c292-79675204e47
                  asset_name:
                    type: string
                    description: Asset name
                    example: "Main Character"
