Get the casting of the shots of an episode
---
description: Get the casting of each shot of an episode. The casting of an
  entity is the list of assets in the entity, with the number of occurrences
  of each asset.
tags:
  - Breakdown
parameters:
  - in: path
    name: project_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the project
    schema:
      type: string
      format: uuid
  - in: path
    name: episode_id
    required: true
    example: d57d91d7-f108-7998-d403-80786315f580
    description: Unique identifier of the episode
    schema:
      type: string
      format: uuid
responses:
  200:
    description: A map of shot identifiers to castings
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              shot_id:
                type: string
                format: uuid
                description: Shot unique identifier
                example: e68e02e8-0219-8009-e514-918974260690
              shot_name:
                type: string
                description: Shot name
                example: SH001
              casting:
                type: array
                items:
                  type: object
                  properties:
                    asset_id:
                      type: string
                      format: uuid
                      description: Asset identifier
                      example: c46c80c6-e097-6887-c292-79675204e470
                    asset_name:
                      type: string
                      description: Asset name
                      example: Main Character
  403:
    description: You do not have access to this project, or you are a vendor
