        Export shots csv
        ---
        tags:
          - Export
        description: Export project shots as CSV file. Includes shot
          information, frames, task statuses, assignments, and metadata.
        produces:
          - text/csv
        parameters:
          - in: path
            name: project_id
            required: true
            schema:
              type: string
              format: uuid
            example: a24a6ea4-ce75-4665-a070-57453082c250
        responses:
            200:
              description: Shots exported as CSV successfully
              content:
                text/csv:
                  schema:
                    type: string
                  example: "Project,Episode,Sequence,Name,Description,Time Spent,Frames,Frame In,Frame Out,FPS
Project A,EP01,SQ01,SH010,Description,5.25,120,1001,1120,24"
        
