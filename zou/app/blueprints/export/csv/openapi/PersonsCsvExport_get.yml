        Export persons csv
        ---
        tags:
          - Export
        description: Export persons as CSV file. Includes first name, last
          name, email, phone, role, departments, studio, country, contract
          type, position, seniority, daily salary and active status.
          Excludes bot accounts.
        produces:
          - text/csv
        responses:
            200:
              description: Persons exported as CSV successfully
              content:
                text/csv:
                  schema:
                    type: string
                  example: "First Name;Last Name;Email;Phone;Role;Departments;Studio;Country;Contract Type;Position;Seniority;Daily Salary;Active
John;Doe;john.doe@example.com;+1234567890;user;Animation;Paris;FR;freelance;artist;mid;320;yes"
        
