Export the time spents to CSV
---
tags:
  - Export
description: Get a CSV file with the time spents of the open projects. Each
  row gives the project, person, entity, task type, date and duration. You
  must be a manager.
responses:
  200:
    description: The CSV file
    content:
      text/csv:
        schema:
          type: string
        example: Project,Person,Entity Type Name,Entity,Task Type,Date,Time
          spent Project A,John Doe,Shot,SH010,Animation,2024-01-15,480

  403:
    description: You are not a manager
