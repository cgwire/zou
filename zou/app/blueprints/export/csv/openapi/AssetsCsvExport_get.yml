        Export assets csv
        ---
        tags:
          - Export
        description: Export project assets as CSV file. Includes asset
          information, task statuses, assignments, and metadata.
        produces:
          - text/csv
        parameters:
          - in: path
            name: project_id
            required: true
            schema:
              type: string
              format: uuid
            example: a24a6ea4-ce75-4665-a070-57453082c25
        responses:
            200:
              description: Assets exported as CSV successfully
              content:
                text/csv:
                  schema:
                    type: string
                  example: "Project,Type,Name,Description,Time Spent
Project A,Character,Asset1,Description,10.50"
        
