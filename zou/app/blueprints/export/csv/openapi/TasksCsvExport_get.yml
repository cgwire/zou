Export the tasks to CSV
---
tags:
  - Export
description: Get a CSV file with the tasks of the open projects. Each row
  gives the project, task type, episode, sequence, entity, assigner,
  assignees, dates, duration, estimation and status. You must be a manager.
responses:
  200:
    description: The CSV file
    content:
      text/csv:
        schema:
          type: string
        example: Project,Task Type,Episode,Sequence,Entity
          Type,Entity,Assigner,Assignees,Duration,Estimation,Start date,Due
          date,WIP date,Validation date,Task Status Project
          A,Animation,EP01,SQ01,Shot,SH010,John Doe,Jane
          Doe,480,600,2024-01-01,2024-01-15,2024-01-05,2024-01-20,WIP

  403:
    description: You are not a manager
