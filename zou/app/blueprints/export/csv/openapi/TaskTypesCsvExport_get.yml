Export the task types to CSV
---
tags:
  - Export
description: Get a CSV file with the task types. Each row gives the
  department and the name of a task type. You must be a manager.
responses:
  200:
    description: The CSV file
    content:
      text/csv:
        schema:
          type: string
        example: Department,Name Animation,Animation Modeling,Modeling

  403:
    description: You are not a manager
