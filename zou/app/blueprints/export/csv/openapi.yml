PersonsCsvExport_get:
  summary: Export the persons to CSV
  tags:
    - Export
  description: Get a CSV file with the persons of the studio, without the
    bots. Each row gives the name, email, phone, role, departments, studio,
    country, contract type, position, seniority, daily salary and active
    status. Only an administrator gets the daily salary column. You must be a
    manager.
  responses:
    200:
      description: The CSV file
      content:
        text/csv:
          schema:
            type: string
          example: First Name;Last
            Name;Email;Phone;Role;Departments;Studio;Country;Contract
            Type;Position;Seniority;Daily Salary;Active
            John;Doe;john.doe@example.com;+1234567890;user;Animation;Paris;FR;freelance;artist;mid;320;yes

    403:
      description: You are not a manager

PlaylistCsvExport_get:
  summary: Export a playlist to CSV
  tags:
    - Export
  description: Get a CSV file with the entities of a playlist. Each row gives
    the entity, the preview revision, the task status and the last comment.
    Vendors cannot use this route.
  parameters:
    - in: path
      name: playlist_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the playlist
  responses:
    200:
      description: The CSV file
      content:
        text/csv:
          schema:
            type: string
          example: Entity name,Nb Frames,Task Type,Retake count,Revision,Task
            Status,Last comment author,Last comment date,Last comment
            SH010,120,Animation,2,10,WIP,John Doe,2024-01-15,Good work

    403:
      description: You do not have access to this playlist, or you are a
        vendor
    404:
      description: The playlist does not exist

