AssetsCsvExport_get:
  summary: Export the assets of a project to CSV
  tags:
    - Export
  description: Get a CSV file with the assets of a project. Each row gives the
    asset, its metadata, and the status and the assignees of each task type.
    Add a query parameter for each column to filter on, for example
    episode_id. Vendors cannot use this route.
  parameters:
    - in: path
      name: project_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the project
  responses:
    200:
      description: The CSV file
      content:
        text/csv:
          schema:
            type: string
          example: Project,Type,Name,Description,Time Spent Project
            A,Character,Asset1,Description,10.50

    400:
      description: An identifier is not a valid UUID
    403:
      description: You do not have access to this project, or you are a vendor
    404:
      description: The project does not exist

BaseCsvExport_get:
  summary: Export to CSV
  tags:
    - Export
  description: Get a CSV file. The rows are sent one by one. You must be a
    manager.
  responses:
    200:
      description: The CSV file
      content:
        text/csv:
          schema:
            type: string
          example: Header1,Header2 Value1,Value2

    403:
      description: You are not a manager

CastingCsvExport_get:
  summary: Export the casting of a project to CSV
  tags:
    - Export
  description: Get a CSV file with the casting of a project. Each row gives an
    entity, an asset of its casting, the number of occurrences and the label.
    Vendors cannot use this route.
  parameters:
    - in: path
      name: project_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the project
    - in: query
      name: episode_id
      required: false
      schema:
        type: string
        format: uuid
      example: b24a6ea4-ce75-4665-a070-57453082c250
      description: Get only the casting of this episode. Give main to get the
        casting of the assets that are in no episode. Give all to get the
        casting of the episodes.
    - in: query
      name: is_shot_casting
      required: false
      schema:
        type: boolean
        default: false
      example: false
      description: Get the casting of the shots. Else, get the casting of the
        assets.
  responses:
    200:
      description: The CSV file
      content:
        text/csv:
          schema:
            type: string
          example: Parent,Name,Asset Type,Asset,Occurences,Label
            Sequence1,SH010,Character,Asset1,1,fixed

    403:
      description: You do not have access to this project, or you are a vendor
    404:
      description: The project does not exist

