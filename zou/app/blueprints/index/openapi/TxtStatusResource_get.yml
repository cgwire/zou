Get the status of the services as text
---
description: Get the status of the services of the API as plain text. Each
  line gives one service and the value up or down. You do not need a token
  for this route.
tags:
  - Index
security: []
responses:
  200:
    description: The status as text
    content:
      text/plain:
        schema:
          type: string
          example: "name: Zou\nversion: 1.0.0\ndatabase-up: up\n"
