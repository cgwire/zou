Get the resource usage
---
description: Get the CPU usage of each core, the load average, the memory
  usage and the number of running jobs. The number of jobs is 0 if the job
  queue is disabled. You do not need a token for this route.
tags:
  - Index
security: []
responses:
  200:
    description: The CPU, memory and job statistics
    content:
      application/json:
        schema:
          type: object
          properties:
            date:
              type: string
            cpu:
              type: object
              properties:
                percent:
                  type: array
                  items:
                    type: number
                loadavg:
                  type: object
            memory:
              type: object
              properties:
                total:
                  type: number
                used:
                  type: number
                available:
                  type: number
                percent:
                  type: number
            jobs:
              type: object
              properties:
                running_jobs:
                  type: integer
