Get resource usage stats
---
description: Get CPU usage for each core, memory repartition and number of jobs in the job queue.
tags:
  - Index
responses:
  '200':
    description: CPU, memory and jobs stats
    content:
      application/json:
        schema:
          type: object
          properties:
            date:
              type: string
              format: date-time
              example: "2023-12-07T10:30:00.000Z"
            cpu:
              type: object
              properties:
                percent:
                  type: array
                  items:
                    type: number
                  example: [25.5, 30.2, 28.1]
                loadavg:
                  type: object
                  properties:
                    "last 1 min":
                      type: number
                      example: 0.75
                    "last 5 min":
                      type: number
                      example: 0.82
                    "last 10 min":
                      type: number
                      example: 0.78
            memory:
              type: object
              properties:
                total:
                  type: integer
                  example: 8589934592
                used:
                  type: integer
                  example: 4294967296
                available:
                  type: integer
                  example: 4294967296
                percent:
                  type: number
                  example: 50.0
            jobs:
              type: object
              properties:
                running_jobs:
                  type: integer
                  example: 3
