Get the status of the services for InfluxDB
---
description: Get the status of the services of the API in a format for
  InfluxDB. The value is 1 when the service is up and 0 when the service is
  down. You do not need a token for this route.
tags:
  - Index
security: []
responses:
  200:
    description: The status of each service and the time
    content:
      application/json:
        schema:
          type: object
          properties:
            database-up:
              type: integer
              enum:
                - 0
                - 1
            key-value-store-up:
              type: integer
              enum:
                - 0
                - 1
            event-stream-up:
              type: integer
              enum:
                - 0
                - 1
            job-queue-up:
              type: integer
              enum:
                - 0
                - 1
            indexer-up:
              type: integer
              enum:
                - 0
                - 1
            time:
              type: number
              description: UNIX timestamp
