Get the configuration of the instance
---
description: 'Get the configuration that Kitsu needs before login: SSO, 2FA, indexer,
  locale, timezone, theme and movie bitrates. If Sentry is enabled for Kitsu,
  the response also gives the Sentry settings. You do not need a token for this
  route.'
tags:
  - Index
security: []
responses:
  200:
    description: The configuration
    content:
      application/json:
        schema:
          type: object
          properties:
            is_self_hosted:
              type: boolean
            dark_theme_by_default:
              type: boolean
            indexer_configured:
              type: boolean
            saml_enabled:
              type: boolean
            oidc_enabled:
              type: boolean
            enforce_2fa:
              type: boolean
            preview_accounts_enabled:
              type: boolean
            crisp_token:
              type: string
            saml_idp_name:
              type: string
            oidc_idp_name:
              type: string
            default_locale:
              type: string
            default_timezone:
              type: string
            movie_highdef_bitrate:
              type: integer
            movie_lowdef_bitrate:
              type: integer
            sentry:
              type: object
              properties:
                dsn:
                  type: string
                sampleRate:
                  type: number
