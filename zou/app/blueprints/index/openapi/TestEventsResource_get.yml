Send a test event
---
description: Send a main:test event to the event stream. Use this route to
  test an event listener, for example the Python client. You do not need a
  token for this route.
tags:
  - Index
security: []
responses:
  200:
    description: The event is sent
    content:
      application/json:
        schema:
          type: object
          properties:
            success:
              type: boolean
