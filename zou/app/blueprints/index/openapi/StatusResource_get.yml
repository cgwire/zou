Get the status of the services
---
description: 'Get the status of the services of the API: the database, the key
  value store, the event stream, the job queue and the indexer. A service is up
  if the API can connect to it. The job queue is up if one worker or more is available.
  You do not need a token for this route.'
tags:
  - Index
security: []
responses:
  200:
    description: The name, the version and the status of each service
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
            version:
              type: string
            database-up:
              type: boolean
            key-value-store-up:
              type: boolean
            event-stream-up:
              type: boolean
            job-queue-up:
              type: boolean
            indexer-up:
              type: boolean
