Get project preview files
---
tags:
- Tasks
description: Retrieve all preview files that are linked to a specific
  project. This includes images, videos, and other preview media
  associated with the project.
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
    200:
        description: Preview files related to given project
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        example: a24a6ea4-ce75-4665-a070-57453082c250
                      task_id:
                        type: string
                        format: uuid
                        example: b24a6ea4-ce75-4665-a070-57453082c250
                      comment_id:
                        type: string
                        format: uuid
                        example: c24a6ea4-ce75-4665-a070-57453082c250
                      revision:
                        type: integer
                        example: 1
                      person_id:
                        type: string
                        format: uuid
                        example: e24a6ea4-ce75-4665-a070-57453082c250
                      created_at:
                        type: string
                        format: date-time
                        example: "2024-01-15T10:30:00Z"
                limit:
                  type: integer
                  example: 100
                page:
                  type: integer
                  example: 1
                is_more:
                  type: boolean
                  example: true
