Get the preview files of a project
---
tags:
  - Tasks
description: Get the preview files of the tasks of a project.
  Synchronization tools use this route. You must be an administrator.
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the project
responses:
  200:
    description: The list of preview files
    content:
      application/json:
        schema:
          type: object
          properties:
            data:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    example: a24a6ea4-ce75-4665-a070-57453082c250
                  task_id:
                    type: string
                    format: uuid
                    example: b24a6ea4-ce75-4665-a070-57453082c250
                  comment_id:
                    type: string
                    format: uuid
                    example: c24a6ea4-ce75-4665-a070-57453082c250
                  revision:
                    type: integer
                    example: 1
                  person_id:
                    type: string
                    format: uuid
                    example: e24a6ea4-ce75-4665-a070-57453082c250
                  created_at:
                    type: string
                    format: date-time
                    example: '2024-01-15T10:30:00Z'
            limit:
              type: integer
              example: 100
            page:
              type: integer
              example: 1
            is_more:
              type: boolean
              example: true
  403:
    description: You are not an administrator
  404:
    description: The project does not exist
