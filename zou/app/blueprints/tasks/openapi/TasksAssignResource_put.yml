Assign tasks to a person
---
tags:
  - Tasks
description: Add a person to the assignees of each task of the list. The
  unknown task identifiers are skipped. A manager of the project can assign
  all the tasks. A supervisor can assign the tasks of their departments. You
  cannot assign a bot.
parameters:
  - in: path
    name: person_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the person
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - task_ids
        properties:
          task_ids:
            type: array
            items:
              type: string
              format: uuid
            example: [a24a6ea4-ce75-4665-a070-57453082c250,
                  b24a6ea4-ce75-4665-a070-57453082c250]
responses:
  200:
    description: The updated tasks
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: SH010 Animation
              task_type_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              task_status_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
              entity_id:
                type: string
                format: uuid
                example: d24a6ea4-ce75-4665-a070-57453082c250
              project_id:
                type: string
                format: uuid
                example: e24a6ea4-ce75-4665-a070-57453082c250
              assignees:
                type: array
                items:
                  type: string
                  format: uuid
                example: [f24a6ea4-ce75-4665-a070-57453082c250]
  400:
    description: The person does not exist
  403:
    description: You cannot assign these tasks, or the person is a bot
