Delete all the tasks of a task type
---
tags:
  - Tasks
description: Delete all the tasks of a task type in a project, with their
  comments and previews. Use it when tasks were created by mistake. You must
  be an administrator.
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the project
  - in: path
    name: task_type_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the task type
responses:
  204:
    description: The tasks are deleted
  403:
    description: You are not an administrator
