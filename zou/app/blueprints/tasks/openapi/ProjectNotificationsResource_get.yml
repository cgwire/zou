Get project notifications
---
tags:
- Tasks
description: Retrieve notifications for tasks related to a project.
  Useful for sync.
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
    200:
        description: All notifications to tasks related to given project
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        example: a24a6ea4-ce75-4665-a070-57453082c250
                      person_id:
                        type: string
                        format: uuid
                        example: b24a6ea4-ce75-4665-a070-57453082c250
                      task_id:
                        type: string
                        format: uuid
                        example: c24a6ea4-ce75-4665-a070-57453082c250
                      comment_id:
                        type: string
                        format: uuid
                        example: d24a6ea4-ce75-4665-a070-57453082c250
                      notification_type:
                        type: string
                        example: assignment
                      created_at:
                        type: string
                        format: date-time
                        example: "2024-01-15T10:30:00Z"
                      updated_at:
                        type: string
                        format: date-time
                        example: "2024-01-15T11:00:00Z"
                limit:
                  type: integer
                  example: 100
                page:
                  type: integer
                  example: 1
                is_more:
                  type: boolean
                  example: true
