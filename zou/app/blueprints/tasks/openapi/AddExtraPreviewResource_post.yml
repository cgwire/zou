Upload an extra preview of a comment
---
tags:
  - Tasks
description: Upload the file of another preview of a comment. A comment can
  have several previews in the same revision. Send the file in a multipart
  form.
parameters:
  - in: path
    name: task_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the task
  - in: path
    name: comment_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the comment
  - in: path
    name: preview_file_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the preview file
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          file:
            type: string
            format: binary
            description: Preview file to upload
responses:
  201:
    description: The preview file
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            comment_id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            task_id:
              type: string
              format: uuid
              example: c24a6ea4-ce75-4665-a070-57453082c250
            revision:
              type: integer
              example: 2
            person_id:
              type: string
              format: uuid
              example: d24a6ea4-ce75-4665-a070-57453082c250
  400:
    description: The file is missing or is not valid
  403:
    description: You cannot do actions on this task
