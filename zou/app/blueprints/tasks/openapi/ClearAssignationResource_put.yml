Clear task assignations
---
tags:
- Tasks
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - task_ids
        properties:
          task_ids:
            type: array
            items:
              type: string
              format: uuid
            example: [
              "a24a6ea4-ce75-4665-a070-57453082c250",
              "b24a6ea4-ce75-4665-a070-57453082c250"
            ]
          person_id:
            type: string
            format: uuid
            example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
    200:
        description: Assignations removed
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                format: uuid
              example: ["a24a6ea4-ce75-4665-a070-57453082c250"]
