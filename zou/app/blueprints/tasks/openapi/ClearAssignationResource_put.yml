Remove the assignees of tasks
---
tags:
  - Tasks
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - task_ids
        properties:
          task_ids:
            type: array
            items:
              type: string
              format: uuid
            example: [a24a6ea4-ce75-4665-a070-57453082c250,
                  b24a6ea4-ce75-4665-a070-57453082c250]
          person_id:
            type: string
            format: uuid
            example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  200:
    description: The identifiers of the changed tasks
    content:
      application/json:
        schema:
          type: array
          items:
            type: string
            format: uuid
          example: [a24a6ea4-ce75-4665-a070-57453082c250]
  400:
    description: The body is not valid
  403:
    description: You cannot change these tasks
description: Remove the assignees of the tasks of the list. Give person_id
  to remove only this person. A manager of the project can change all the
  tasks. A supervisor can change the tasks of their departments.
