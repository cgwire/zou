Get comment
---
tags:
- Tasks
description: Get a comment by id for a task.
parameters:
  - in: path
    name: task_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c25
  - in: path
    name: comment_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c25
responses:
    200:
      description: Comment found and returned
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c25
              object_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c25
              person_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c25
              text:
                type: string
                example: Review completed successfully
              created_at:
                type: string
                format: date-time
                example: "2024-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                example: "2024-01-15T11:00:00Z"
