Get the statistics of the open tasks
---
tags:
  - Tasks
description: Get the number of tasks and the totals for each task type and
  each task status of each open project. An administrator gets all the open
  projects. Other users get the open projects of their teams.
responses:
  200:
    description: A map of project identifiers to statistics
    content:
      application/json:
        schema:
          type: object
          additionalProperties:
            type: object
            properties:
              total:
                type: integer
              done:
                type: integer
              estimation:
                type: integer
              duration:
                type: integer
  400:
    description: Bad request
