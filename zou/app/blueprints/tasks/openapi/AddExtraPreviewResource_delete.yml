Delete preview from comment
---
tags:
- Tasks
description: Delete a preview from a comment. Use force query to delete
  even if there are dependencies.
parameters:
  - in: path
    name: task_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: comment_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: preview_file_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: query
    name: force
    required: false
    schema:
      type: boolean
      default: false
    description: Force deletion even if preview has dependencies
responses:
    204:
      description: Preview deleted from comment
