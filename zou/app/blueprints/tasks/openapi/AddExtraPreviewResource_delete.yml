Delete a preview of a comment
---
tags:
  - Tasks
description: Delete a preview of a comment of a task. The preview must be on
  the comment, and the comment must be on the task. Use force=true to delete
  the files from the storage now. Else, the purge deletes them later. Only a
  manager of the project can use force.
parameters:
  - in: path
    name: task_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the task
  - in: path
    name: comment_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the comment
  - in: path
    name: preview_file_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the preview file
  - in: query
    name: force
    required: false
    schema:
      type: boolean
      default: false
    description: Delete the files from the storage now
responses:
  204:
    description: The preview is deleted
  400:
    description: An identifier is not valid
  403:
    description: You cannot do actions on this task, or you use force and
      you are not a manager
  404:
    description: The task, the comment or the preview does not exist, or
      they are not linked
