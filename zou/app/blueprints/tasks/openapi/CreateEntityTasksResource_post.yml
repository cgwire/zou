Create tasks for entities of a type
---
tags:
  - Tasks
description: Create a task of the task type for each entity of the list. If
  the body is empty, the route uses all the entities of this type in the
  project. A task that exists is skipped. You must be a manager of the
  project.
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the project
  - in: path
    name: entity_type
    required: true
    schema:
      type: string
    example: Asset
    description: Name of the entity type, for example Asset or Sequence
  - in: path
    name: task_type_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the task type
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: array
        items:
          type: string
          format: uuid
        description: List of entity IDs to create tasks for
      example: [b24a6ea4-ce75-4665-a070-57453082c250]
responses:
  201:
    description: The new tasks
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: Entity Task Name
              task_type_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              task_status_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
              entity_id:
                type: string
                format: uuid
                example: d24a6ea4-ce75-4665-a070-57453082c250
              project_id:
                type: string
                format: uuid
                example: e24a6ea4-ce75-4665-a070-57453082c250
  400:
    description: The body is not a list of valid identifiers
  403:
    description: You are not a manager of the project
