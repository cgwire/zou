Create entity tasks
---
tags:
- Tasks
description: Create tasks for entities of a given type. Provide entity
  IDs in the JSON body, or omit for all entities in the project.
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: entity_type
    required: true
    schema:
      type: string
    example: Asset
    description: Entity type name (Asset, Sequence, etc.)
  - in: path
    name: task_type_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: array
        items:
          type: string
          format: uuid
        description: List of entity IDs to create tasks for
      example: ["b24a6ea4-ce75-4665-a070-57453082c250"]
responses:
    201:
      description: Tasks created for entities
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  example: a24a6ea4-ce75-4665-a070-57453082c250
                name:
                  type: string
                  example: Entity Task Name
                task_type_id:
                  type: string
                  format: uuid
                  example: b24a6ea4-ce75-4665-a070-57453082c250
                task_status_id:
                  type: string
                  format: uuid
                  example: c24a6ea4-ce75-4665-a070-57453082c250
                entity_id:
                  type: string
                  format: uuid
                  example: d24a6ea4-ce75-4665-a070-57453082c250
                project_id:
                  type: string
                  format: uuid
                  example: e24a6ea4-ce75-4665-a070-57453082c250
    400:
      description: Bad request
