Get project comments
---
tags:
- Tasks
description: Retrieve comments for tasks related to a project. Useful
  for sync.
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c25
  - in: query
    name: limit
    type: integer
    default: 100
    example: 100
responses:
    200:
        description: All comments to tasks related to given project
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    example: a24a6ea4-ce75-4665-a070-57453082c25
                  object_id:
                    type: string
                    format: uuid
                    example: b24a6ea4-ce75-4665-a070-57453082c25
                  person_id:
                    type: string
                    format: uuid
                    example: c24a6ea4-ce75-4665-a070-57453082c25
                  text:
                    type: string
                    example: This task looks good
                  created_at:
                    type: string
                    format: date-time
                    example: "2024-01-15T10:30:00Z"
                  updated_at:
                    type: string
                    format: date-time
                    example: "2024-01-15T11:00:00Z"
