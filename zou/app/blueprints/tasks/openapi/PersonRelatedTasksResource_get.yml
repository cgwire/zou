Get person tasks for type
---
tags:
- Tasks
description: For all entities assigned to the person, return tasks for
  the given task type.
parameters:
  - in: path
    name: person_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: task_type_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
    200:
      description: All tasks for the given task type
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  example: a24a6ea4-ce75-4665-a070-57453082c250
                name:
                  type: string
                  example: Asset Modeling
                task_type_id:
                  type: string
                  format: uuid
                  example: b24a6ea4-ce75-4665-a070-57453082c250
                task_status_id:
                  type: string
                  format: uuid
                  example: c24a6ea4-ce75-4665-a070-57453082c250
                entity_id:
                  type: string
                  format: uuid
                  example: d24a6ea4-ce75-4665-a070-57453082c250
                project_id:
                  type: string
                  format: uuid
                  example: e24a6ea4-ce75-4665-a070-57453082c250
                assignees:
                  type: array
                  items:
                    type: string
                    format: uuid
                  example: ["f24a6ea4-ce75-4665-a070-57453082c250"]
