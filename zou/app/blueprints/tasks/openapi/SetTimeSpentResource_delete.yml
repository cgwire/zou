Delete time spent
---
tags:
- Tasks
parameters:
  - in: path
    name: task_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c25
  - in: path
    name: date
    required: true
    schema:
      type: string
      format: date
    example: "2022-07-12"
  - in: path
    name: person_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c25
responses:
    201:
        description: Time spent removed for the person on the task
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  example: a24a6ea4-ce75-4665-a070-57453082c25
                task_id:
                  type: string
                  format: uuid
                  example: b24a6ea4-ce75-4665-a070-57453082c25
                person_id:
                  type: string
                  format: uuid
                  example: c24a6ea4-ce75-4665-a070-57453082c25
                date:
                  type: string
                  format: date
                  example: "2022-07-12"
                duration:
                  type: number
                  example: 0
                created_at:
                  type: string
                  format: date-time
                  example: "2024-01-15T10:30:00Z"
    400:
        description: Invalid parameters
