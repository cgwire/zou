Get the open tasks of a person
---
tags:
  - Tasks
description: Get the tasks of a person that are not done, in the open
  projects. A vendor cannot read the tasks of other persons, and gets an
  empty list for their own tasks. A client gets an empty list. You cannot
  read the tasks of a bot.
parameters:
  - in: path
    name: person_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the person
responses:
  200:
    description: The list of tasks
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: SH010 Animation
              task_type_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              task_status_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
              entity_id:
                type: string
                format: uuid
                example: d24a6ea4-ce75-4665-a070-57453082c250
              project_id:
                type: string
                format: uuid
                example: e24a6ea4-ce75-4665-a070-57453082c250
              assignees:
                type: array
                items:
                  type: string
                  format: uuid
                example: [f24a6ea4-ce75-4665-a070-57453082c250]
  403:
    description: You cannot read the tasks of this person, or the person is
      a bot
