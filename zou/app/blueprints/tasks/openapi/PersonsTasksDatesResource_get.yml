Get the task dates of the persons
---
tags:
  - Tasks
description: For each active person, get the first start date and the last
  end date of their tasks. The schedule of the team uses it. An
  administrator gets all the projects. A manager or a supervisor gets the
  projects of their teams. The other open projects come as busy periods,
  without the project or the task.
parameters:
  - in: query
    name: project_id
    required: false
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Get only the tasks of this project
responses:
  200:
    description: The first and the last date for each person
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              person_id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              min_date:
                type: string
                description: First task start date for this person within
                  the requested scope
                example: '2024-01-15 00:00:00'
              max_date:
                type: string
                description: Last task due date for this person within the
                  requested scope
                example: '2024-03-21 00:00:00'
              busy_periods:
                type: array
                description: Anonymous, merged date intervals covering the
                  person's tasks in open productions outside the caller's
                  scope. No production or task detail is exposed.
                items:
                  type: object
                  properties:
                    start_date:
                      type: string
                      example: '2024-01-15 00:00:00'
                    end_date:
                      type: string
                      example: '2024-03-21 00:00:00'
  400:
    description: project_id is not valid
  403:
    description: You do not have the supervisor role, or you are not in the
      team of this project
