Get the previews of a task
---
tags:
  - Tasks
description: Get the preview files of a task. A client does not get the
  rejected previews.
parameters:
  - in: path
    name: task_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the task
responses:
  200:
    description: The list of preview files
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              task_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              revision:
                type: integer
                example: 1
              comment_id:
                type: string
                format: uuid
                example: d24a6ea4-ce75-4665-a070-57453082c250
              person_id:
                type: string
                format: uuid
                example: e24a6ea4-ce75-4665-a070-57453082c250
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
  403:
    description: You do not have access to this task
