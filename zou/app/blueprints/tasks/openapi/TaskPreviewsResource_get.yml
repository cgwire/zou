Get task previews
---
tags:
- Tasks
description: Return previews linked to a task.
parameters:
  - in: path
    name: task_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
    200:
      description: Previews linked to task
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  example: a24a6ea4-ce75-4665-a070-57453082c250
                task_id:
                  type: string
                  format: uuid
                  example: b24a6ea4-ce75-4665-a070-57453082c250
                revision:
                  type: integer
                  example: 1
                comment_id:
                  type: string
                  format: uuid
                  example: d24a6ea4-ce75-4665-a070-57453082c250
                person_id:
                  type: string
                  format: uuid
                  example: e24a6ea4-ce75-4665-a070-57453082c250
                created_at:
                  type: string
                  format: date-time
                  example: "2024-01-15T10:30:00Z"
