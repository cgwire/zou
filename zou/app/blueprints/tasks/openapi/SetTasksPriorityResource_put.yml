Set the priority of tasks
---
tags:
  - Tasks
description: Set the priority of each task of the list. The tasks that you
  cannot change are skipped. A manager can change the tasks of the project.
  A supervisor can change the tasks of their departments.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - task_ids
          - priority
        properties:
          task_ids:
            type: array
            items:
              type: string
              format: uuid
            example: [a24a6ea4-ce75-4665-a070-57453082c250,
                  b24a6ea4-ce75-4665-a070-57453082c250]
          priority:
            type: integer
            example: 2
responses:
  200:
    description: The updated tasks
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
  400:
    description: The body is not valid
