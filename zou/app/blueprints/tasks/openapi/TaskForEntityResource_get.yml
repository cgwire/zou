Get the tasks of an entity for a task type
---
tags:
  - Tasks
description: Get the tasks of an entity that have a task type.
parameters:
  - in: path
    name: entity_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the entity
  - in: path
    name: task_type_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the task type
responses:
  200:
    description: The list of tasks
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                example: SH010 Animation
              task_type_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              task_status_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
              entity_id:
                type: string
                format: uuid
                example: d24a6ea4-ce75-4665-a070-57453082c250
              project_id:
                type: string
                format: uuid
                example: e24a6ea4-ce75-4665-a070-57453082c250
              assignees:
                type: array
                items:
                  type: string
                  format: uuid
                example: [f24a6ea4-ce75-4665-a070-57453082c250]
  403:
    description: You do not have access to this project or to this entity
  404:
    description: The entity does not exist
