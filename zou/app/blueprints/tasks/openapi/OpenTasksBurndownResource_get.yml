Get the burndown of the open tasks
---
tags:
  - Tasks
description: Get the burndown values of the open tasks that match the
  filters. The response gives the total duration and estimation, the first
  start date, the last due date and the values for each day. The tasks are
  the tasks of the open projects of your teams. An administrator gets the
  tasks of all the open projects. The route skips the concept tasks if you
  do not give task_type_id. Clients and vendors cannot use this route.
parameters:
  - in: query
    name: project_id
    required: false
    schema:
      type: string
      format: uuid
    description: Get only the tasks of this project
  - in: query
    name: task_status_id
    required: false
    schema:
      type: string
      format: uuid
    description: Get only the tasks with this task status
  - in: query
    name: task_type_id
    required: false
    schema:
      type: string
      format: uuid
    description: Get only the tasks of this task type
  - in: query
    name: person_id
    required: false
    schema:
      type: string
      format: uuid
    description: Get only the tasks of these assignees. Give a
      comma-separated list, or unassigned for the tasks without assignee.
  - in: query
    name: studio_id
    required: false
    schema:
      type: string
      format: uuid
    description: Get only the tasks of the assignees of this studio
  - in: query
    name: department_id
    required: false
    schema:
      type: string
      format: uuid
    description: Get only the tasks of the assignees of this department
  - in: query
    name: start_date
    required: false
    schema:
      type: string
      format: date
    description: Get only the tasks that start on this date or after
  - in: query
    name: due_date
    required: false
    schema:
      type: string
      format: date
    description: Get only the tasks that end on this date or before
  - in: query
    name: priority
    required: false
    schema:
      type: integer
    description: Get only the tasks with this priority
responses:
  200:
    description: The burndown values
    content:
      application/json:
        schema:
          type: object
          properties:
            total:
              type: integer
              description: Total number of tasks
            total_estimation:
              type: number
              description: Total estimation of tasks in minutes
            start_date:
              type: string
              format: date
              description: First task start date
            end_date:
              type: string
              format: date
              description: Last task due date
            done_by_day:
              type: array
              items:
                type: object
                properties:
                  date:
                    type: string
                    format: date
                  done:
                    type: integer
                  done_estimation:
                    type: number
  400:
    description: A filter is not valid
  403:
    description: You are a client or a vendor on the given project, or
      globally when you give no project; or you are not in the team of the
      given project
