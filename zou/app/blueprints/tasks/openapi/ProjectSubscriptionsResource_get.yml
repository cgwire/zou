Get the subscriptions of a project
---
tags:
  - Tasks
description: Get the subscriptions of the tasks of a project.
  Synchronization tools use this route. You must be an administrator.
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the project
responses:
  200:
    description: The list of subscriptions
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              person_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              task_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
  403:
    description: You are not an administrator
  404:
    description: The project does not exist
