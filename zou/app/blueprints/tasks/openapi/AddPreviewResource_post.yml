Add a preview to a comment
---
tags:
  - Tasks
description: Create a preview file for a comment of a task. Upload the file
  of the preview after. If you do not give the revision, the route uses the
  last revision plus 1.
parameters:
  - in: path
    name: task_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the task
  - in: path
    name: comment_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the comment
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          revision:
            type: integer
            description: Revision number for the preview
            example: 1
responses:
  201:
    description: The new preview file
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            comment_id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            task_id:
              type: string
              format: uuid
              example: c24a6ea4-ce75-4665-a070-57453082c250
            revision:
              type: integer
              example: 3
            person_id:
              type: string
              format: uuid
              example: d24a6ea4-ce75-4665-a070-57453082c250
            created_at:
              type: string
              format: date-time
              example: '2024-01-15T10:30:00Z'
  400:
    description: The body is not valid
  403:
    description: You cannot do actions on this task
  404:
    description: The task or the comment does not exist
