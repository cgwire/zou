Get a task with all its data
---
description: Get a task with the details of its assignees, its task type,
  its task status, its entity and its project. A manager gets all the
  fields of the assignees and of the assigner. Other users get the minimal
  fields. A client gets a reduced task, without the assignees and the
  assigner.
tags:
  - Tasks
parameters:
  - in: path
    name: task_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the task
responses:
  200:
    description: The task
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              example: SH010 Animation
            task_type_id:
              type: string
              format: uuid
              example: b24a6ea4-ce75-4665-a070-57453082c250
            task_status_id:
              type: string
              format: uuid
              example: c24a6ea4-ce75-4665-a070-57453082c250
            entity_id:
              type: string
              format: uuid
              example: d24a6ea4-ce75-4665-a070-57453082c250
            project_id:
              type: string
              format: uuid
              example: e24a6ea4-ce75-4665-a070-57453082c250
            assignees:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    example: f24a6ea4-ce75-4665-a070-57453082c250
                  first_name:
                    type: string
                    example: John
                  last_name:
                    type: string
                    example: Doe
            task_type:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  example: b24a6ea4-ce75-4665-a070-57453082c250
                name:
                  type: string
                  example: Animation
            task_status:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  example: c24a6ea4-ce75-4665-a070-57453082c250
                name:
                  type: string
                  example: In Progress
  403:
    description: You do not have access to this project
  404:
    description: The task does not exist
