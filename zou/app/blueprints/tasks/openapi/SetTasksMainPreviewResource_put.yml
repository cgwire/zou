Use the last preview of tasks as the entity pictures
---
tags:
  - Tasks
description: For each task of the list, use its last preview as the picture
  of its entity. The tasks without preview are skipped. Clients cannot use
  this route.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - task_ids
        properties:
          task_ids:
            type: array
            items:
              type: string
              format: uuid
responses:
  200:
    description: The updated entities
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
  400:
    description: The body is not valid
  403:
    description: You do not have access to this project, or you are a client
