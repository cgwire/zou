Delete tasks
---
tags:
  - Tasks
description: Delete the tasks of the list. Send a list of task identifiers
  in the body. You must be a manager of the project.
parameters:
  - in: path
    name: project_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the project
responses:
  200:
    description: The identifiers of the deleted tasks
    content:
      application/json:
        schema:
          type: array
          items:
            type: string
            format: uuid
          example: [a24a6ea4-ce75-4665-a070-57453082c250]
  400:
    description: The body is not a list of valid identifiers
  403:
    description: You are not a manager of the project
