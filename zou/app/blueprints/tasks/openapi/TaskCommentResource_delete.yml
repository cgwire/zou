Delete a comment of a task
---
tags:
  - Tasks
description: Delete a comment of a task. A manager of the project can delete
  all the comments. Other users can delete their own comments only.
parameters:
  - in: path
    name: task_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the task
  - in: path
    name: comment_id
    required: true
    schema:
      type: string
      format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the comment
responses:
  204:
    description: The comment is deleted
  403:
    description: You cannot delete this comment
  404:
    description: The comment does not exist
