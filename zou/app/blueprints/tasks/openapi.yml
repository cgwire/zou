AddExtraPreviewResource_delete:
  summary: Delete a preview of a comment
  tags:
    - Tasks
  description: Delete a preview of a comment of a task. The preview must be on
    the comment, and the comment must be on the task. Administrators and the
    managers of the project can use this route. Other users must be assignees
    of the task, supervisors of its department, or creators of its entity. You
    must also be able to read the comment. A client of the project cannot use
    this route. Use force=true to delete the files from the storage now. Else,
    the purge deletes them later. Only an administrator or a manager of the
    project can use force.
  parameters:
    - in: path
      name: task_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the task
    - in: path
      name: comment_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the comment
    - in: path
      name: preview_file_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the preview file
    - in: query
      name: force
      required: false
      schema:
        type: boolean
        default: false
      description: Delete the files from the storage now
  responses:
    204:
      description: The preview is deleted
    400:
      description: An identifier is not valid
    403:
      description: You cannot do actions on this task, or you use force and
        you are not a manager
    404:
      description: The task, the comment or the preview does not exist, or
        they are not linked

AddExtraPreviewResource_post:
  summary: Upload an extra preview of a comment
  tags:
    - Tasks
  description: Create another preview entry on a comment, in the same revision
    as the preview preview_file_id. A comment can have several previews in the
    same revision. The route creates the metadata only. Upload the file after,
    with the preview file upload route. Administrators and the managers of the
    project can use this route. Other users must be assignees of the task,
    supervisors of its department, or creators of its entity. A client of the
    project cannot use this route.
  parameters:
    - in: path
      name: task_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the task
    - in: path
      name: comment_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the comment
    - in: path
      name: preview_file_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the preview file
  responses:
    201:
      description: The preview file
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              comment_id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              task_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
              revision:
                type: integer
                example: 2
              person_id:
                type: string
                format: uuid
                example: d24a6ea4-ce75-4665-a070-57453082c250
    400:
      description: The project allows one preview per revision, or the
        revision already exists
    403:
      description: You cannot do actions on this task
    404:
      description: The task, the comment or the preview file does not exist

AddPreviewResource_post:
  summary: Add a preview to a comment
  tags:
    - Tasks
  description: Create a preview file for a comment of a task. Upload the file
    of the preview after. If you do not give the revision, the route uses the
    last revision plus 1. Administrators and the managers of the project can
    use this route. Other users must be assignees of the task, supervisors of
    its department, or creators of its entity. A client of the project cannot
    use this route.
  parameters:
    - in: path
      name: task_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the task
    - in: path
      name: comment_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the comment
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            revision:
              type: integer
              description: Revision number for the preview
              example: 1
  responses:
    201:
      description: The new preview file
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              comment_id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              task_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
              revision:
                type: integer
                example: 3
              person_id:
                type: string
                format: uuid
                example: d24a6ea4-ce75-4665-a070-57453082c250
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
    400:
      description: The body is not valid, the revision already exists on this
        task, or the project allows one preview per revision
    403:
      description: You cannot do actions on this task
    404:
      description: The task or the comment does not exist

AddTimeSpentResource_post:
  summary: Add time to a time spent
  tags:
    - Tasks
  parameters:
    - in: path
      name: task_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the task
    - in: path
      name: date
      required: true
      schema:
        type: string
        format: date
      example: '2022-07-12'
      description: Date in the YYYY-MM-DD format
    - in: path
      name: person_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the person
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            duration:
              type: number
              example: 30
  responses:
    201:
      description: The updated time spent
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: a24a6ea4-ce75-4665-a070-57453082c250
              task_id:
                type: string
                format: uuid
                example: b24a6ea4-ce75-4665-a070-57453082c250
              person_id:
                type: string
                format: uuid
                example: c24a6ea4-ce75-4665-a070-57453082c250
              date:
                type: string
                format: date
                example: '2022-07-12'
              duration:
                type: number
                example: 150
              created_at:
                type: string
                format: date-time
                example: '2024-01-15T10:30:00Z'
    400:
      description: The date or the duration is not valid
    403:
      description: The person is not an assignee of the task, you cannot add
        time for this person, or the person is a bot
    404:
      description: The task or the person does not exist
  description: Add a duration to the time spent of a person on a task for a
    date. If the time spent does not exist, the route creates it. An
    administrator can add time for all the persons. For other users, the
    person must be an assignee of the task. The person can add time for
    themselves. A manager of the project can add time for the assignees. You
    cannot add time for a bot, except when the project enables bot
    collaboration.

ClearAssignationResource_put:
  summary: Remove the assignees of tasks
  tags:
    - Tasks
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - task_ids
          properties:
            task_ids:
              type: array
              items:
                type: string
                format: uuid
              example: [a24a6ea4-ce75-4665-a070-57453082c250,
                    b24a6ea4-ce75-4665-a070-57453082c250]
            person_id:
              type: string
              format: uuid
              example: a24a6ea4-ce75-4665-a070-57453082c250
  responses:
    200:
      description: The identifiers of the changed tasks
      content:
        application/json:
          schema:
            type: array
            items:
              type: string
              format: uuid
            example: [a24a6ea4-ce75-4665-a070-57453082c250]
    400:
      description: The body is not valid
  description: Remove the assignees of the tasks of the list. Give person_id
    to remove only this person. The tasks that you cannot change, and the
    unknown tasks, are skipped. An administrator or a manager of the project
    can change all the tasks. A supervisor can change the tasks of their
    departments. An assignee can remove themselves, with their own
    person_id.

