          schema:
            type: array
            items:
              type: object
              properties:
                person_id:
                  type: string
                  format: uuid
                  example: a24a6ea4-ce75-4665-a070-57453082c250
                min_date:
                  type: string
                  description: First task start date for this person within
                    the requested scope
                  example: '2024-01-15 00:00:00'
                max_date:
                  type: string
                  description: Last task due date for this person within the
                    requested scope
                  example: '2024-03-21 00:00:00'
                busy_periods:
                  type: array
                  description: Anonymous, merged date intervals covering the
                    person's tasks in open productions outside the caller's
                    scope. No production or task detail is exposed.
                  items:
                    type: object
                    properties:
