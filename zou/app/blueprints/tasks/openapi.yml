                    example: a24a6ea4-ce75-4665-a070-57453082c250
                  task_id:
                    type: string
                    format: uuid
                    example: b24a6ea4-ce75-4665-a070-57453082c250
                  person_id:
                    type: string
                    format: uuid
                    example: c24a6ea4-ce75-4665-a070-57453082c250
                  date:
                    type: string
                    format: date
                    example: '2022-07-12'
                  duration:
                    type: number
                    example: 120
                  created_at:
                    type: string
                    format: date-time
