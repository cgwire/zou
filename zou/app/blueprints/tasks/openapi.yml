      required: false
      schema:
        type: string
        format: uuid
      description: Get only the tasks with this task status
    - in: query
      name: task_type_id
      required: false
      schema:
        type: string
        format: uuid
      description: Get only the tasks of this task type
    - in: query
      name: person_id
      required: false
      schema:
        type: string
        format: uuid
      description: Get only the tasks of these assignees. Give a
        comma-separated list, or unassigned for the tasks without assignee.
    - in: query
      name: studio_id
      required: false
      schema:
        type: string
        format: uuid
      description: Get only the tasks of the assignees of this studio
    - in: query
      name: department_id
      required: false
      schema:
        type: string
        format: uuid
      description: Get only the tasks of the assignees of this department
    - in: query
      name: start_date
      required: false
      schema:
        type: string
        format: date
      description: Get only the tasks that start on this date or after
    - in: query
      name: due_date
      required: false
      schema:
        type: string
        format: date
      description: Get only the tasks that end on this date or before
    - in: query
      name: priority
      required: false
      schema:
        type: integer
      description: Get only the tasks with this priority
  responses:
    200:
      description: The burndown values
      content:
        application/json:
          schema:
            type: object
            properties:
              total:
                type: integer
                description: Total number of tasks
              total_estimation:
                type: number
                description: Total estimation of tasks in minutes
              start_date:
                type: string
                format: date
                description: First task start date
              end_date:
                type: string
                format: date
                description: Last task due date
              done_by_day:
                type: array
                items:
                  type: object
                  properties:
                    date:
                      type: string
                      format: date
                    done:
                      type: integer
                    done_estimation:
                      type: number
    400:
      description: A filter is not valid
    403:
      description: You are a client or a vendor on the given project, or
