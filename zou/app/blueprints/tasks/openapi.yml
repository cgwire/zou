    global role. You must be a supervisor, a manager or an administrator in
    the studio. With project_id, the route uses your role on this project.
  parameters:
    - in: query
      name: project_id
      required: false
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Get only the tasks of this project
  responses:
    200:
      description: The first and the last date for each person
      content:
