      description: Get only the tasks of this task type
    - in: query
      name: person_id
      required: false
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Get only the tasks of these assignees. Give a
        comma-separated list, or unassigned for the tasks without assignee.
    - in: query
      name: start_date
      required: false
      schema:
        type: string
        format: date
      example: '2022-07-12'
      description: Get only the tasks that start on this date or after
    - in: query
      name: due_date
      required: false
      schema:
        type: string
        format: date
      example: '2022-07-12'
      description: Get only the tasks that end on this date or before
    - in: query
      name: priority
      required: false
      schema:
        type: integer
      example: 3
      description: Get only the tasks with this priority
    - in: query
      name: page
      required: false
      schema:
        type: integer
        default: 1
      example: 1
      description: Page to get
    - in: query
      name: limit
      required: false
      schema:
        type: integer
        default: 100
      example: 100
      description: Number of tasks in a page. The default value is 100.

    - in: query
      name: studio_id
      required: false
      description: Get only the tasks of the assignees of this studio
      schema:
        type: string
        format: uuid
    - in: query
      name: department_id
      required: false
      description: Get only the tasks of the assignees of this department
      schema:
        type: string
        format: uuid
    - in: query
      name: group_by
      required: false
      description: Group the statistics on this field
      schema:
        type: string
