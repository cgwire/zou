GetTimeSpentDateResource_get:
  summary: Get the time spent on a task for a date
  tags:
    - Tasks
  parameters:
    - in: path
      name: task_id
      required: true
      schema:
        type: string
        format: uuid
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the task
    - in: path
      name: date
      required: true
      schema:
        type: string
        format: date
      example: '2022-07-12'
      description: Date in the YYYY-MM-DD format
  responses:
    200:
      description: An object. Each key is a person identifier, with the list
        of their time spent entries. The key total gives the sum of the
        durations.
      content:
        application/json:
          schema:
            type: object
            properties:
              total:
                type: number
                description: Sum of the durations
            additionalProperties:
              type: array
              description: Time spent entries of the person
              items:
                type: object
                properties:
                  id:
                    type: string
