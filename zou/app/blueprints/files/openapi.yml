            - task_type_id
          properties:
            name:
              type: string
              description: Output file name
              example: main
            mode:
              type: string
              description: Output file mode
              default: output
              example: output
            output_type_id:
              type: string
              format: uuid
              description: Output type identifier
              example: a24a6ea4-ce75-4665-a070-57453082c250
            task_type_id:
              type: string
              format: uuid
              description: Task type identifier
              example: a24a6ea4-ce75-4665-a070-57453082c250
            person_id:
              type: string
              format: uuid
              description: Person identifier
              example: a24a6ea4-ce75-4665-a070-57453082c250
            working_file_id:
              type: string
              format: uuid
              description: Source working file identifier
              example: a24a6ea4-ce75-4665-a070-57453082c250
            file_status_id:
              type: string
              format: uuid
              description: File status identifier
              example: a24a6ea4-ce75-4665-a070-57453082c250
            comment:
              type: string
              description: Output file comment
              example: Final render
            extension:
              type: string
              description: File extension
              example: .mp4
            representation:
              type: string
              description: File representation
              example: mp4
            revision:
              type: integer
              description: File revision number
              example: 1
            nb_elements:
              type: integer
              description: Number of elements
              default: 1
              example: 1
            sep:
              type: string
              description: Path separator
              default: /
              example: /
