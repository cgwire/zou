      example: a24a6ea4-ce75-4665-a070-57453082c250
  responses:
    200:
      description: The file
      content:
        image/png:
          schema:
            type: string
            format: binary
            description: PNG image file
            example: binary data
        image/jpg:
          schema:
            type: string
            format: binary
            description: JPEG image file
            example: binary data
        image/gif:
          schema:
            type: string
            format: binary
            description: GIF image file
            example: binary data
        application/octet-stream:
          schema:
            type: string
            format: binary
            description: Binary file content
            example: binary data
    403:
      description: You do not have access to this task
    404:
      description: The working file or its file does not exist

WorkingFileFileResource_post:
  summary: Upload a working file
  description: Upload the file of a working file to the storage. Send the file
    in a multipart form.
  tags:
    - Files
  parameters:
    - in: path
      name: working_file_id
      required: true
      schema:
        type: string
        format: uuid
      description: Working file unique identifier
      example: a24a6ea4-ce75-4665-a070-57453082c250
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          required:
            - file
          properties:
            file:
              type: string
              format: binary
              description: Working file to upload
              example: file content
  responses:
    201:
      description: The working file
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Working file unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                description: Working file name
                example: main
              path:
                type: string
                description: Working file path
                example: /project/asset/working/main_v001.blend
              revision:
                type: integer
                description: Working file revision
                example: 1
              task_id:
                type: string
                format: uuid
                description: Task identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: '2023-01-01T12:00:00Z'
              updated_at:
                type: string
                format: date-time
                description: Last update timestamp
                example: '2023-01-01T12:30:00Z'
    400:
      description: The file is missing
    403:
      description: You do not have access to this task
    404:
      description: The working file does not exist

WorkingFilePathResource_post:
  summary: Get the path of a working file
  description: Get the folder path and the file name of a working file of a
    task. The route uses the file tree of the project to make the path. If
    revision is 0, the route uses the next revision. A vendor must have a
    task on the entity of the task. If software_id is not given, the route
    uses the 3ds Max software and creates it if it does not exist.
  tags:
    - Files
  parameters:
    - in: path
      name: task_id
      required: true
      schema:
        type: string
        format: uuid
      description: Task unique identifier
      example: a24a6ea4-ce75-4665-a070-57453082c250
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
              description: File name
              default: main
              example: main
            mode:
              type: string
              description: File mode
              default: working
              example: working
            software_id:
              type: string
              format: uuid
              description: Software identifier
              example: a24a6ea4-ce75-4665-a070-57453082c250
            comment:
              type: string
              description: File comment
              example: Updated lighting
            revision:
              type: integer
              description: File revision number
              example: 1
            sep:
              type: string
              description: Path separator
              default: /
              example: /
  responses:
    200:
      description: The path and the file name
      content:
        application/json:
          schema:
            type: object
            properties:
              path:
                type: string
                description: Generated file path
                example: /project/asset/working/main_v001.blend
              name:
                type: string
                description: Generated file name
                example: main_v001.blend
    400:
      description: The body is not valid, or the file tree is not valid
    403:
      description: You do not have access to this project, or you are a vendor
        without a task on this entity
    404:
      description: The task or the software does not exist
OutputFileFileResource_get:
  summary: Download an output file
  description: Download the file of an output file from the storage. You must
    be in the project team. A client cannot download it. A manager or a
    supervisor of the project downloads every output file of the project. An
    artist or a vendor downloads the output files of the entities they have a
    task on, and of the assets cast in these entities.
  tags:
    - Files
  parameters:
    - in: path
      name: output_file_id
      required: true
      schema:
        type: string
        format: uuid
      description: Output file unique identifier
      example: a24a6ea4-ce75-4665-a070-57453082c250
  responses:
    200:
      description: The file
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
            description: Binary file content
            example: binary data
    403:
      description: You do not have access to this output file
    404:
      description: The output file or its file does not exist
OutputFileFileResource_post:
  summary: Upload an output file
  description: Upload the file of an output file to the storage. Send the file
    in a multipart form. You must be in the project team, and be a manager of
    the project or have a task on the entity of the output file. A client
    cannot upload it. The upload sets the size and the upload date of the
    output file.
  tags:
    - Files
  parameters:
    - in: path
      name: output_file_id
      required: true
      schema:
        type: string
        format: uuid
      description: Output file unique identifier
      example: a24a6ea4-ce75-4665-a070-57453082c250
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          required:
            - file
          properties:
            file:
              type: string
              format: binary
              description: File to upload
              example: file content
  responses:
    201:
      description: The output file, with its new size and upload date
      content:
        application/json:
          schema:
            type: object
    403:
      description: You do not have access to this output file
    404:
      description: The output file does not exist
