CommentWorkingFileResource_put:
  summary: Change the comment of a working file
  description: Change the comment of a working file. You must be able to do
    actions on the task. A client of the project cannot use this route.
  tags:
    - Files
  parameters:
    - in: path
      name: working_file_id
      required: true
      schema:
        type: string
        format: uuid
      description: Working file unique identifier
      example: a24a6ea4-ce75-4665-a070-57453082c250
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - comment
          properties:
            comment:
              type: string
              description: Working file comment
              example: Updated lighting and materials
  responses:
    200:
      description: The updated working file
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Working file unique identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
              comment:
                type: string
                description: Updated comment
                example: Updated lighting and materials
              updated_at:
                type: string
                format: date-time
                description: Last update timestamp
                example: '2023-01-01T12:30:00Z'
    400:
      description: The comment is missing
    403:
      description: You cannot do actions on this task
    404:
      description: The working file does not exist

EntityOutputFilePathResource_post:
  summary: Get the path of an output file
  description: Get the folder path and the file name of an output file of an
    entity. The route uses the file tree of the project to make the path. If
    revision is 0, the route uses the next revision. A vendor must have a
    task on the entity.
  tags:
    - Files
  parameters:
    - in: path
      name: entity_id
      required: true
      schema:
        type: string
        format: uuid
      description: Entity unique identifier
      example: a24a6ea4-ce75-4665-a070-57453082c250
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - output_type_id
            - task_type_id
          properties:
            name:
              type: string
              description: File name
              default: main
              example: main
            mode:
              type: string
              description: File mode
              default: output
              example: output
            output_type_id:
              type: string
              format: uuid
              description: Output type identifier
              example: a24a6ea4-ce75-4665-a070-57453082c250
            task_type_id:
              type: string
              format: uuid
              description: Task type identifier
              example: a24a6ea4-ce75-4665-a070-57453082c250
            extension:
              type: string
              description: File extension
              example: .mp4
            representation:
              type: string
              description: File representation
              example: mp4
            revision:
              type: integer
              description: File revision number
              example: 1
            separator:
              type: string
              description: Path separator
              default: /
              example: /
  responses:
    200:
      description: The folder path and the file name
      content:
        application/json:
          schema:
            type: object
            properties:
              folder_path:
                type: string
                description: Generated folder path
                example: /project/asset/output
              file_name:
                type: string
                description: Generated file name
                example: main_v001.mp4
    400:
      description: The body is not valid, or the file tree is not valid
    403:
      description: You do not have access to this project, or you are a vendor
        without a task on this entity
    404:
      description: The entity does not exist

EntityOutputFilesResource_get:
  summary: Get the output files of an entity
  description: Get the output files of an entity.
  tags:
    - Files
  parameters:
    - in: path
      name: entity_id
      required: true
      schema:
        type: string
        format: uuid
      description: Entity unique identifier
      example: a24a6ea4-ce75-4665-a070-57453082c250
    - in: query
      name: output_type_id
      required: false
      schema:
        type: string
        format: uuid
      description: Get only the files of this output type
      example: b35b7fb5-df86-5776-b181-68564193d360
    - in: query
      name: task_type_id
      required: false
      schema:
        type: string
        format: uuid
      description: Get only the files of this task type
      example: c46c80c6-e097-6887-c292-79675204e470
    - in: query
      name: file_status_id
      required: false
      schema:
        type: string
        format: uuid
      description: Get only the files with this file status
      example: d57d91d7-f108-7998-d403-80786315f580
    - in: query
      name: representation
      required: false
      schema:
        type: string
      description: Get only the files with this representation, for example
        abc or fbx
      example: cache
    - in: query
      name: name
      required: false
      schema:
        type: string
      description: Get only the files with this name
      example: main
  responses:
    200:
      description: The list of output files
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: Output file unique identifier
                  example: e68e02e8-0219-8009-e514-918974260690
                name:
                  type: string
                  description: Output file name
                  example: main
                revision:
                  type: integer
                  description: Output file revision
                  example: 1
                path:
                  type: string
                  description: Output file path
                  example: /project/asset/output/main_v001.mp4
                updated_at:
                  type: string
                  format: date-time
                  description: Last update timestamp
                  example: '2023-01-01T12:00:00Z'
                entity_id:
                  type: string
                  format: uuid
                  description: Entity identifier
                  example: f79f13f9-1320-9010-f625-a09008537180
    403:
      description: You do not have access to this project
    404:
      description: The entity does not exist

