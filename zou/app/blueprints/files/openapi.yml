        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Output file unique identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
              name:
                type: string
                description: Output file name
                example: main
              path:
                type: string
                description: Output file path
                example: /project/asset/output/main_v001.mp4
              revision:
                type: integer
                description: Output file revision
                example: 1
              entity_id:
                type: string
                format: uuid
                description: Entity identifier
                example: c46c80c6-e097-6887-c292-79675204e470
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: '2023-01-01T12:00:00Z'
              updated_at:
                type: string
                format: date-time
                description: Last update timestamp
                example: '2023-01-01T12:30:00Z'
    400:
      description: The body is not valid, the output type or the person does
