GetNextEntityOutputFileRevisionResource_post:
  summary: Get the next revision of an output file
  description: Get the next revision number of an output file of an entity.
    The route finds the last revision for the name, the output type and the
    task type of the body.
  tags:
    - Files
  parameters:
    - in: path
      name: entity_id
      required: true
      schema:
        type: string
        format: uuid
      description: Entity unique identifier
      example: a24a6ea4-ce75-4665-a070-57453082c250
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - output_type_id
            - task_type_id
          properties:
            name:
              type: string
              description: File name
              default: main
              example: main
            output_type_id:
              type: string
              format: uuid
              description: Output type identifier
              example: a24a6ea4-ce75-4665-a070-57453082c250
            task_type_id:
              type: string
              format: uuid
              description: Task type identifier
              example: b35b7fb5-df86-5776-b181-68564193d360
  responses:
    200:
      description: The next revision number
      content:
        application/json:
          schema:
            type: object
            properties:
              next_revision:
                type: integer
                description: Next available revision number
                example: 3
    400:
      description: The body is not valid
    403:
      description: You do not have access to this project
    404:
      description: The entity, the output type or the task type does not exist

