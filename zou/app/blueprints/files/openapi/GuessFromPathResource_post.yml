Guess the entity from a file path
---
description: Find the templates of the file tree of a project that match a
  file path. For each template, the response gives the identifiers that
  match the tokens of the template.
tags:
  - Files
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - project_id
          - file_path
        properties:
          project_id:
            type: string
            format: uuid
            description: Project unique identifier
            example: a24a6ea4-ce75-4665-a070-57453082c250
          file_path:
            type: string
            description: File path to analyze
            example: /project/asset/working/main_v001.blend
          sep:
            type: string
            description: Path separator
            default: /
            example: /
responses:
  200:
    description: The list of the matching templates
    content:
      application/json:
        schema:
          type: object
          properties:
            matches:
              type: array
              items:
                type: object
                properties:
                  template:
                    type: string
                    description: Template name
                    example: default
                  confidence:
                    type: number
                    description: Confidence score
                    example: 0.95
                  data:
                    type: object
                    description: Extracted data from path
                    properties:
                      project_id:
                        type: string
                        format: uuid
                        description: Project identifier
                        example: a24a6ea4-ce75-4665-a070-57453082c250
                      entity_id:
                        type: string
                        format: uuid
                        description: Entity identifier
                        example: b35b7fb5-df86-5776-b181-68564193d360
  400:
    description: The body is not valid
  403:
    description: You do not have access to this project
