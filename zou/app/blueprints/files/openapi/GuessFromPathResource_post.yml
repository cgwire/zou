Guess file tree template
---
description: Get list of possible project file tree templates matching
  a file path and data ids corresponding to template tokens.
tags:
- Files
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - project_id
          - file_path
        properties:
          project_id:
            type: string
            format: uuid
            description: Project unique identifier
            example: a24a6ea4-ce75-4665-a070-57453082c250
          file_path:
            type: string
            description: File path to analyze
            example: "/project/asset/working/main_v001.blend"
          sep:
            type: string
            description: Path separator
            default: /
            example: "/"
responses:
  200:
    description: List of possible project file tree templates matching the file path
    content:
      application/json:
        schema:
          type: object
          properties:
            matches:
              type: array
              items:
                type: object
                properties:
                  template:
                    type: string
                    description: Template name
                    example: "default"
                  confidence:
                    type: number
                    description: Confidence score
                    example: 0.95
                  data:
                    type: object
                    description: Extracted data from path
                    properties:
                      project_id:
                        type: string
                        format: uuid
                        description: Project identifier
                        example: a24a6ea4-ce75-4665-a070-57453082c250
                      entity_id:
                        type: string
                        format: uuid
                        description: Entity identifier
                        example: b35b7fb5-df86-5776-b181-68564193d360
  400:
    description: Invalid project ID or file path
