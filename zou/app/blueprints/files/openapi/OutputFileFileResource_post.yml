Store output file
---
description: Store a output file in the file storage system. Uploads
  the file content and associates it with the output file record.
tags:
- Files
parameters:
  - in: path
    name: output_file_id
    required: true
    schema:
      type: string
      format: uuid
    description: Output file unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - file
        properties:
          file:
            type: string
            format: binary
            description: Output file to upload
            example: "file content"
responses:
  201:
    description: Output file stored successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Output file unique identifier
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              description: Output file name
              example: "main"
            path:
              type: string
              description: Output file path
              example: "/project/asset/export/main_v001.abc"
            revision:
              type: integer
              description: Output file revision
              example: 1
            task_type_id:
              type: string
              format: uuid
              description: Task type identifier
              example: b35b7fb5-df86-5776-b181-68564193d360
            created_at:
              type: string
              format: date-time
              description: Creation timestamp
              example: "2023-01-01T12:00:00Z"
            updated_at:
              type: string
              format: date-time
              description: Last update timestamp
              example: "2023-01-01T12:30:00Z"
