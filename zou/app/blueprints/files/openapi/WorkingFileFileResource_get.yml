Download a working file
---
description: Download the file of a working file from the storage.
tags:
  - Files
parameters:
  - in: path
    name: working_file_id
    required: true
    schema:
      type: string
      format: uuid
    description: Working file unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  200:
    description: The file
    content:
      image/png:
        schema:
          type: string
          format: binary
          description: PNG image file
          example: binary data
      image/jpg:
        schema:
          type: string
          format: binary
          description: JPEG image file
          example: binary data
      image/gif:
        schema:
          type: string
          format: binary
          description: GIF image file
          example: binary data
      application/octet-stream:
        schema:
          type: string
          format: binary
          description: Binary file content
          example: binary data
  403:
    description: You do not have access to this task
  404:
    description: The working file or its file does not exist
