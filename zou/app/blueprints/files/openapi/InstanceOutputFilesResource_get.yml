Get the output files of an asset instance
---
description: Get the output files of an asset instance. An asset instance is
  a copy of an asset in a shot or a scene. The temporal entity is this shot
  or this scene.
tags:
  - Files
parameters:
  - in: path
    name: asset_instance_id
    required: true
    schema:
      type: string
      format: uuid
    description: Asset instance unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: query
    name: temporal_entity_id
    required: false
    schema:
      type: string
      format: uuid
    description: Get only the files of this shot or scene
    example: b35b7fb5-df86-5776-b181-68564193d360
  - in: query
    name: output_type_id
    required: false
    schema:
      type: string
      format: uuid
    description: Get only the files of this output type
    example: c46c80c6-e097-6887-c292-79675204e470
  - in: query
    name: task_type_id
    required: false
    schema:
      type: string
      format: uuid
    description: Get only the files of this task type
    example: d57d91d7-f108-7998-d403-80786315f580
  - in: query
    name: file_status_id
    required: false
    schema:
      type: string
      format: uuid
    description: Get only the files with this file status
    example: e68e02e8-0219-8009-e514-918974260690
  - in: query
    name: representation
    required: false
    schema:
      type: string
    description: Get only the files with this representation, for example
      abc or fbx
    example: cache
  - in: query
    name: name
    required: false
    schema:
      type: string
    description: Get only the files with this name
    example: main
responses:
  200:
    description: The list of output files
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Output file unique identifier
                example: f79f13f9-1320-9010-f625-a09008537180
              name:
                type: string
                description: Output file name
                example: main
              revision:
                type: integer
                description: Output file revision
                example: 1
              path:
                type: string
                description: Output file path
                example: /project/asset/instance/output/main_v001.mp4
              updated_at:
                type: string
                format: date-time
                description: Last update timestamp
                example: '2023-01-01T12:00:00Z'
              asset_instance_id:
                type: string
                format: uuid
                description: Asset instance identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              temporal_entity_id:
                type: string
                format: uuid
                description: Temporal entity identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
  403:
    description: You do not have access to this project
  404:
    description: The asset instance does not exist
