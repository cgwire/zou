Get entity output type files
---
description: Retrieve all output files for a given entity and
  output type. Optionally filter by representation.
tags:
- Files
parameters:
  - in: path
    name: entity_id
    required: true
    schema:
      type: string
      format: uuid
    description: Entity unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: output_type_id
    required: true
    schema:
      type: string
      format: uuid
    description: Output type unique identifier
    example: b35b7fb5-df86-5776-b181-68564193d360
  - in: query
    name: representation
    required: false
    schema:
      type: string
    description: Filter by representation
    example: "mp4"
  - in: query
    name: page
    required: false
    type: integer
    example: 1
    description: Page number. Without page nor limit, the whole list is
      returned; with either, a paginated envelope is returned.
  - in: query
    name: limit
    required: false
    type: integer
    example: 100
    description: Number of entries per page (default 100, max 5000). A
      limit alone returns the first page.
responses:
  200:
    description: All output files for the entity and output type
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Output file unique identifier
                example: c46c80c6-e097-6887-c292-79675204e470
              name:
                type: string
                description: Output file name
                example: "main"
              revision:
                type: integer
                description: Output file revision
                example: 1
              path:
                type: string
                description: Output file path
                example: "/project/asset/output/main_v001.mp4"
              updated_at:
                type: string
                format: date-time
                description: Last update timestamp
                example: "2023-01-01T12:00:00Z"
              entity_id:
                type: string
                format: uuid
                description: Entity identifier
                example: d57d91d7-f108-7998-d403-80786315f580
