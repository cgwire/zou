Get the output files of an output type
---
description: Get the output files of an entity that have an output type.
tags:
  - Files
parameters:
  - in: path
    name: entity_id
    required: true
    schema:
      type: string
      format: uuid
    description: Entity unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: output_type_id
    required: true
    schema:
      type: string
      format: uuid
    description: Get only the files of this output type
    example: b35b7fb5-df86-5776-b181-68564193d360
  - in: query
    name: representation
    required: false
    schema:
      type: string
    description: Get only the files with this representation, for example
      abc or fbx
    example: mp4
responses:
  200:
    description: The list of output files
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Output file unique identifier
                example: c46c80c6-e097-6887-c292-79675204e470
              name:
                type: string
                description: Output file name
                example: main
              revision:
                type: integer
                description: Output file revision
                example: 1
              path:
                type: string
                description: Output file path
                example: /project/asset/output/main_v001.mp4
              updated_at:
                type: string
                format: date-time
                description: Last update timestamp
                example: '2023-01-01T12:00:00Z'
              entity_id:
                type: string
                format: uuid
                description: Entity identifier
                example: d57d91d7-f108-7998-d403-80786315f580
  403:
    description: You do not have access to this project
  404:
    description: The entity or the output type does not exist
