Get entity output type files
---
description: Retrieve all output files for a given entity and
  output type. Optionally filter by representation.
tags:
- Files
parameters:
  - in: path
    name: entity_id
    required: true
    schema:
      type: string
      format: uuid
    description: Entity unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c25
  - in: path
    name: output_type_id
    required: true
    schema:
      type: string
      format: uuid
    description: Output type unique identifier
    example: b35b7fb5-df86-5776-b181-68564193d36
  - in: query
    name: representation
    required: false
    schema:
      type: string
    description: Filter by representation
    example: "mp4"
responses:
  200:
    description: All output files for the entity and output type
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Output file unique identifier
                example: c46c8gc6-eg97-6887-c292-79675204e47
              name:
                type: string
                description: Output file name
                example: "main"
              revision:
                type: integer
                description: Output file revision
                example: 1
              path:
                type: string
                description: Output file path
                example: "/project/asset/output/main_v001.mp4"
              updated_at:
                type: string
                format: date-time
                description: Last update timestamp
                example: "2023-01-01T12:00:00Z"
              entity_id:
                type: string
                format: uuid
                description: Entity identifier
                example: d57d9hd7-fh08-7998-d403-80786315f58
