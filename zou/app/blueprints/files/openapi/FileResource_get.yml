Get file information
---
description: Retrieve information about a file that could be either
  a working file or an output file. Returns detailed file metadata
  and properties.
tags:
- Files
parameters:
  - in: path
    name: file_id
    required: true
    schema:
      type: string
      format: uuid
    description: File unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  200:
    description: File information retrieved successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: File unique identifier
              example: b35b7fb5-df86-5776-b181-68564193d360
            name:
              type: string
              description: File name
              example: "main"
            path:
              type: string
              description: File path
              example: "/project/asset/working/main_v001.blend"
            revision:
              type: integer
              description: File revision
              example: 1
            updated_at:
              type: string
              format: date-time
              description: Last update timestamp
              example: "2023-01-01T12:00:00Z"
            task_id:
              type: string
              format: uuid
              description: Task identifier (for working files)
              example: c46c80c6-e097-6887-c292-79675204e470
            entity_id:
              type: string
              format: uuid
              description: Entity identifier (for output files)
              example: d57d91d7-f108-7998-d403-80786315f580
