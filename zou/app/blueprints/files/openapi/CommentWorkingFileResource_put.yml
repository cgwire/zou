Change the comment of a working file
---
description: Change the comment of a working file.
tags:
  - Files
parameters:
  - in: path
    name: working_file_id
    required: true
    schema:
      type: string
      format: uuid
    description: Working file unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - comment
        properties:
          comment:
            type: string
            description: Working file comment
            example: Updated lighting and materials
responses:
  200:
    description: The updated working file
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Working file unique identifier
              example: b35b7fb5-df86-5776-b181-68564193d360
            comment:
              type: string
              description: Updated comment
              example: Updated lighting and materials
            updated_at:
              type: string
              format: date-time
              description: Last update timestamp
              example: '2023-01-01T12:30:00Z'
  400:
    description: The comment is missing
  403:
    description: You cannot do actions on this task
  404:
    description: The working file does not exist
