Create a working file
---
description: Create a working file for a task. A working file is a revision
  of a file that an artist uses to make output files. The route uses the
  file tree of the project to make the path. If revision is 0, the route
  uses the next revision. The task is assigned to the current user.
tags:
  - Files
parameters:
  - in: path
    name: task_id
    required: true
    schema:
      type: string
      format: uuid
    description: Task unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
        properties:
          name:
            type: string
            description: Working file name
            example: main
          mode:
            type: string
            description: Working file mode
            default: working
            example: working
          description:
            type: string
            description: Working file description
            example: Main character model
          comment:
            type: string
            description: Working file comment
            example: Updated lighting and materials
          person_id:
            type: string
            format: uuid
            description: Person identifier
            example: a24a6ea4-ce75-4665-a070-57453082c250
          software_id:
            type: string
            format: uuid
            description: Software identifier
            example: a24a6ea4-ce75-4665-a070-57453082c250
          revision:
            type: integer
            description: Working file revision
            example: 1
          sep:
            type: string
            description: Path separator
            default: /
            example: /
responses:
  201:
    description: The new working file
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Working file unique identifier
              example: b35b7fb5-df86-5776-b181-68564193d360
            name:
              type: string
              description: Working file name
              example: main
            path:
              type: string
              description: Working file path
              example: /project/asset/working/main_v001.blend
            revision:
              type: integer
              description: Working file revision
              example: 1
            task_id:
              type: string
              format: uuid
              description: Task identifier
              example: c46c80c6-e097-6887-c292-79675204e470
            created_at:
              type: string
              format: date-time
              description: Creation timestamp
              example: '2023-01-01T12:00:00Z'
            updated_at:
              type: string
              format: date-time
              description: Last update timestamp
              example: '2023-01-01T12:30:00Z'
  400:
    description: The body is not valid, or the working file already exists
  403:
    description: You do not have access to this project
  404:
    description: The task does not exist
