Generate instance output file path
---
description: Generate an output file path from file tree template
  based on asset instance parameters. Revision can be computed
  automatically if not provided.
tags:
- Files
parameters:
  - in: path
    name: asset_instance_id
    required: true
    schema:
      type: string
      format: uuid
    description: Asset instance unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: path
    name: temporal_entity_id
    required: true
    schema:
      type: string
      format: uuid
    description: Temporal entity unique identifier
    example: b35b7fb5-df86-5776-b181-68564193d360
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - output_type_id
          - task_type_id
        properties:
          name:
            type: string
            description: File name
            default: main
            example: "main"
          mode:
            type: string
            description: File mode
            default: output
            example: "output"
          output_type_id:
            type: string
            format: uuid
            description: Output type identifier
            example: a24a6ea4-ce75-4665-a070-57453082c250
          task_type_id:
            type: string
            format: uuid
            description: Task type identifier
            example: b35b7fb5-df86-5776-b181-68564193d360
          extension:
            type: string
            description: File extension
            example: ".mp4"
          representation:
            type: string
            description: File representation
            example: "mp4"
          revision:
            type: integer
            description: File revision number
            example: 1
          separator:
            type: string
            description: Path separator
            default: /
            example: "/"
responses:
  200:
    description: Output file path generated successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            folder_path:
              type: string
              description: Generated folder path
              example: "/project/asset/instance/output"
            file_name:
              type: string
              description: Generated file name
              example: "main_v001.mp4"
