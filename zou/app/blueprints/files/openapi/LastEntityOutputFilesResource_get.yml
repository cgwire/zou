Get the last output files of an entity
---
description: Get the last revision of each output file of an entity. The
  response groups the files by output type and by name.
tags:
  - Files
parameters:
  - in: path
    name: entity_id
    required: true
    schema:
      type: string
      format: uuid
    description: Entity unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: query
    name: output_type_id
    required: false
    schema:
      type: string
      format: uuid
    description: Get only the files of this output type
    example: b35b7fb5-df86-5776-b181-68564193d360
  - in: query
    name: task_type_id
    required: false
    schema:
      type: string
      format: uuid
    description: Get only the files of this task type
    example: c46c80c6-e097-6887-c292-79675204e470
  - in: query
    name: representation
    required: false
    schema:
      type: string
    description: Get only the files with this representation, for example
      abc or fbx
    example: mp4
  - in: query
    name: file_status_id
    required: false
    schema:
      type: string
      format: uuid
    description: Get only the files with this file status
    example: d57d91d7-f108-7998-d403-80786315f580
  - in: query
    name: name
    required: false
    schema:
      type: string
    description: Get only the files with this name
    example: main
responses:
  200:
    description: The last revisions, by output type and by name
    content:
      application/json:
        schema:
          type: object
          additionalProperties:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Output file unique identifier
                example: e68e02e8-0219-8009-e514-918974260690
              name:
                type: string
                description: Output file name
                example: main
              revision:
                type: integer
                description: Output file revision
                example: 2
              path:
                type: string
                description: Output file path
                example: /project/asset/output/main_v002.mp4
              updated_at:
                type: string
                format: date-time
                description: Last update timestamp
                example: '2023-01-01T12:00:00Z'
  403:
    description: You do not have access to this project
  404:
    description: The entity does not exist
