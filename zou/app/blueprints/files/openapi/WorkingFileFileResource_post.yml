Store working file
---
description: Store a working file in the file storage system. Uploads
  the file content and associates it with the working file record.
tags:
- Files
parameters:
  - in: path
    name: working_file_id
    required: true
    schema:
      type: string
      format: uuid
    description: Working file unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c25
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - file
        properties:
          file:
            type: string
            format: binary
            description: Working file to upload
            example: "file content"
responses:
  201:
    description: Working file stored successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Working file unique identifier
              example: a24a6ea4-ce75-4665-a070-57453082c25
            name:
              type: string
              description: Working file name
              example: "main"
            path:
              type: string
              description: Working file path
              example: "/project/asset/working/main_v001.blend"
            revision:
              type: integer
              description: Working file revision
              example: 1
            task_id:
              type: string
              format: uuid
              description: Task identifier
              example: b35b7fb5-df86-5776-b181-68564193d36
            created_at:
              type: string
              format: date-time
              description: Creation timestamp
              example: "2023-01-01T12:00:00Z"
            updated_at:
              type: string
              format: date-time
              description: Last update timestamp
              example: "2023-01-01T12:30:00Z"
