Get entity working files
---
description: Retrieve all working files for a given entity with
  optional filtering by task and name. Returns complete list of
  working files with their revisions.
tags:
- Files
parameters:
  - in: path
    name: entity_id
    required: true
    schema:
      type: string
      format: uuid
    description: Entity unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
  - in: query
    name: task_id
    required: false
    schema:
      type: string
      format: uuid
    description: Filter by task
    example: b35b7fb5-df86-5776-b181-68564193d360
  - in: query
    name: name
    required: false
    schema:
      type: string
    description: Filter by file name
    example: "main"
responses:
  200:
    description: All working files for the entity
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Working file unique identifier
                example: c46c80c6-e097-6887-c292-79675204e470
              name:
                type: string
                description: Working file name
                example: "main"
              revision:
                type: integer
                description: Working file revision
                example: 1
              path:
                type: string
                description: Working file path
                example: "/project/asset/working/main_v001.blend"
              updated_at:
                type: string
                format: date-time
                description: Last update timestamp
                example: "2023-01-01T12:00:00Z"
              task_id:
                type: string
                format: uuid
                description: Task identifier
                example: d57d91d7-f108-7998-d403-80786315f580
              entity_id:
                type: string
                format: uuid
                description: Entity identifier
                example: e68e02e8-0219-8009-e514-918974260690
