Get the working files of a task
---
description: Get the working files of a task, with all their revisions.
tags:
  - Files
parameters:
  - in: path
    name: task_id
    required: true
    schema:
      type: string
      format: uuid
    description: Task unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
responses:
  200:
    description: The list of working files
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Working file unique identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
              name:
                type: string
                description: Working file name
                example: main
              revision:
                type: integer
                description: Working file revision
                example: 1
              updated_at:
                type: string
                format: date-time
                description: Last update timestamp
                example: '2023-01-01T12:00:00Z'
              task_id:
                type: string
                format: uuid
                description: Task identifier
                example: c46c80c6-e097-6887-c292-79675204e470
  403:
    description: You do not have access to this task
  404:
    description: The task does not exist
