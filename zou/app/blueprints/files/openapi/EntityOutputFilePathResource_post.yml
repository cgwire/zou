Get the path of an output file
---
description: Get the folder path and the file name of an output file of an
  entity. The route uses the file tree of the project to make the path. If
  revision is 0, the route uses the next revision.
tags:
  - Files
parameters:
  - in: path
    name: entity_id
    required: true
    schema:
      type: string
      format: uuid
    description: Entity unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c250
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - output_type_id
          - task_type_id
        properties:
          name:
            type: string
            description: File name
            default: main
            example: main
          mode:
            type: string
            description: File mode
            default: output
            example: output
          output_type_id:
            type: string
            format: uuid
            description: Output type identifier
            example: a24a6ea4-ce75-4665-a070-57453082c250
          task_type_id:
            type: string
            format: uuid
            description: Task type identifier
            example: a24a6ea4-ce75-4665-a070-57453082c250
          extension:
            type: string
            description: File extension
            example: .mp4
          representation:
            type: string
            description: File representation
            example: mp4
          revision:
            type: integer
            description: File revision number
            example: 1
          separator:
            type: string
            description: Path separator
            default: /
            example: /
responses:
  200:
    description: The folder path and the file name
    content:
      application/json:
        schema:
          type: object
          properties:
            folder_path:
              type: string
              description: Generated folder path
              example: /project/asset/output
            file_name:
              type: string
              description: Generated file name
              example: main_v001.mp4
  400:
    description: The body is not valid, or the file tree is not valid
  403:
    description: You do not have access to this project
  404:
    description: The entity does not exist
