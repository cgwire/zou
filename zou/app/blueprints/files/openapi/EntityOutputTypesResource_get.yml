Get entity output types
---
description: Retrieve all types of output files generated for a
  given entity. Returns list of output types available for the
  entity.
tags:
- Files
parameters:
  - in: path
    name: entity_id
    required: true
    schema:
      type: string
      format: uuid
    description: Entity unique identifier
    example: a24a6ea4-ce75-4665-a070-57453082c25
responses:
  200:
    description: All types of output files generated for the entity
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Output type unique identifier
                example: b35b7fb5-df86-5776-b181-68564193d36
              name:
                type: string
                description: Output type name
                example: "Cache"
              short_name:
                type: string
                description: Output type short name
                example: "CACHE"
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: "2023-01-01T12:00:00Z"
              updated_at:
                type: string
                format: date-time
                description: Last update timestamp
                example: "2023-01-01T12:30:00Z"
