Create concept folder
---
description: Create a new concept folder for a specific project. Reserved
  to the managers and the supervisors of the project. A folder already
  carrying this name is returned as is.
tags:
  - Concepts
parameters:
  - in: path
    name: project_id
    required: true
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the project
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
        properties:
          name:
            type: string
            description: Concept folder name
            example: "Characters"
responses:
  201:
    description: Concept folder successfully created
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Concept folder unique identifier
              example: e68e02e8-a219-8009-e514-91897426a691
            name:
              type: string
              description: Concept folder name
              example: "Characters"
            project_id:
              type: string
              format: uuid
              description: Project identifier
              example: a24a6ea4-ce75-4665-a070-57453082c250
            created_by:
              type: string
              format: uuid
              description: Creator person identifier
              example: d57d91d7-f108-7998-d403-80786315f580
            created_at:
              type: string
              format: date-time
              description: Creation timestamp
              example: "2023-01-01T12:00:00Z"
            updated_at:
              type: string
              format: date-time
              description: Last update timestamp
              example: "2023-01-01T12:00:00Z"
