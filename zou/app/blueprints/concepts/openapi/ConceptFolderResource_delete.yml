Delete concept folder
---
description: Delete a concept folder. Reserved to the managers and the
  supervisors of the project. Its concepts are kept, they go back to the
  root of the project.
tags:
  - Concepts
parameters:
  - in: path
    name: concept_folder_id
    required: true
    type: string
    format: uuid
    example: e68e02e8-a219-8009-e514-91897426a691
    description: Unique identifier of the concept folder
responses:
  204:
    description: Concept folder successfully deleted
