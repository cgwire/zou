Get concept tasks
---
description: Retrieve all tasks that are related to a specific concept.
tags:
  - Concepts
parameters:
  - in: path
    name: concept_id
    required: true
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the concept
  - in: query
    name: relations
    type: boolean
    required: false
    description: Include related entity information
    example: true
responses:
  200:
    description: List of concept tasks successfully retrieved
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Task unique identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
              name:
                type: string
                description: Task name
                example: "Character Design Task"
              task_type_id:
                type: string
                format: uuid
                description: Task type identifier
                example: c46c80c6-e097-6887-c292-79675204e470
              task_status_id:
                type: string
                format: uuid
                description: Task status identifier
                example: d57d91d7-f108-7998-d403-80786315f580
              entity_id:
                type: string
                format: uuid
                description: Entity identifier
                example: e68e02e8-0219-8009-e514-918974260690
              assigned_to:
                type: string
                format: uuid
                description: Assigned person identifier
                example: f79f13f9-1320-9010-f625-029985371800
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: "2023-01-01T12:00:00Z"
              updated_at:
                type: string
                format: date-time
                description: Last update timestamp
                example: "2023-01-01T12:30:00Z"
