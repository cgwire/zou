Get project concept folders
---
description: Retrieve all the folders the concepts of a specific project
  are sorted in, ordered by name. A concept names its folder through its
  parent_id.
tags:
  - Concepts
parameters:
  - in: path
    name: project_id
    required: true
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the project
responses:
  200:
    description: List of project concept folders successfully retrieved
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Concept folder unique identifier
                example: e68e02e8-a219-8009-e514-91897426a691
              name:
                type: string
                description: Concept folder name
                example: "Characters"
              project_id:
                type: string
                format: uuid
                description: Project identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              created_by:
                type: string
                format: uuid
                description: Creator person identifier
                example: d57d91d7-f108-7998-d403-80786315f580
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: "2023-01-01T12:00:00Z"
              updated_at:
                type: string
                format: date-time
                description: Last update timestamp
                example: "2023-01-01T12:00:00Z"
