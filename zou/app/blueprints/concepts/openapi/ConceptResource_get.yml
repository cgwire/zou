Get concept
---
description: Retrieve detailed information about a specific concept
  including metadata, project context, and related data.
tags:
  - Concepts
parameters:
  - in: path
    name: concept_id
    required: true
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the concept
responses:
  200:
    description: Concept information successfully retrieved
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Concept unique identifier
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              description: Concept name
              example: "Character Design"
            description:
              type: string
              description: Concept description
              example: "Main character concept art"
            project_id:
              type: string
              format: uuid
              description: Project identifier
              example: b35b7fb5-df86-5776-b181-68564193d360
            created_at:
              type: string
              format: date-time
              description: Creation timestamp
              example: "2023-01-01T12:00:00Z"
            updated_at:
              type: string
              format: date-time
              description: Last update timestamp
              example: "2023-01-01T12:30:00Z"
