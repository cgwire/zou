Create concept
---
description: Create a new concept for a specific project with name,
  description, and optional entity concept links.
tags:
  - Concepts
parameters:
  - in: path
    name: project_id
    required: true
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the project
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
        properties:
          name:
            type: string
            description: Concept name
            example: "Character Design"
          description:
            type: string
            description: Concept description
            example: "Main character concept art"
          data:
            type: object
            description: Additional concept data
            example: {"style": "realistic", "mood": "heroic"}
          entity_concept_links:
            type: array
            items:
              type: string
              format: uuid
            description: List of entity concept link identifiers
            example: ["b35b7fb5-df86-5776-b181-68564193d360", "c46c80c6-e097-6887-c292-79675204e470"]
          parent_id:
            type: string
            format: uuid
            description: Concept folder of the project to create the concept in
            example: e68e02e8-a219-8009-e514-91897426a691
responses:
  201:
    description: Concept successfully created
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Concept unique identifier
              example: a24a6ea4-ce75-4665-a070-57453082c250
            name:
              type: string
              description: Concept name
              example: "Character Design"
            description:
              type: string
              description: Concept description
              example: "Main character concept art"
            project_id:
              type: string
              format: uuid
              description: Project identifier
              example: b35b7fb5-df86-5776-b181-68564193d360
            data:
              type: object
              description: Additional concept data
              example: {"style": "realistic", "mood": "heroic"}
            created_by:
              type: string
              format: uuid
              description: Creator person identifier
              example: d57d91d7-f108-7998-d403-80786315f580
            created_at:
              type: string
              format: date-time
              description: Creation timestamp
              example: "2023-01-01T12:00:00Z"
            updated_at:
              type: string
              format: date-time
              description: Last update timestamp
              example: "2023-01-01T12:00:00Z"
