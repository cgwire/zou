Rename a concept folder
---
description: Rename a concept folder. Two folders of a project cannot have
  the same name. You must be a manager or a supervisor of the project.
tags:
  - Concepts
parameters:
  - in: path
    name: concept_folder_id
    required: true
    example: e68e02e8-a219-8009-e514-91897426a691
    description: Unique identifier of the concept folder
    schema:
      type: string
      format: uuid
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
        properties:
          name:
            type: string
            description: Concept folder name
            example: Characters
responses:
  200:
    description: The renamed concept folder
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Concept folder unique identifier
              example: e68e02e8-a219-8009-e514-91897426a691
            name:
              type: string
              description: Concept folder name
              example: Characters
            project_id:
              type: string
              format: uuid
              description: Project identifier
              example: a24a6ea4-ce75-4665-a070-57453082c250
            created_by:
              type: string
              format: uuid
              description: Creator person identifier
              example: d57d91d7-f108-7998-d403-80786315f580
            created_at:
              type: string
              format: date-time
              description: Creation timestamp
              example: '2023-01-01T12:00:00Z'
            updated_at:
              type: string
              format: date-time
              description: Last update timestamp
              example: '2023-01-01T12:00:00Z'
  400:
    description: An other folder of the project has this name, or the name
      is not valid
  403:
    description: You are not a manager or a supervisor of the project
  404:
    description: The concept folder does not exist
