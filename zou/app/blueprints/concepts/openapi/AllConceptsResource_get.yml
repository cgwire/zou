Get all concepts
---
description: Retrieve all concept entries with filtering support.
  Filters can be specified in the query string to narrow down results by
  project or parent concept.
tags:
  - Concepts
parameters:
  - in: query
    name: project_id
    required: false
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Filter concepts by specific project
  - in: query
    name: parent_id
    required: false
    type: string
    format: uuid
    example: b35b7fb5-df86-5776-b181-68564193d360
    description: Filter concepts by parent concept
responses:
  200:
    description: List of concepts successfully retrieved
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Concept unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                description: Concept name
                example: "Character Design"
              description:
                type: string
                description: Concept description
                example: "Main character concept art"
              project_id:
                type: string
                format: uuid
                description: Project identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
              parent_id:
                type: string
                format: uuid
                description: Parent concept identifier
                example: c46c80c6-e097-6887-c292-79675204e470
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: "2023-01-01T12:00:00Z"
              updated_at:
                type: string
                format: date-time
                description: Last update timestamp
                example: "2023-01-01T12:30:00Z"
