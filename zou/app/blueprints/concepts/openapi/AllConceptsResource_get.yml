Get concepts
---
description: Get the concepts. Add a query parameter for each column to
  filter on. If you are not an administrator, you must give project_id.
tags:
  - Concepts
parameters:
  - in: query
    name: project_id
    required: false
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Get only the concepts of this project
    schema:
      type: string
      format: uuid
  - in: query
    name: parent_id
    required: false
    example: b35b7fb5-df86-5776-b181-68564193d360
    description: Get only the concepts of this concept folder
    schema:
      type: string
      format: uuid
responses:
  200:
    description: The list of concepts
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Concept unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                description: Concept name
                example: Character Design
              description:
                type: string
                description: Concept description
                example: Main character concept art
              project_id:
                type: string
                format: uuid
                description: Project identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
              parent_id:
                type: string
                format: uuid
                description: Parent concept identifier
                example: c46c80c6-e097-6887-c292-79675204e470
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: '2023-01-01T12:00:00Z'
              updated_at:
                type: string
                format: date-time
                description: Last update timestamp
                example: '2023-01-01T12:30:00Z'
  403:
    description: You do not have access to this project, or you are a client
      or a vendor
