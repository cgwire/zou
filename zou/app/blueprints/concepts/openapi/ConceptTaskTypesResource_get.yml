Get the task types of a concept
---
description: Get the task types of the tasks of a concept.
tags:
  - Concepts
parameters:
  - in: path
    name: concept_id
    required: true
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the concept
    schema:
      type: string
      format: uuid
responses:
  200:
    description: The list of task types
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Task type unique identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
              name:
                type: string
                description: Task type name
                example: Concept Art
              short_name:
                type: string
                description: Task type short name
                example: CON
              color:
                type: string
                description: Task type color code
                example: '#FF5733'
              for_entity:
                type: string
                description: Entity type this task type is for
                example: Concept
  403:
    description: You do not have access to this project, or you are a client
  404:
    description: The concept does not exist
