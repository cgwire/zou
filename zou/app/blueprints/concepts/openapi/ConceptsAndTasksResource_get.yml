Get concepts and tasks
---
description: Retrieve all concepts and all related tasks included in the
  response.
tags:
  - Concepts
parameters:
  - in: query
    name: project_id
    required: false
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Filter concepts by specific project
responses:
  200:
    description: Concepts with tasks successfully retrieved
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Concept unique identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              name:
                type: string
                description: Concept name
                example: "Character Design"
              description:
                type: string
                description: Concept description
                example: "Main character concept art"
              project_id:
                type: string
                format: uuid
                description: Project identifier
                example: b35b7fb5-df86-5776-b181-68564193d360
              project_name:
                type: string
                description: Project name
                example: "My Animation Project"
              asset_type_name:
                type: string
                description: Asset type name
                example: "Character"
              tasks:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      description: Task unique identifier
                      example: c46c80c6-e097-6887-c292-79675204e470
                    name:
                      type: string
                      description: Task name
                      example: "Character Design Task"
                    task_type_id:
                      type: string
                      format: uuid
                      description: Task type identifier
                      example: d57d91d7-f108-7998-d403-80786315f580
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: "2023-01-01T12:00:00Z"
              updated_at:
                type: string
                format: date-time
                description: Last update timestamp
                example: "2023-01-01T12:30:00Z"
