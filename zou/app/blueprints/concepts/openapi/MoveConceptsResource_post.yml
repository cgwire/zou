Move concepts to a concept folder
---
description: Move concepts of a project to one of its concept folders, or
  back to the root of the project when no folder is named. Reserved to the
  managers and the supervisors of the project. Identifiers that are not
  concepts of the project are skipped.
tags:
  - Concepts
parameters:
  - in: path
    name: project_id
    required: true
    type: string
    format: uuid
    example: a24a6ea4-ce75-4665-a070-57453082c250
    description: Unique identifier of the project
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - concept_ids
        properties:
          concept_ids:
            type: array
            items:
              type: string
              format: uuid
            description: Identifiers of the concepts to move
            example: ["b35b7fb5-df86-5776-b181-68564193d360", "c46c80c6-e097-6887-c292-79675204e470"]
          concept_folder_id:
            type: string
            format: uuid
            description: Concept folder to move the concepts to, none to
              move them back to the root of the project
            example: e68e02e8-a219-8009-e514-91897426a691
responses:
  200:
    description: Identifiers of the concepts that were moved
    content:
      application/json:
        schema:
          type: array
          items:
            type: string
            format: uuid
          example: ["b35b7fb5-df86-5776-b181-68564193d360", "c46c80c6-e097-6887-c292-79675204e470"]
