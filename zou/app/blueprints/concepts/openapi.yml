AllConceptsResource_get:
  summary: Get concepts
  description: Get the concepts. Add a query parameter for each column to
    filter on. If you are not an administrator, you must give project_id.
  tags:
    - Concepts
  parameters:
    - in: query
      name: project_id
      required: false
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Get only the concepts of this project
      schema:
        type: string
        format: uuid
    - in: query
      name: parent_id
      required: false
      example: b35b7fb5-df86-5776-b181-68564193d360
      description: Get only the concepts of this concept folder
      schema:
        type: string
        format: uuid
    - in: query
      name: assigned_to
      required: false
      description: With any value, get only the concepts that have a task
        assigned to you.
      schema:
        type: string
  responses:
    200:
      description: The list of concepts
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: Concept unique identifier
                  example: a24a6ea4-ce75-4665-a070-57453082c250
                name:
                  type: string
                  description: Concept name
                  example: Character Design
                description:
                  type: string
                  description: Concept description
                  example: Main character concept art
                project_id:
                  type: string
                  format: uuid
                  description: Project identifier
                  example: b35b7fb5-df86-5776-b181-68564193d360
                parent_id:
                  type: string
                  format: uuid
                  description: Parent concept identifier
                  example: c46c80c6-e097-6887-c292-79675204e470
                created_at:
                  type: string
                  format: date-time
                  description: Creation timestamp
                  example: '2023-01-01T12:00:00Z'
                updated_at:
                  type: string
                  format: date-time
                  description: Last update timestamp
                  example: '2023-01-01T12:30:00Z'
    400:
      description: An identifier is not a valid UUID
    403:
      description: You do not have access to this project, or you are a client
        or a vendor

ConceptFolderResource_delete:
  summary: Delete a concept folder
  description: Delete a concept folder. The concepts of the folder are not
    deleted. They go back to the root of the project. You must be a manager or
    a supervisor of the project.
  tags:
    - Concepts
  parameters:
    - in: path
      name: concept_folder_id
      required: true
      example: e68e02e8-a219-8009-e514-91897426a691
      description: Unique identifier of the concept folder
      schema:
        type: string
        format: uuid
  responses:
    204:
      description: The concept folder is deleted
    403:
      description: You are not a manager or a supervisor of the project
    404:
      description: The concept folder does not exist

ConceptFolderResource_put:
  summary: Rename a concept folder
  description: Rename a concept folder. Two folders of a project cannot have
    the same name. You must be a manager or a supervisor of the project.
  tags:
    - Concepts
  parameters:
    - in: path
      name: concept_folder_id
      required: true
      example: e68e02e8-a219-8009-e514-91897426a691
      description: Unique identifier of the concept folder
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
          properties:
            name:
              type: string
              description: Concept folder name
              example: Characters
  responses:
    200:
      description: The renamed concept folder
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Concept folder unique identifier
                example: e68e02e8-a219-8009-e514-91897426a691
              name:
                type: string
                description: Concept folder name
                example: Characters
              project_id:
                type: string
                format: uuid
                description: Project identifier
                example: a24a6ea4-ce75-4665-a070-57453082c250
              created_by:
                type: string
                format: uuid
                description: Creator person identifier
                example: d57d91d7-f108-7998-d403-80786315f580
              created_at:
                type: string
                format: date-time
                description: Creation timestamp
                example: '2023-01-01T12:00:00Z'
              updated_at:
                type: string
                format: date-time
                description: Last update timestamp
                example: '2023-01-01T12:00:00Z'
    400:
      description: Another folder of the project has this name, or the name
        is not valid
    403:
      description: You are not a manager or a supervisor of the project
    404:
      description: The concept folder does not exist

ConceptPreviewsResource_get:
  summary: Get the previews of a concept
  description: Get the preview files of a concept. The response is a map of
    task type identifiers to lists of previews.
  tags:
    - Concepts
  parameters:
    - in: path
      name: concept_id
      required: true
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the concept
      schema:
        type: string
        format: uuid
  responses:
    200:
      description: A map of task type identifiers to lists of previews
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Preview unique identifier
                    example: b35b7fb5-df86-5776-b181-68564193d360
                  name:
                    type: string
                    description: Preview name
                    example: concept_preview_01
                  original_name:
                    type: string
                    description: Original file name
                    example: character_concept.jpg
                  file_path:
                    type: string
                    description: File path
                    example: /previews/concept/concept_preview_01.jpg
                  task_type_id:
                    type: string
                    format: uuid
                    description: Task type identifier
                    example: c46c80c6-e097-6887-c292-79675204e470
                  created_at:
                    type: string
                    format: date-time
                    description: Creation timestamp
                    example: '2023-01-01T12:00:00Z'
    403:
      description: You do not have access to this project, or you are a client
    404:
      description: The concept does not exist

ConceptResource_delete:
  summary: Delete a concept
  description: Delete a concept. The creator of the concept can delete it if
    the creator is in the project team. Other users must be managers of the
    project. If the concept has tasks, the concept is only marked as canceled.
    Use force=true to delete the concept and all its related data.
    Only a manager of the project can use force=true.
  tags:
    - Concepts
  parameters:
    - in: path
      name: concept_id
      required: true
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Unique identifier of the concept to delete
      schema:
        type: string
        format: uuid
    - in: query
      name: force
      required: false
      description: Delete the concept and all its related data
      example: false
      schema:
        type: boolean
  responses:
    204:
      description: The concept is deleted
    403:
      description: You cannot delete this concept
    404:
      description: The concept does not exist

