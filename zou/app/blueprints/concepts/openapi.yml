ConceptsAndTasksResource_get:
  summary: Get concepts with their tasks
  description: Get the concepts with the tasks of each concept. Filter with
    project_id or id. The other columns are not filters on this route. If you
    are not an administrator, you must give project_id.
  tags:
    - Concepts
  parameters:
    - in: query
      name: project_id
      required: false
      example: a24a6ea4-ce75-4665-a070-57453082c250
      description: Get only the concepts of this project
      schema:
        type: string
        format: uuid
    - in: query
      name: assigned_to
      required: false
      description: With any value, get only the concepts that have a task
        assigned to you.
      schema:
        type: string
  responses:
    200:
      description: The list of concepts with their tasks
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: Concept unique identifier
                  example: a24a6ea4-ce75-4665-a070-57453082c250
                name:
                  type: string
                  description: Concept name
                  example: Character Design
                description:
                  type: string
                  description: Concept description
                  example: Main character concept art
                project_id:
                  type: string
                  format: uuid
                  description: Project identifier
                  example: b35b7fb5-df86-5776-b181-68564193d360
                project_name:
                  type: string
                  description: Project name
                  example: My Animation Project
                asset_type_name:
                  type: string
                  description: Asset type name
                  example: Character
                tasks:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Task unique identifier
                        example: c46c80c6-e097-6887-c292-79675204e470
                      name:
                        type: string
                        description: Task name
                        example: Character Design Task
                      task_type_id:
                        type: string
                        format: uuid
                        description: Task type identifier
