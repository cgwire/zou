---
name: Zou CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

# A new push to a pull request makes the run in flight pointless: stop it
# instead of paying for it to finish. Any other run, a push to main or a
# tag, is alone in its group: every commit on main keeps a verdict to
# bisect from, and its TestPyPI publish. The group is keyed on the run id
# rather than the sha, which the bump commit of a release and its tag
# share: pushed together, one would cancel the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  PYTHON_REF: "3.12"
  PG_REF: "18"
  PYTHON_VERSIONS: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
  PG_VERSIONS: '["12", "14", "15", "16", "17", "18"]'
  MEILI_MASTER_KEY: testkey0123456789
  PGPASSWORD: mysecretpassword

jobs:
  # A push to main or a pull request tests every Python on the reference
  # Postgres and every other Postgres on the reference Python. A tag tests
  # the reference pair alone, and that one leg gates the publish.
  setup:
    name: Build the test matrix 🔧
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Generate the matrix
        id: matrix
        run: |
          python3 -c "
          import json, os

          py_ref = os.environ['PYTHON_REF']
          pg_ref = os.environ['PG_REF']
          py_all = json.loads(os.environ['PYTHON_VERSIONS'])
          pg_all = json.loads(os.environ['PG_VERSIONS'])

          entries = []
          if os.environ['GITHUB_REF'].startswith('refs/tags/'):
              entries.append({'python-version': py_ref, 'pg-version': pg_ref})
          else:
              for py in py_all:
                  entries.append({'python-version': py, 'pg-version': pg_ref})
              for pg in pg_all:
                  if pg != pg_ref:
                      entries.append({'python-version': py_ref, 'pg-version': pg})

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'matrix={json.dumps({\"include\": entries})}\n')
          "

  test:
    name: >-
      Test Python ${{ matrix.python-version }} / PG ${{ matrix.pg-version }} 🐍
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    services:
      postgres:
        image: "postgres:${{ matrix.pg-version }}"
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: ${{ env.PGPASSWORD }}
      meilisearch:
        image: getmeili/meilisearch:v1.1
        ports:
          - 7700:7700
        env:
          MEILI_MASTER_KEY: ${{ env.MEILI_MASTER_KEY }}
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v6
      - name: Cache APT packages
        uses: actions/cache@v5
        id: apt-cache
        with:
          path: ~/apt-cache
          key: apt-ffmpeg-${{ runner.os }}
      - name: Install ffmpeg
        run: |
          if [ -d ~/apt-cache ] && ls ~/apt-cache/*.deb 1>/dev/null 2>&1; then
            sudo dpkg -i ~/apt-cache/*.deb 2>/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -f --no-install-recommends)
          else
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
            sudo apt-get autoclean -y
            mkdir -p ~/apt-cache
            cp /var/cache/apt/archives/ffmpeg*.deb ~/apt-cache/ 2>/dev/null || true
            cp /var/cache/apt/archives/libav*.deb ~/apt-cache/ 2>/dev/null || true
            cp /var/cache/apt/archives/libsw*.deb ~/apt-cache/ 2>/dev/null || true
            cp /var/cache/apt/archives/libpostproc*.deb ~/apt-cache/ 2>/dev/null || true
          fi
      - name: Set up Python 🐍
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Upgrade pip 📦
        run: >-
          pip install --upgrade pip setuptools
      - name: Install packages 📦
        run: >-
          pip install -r requirements.txt
      # The databases are disposable: fsync, synchronous commits and full
      # page writes only make every commit, the CREATE DATABASE of each
      # worker and the TRUNCATE between test classes wait for the disk.
      - name: Relax the durability of the test databases 🗄
        run: >-
          psql -U postgres -h 127.0.0.1
          -c 'ALTER SYSTEM SET fsync = off'
          -c 'ALTER SYSTEM SET synchronous_commit = off'
          -c 'ALTER SYSTEM SET full_page_writes = off'
          -c 'SELECT pg_reload_conf()'
      # tests/conftest.py creates the databases on first use: one per
      # pytest-xdist worker, and the plain one for the serial pass. The
      # integration tests share the Meilisearch indexes, so they run alone
      # once the parallel pass is over, and they alone get INDEXER_KEY:
      # with it, every asset, shot or person a test creates is pushed to
      # the index and waited for.
      - name: Run tests 🧪
        shell: bash
        run: >-
          py.test -n logical --dist loadscope -m "not integration" --durations=25
          | tee "$RUNNER_TEMP/parallel.log"
        env:
          DEBUG: 1
          MAIL_DEBUG_BODY: 1
          MAIL_ENABLED: False
      # A failed parallel pass keeps a verdict of its own, and the
      # integration tests still report theirs.
      - name: Run the integration tests 🧪
        if: ${{ !cancelled() }}
        shell: bash
        run: >-
          py.test -m integration --durations=10 -rs
          | tee "$RUNNER_TEMP/integration.log"
        env:
          INDEXER_KEY: ${{ env.MEILI_MASTER_KEY }}
          DEBUG: 1
          MAIL_DEBUG_BODY: 1
          MAIL_ENABLED: False
      # The durations report only lives in the step log: copy it to the run
      # summary, where the outliers stay visible run after run. The report
      # runs to the next separator line of pytest.
      - name: List the slowest tests 📊
        if: ${{ !cancelled() }}
        run: |
          for log in "$RUNNER_TEMP"/parallel.log "$RUNNER_TEMP"/integration.log; do
            [ -f "$log" ] || continue
            echo "### Slowest tests, $(basename "$log" .log) pass"
            echo '```'
            awk '/^=+ slowest [0-9]+ durations =+$/ {on = 1; next} on && /^=/ {exit} on' "$log"
            echo '```'
          done >> "$GITHUB_STEP_SUMMARY"

  audit:
    name: Audit dependencies 🔒
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 🐍
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages 📦
        run: >-
          pip install --upgrade pip setuptools &&
          pip install -r requirements.txt
      # The cryptography/pyopenssl advisories below cannot be fixed yet:
      # pysaml2 7.5.4 (latest) caps pyopenssl<24.3, which caps
      # cryptography<44 — while the fixes require cryptography>=49 (i.e.
      # pyopenssl>=26.4). Blocked on IdentityPython/pysaml2#1021.
      # Drop the ignores below once pysaml2 ships a release lifting the cap.
      - name: Run pip-audit 🔒
        run: >-
          pip install pip-audit &&
          pip-audit --skip-editable
          --ignore-vuln PYSEC-2026-35
          --ignore-vuln PYSEC-2026-3553
          --ignore-vuln PYSEC-2026-3554
          --ignore-vuln CVE-2024-12797
          --ignore-vuln CVE-2026-26007
          --ignore-vuln GHSA-537c-gmf6-5ccf
          --ignore-vuln CVE-2026-27448
          --ignore-vuln PYSEC-2026-2269
          --ignore-vuln CVE-2026-27459

  publish-test:
    name: Publish to TestPyPI 📦
    needs: test
    if: github.ref == 'refs/heads/main' && github.repository == 'cgwire/zou'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: testpypi
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 🐍
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Append short commit hash to version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DEV_NUM=$(printf '%d' "0x${SHORT_SHA}")
          sed -i "s/^__version__ = \"\\(.*\\)\"/__version__ = \"\\1.dev${DEV_NUM}\"/" zou/__init__.py
          grep __version__ zou/__init__.py
      - name: Install pypa/build
        run: >-
          python3 -m pip install build --user
      - name: Build a binary wheel 🏗️
        run: >-
          python3 -m build
      - name: Publish to TestPyPI 📦
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # The dev version derives from the commit hash: a file already
          # there is this same build, uploaded by a re-run or a duplicated
          # run of the push.
          skip-existing: true

  publish:
    name: Publish to PyPI 📦
    needs: test
    if: startsWith(github.ref, 'refs/tags') && github.repository == 'cgwire/zou'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: pypi
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 🐍
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install pypa/build
        run: >-
          python3 -m pip install build --user
      - name: Build a binary wheel 🏗️
        run: >-
          python3 -m build
      - name: Publish to PyPI 📦
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # release.sh never tags a version twice: a file already there is
          # this same release, uploaded by a re-run or a duplicated run of
          # the tag push.
          skip-existing: true
